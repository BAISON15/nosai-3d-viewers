<style>

const WORDS = [

  ["斑点米（はんてんまい）","カメムシに吸われて黒い点がついたお米。等級が下がる。"],
  ["畦畔（けいはん）の草刈り","畦の草はカメムシのすみか。出穂の2週間前までに刈っておく。"],

/* =========================================================
   2. 状態
   ========================================================= */
const GRID = 6, CELLS = GRID*GRID, CELL = 1.6, FIELD = GRID*CELL, WATER_MAX = 12;
const state = {
  idx: 0, step: 0, water: 0, growth: 0, weed: 0, quality: 100, dryDay: 0, mowed: false,
  done: false, working: false, finished: false, log: []
};
const cells = [];
for(let i=0;i<CELLS;i++) cells.push({tilled:false,puddled:false,planted:false,harvested:false,dry:false,crack:0});

const weedOrder = [...Array(CELLS).keys()].sort(()=>Math.random()-0.5);
const el = id => document.getElementById(id);
function toast(msg){
  const t = el('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* =========================================================
   3. 稲と雑草の形（湾曲したリボンを組み合わせる）
   ========================================================= */
function ribbon(angle, lean, length, width, curve){
  const SEG=5, pos=[], idx=[];
  for(let i=0;i<=SEG;i++){
    const t=i/SEG, bend=curve*t*t;
    const r=Math.sin(lean+bend)*length*t, y=Math.cos(lean+bend)*length*t;
    const x=Math.cos(angle)*r, z=Math.sin(angle)*r;
    const w=width*(1-t*0.8)*(t<0.2?t/0.2:1);
    const nx=-Math.sin(angle)*w, nz=Math.cos(angle)*w;
    pos.push(x-nx,y,z-nz, x+nx,y,z+nz);
    if(i<SEG){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function merge(list){
  let vc=0, ic=0;
  list.forEach(g=>{ vc+=g.attributes.position.count; ic+=g.index.count; });
  const pos=new Float32Array(vc*3), nor=new Float32Array(vc*3), idx=new Uint16Array(ic);
  let vo=0, io=0;
  list.forEach(g=>{
    pos.set(g.attributes.position.array, vo*3);
    nor.set(g.attributes.normal.array, vo*3);
    const gi=g.index.array;
    for(let k=0;k<gi.length;k++) idx[io+k]=gi[k]+vo;
    vo+=g.attributes.position.count; io+=gi.length; g.dispose();
  });
  const out=new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3));
  out.setIndex(new THREE.BufferAttribute(idx,1));
  return out;
}
// 稲：細い葉が8枚、まっすぐ立ち上がってから軽く先が垂れる
const kabuGeo = s => merge([0,1,2,3,4,5,6,7].map(i=>
  ribbon((i/8)*Math.PI*2 + s*1.3, 0.07+((i+s)%3)*0.055, 1.05+((i*7+s*3)%5)*0.05, 0.048, 0.30+((i+s)%4)*0.09)));
const hoGeo = s => merge([0,1,2].map(i=> ribbon((i/3)*Math.PI*2+s, 0.10, 0.60, 0.042, 1.95)));
// 畦の草：背が低く、外へ開いた短い草の株。稲と見間違えないようにする
const weedGeo = () => merge([0,1,2,3,4,5].map(i=>
  ribbon((i/6)*Math.PI*2+0.6, 0.34+((i%3)*0.10), 0.52+((i%2)*0.08), 0.032, 0.55)));
// 田んぼの雑草（コナギ・ヒエのイメージ）。稲より背が高く、葉が広くて外へ寝る
const paddyWeedGeo = () => merge([
  ...[0,1,2,3,4].map(i=> ribbon((i/5)*Math.PI*2+0.4, 0.50+((i%3)*0.08), 1.45+((i%2)*0.2), 0.125, 0.30)),
  ribbon(0.0, 0.02, 2.05, 0.045, 0.10),      // まっすぐ立つ茎
  ribbon(0.9, 0.04, 1.85, 0.06, 0.85)        // 先の穂
]);

/* =========================================================
   4. シーン（田面は1枚の泥、機械が通った跡が残る）
   ========================================================= */
const canvas = el('c');

let inflowTimer = 0;
let paddyCtx, paddyTex, dryBackup = null, pmrem;
const TEX = 512;
const plants = [], weeds = [], azeGrass = [];

function pos2(i){
  const gx=i%GRID, gz=Math.floor(i/GRID);
  return {x:(gx-(GRID-1)/2)*CELL, z:(gz-(GRID-1)/2)*CELL};
}
function cellAt(x,z){
  const gx=Math.min(GRID-1, Math.max(0, Math.floor((x+FIELD/2)/CELL)));
  const gz=Math.min(GRID-1, Math.max(0, Math.floor((z+FIELD/2)/CELL)));
  return gz*GRID+gx;
}
// 平面はX軸まわりに-90度倒してあり、さらにテクスチャは上下反転して貼られる。
// その結果、キャンバスのY座標はワールドZとそのまま同じ向きになる。
function texUV(x,z){ return {u:(x+FIELD/2)/FIELD*TEX, v:(z+FIELD/2)/FIELD*TEX}; }

/* ---- 田面のテクスチャ（ここに作業の跡を描いていく） ---- */
function mudBase(){
  const c = paddyCtx;
  c.fillStyle = '#8B7B57'; c.fillRect(0,0,TEX,TEX);
  for(let i=0;i<900;i++){
    c.globalAlpha = 0.05 + Math.random()*0.12;
    c.fillStyle = Math.random()<0.5 ? '#6A5C3E' : '#A3936C';
    c.beginPath(); c.arc(Math.random()*TEX, Math.random()*TEX, 3+Math.random()*20, 0, 7); c.fill();
  }
  c.globalAlpha = 1;
  paddyTex.needsUpdate = true;
}
const WORK = {
  till:   {col:'#5A4530', grain:'#412F1F', tire:'#3B2C1C', tw:0.17},
  puddle: {col:'#4E4739', grain:'#413B2F', tire:'#443D30', tw:0.13},
  plant:  {col:'#4A4335', grain:'#3E382C', tire:'#3C3629', tw:0.10},
  harvest:{col:'#9A8A5F', grain:'#7E7049', tire:'#7A6C46', tw:0.15},
  fert:   null, spray:null, mow:null, irrigate:null, drain:null, dry:null
};
let trackPath = [];

/* 区画を、縁をくずした形で塗る（重ねて塗るので継ぎ目も塗り残しも出ない） */
function paintCellTex(i, mode){
  const st = WORK[mode];
  if(!st) return;
  const c = paddyCtx, p = pos2(i), t = texUV(p.x, p.z);
  const half = CELL/FIELD*TEX/2;
  c.fillStyle = st.col;
  c.beginPath();
  for(let a=0;a<14;a++){
    const ang = a/14*Math.PI*2;
    const rr = half*(1.35 + Math.random()*0.25);       // 隣とかならず重なる大きさ
    const x = t.u+Math.cos(ang)*rr, y = t.v+Math.sin(ang)*rr;
    a ? c.lineTo(x,y) : c.moveTo(x,y);
  }
  c.closePath(); c.fill();
  for(let k=0;k<26;k++){                                // 土の粒立ち
    c.globalAlpha = 0.06+Math.random()*0.14;
    c.fillStyle = Math.random()<0.5 ? st.grain : '#FFFFFF';
    c.beginPath();
    c.arc(t.u+(Math.random()-0.5)*half*2.2, t.v+(Math.random()-0.5)*half*2.2,
          2+Math.random()*10, 0, 7);
    c.fill();
  }
  c.globalAlpha = 1;
  redrawTracks(mode);                                   // 塗りの上に車輪跡を描き直す
  paddyTex.needsUpdate = true;
}

/* 機械が通った線を車輪の跡として重ねる */
function redrawTracks(mode){
  const st = WORK[mode];
  if(!st || trackPath.length < 2) return;
  const c = paddyCtx;
  c.lineCap='round'; c.lineJoin='round';
  c.strokeStyle = st.tire;
  c.lineWidth = CELL/FIELD*TEX*st.tw;
  const off = CELL/FIELD*TEX*0.22;
  [1,-1].forEach(sgn=>{
    c.beginPath();
    for(let k=1;k<trackPath.length;k++){
      const a=trackPath[k-1], b=trackPath[k];
      const dx=b.u-a.u, dy=b.v-a.v, len=Math.hypot(dx,dy);
      if(len<0.5) continue;
      const nx=-dy/len*off*sgn, ny=dx/len*off*sgn;
      c.moveTo(a.u+nx, a.v+ny); c.lineTo(b.u+nx, b.v+ny);
    }
    c.stroke();
  });
}
function addTrackPoint(mode, x, z){
  if(!WORK[mode]) return;
  const t = texUV(x,z);
  const last = trackPath[trackPath.length-1];
  if(last && Math.hypot(t.u-last.u, t.v-last.v) < 4) return;   // 点が多くなりすぎないように
  trackPath.push(t);
  redrawTracks(mode);
  paddyTex.needsUpdate = true;
}
function drawCracks(day){                          // 中干しで田面が乾いてひび割れる
  const c = paddyCtx;
  c.globalAlpha = 0.06; c.fillStyle = '#BCAB80'; c.fillRect(0,0,TEX,TEX); c.globalAlpha = 1;
  c.strokeStyle = 'rgba(48,36,22,0.5)'; c.lineWidth = 1.4 + day*0.15;
  for(let i=0;i<22;i++){
    let x=Math.random()*TEX, y=Math.random()*TEX;
    c.beginPath(); c.moveTo(x,y);
    for(let k=0;k<4;k++){ x+=(Math.random()-0.5)*46; y+=(Math.random()-0.5)*46; c.lineTo(x,y); }
    c.stroke();
  }
  paddyTex.needsUpdate = true;
}

/* ---- 空・水面のテクスチャ ---- */
/* 全天球の空。太陽も描き込み、これを環境マップにして水面へ映す */
function skyTexture(skyHex, sunHex, power){
  const W=1024, H=512;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g=cv.getContext('2d');
  const sky=new THREE.Color(skyHex);
  const zenith=sky.clone().multiplyScalar(0.62).offsetHSL(0,0.06,0);
  const haze =sky.clone().lerp(new THREE.Color(0xFFFFFF),0.55);
  const under=sky.clone().lerp(new THREE.Color(0x4A4A38),0.72);
  const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,   '#'+zenith.getHexString());
  gr.addColorStop(0.42,'#'+sky.getHexString());
  gr.addColorStop(0.50,'#'+haze.getHexString());
  gr.addColorStop(1,   '#'+under.getHexString());
  g.fillStyle=gr; g.fillRect(0,0,W,H);

  // 太陽（光源の向きと同じ位置に置く）
  const d=new THREE.Vector3(16,20,11).normalize();
  const su=(Math.atan2(d.z,d.x)/(Math.PI*2)+0.5)*W;
  const sv=(1-(Math.asin(d.y)/Math.PI+0.5))*H;
  const glow=g.createRadialGradient(su,sv,2,su,sv,150);
  const sc=new THREE.Color(sunHex);
  glow.addColorStop(0,'rgba(255,255,245,'+(0.95*power)+')');
  glow.addColorStop(0.06,'rgba('+Math.round(sc.r*255)+','+Math.round(sc.g*255)+','+Math.round(sc.b*255)+',0.75)');
  glow.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=glow; g.beginPath(); g.arc(su,sv,150,0,7); g.fill();

  // 雲
  g.globalAlpha=0.20;
  for(let i=0;i<26;i++){
    const x=Math.random()*W, y=90+Math.random()*130;
    g.fillStyle='#FFFFFF';
    g.beginPath(); g.ellipse(x,y,40+Math.random()*90,9+Math.random()*13,0,0,7); g.fill();
  }
  g.globalAlpha=1;

  const t=new THREE.CanvasTexture(cv);
  t.mapping=THREE.EquirectangularReflectionMapping;
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function buildSky(skyHex, sunHex, power){
  const tex = skyTexture(skyHex, sunHex, power);
  const env = pmrem.fromEquirectangular(tex).texture;
  if(scene.background && scene.background.dispose) scene.background.dispose();
  if(scene.environment) scene.environment.dispose();
  scene.background = tex;
  scene.environment = env;      // 水面がこの空を映す
}
function waterNormalTexture(){
  const n=192, cv=document.createElement('canvas'); cv.width=cv.height=n;
  const g=cv.getContext('2d'), img=g.createImageData(n,n);
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    const i=(y*n+x)*4;
    const nx=Math.sin(x*0.20)*0.4 + Math.sin((x*0.08+y*0.13))*0.6;
    const ny=Math.cos(y*0.17)*0.4 + Math.sin((x*0.11-y*0.06))*0.6;
    img.data[i]=128+nx*46; img.data[i+1]=128+ny*46; img.data[i+2]=248; img.data[i+3]=255;
  }
  g.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(4,4);
  return t;
}
function grassTexture(base, dark){
  const n=128, cv=document.createElement('canvas'); cv.width=cv.height=n;
  const g=cv.getContext('2d');
  g.fillStyle=base; g.fillRect(0,0,n,n);
  for(let i=0;i<1400;i++){
    g.globalAlpha=0.06+Math.random()*0.16;
    g.strokeStyle=Math.random()<0.5?dark:'#FFFFFF';
    g.lineWidth=1;
    const x=Math.random()*n, y=Math.random()*n;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+(Math.random()-0.5)*3, y-2-Math.random()*4); g.stroke();
  }
  const t=new THREE.CanvasTexture(cv);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(30,30);
  return t;
}

/* ---- 見まわす操作 ---- */
const cam={th:-0.62, ph:0.88, d:21, t:new THREE.Vector3(0,0.5,0)};
function applyCam(){
  cam.ph=Math.max(0.16,Math.min(1.45,cam.ph));
  cam.d =Math.max(9, Math.min(44, cam.d));
  camera.position.set(
    cam.t.x+cam.d*Math.sin(cam.ph)*Math.cos(cam.th),
    cam.t.y+cam.d*Math.cos(cam.ph),
    cam.t.z+cam.d*Math.sin(cam.ph)*Math.sin(cam.th));
  camera.lookAt(cam.t);
}
let drag=false, lx=0, ly=0, pinch=0;
canvas.addEventListener('pointerdown', e=>{ drag=true; lx=e.clientX; ly=e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e=>{
  if(!drag) return;
  cam.th -= (e.clientX-lx)*0.006; cam.ph -= (e.clientY-ly)*0.006;
  lx=e.clientX; ly=e.clientY; applyCam();
});
canvas.addEventListener('pointerup', ()=>{ drag=false; });
canvas.addEventListener('pointercancel', ()=>{ drag=false; });
canvas.addEventListener('wheel', e=>{ e.preventDefault(); cam.d+=e.deltaY*0.02; applyCam(); }, {passive:false});
canvas.addEventListener('touchmove', e=>{
  if(e.touches.length!==2) return;
  e.preventDefault();
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  if(pinch){ cam.d+=(pinch-d)*0.04; applyCam(); }
  pinch=d;
}, {passive:false});
canvas.addEventListener('touchend', ()=>{ pinch=0; });

/* 圃場を端から端まで走らせる。通った区画に効果が出る */
function runMachine(mode, onEnd){
  const m = machines[mode];
  if(!m){ onEnd(); return; }
  const route = [];
  if(mode === 'mow'){
    // 畦の上をぐるりと一周する
    const half = FIELD/2 + 0.35;
    const cn = [[-half,-half],[half,-half],[half,half],[-half,half],[-half,-half]];
    for(let e=0;e<4;e++){
      const x0=cn[e][0], z0=cn[e][1], x1=cn[e+1][0], z1=cn[e+1][1];
      for(let t=0;t<6;t++) route.push({x:x0+(x1-x0)*t/6, z:z0+(z1-z0)*t/6, cell:null});
    }
    route.push({x:cn[0][0], z:cn[0][1], cell:null});
  }else{
    const step = m.userData.rowStep || 1;
    let turn = 0;
    for(let gz=0; gz<GRID; gz+=step){
      const row=[];
      for(let gx=0; gx<GRID; gx++) row.push(gz*GRID+gx);
      if(turn%2) row.reverse();
      turn++;
      row.forEach(i=>{ const p=pos2(i); route.push({x:p.x, z:p.z, cell:i}); });
    }
  }
  const s0 = route[0];
  m.visible = true;
  const fy = m.userData.y || 0;
  m.position.set(mode==='mow' ? s0.x : s0.x - CELL*1.6, fy, s0.z);
  m.rotation.y = Math.PI/2;
  trackPath = [];
  runner = { m, mode, route, k:0, spin:0,
             target:new THREE.Vector3(s0.x, fy, s0.z), leaving:false, onEnd };
}
function stepMachine(dt){
  if(!runner) return;
  const r = runner, m = r.m;
  const d = r.target.clone().sub(m.position); d.y=0;
  const dist = d.length();
  if(dist < 0.08){
    if(r.leaving){ m.visible=false; runner=null; r.onEnd(); return; }
    if(r.k < r.route.length){
      const w = r.route[r.k];
      if(w.cell !== null) applyCell(w.cell, r.mode);   // いま到着した区画を処理する
      r.k++;
      if(r.k < r.route.length){
        const n = r.route[r.k];
        r.target.set(n.x, m.position.y, n.z);
        return;
      }
    }
    const last = r.route[r.route.length-1];
    r.target.set(last.x + (r.mode==='mow' ? 0 : CELL*2.2), m.position.y,
                 last.z + (r.mode==='mow' ? -CELL*2.5 : 0));
    r.leaving = true;
    return;
  }
  const step = Math.min(dist, (m.userData.speed || 6.2)*dt);
  d.normalize();
  m.position.addScaledVector(d, step);
  const yaw = Math.atan2(d.x, d.z);
  let diff = yaw - m.rotation.y;
  while(diff> Math.PI) diff-=Math.PI*2;
  while(diff<-Math.PI) diff+=Math.PI*2;
  m.rotation.y += diff*Math.min(1, dt*6);
  r.spin += step*2.4;
  (m.userData.wheels||[]).forEach(w=> w.rotation.x = r.spin);
  // 歩く人は脚を振る
  (m.userData.legs||[]).forEach((hip,k)=> hip.rotation.x = Math.sin(r.spin*2.2 + k*Math.PI)*0.5);
  addTrackPoint(r.mode, m.position.x, m.position.z);   // 車輪の跡
  if(m.userData.blade) m.userData.blade.rotation.y = r.spin*9;
  (m.userData.rotors||[]).forEach((ro,k)=> ro.rotation.y = r.spin*14*(k%2?1:-1));
  if(r.mode === 'mow'){
    for(let i=0;i<azeGrass.length;i++){
      const g = azeGrass[i];
      if(g.visible && Math.hypot(g.position.x-m.position.x, g.position.z-m.position.z) < 1.2) g.visible = false;
    }
  }
  if(m.userData.reel) m.userData.reel.rotation.x = r.spin*1.4;
}

function applyCell(i, mode){
  const c = cells[i];
  if(mode==='till')   c.tilled=true;
  if(mode==='puddle') c.puddled=true;
  if(mode==='plant')  c.planted=true;
  if(mode==='harvest'){ c.planted=false; c.harvested=true; }
  if(mode==='dry')    c.dry=true;
  paintCellTex(i, mode);                                  // 通った区画の田面を塗る
  if(mode==='plant' || mode==='harvest') paintPlants();   // 通ったそばから苗を出す／刈る
}

/* ---- 時間をかけて進む作業 ---- */
const job = { kind:null, t:0, phase:-1, onEnd:null };
function startJob(kind, onEnd){ job.kind=kind; job.t=0; job.phase=-1; job.onEnd=onEnd; }
function endJob(){ const f=job.onEnd; job.kind=null; job.onEnd=null; if(f) f(); }

function updateJobs(dt){
  if(!job.kind) return;
  job.t += dt;

  if(job.kind === 'dry'){
    const PER = 1.8;                                   // 1日ぶん＝1.8秒、計7日
    if(state.water >= 1){                              // 途中で水が入ったらやり直し
      job.kind = null; job.onEnd = null;
      state.working = false; state.dryDay = 0;
      if(dryBackup) paddyCtx.putImageData(dryBackup, 0, 0);   // 干す前の田面に戻す
      paddyTex.needsUpdate = true;
      toast('水が入りました。中干しは最初からやり直しです');
      updateGuide();
      return;
    }
    const day = Math.min(7, Math.floor(job.t/PER)+1);
    if(day !== state.dryDay){
      state.dryDay = day;
      cells.forEach(c=>{ c.dry = true; });
      drawCracks(day);
      updateGuide();
    }
    if(job.t >= PER*7) endJob();

  }else if(job.kind === 'irrigate'){
    const PER = 1.7, PHASES = 5;                       // 入水と落水を3回くり返す
    const ph = Math.min(PHASES-1, Math.floor(job.t/PER));
    if(ph !== job.phase){
      job.phase = ph;
      updateGuide();
    }
    const goal = (job.phase % 2 === 0) ? 3.4 : 0.2;
    if(job.phase % 2 === 0) inflowTimer = 0.4;         // 入水しているあいだは流れを見せる
    state.water += (goal - state.water) * Math.min(1, dt*2.4);
    paintWater(); updateMeters();
    if(job.t >= PER*PHASES){ state.water = Math.round(state.water); endJob(); }

  }else if(job.kind === 'drain'){
    state.water = Math.max(0, state.water - dt*1.6);
    paintWater(); updateMeters();
    if(state.water <= 0.05){ state.water = 0; paintWater(); updateMeters(); endJob(); }
  }
}

function paintPlants(){
  const gr = state.growth/100;
  const ripe = Math.max(0, (gr-0.75)/0.25);
  leafMat.color.copy(new THREE.Color(0x4C8A36).lerp(new THREE.Color(0xC9AE4B), ripe));
  const h = 0.35 + gr*1.45, w = 0.70 + gr*0.40;
  for(let k=0;k<plants.length;k++){
    const pl = plants[k], c = cells[pl.cell];
    pl.g.visible = c.planted && !c.harvested;
    pl.g.scale.set(w, h, w);
    pl.ho.visible = ripe > 0.05;
  }
}
function paintAll(){
  paintPlants();
  // 雑草が見えるのは、苗が植わっている田んぼだけ
  const n = Math.round(state.weed/100*CELLS);
  for(let i=0;i<CELLS;i++) weeds[i].visible = false;
  for(let k=0;k<n;k++){
    const i = weedOrder[k];
    weeds[i].visible = cells[i].planted && !cells[i].harvested;
  }
}
function paintWater(){
  water.visible = state.water > 0.05;
  water.position.y = state.water*0.014;
}
function setSeason(month){
  // [空の色, 日ざしの色, 光の強さ, 地面の色]
  const t = ({4:[0xA9CFDD,0xFFF3DC,1.00,0x77864C], 5:[0x9FCFE4,0xFFF6E2,1.10,0x6D8046],
              6:[0xA6B7C0,0xE9E9E1,0.80,0x62793F], 7:[0x8FC6E2,0xFFEFC0,1.25,0x647F41],
              8:[0x8FC6E2,0xFFEDBA,1.28,0x668542], 9:[0xA9C9DA,0xFFE9BE,1.00,0x7C7F4C],
              10:[0xB4C6CE,0xF6DDB0,0.88,0x8C8153]})[month] || [0x9FC8DA,0xFFF3DC,1.0,0x77864C];
  const sky = new THREE.Color(t[0]);
  scene.fog.color.copy(sky);
  buildSky(t[0], t[1], t[2]);                 // 空と、水面に映る環境を作り直す
  sun.color.setHex(t[1]); sun.intensity = t[2]*2.2;
  hemi.color.copy(sky);
  ground.material.color.setHex(t[3]);
  // 水は空の色を映す（泥の色と混ぜる）
  waterMat.color.copy(sky).lerp(new THREE.Color(0x40584F), 0.55);
  canalMat.color.copy(sky).lerp(new THREE.Color(0x2F4A57), 0.55);
}

/* =========================================================
   7. 画面表示
   ========================================================= */
function curStep(){
  const s = STAGES[state.idx];
  return s.steps[Math.min(state.step, s.steps.length-1)];
}
function curAim(){
  const s = STAGES[state.idx], st = curStep();
  return (!state.done && st.aim !== undefined) ? st.aim : s.aim;
}
function weedWord(v){ return v<25 ? "少ない" : v<55 ? "ふつう" : v<80 ? "多い" : "かなり多い"; }
function updateMeters(){
  const aim = curAim();
  el('m-water').textContent = state.water.toFixed(0) + 'cm';
  el('b-water').style.width = Math.min(100, state.water/WATER_MAX*100) + '%';
  const diff = Math.abs(state.water - aim);
  el('b-water').style.background = job.kind ? 'var(--blue)'
    : diff<=1 ? 'var(--blue)' : diff<=3 ? 'var(--gold)' : 'var(--red)';
  el('m-aim').textContent = '目安 ' + aim + 'cm';

  el('m-growth').textContent = Math.round(state.growth) + '%';
  el('b-growth').style.width = state.growth + '%';

  el('m-weed').textContent = weedWord(state.weed);
  el('b-weed').style.width = state.weed + '%';
  el('b-weed').style.background = state.weed<40 ? 'var(--green)' : state.weed<70 ? 'var(--gold)' : 'var(--red)';
}
function updateGuide(){
  const s = STAGES[state.idx];
  el('m-season').textContent = s.season;
  el('m-stage').textContent  = (state.idx+1) + ' / ' + STAGES.length;
  el('g-when').textContent   = s.when;
  el('g-title').textContent  = s.title;
  el('g-weather').textContent= s.weather;
  el('g-desc').textContent   = s.desc;
  const task = el('g-task');
  const st = curStep();
  if(state.done){
    task.textContent = '✅ この季節の作業は終わりました。次の季節へ進めます。';
  }else if(s.steps.length > 1){
    task.textContent = s.task + '（いま：' + (state.step+1) + '/' + s.steps.length + '　' + st.action + '）';
  }else{
    task.textContent = s.task;
  }
  task.className = 'task' + (state.done ? ' done' : '');
  if(state.working){
    if(job.kind === 'dry')        task.textContent = '☀️ 中干し中… ' + state.dryDay + '日目 / 7日　この間は水を入れないでください';
    else if(job.kind === 'irrigate') task.textContent = '💧 間断灌漑中… ' + ((job.phase%2===0) ? '水を入れています' : '水が落ちていくのを待っています') + '（' + (Math.floor(job.phase/2)+1) + '回目 / 3回）';
    else if(job.kind === 'drain') task.textContent = '☀️ 落水中… 田んぼの水を落としています';
  }
  const main = el('btn-main');
  main.textContent = state.done ? '✅ 作業ずみ' : (state.working ? '⏳ 作業中…' : st.icon + ' ' + st.action);
  main.disabled = state.done || state.working;
}

/* =========================================================
   8. 操作
   ========================================================= */
el('btn-in').onclick  = ()=>{ if(state.working && job.kind!=='dry') return; state.water=Math.min(WATER_MAX,state.water+1); inflowTimer=1.4; paintWater(); updateMeters(); };
el('btn-out').onclick = ()=>{ if(state.working && job.kind!=='dry') return; state.water=Math.max(0,state.water-1); paintWater(); updateMeters(); };

el('btn-weed').onclick = ()=>{
  if(state.working) return;
  if(state.weed < 12){ toast('いまは草も虫も目立ちません'); return; }
  state.weed = Math.max(0, state.weed - 65);
  paintAll(); updateMeters();
  toast('草取りと防除をしました');
};

el('btn-main').onclick = ()=>{
  if(state.working || state.done) return;
  const st = curStep();
  if(st.need){
    const [lo,hi] = st.need.water;
    if(state.water < lo || state.water > hi){ toast(st.need.msg); return; }
  }
  state.working = true;
  updateGuide();
  if(st.mode==='dry'){
    state.dryDay = 0;
    dryBackup = paddyCtx.getImageData(0,0,TEX,TEX);
    startJob('dry', finishAction);
  } else if(st.mode==='irrigate' || st.mode==='drain'){
    startJob(st.mode, finishAction);
  } else {
    runMachine(st.mode, finishAction);
  }
};
function finishAction(){
  const s = STAGES[state.idx];
  paintAll();
  if(curStep().mode === 'mow') state.mowed = true;
  state.working = false;
  if(state.step < s.steps.length-1){
    state.step++;                       // 次の作業へ（例：田起こし→代かき）
    updateGuide(); updateMeters();
    toast(s.steps[state.step-1].action + 'がおわりました。つぎは' + s.steps[state.step].action);
  }else{
    state.done = true;
    updateGuide(); updateMeters();
    toast('この季節の作業がおわりました');
  }
}

el('btn-next').onclick = ()=>{
  if(state.working){ toast('作業がおわるまで待ってください'); return; }
  const s = STAGES[state.idx];

  // その季節の評価
  let pt = 100, memo = [];
  const diff = Math.abs(state.water - s.aim);
  if(diff > 3){ pt -= 25; memo.push('水深が目安（' + s.aim + 'cm）から離れていました'); }
  else if(diff > 1){ pt -= 10; memo.push('水深がやや目安からずれていました'); }
  if(state.weed > 70){ pt -= 25; memo.push('雑草や害虫を放置しました'); }
  else if(state.weed > 40){ pt -= 10; memo.push('雑草がやや増えていました'); }
  if(!state.done){ pt -= 30; memo.push(s.steps[state.step].action + 'を行いませんでした'); }
  pt = Math.max(20, pt);
  state.log.push({title:s.title, pt, memo: memo.length? memo.join('。') : 'この季節の管理は良好でした'});
  state.quality = Math.round(state.log.reduce((a,b)=>a+b.pt,0)/state.log.length);

  if(state.idx >= STAGES.length-1){ showResult(); return; }

  state.idx++;
  state.done = false;
  state.step = 0;
  const ns = STAGES[state.idx];
  state.growth = ns.growthTo;
  if(ns.steps[0].mode === 'harvest') state.weed = Math.max(0, state.weed - 20);
  setSeason(parseInt(ns.season.match(/(\d+)月/)[1], 10));
  paintAll(); paintWater(); updateMeters(); updateGuide();
  showModal('【' + ns.season + '】 ' + ns.title,
            ns.desc,
            '水深の目安は ' + ns.aim + 'cm です。' + (ns.weedRate ? '雑草も伸びやすい時期です。' : ''));
};

/* =========================================================
   9. お知らせ・結果
   ========================================================= */
function showModal(title, body, aim){
  el('mo-title').textContent = title;
  el('mo-body').textContent  = body;
  el('mo-extra').innerHTML   = aim ? '<div class="aimbox">' + aim + '</div>' : '';
  el('mo-ok').textContent = 'この季節をはじめる';
  el('modal').classList.remove('hide');
}
el('mo-ok').onclick = ()=> el('modal').classList.add('hide');

function showResult(){
  state.finished = true;
  const q = state.quality;
  const kg = Math.round(300 + (q/100)*270);
  let grade, lead;
  if(q>=90){ grade='1等'; lead='水管理も作業の時期もよく合っていました。粒のそろった、いいお米になりました。'; }
  else if(q>=75){ grade='1〜2等'; lead='おおむね順調な一年でした。取りこぼした季節を見直せば、来年はもっと安定します。'; }
  else if(q>=55){ grade='2〜3等'; lead='収穫までたどり着きました。水深のずれや雑草の放置が、収穫量に響いています。'; }
  else { grade='規格外も'; lead='苦しい一年でした。まずは季節ごとの「目安の水深」を守るところからはじめましょう。'; }
  el('rs-yield').textContent = kg;
  el('rs-grade').textContent = grade;
  el('rs-score').textContent = q;
  el('rs-lead').textContent = lead + (state.mowed
    ? ' 畦の草を刈っておいたので、カメムシによる斑点米はわずかで済みました。'
    : ' 畦の草を刈らなかったため、カメムシが穂を吸い、黒い点のついた米が混じりました。');
  el('rs-log').innerHTML = state.log.map(x=>
    '<tr><td>'+x.title+'</td><td>'+x.memo+'</td><td class="r">'+x.pt+'</td></tr>').join('');
  el('rs-words').innerHTML = WORDS.map(w=>'<dt>'+w[0]+'</dt><dd>'+w[1]+'</dd>').join('');
  el('result').classList.remove('hide');
}

/* =========================================================
   10. 時間の流れ（水は減り、雑草は伸びる）
   ========================================================= */
let clock, tNow=0, acc=0;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function tick(dt){
  if(state.finished) return;
  const s = STAGES[state.idx];
  // 水は蒸発と地下浸透で少しずつ減る
  if(!job.kind && state.water > 0 && Math.random() < dt*0.10) { state.water--; paintWater(); }
  // 雑草・害虫は季節に応じて増える
  if(s.weedRate) state.weed = Math.min(100, state.weed + s.weedRate*dt);
  updateMeters();
}

function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  tNow += dt;
  stepMachine(dt);
  updateJobs(dt);
  acc += dt;
  if(acc > 0.5){ tick(acc); acc = 0; }
  if(!reduce){
    const amp = 0.03 + state.growth/100*0.05;
    for(let i=0;i<plants.length;i++){
      const g=plants[i].g;
      if(!g.visible) continue;
      g.rotation.z = Math.sin(tNow*1.1 + i*0.28)*amp;      // 風が波のように渡る
      g.rotation.x = Math.cos(tNow*0.8 + i*0.17)*amp*0.6;
    }
    canalNormal.offset.x -= dt*0.42;                 // 用水路の水は下流へ流れ続ける
    canalNormal.offset.y += dt*0.05;
    if(inflowTimer > 0){                             // 水口から田んぼへ落ちる流れ
      inflowTimer -= dt;
      inflow.visible = true;
      const j = inflow.userData.jet, rg = inflow.userData.ring;
      j.scale.y = 0.9 + Math.sin(tNow*22)*0.12;
      const ph = (tNow*1.6) % 1;
      rg.scale.setScalar(0.6 + ph*1.5);
      rg.material.opacity = 0.5*(1-ph);
      inflow.position.y = 0.04 + state.water*0.014;
    }else{
      inflow.visible = false;
    }
    if(water.visible){
      waterNormal.offset.x += dt*0.012;            // さざ波が流れて日ざしがきらめく
      waterNormal.offset.y += dt*0.019;
      waterMat.opacity = 0.88 + Math.sin(tNow*0.7)*0.03;
    }
  }
  renderer.render(scene, camera);
}

/* =========================================================
   11. 起動
   ========================================================= */
function boot(){
  window.__booted = true;
  initScene();
  buildMachines();
  clock = new THREE.Clock();
  applyCam();
  setSeason(4);
  paintAll(); paintWater(); updateMeters(); updateGuide();

  el('mo-title').textContent = 'お米ができるまでの一年';
  el('mo-body').textContent  = '4月の土づくりから10月の稲刈りまで、7つの季節を体験します。田んぼの水は放っておくと少しずつ減り、夏には雑草も伸びてきます。ゲージを見ながら手入れをしてください。';
  el('mo-extra').innerHTML =
    '<ul>' +
    '<li><b>💧 給水／☀️ 排水</b>　季節ごとの「目安の水深」に合わせます。ゲージが青なら合っています。</li>' +
    '<li><b>🚜 作業する</b>　トラクタや田植機が田んぼを走ります。押すだけで進みます。</li>' +
    '<li><b>🌿 草取り・防除</b>　雑草ゲージが伸びてきたら押してください。</li>' +
    '<li><b>⏩ 次の季節へ</b>　その季節の管理が採点され、次に進みます。</li>' +
    '</ul>';
  el('mo-ok').textContent = 'はじめる';
  loop();
}
boot();
</script>
