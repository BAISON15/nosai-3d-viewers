<style>

<script type="module">
import * as THREE from "three";

/* ============================================================
   マテリアル・部位色
============================================================ */
const MAT = {
  wood:   new THREE.MeshStandardMaterial({ color: 0xb08968, roughness: 0.8 }),
  woodD:  new THREE.MeshStandardMaterial({ color: 0x8a6a49, roughness: 0.8 }),
  floor:  new THREE.MeshStandardMaterial({ color: 0xd6b98c, roughness: 0.7 }),
  ceil:   new THREE.MeshStandardMaterial({ color: 0xf3f1e8, roughness: 0.95 }),
  iwall:  new THREE.MeshStandardMaterial({ color: 0xf5f2ea, roughness: 0.95 }),
  glass:  new THREE.MeshStandardMaterial({ color: 0x9fb4bf, roughness: 0.05, metalness: 0, transparent: true, opacity: 0.3, depthWrite: false }),
  sash:   new THREE.MeshStandardMaterial({ color: 0x6b6f73, roughness: 0.4, metalness: 0.55 }),   // アルミサッシ(ステンカラー)
  gutter: new THREE.MeshStandardMaterial({ color: 0xcfd4d9, roughness: 0.35, metalness: 0.5 }),
  conc:   new THREE.MeshStandardMaterial({ color: 0x8d8d86, roughness: 0.9 }),
  door:   new THREE.MeshStandardMaterial({ color: 0x4a3220, roughness: 0.7 }),
  equip:  new THREE.MeshStandardMaterial({ color: 0xe7e5e4, roughness: 0.5, metalness: 0.2 }),
};

const ROOFS = {
  kawara:    { label: "粘土瓦",               color: 0xa8503a, roughness: 0.85, metalness: 0.02 },
  slate:     { label: "スレート(化粧スレート)", color: 0x54606b, roughness: 0.65, metalness: 0.05 },
  galvalume: { label: "ガルバリウム鋼板",       color: 0xc9ced2, roughness: 0.30, metalness: 0.65 },
};
const WALLS = {
  mortar: { label: "モルタル塗り",      color: 0xe9e2d3, roughness: 0.9, metalness: 0 },
  siding: { label: "窯業系サイディング", color: 0xd7d1c1, roughness: 0.6, metalness: 0 },
  wood:   { label: "木質系下見板",      color: 0x8a6a49, roughness: 0.8, metalness: 0 },
};

const PART_COLORS = {
  "屋根":          "#dc2626",
  "外壁":          "#2563eb",
  "開口部":        "#f59e0b",
  "雨樋・附帯":    "#06b6d4",
  "軸組(構造材)":  "#92400e",
  "内装":          "#d946ef",
  "床":            "#65a30d",
  "基礎":          "#64748b",
  "附帯設備":      "#0891b2",
  "家具類":        "#7c3aed",
};
const partMatCache = {};
function partMat(part, translucent) {
  const key = part + (translucent ? "_t" : "_s");
  if (!partMatCache[key]) {
    partMatCache[key] = new THREE.MeshStandardMaterial({
      color: new THREE.Color(PART_COLORS[part] || "#a3a3a3"),
      roughness: 0.7, metalness: 0.05,
      transparent: !!translucent, opacity: translucent ? 0.45 : 1.0,
      side: THREE.DoubleSide,
    });
  }
  return partMatCache[key];
}
const ghostMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.07, depthWrite: false });

/* ============================================================
   材質テクスチャ(プロシージャル生成)
   1タイル=下記CELLSのメートル数に相当する模様を描画し、面の寸法に応じて繰り返す
============================================================ */
const CELLS = { roof_kawara: 1.2, roof_slate: 1.8, roof_galvalume: 2.4, wall_mortar: 2.0, wall_siding: 1.8, wall_wood: 1.0 };
const TEX_CACHE = {};

function makeCanvasTex(draw) {
  const cv = document.createElement("canvas");
  cv.width = cv.height = 256;
  draw(cv.getContext("2d"), 256, 256);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;   // 斜めから見た屋根・壁の模様がぼやけないように(実際の上限はGPUに合わせて丸められる)
  return t;
}

const TEX_DRAWERS = {
  /* 粘土瓦: 段ごとの陰影+谷線・山の丸み+軒側のスカラップ */
  roof_kawara(ctx, w, h) {
    ctx.fillStyle = "#a8503a"; ctx.fillRect(0, 0, w, h);
    const rows = 4, cols = 4, rh = h / rows, cw = w / cols;
    for (let r = 0; r < rows; r++) {
      const off = (r % 2) * (cw / 2);
      const gr = ctx.createLinearGradient(0, r * rh, 0, (r + 1) * rh);
      gr.addColorStop(0, "rgba(255,255,255,0.12)");
      gr.addColorStop(0.7, "rgba(0,0,0,0.04)");
      gr.addColorStop(1, "rgba(0,0,0,0.32)");
      ctx.fillStyle = gr; ctx.fillRect(0, r * rh, w, rh);
      for (let c = -1; c <= cols; c++) {
        const x = c * cw + off;
        ctx.strokeStyle = "rgba(40,12,6,0.35)"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x, r * rh + 2); ctx.lineTo(x, (r + 1) * rh - 1); ctx.stroke();
        ctx.strokeStyle = "rgba(255,235,220,0.18)"; ctx.lineWidth = 7;
        ctx.beginPath(); ctx.moveTo(x + cw / 2, r * rh + 4); ctx.lineTo(x + cw / 2, (r + 1) * rh - 3); ctx.stroke();
        ctx.strokeStyle = "rgba(40,12,6,0.45)"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(x + cw / 2, (r + 1) * rh - 2, cw / 2 - 2, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
      }
    }
  },
  /* 化粧スレート: 千鳥に割り付けた平板+目地 */
  roof_slate(ctx, w, h) {
    ctx.fillStyle = "#54606b"; ctx.fillRect(0, 0, w, h);
    const rows = 6, cols = 3, rh = h / rows, cw = w / cols;
    for (let r = 0; r < rows; r++) {
      const off = (r % 2) * (cw / 2);
      for (let c = -1; c <= cols; c++) {
        const x = c * cw + off;
        ctx.fillStyle = `rgba(255,255,255,${0.03 * ((r * 3 + c * 5 + 60) % 3)})`;
        ctx.fillRect(x + 1, r * rh + 1, cw - 2, rh - 2);
        ctx.fillStyle = "rgba(0,0,0,0.30)";
        ctx.fillRect(x - 1, r * rh, 2, rh);
      }
      ctx.fillStyle = "rgba(0,0,0,0.40)";
      ctx.fillRect(0, (r + 1) * rh - 2, w, 2);
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      ctx.fillRect(0, r * rh, w, 1);
    }
  },
  /* ガルバリウム鋼板: 縦ハゼ(立平葺き)のライン+金属の縦ムラ */
  roof_galvalume(ctx, w, h) {
    ctx.fillStyle = "#c9ced2"; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 48; i++) {
      const x = (i * 37 + 11) % w;
      ctx.fillStyle = `rgba(${(i % 2) ? "255,255,255" : "90,100,110"},${0.03 + (i * 7 % 4) * 0.01})`;
      ctx.fillRect(x, 0, 2 + (i % 3), h);
    }
    const cols = 6, cw = w / cols;
    for (let c = 0; c < cols; c++) {
      const x = c * cw;
      ctx.fillStyle = "rgba(60,70,80,0.55)"; ctx.fillRect(x, 0, 3, h);
      ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.fillRect(x + 3, 0, 2, h);
      ctx.fillStyle = "rgba(60,70,80,0.25)"; ctx.fillRect(x + 5, 0, 1, h);
    }
  },
  /* モルタル塗り: 大きな模様を持たないフラットな塗り肌(微細な砂目のみ) */
  wall_mortar(ctx, w, h) {
    ctx.fillStyle = "#e9e2d3"; ctx.fillRect(0, 0, w, h);
    // 擬似乱数(ハッシュ)で微細な砂目を散らす。大きな円や淡いパッチは描かない。
    let s = 1234567;
    const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
    for (let i = 0; i < 1400; i++) {
      const x = rnd() * w, y = rnd() * h;
      const light = rnd() < 0.5;
      ctx.fillStyle = `rgba(${light ? "255,255,255" : "120,110,92"},${0.04 + rnd() * 0.05})`;
      ctx.fillRect(x, y, 1, 1);
    }
  },
  /* 窯業系サイディング: 横目地+千鳥の縦ジョイント+柄の細筋 */
  wall_siding(ctx, w, h) {
    ctx.fillStyle = "#d7d1c1"; ctx.fillRect(0, 0, w, h);
    const rows = 6, rh = h / rows;
    for (let r = 0; r < rows; r++) {
      for (let i = 0; i < 12; i++) {
        ctx.fillStyle = `rgba(100,92,78,${0.04 + ((r * 5 + i * 3) % 3) * 0.02})`;
        ctx.fillRect(0, r * rh + 3 + ((i * 19 + r * 7) % (rh - 8)), w, 1);
      }
      ctx.fillStyle = "rgba(60,54,44,0.45)"; ctx.fillRect(0, (r + 1) * rh - 2, w, 2);
      ctx.fillStyle = "rgba(255,255,255,0.20)"; ctx.fillRect(0, r * rh, w, 2);
      const jx = ((r % 2) ? w / 2 : w / 4) + (r * 31) % 40;
      ctx.fillStyle = "rgba(60,54,44,0.30)"; ctx.fillRect(jx, r * rh, 2, rh);
    }
  },
  /* 木質系下見板: 板の重ね(下端の影)+木目 */
  wall_wood(ctx, w, h) {
    ctx.fillStyle = "#8a6a49"; ctx.fillRect(0, 0, w, h);
    const rows = 5, rh = h / rows;
    for (let r = 0; r < rows; r++) {
      const gr = ctx.createLinearGradient(0, r * rh, 0, (r + 1) * rh);
      gr.addColorStop(0, "rgba(255,235,200,0.15)");
      gr.addColorStop(0.85, "rgba(0,0,0,0.05)");

/* フローリング(幅303mmの板を乱尺に張った模様)

const FLOOR_TILE = 1.818;

  const plank = (x0, ya, yb, k) => {

    for (let i = 0; i < 9; i++) grain.push([x0 + 4 + rnd() * (cw - 8), 0.6 + rnd() * 1.4, 0.06 + rnd() * 0.12, rnd() * 6.28, 2 + rnd() * 5]);
    for (const off of [0, -S]) {

      if (y1 <= 0 || y0 >= S) continue;
      ctx.save();
      ctx.beginPath(); ctx.rect(x0, y0, cw, y1 - y0); ctx.clip();
      ctx.fillStyle = `rgb(${Math.round(198 * k)},${Math.round(156 * k)},${Math.round(104 * k)})`;
      ctx.fillRect(x0, y0, cw, y1 - y0);
      for (const [lx, lw, a, ph, amp] of grain) {        // 木目
        ctx.strokeStyle = `rgba(92,58,28,${a.toFixed(3)})`;
        ctx.lineWidth = lw;

        for (let y = y0; y <= y1; y += 12) {

// 床の寸法(x方向・z方向)に合わせて模様を繰り返したフローリングの材質

  if (TEX_CACHE.floor_engawa) return TEX_CACHE.floor_engawa;

  const cv = document.createElement("canvas");
  cv.width = cv.height = S;
  const ctx = cv.getContext("2d");
  let seed = 20260923;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let c = 0; c < cols; c++) {
    const x0 = c * cw, k = 0.95 + rnd() * 0.08;             // 板ごとの色の差は控えめに
    ctx.fillStyle = `rgb(${Math.round(214 * k)},${Math.round(178 * k)},${Math.round(128 * k)})`;
    ctx.fillRect(x0, 0, cw, S);
    for (let x = x0 + 1.5 + rnd() * 2; x < x0 + cw - 1; x += 1.6 + rnd() * 2.6) {   // 柾目

      ctx.lineWidth = 0.6 + rnd() * 0.9;
      const ph = rnd() * 6.28, amp = rnd() * 0.8;

  t.colorSpace = THREE.SRGBColorSpace;

    t.center.set(0.5, 0.5);
    t.rotation = Math.PI / 2;
    t.repeat.set(sizeZ / FLOOR_TILE, sizeX / FLOOR_TILE);

    t.repeat.set(sizeX / FLOOR_TILE, sizeZ / FLOOR_TILE);

function texturedMaterial(kind, key, repX, repY) {
  const def = kind === "roof" ? ROOFS[key] : WALLS[key];
  const tex = getBaseTexture(kind + "_" + key).clone();
  tex.needsUpdate = true;

/* ============================================================
   ヘルパー
============================================================ */
function tag(mesh, part, member, layer) {
  mesh.userData.part = part;

  mesh.userData.layer = layer; // ext | int | frame | found
  mesh.userData.baseMat = mesh.material;

}
function box(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);

// 複数の形状を1つのメッシュにまとめる(建具1枚を1部材として数え、ハイライト・透過もまとめて効かせる)
// list: [[座標変換済みの形状, 材質], ...]  材質ごとにグループを分けて描き分ける
function mergeGeoms(list) {
  const pos = [], nor = [], uv = [], mats = [];
  const geo = new THREE.BufferGeometry();
  let start = 0;
  for (const [g0, mat] of list) {
    const g1 = g0.index ? g0.toNonIndexed() : g0;
    for (const v of g1.attributes.position.array) pos.push(v);
    for (const v of g1.attributes.normal.array) nor.push(v);
    for (const v of g1.attributes.uv.array) uv.push(v);
    let mi = mats.indexOf(mat);
    if (mi < 0) { mats.push(mat); mi = mats.length - 1; }
    geo.addGroup(start, g1.attributes.position.count, mi);
    start += g1.attributes.position.count;
    if (g1 !== g0) g1.dispose();
    g0.dispose();
  }
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));

// 座標変換済みの直方体の形状(mergeGeoms用)

  const g = new THREE.BoxGeometry(w, h, d);
  g.translate(x, y, z);
  return g;
}
/* 内部建具のキット(枠・開き戸・引戸・襖・障子)。各モデルの内装から共通で使う

   戸は取手・引手・襖縁ごと1枚=1部材にまとめ(使用数・ハイライト・汚損表示を戸の単位で扱うため)、
   枠は部材ごとに分ける(汚損表示は部材の外形で描くため、まとめると開口をふさいでしまう) */

  const track = 0.013;                                        // 引違いの溝(壁芯からの振り分け)
  // 壁に沿った座標(u=壁の通り方向, v=壁の厚み方向)で形状を作る
  const onWall = (axis, c) => (du, h, dv, u, y, v) =>

    const gd = new THREE.CylinderGeometry(r, r, t, 20);
    if (axis === "z") { gd.rotateX(Math.PI / 2); gd.translate(u, y, c + v); }
    else { gd.rotateZ(Math.PI / 2); gd.translate(c + v, y, u); }

      add(new THREE.Mesh(B(frW, yt - yb, frD, a1 - frW / 2, (yb + yt) / 2, 0), frameMat), fm);

      if (japanese || kind === "bath")

        parts.push([B(0.12, 0.018, 0.018, hu - 0.045, hy, s * (T / 2 + 0.024)), M.kanagu]);

        parts.push([B(0.03, 0.16, 0.004, hu, hy, s * (T / 2 + 0.001)), M.fuchi]);
      }
    }
    add(mergeGeoms(parts), member);
  };
}
/* ユニットバス(床パン・浴槽・壁パネル・水栓金具)
   浴室の内法を「入口の壁(v=0)→浴槽側の壁(v=Lv)」、それと直交する幅方向を u として扱い、どちら向きの浴室にも使う
   o.axis: v方向の軸("x"|"z") / o.sign: v方向の向き(+1|-1) / o.v0: 入口の壁の内面の位置 / o.Lv: 奥行
   o.u0: u方向の起点(座標の小さい側の壁の内面) / o.Lu: 幅 / o.fy: 床の基準高さ / o.top: 壁パネルの上端(天井の下面)
   o.door: [a0, a1] 入口の開口(u座標) / o.doorTop: 入口の開口の上端の高さ
   水栓・鏡・シャワーは u=Lu の壁に付ける(o.faucetSide が 0 なら u=0 の壁) */
const UB_MAT = {
  floor:   new THREE.MeshStandardMaterial({ color: 0xc9ced1, roughness: 0.8 }),
  drain:   new THREE.MeshStandardMaterial({ color: 0x5b6166, roughness: 0.5, metalness: 0.4 }),
  tub:     new THREE.MeshStandardMaterial({ color: 0xf6f7f8, roughness: 0.22 }),
  basin:   new THREE.MeshStandardMaterial({ color: 0xd9e8ee, roughness: 0.25 }),
  wall:    new THREE.MeshStandardMaterial({ color: 0xf1eee8, roughness: 0.55 }),
  accent:  new THREE.MeshStandardMaterial({ color: 0xcfc3b2, roughness: 0.5 }),
  metal:   new THREE.MeshStandardMaterial({ color: 0xd4d8db, roughness: 0.18, metalness: 0.85 }),
  mirror:  new THREE.MeshStandardMaterial({ color: 0xe8eef2, roughness: 0.05, metalness: 0.95 }),
  counter: new THREE.MeshStandardMaterial({ color: 0xf3f4f5, roughness: 0.3 }),
  bathFrame: new THREE.MeshStandardMaterial({ color: 0xc5cacd, roughness: 0.35, metalness: 0.5 }),   // 浴室の戸の枠・框(アルミ)
  bathPanel: new THREE.MeshStandardMaterial({ color: 0xe8eef0, roughness: 0.12 }),                  // 浴室の戸の樹脂パネル(すりガラス調)
  louver:    new THREE.MeshStandardMaterial({ color: 0x98a0a5, roughness: 0.4, metalness: 0.3 }),   // 浴室の戸の換気ガラリ
};
function buildUnitBath(add, member, o) {
  const { axis, sign, v0, Lv, u0, Lu, fy } = o;
  const B = (du, h, dv, u, y, v) => axis === "x"
    ? boxGeo(dv, h, du, v0 + sign * v, y, u0 + u)
    : boxGeo(du, h, dv, u0 + u, y, v0 + sign * v);
  const yF = fy + 0.06;                        // 床パンの上面(脱衣室の床より少し上げる)
  const tubD = 0.78, tv = Lv - tubD;           // 浴槽の奥行・浴槽の手前(エプロン)の位置
  const rim = yF + 0.50, bd = rim - 0.40;      // 浴槽の縁の高さ・内槽の底の高さ

  // 床パン・排水溝
  add(mergeGeoms([
    [B(Lu - 0.006, 0.034, Lv - 0.006, Lu / 2, fy + 0.043, Lv / 2), UB_MAT.floor],
    [B(Lu - 0.24, 0.004, 0.045, Lu / 2, yF + 0.001, tv - 0.05), UB_MAT.drain],
  ]), member);

  // 浴槽(エプロン・縁・内槽)。内槽の壁は縁の下に隠れる位置に立てる
  const iv0 = tv + 0.07, iv1 = Lv - 0.06;      // 内槽の手前・奥の内面
  add(mergeGeoms([
    [B(Lu - 0.01, rim - yF, 0.04, Lu / 2, (yF + rim) / 2, tv + 0.02), UB_MAT.tub],            // エプロン
    [B(Lu - 0.01, 0.03, 0.08, Lu / 2, rim - 0.015, tv + 0.04), UB_MAT.tub],                   // 縁(手前)
    [B(Lu - 0.01, 0.03, 0.09, Lu / 2, rim - 0.015, Lv - 0.045), UB_MAT.tub],                  // 縁(奥)
    [B(0.08, 0.03, tubD, 0.045, rim - 0.015, tv + tubD / 2), UB_MAT.tub],                     // 縁(左右)
    [B(0.08, 0.03, tubD, Lu - 0.045, rim - 0.015, tv + tubD / 2), UB_MAT.tub],
    [B(Lu - 0.13, rim - 0.03 - bd, 0.02, Lu / 2, (bd + rim - 0.03) / 2, iv0 - 0.01), UB_MAT.basin],   // 内槽の壁(手前・奥)
    [B(Lu - 0.13, rim - 0.03 - bd, 0.02, Lu / 2, (bd + rim - 0.03) / 2, iv1 + 0.01), UB_MAT.basin],
    [B(0.02, rim - 0.03 - bd, iv1 - iv0, 0.065, (bd + rim - 0.03) / 2, (iv0 + iv1) / 2), UB_MAT.basin],   // 内槽の壁(左右)
    [B(0.02, rim - 0.03 - bd, iv1 - iv0, Lu - 0.065, (bd + rim - 0.03) / 2, (iv0 + iv1) / 2), UB_MAT.basin],
    [B(Lu - 0.13, 0.02, iv1 - iv0, Lu / 2, bd - 0.01, (iv0 + iv1) / 2), UB_MAT.basin],        // 内槽の底
  ]), member);

  // 壁パネル(入口の壁は開口を空ける。浴槽側の壁はアクセントパネル)
  const top = o.top, H = top - yF, yc = (yF + top) / 2, t = 0.01;
  const [da, db] = o.door, dTop = o.doorTop;
  const walls = [
    [B(t, H, Lv, t / 2, yc, Lv / 2), UB_MAT.wall],
    [B(t, H, Lv, Lu - t / 2, yc, Lv / 2), UB_MAT.wall],
    [B(Lu, H, t, Lu / 2, yc, Lv - t / 2), UB_MAT.accent],
    [B(Lu - db, H, t, (db + Lu) / 2, yc, t / 2), UB_MAT.wall],
    [B(db - da, top - dTop, t, (da + db) / 2, (dTop + top) / 2, t / 2), UB_MAT.wall],
  ];
  if (da > 0.005) walls.push([B(da, H, t, da / 2, yc, t / 2), UB_MAT.wall]);
  add(mergeGeoms(walls), member);

  // 水栓金具・カウンター・鏡・シャワー・手すり(水栓側の壁)
  const wu = Lu - t, vf = Math.max(0.35, tv - 0.32), vb = Math.max(0.12, vf - 0.30);
  const fu = (dd) => (o.faucetSide === 0 ? t + dd : wu - dd);   // 水栓側の壁の面からの距離 → u座標
  add(mergeGeoms([
    [B(0.05, 0.07, 0.30, fu(0.025), yF + 0.72, vf), UB_MAT.metal],          // 混合水栓(本体)
    [B(0.12, 0.022, 0.03, fu(0.08), yF + 0.69, vf), UB_MAT.metal],          // 吐水口
    [B(0.03, 0.05, 0.05, fu(0.04), yF + 0.72, vf - 0.17), UB_MAT.metal],    // ハンドル
    [B(0.03, 0.05, 0.05, fu(0.04), yF + 0.72, vf + 0.17), UB_MAT.metal],
    [B(0.16, 0.025, 0.62, fu(0.08), yF + 0.60, vf), UB_MAT.counter],        // カウンター
    [B(0.008, 0.62, 0.38, fu(0.004), yF + 1.30, vf), UB_MAT.mirror],        // 鏡
    [B(0.03, 0.85, 0.03, fu(0.035), yF + 1.35, vb), UB_MAT.metal],          // シャワーのスライドバー
    [B(0.09, 0.03, 0.14, fu(0.09), yF + 1.78, vb), UB_MAT.metal],           // シャワーヘッド
    [B(0.035, 0.60, 0.035, fu(0.04), yF + 0.95, tv + 0.10), UB_MAT.metal],  // 浴槽脇の手すり
  ]), member);
}
function beamBetween(p1, p2, r, mat) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 6), mat);
  m.position.copy(p1).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  return m;
}

/* ============================================================
   住宅モデル生成
   W=8(間口, X方向=棟方向), D=6(奥行, Z方向), 南面=+Z, 玄関=+X妻側
============================================================ */
// 面内の平面投影でUVを求める(a→b を u 軸、面内でそれに直交する向きを v 軸)。
// 矩形なら従来の 0〜1 と同じ値になり、台形・三角形でも模様が歪まず、軒(a→b)から段が揃う。
function planarUV(pts) {
  const [a, b, c] = pts;
  const uAx = new THREE.Vector3().subVectors(b, a);
  const uLen = uAx.length();
  uAx.divideScalar(uLen);
  const n = new THREE.Vector3().crossVectors(uAx, new THREE.Vector3().subVectors(c, a)).normalize();
  const vAx = new THREE.Vector3().crossVectors(n, uAx);
  const rel = pts.map((p) => new THREE.Vector3().subVectors(p, a));
  const vLen = Math.max(...rel.map((r) => r.dot(vAx)));
  return rel.map((r) => [r.dot(uAx) / uLen, r.dot(vAx) / vLen]);
}
function quadMesh(a, b, c, d, mat) {
  const geo = new THREE.BufferGeometry();
  const pos = [a, b, c, a, c, d].flatMap((v) => [v.x, v.y, v.z]);
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  const [ua, ub, uc, ud] = planarUV([a, b, c, d]);
  geo.setAttribute("uv", new THREE.Float32BufferAttribute([ua, ub, uc, ua, uc, ud].flat(), 2));
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, mat);
}
function triMesh(a, b, c, mat) {
  const geo = new THREE.BufferGeometry();
  const pos = [a, b, c].flatMap((v) => [v.x, v.y, v.z]);
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute("uv", new THREE.Float32BufferAttribute(planarUV([a, b, c]).flat(), 2));
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, mat);
}

    // 2階 南面: 和室A・洋室Bに2か所ずつ、納戸に1か所(押入・クローゼットは窓を避ける)
    O(2, "S", -3.30, 1.50, 1.10, 0.95, "koshi", "窓(2階)", "washitsuA", { shoji: true }),
    O(2, "S", -1.60, 1.50, 1.10, 0.95, "koshi", "窓(2階)", "washitsuA", { shoji: true }),
    O(2, "S", 0.30, 1.50, 1.10, 0.95, "koshi", "窓(2階)", "yoB"),
    O(2, "S", 2.00, 1.50, 1.10, 0.95, "koshi", "窓(2階)", "yoB"),
    O(2, "S", 3.70, 0.90, 1.10, 0.95, "koshi", "窓(2階)", "nando2"),
    // 2階 北面: 北側廊下の窓3か所
    O(2, "N", -2.20, 1.20, 1.00, 1.00, "koshi", "窓(2階)", "rouka2"),
    O(2, "N", 0.00, 1.20, 1.00, 1.00, "koshi", "窓(2階)", "rouka2"),
    O(2, "N", 2.20, 1.20, 1.00, 1.00, "koshi", "窓(2階)", "rouka2"),
  ];

  const F = (room, type, x, z, face) => ({ room, type, at: [x, z], face });
  const furniture = [
    F("zashiki", "zataku", -4.00, 2.00, "S"),              // 座敷: 座卓(床の間・押入の前を空ける)
    F("chanoma", "zataku", -0.45, -2.40, "S"),             // 茶の間: 座卓とテレビ、たんす
    F("chanoma", "tvBoard", 1.145, -2.40, "W"),
    F("chanoma", "tansu", -2.02, -3.60, "E"),
    F("daidokoro", "diningSet", -3.70, -2.30, "E"),        // 台所: 食卓と冷蔵庫
    F("daidokoro", "fridge", -4.88, -4.05, "S"),
    F("hiroen", "hiroenSet", -4.60, 3.88, "S"),            // 広縁: 応接セット(籐椅子)
    F("nando", "tansu", 5.66, -3.00, "W"),                 // 東納戸: たんす
    F("washitsuA", "futon", -2.50, 0.60, "S"),             // 2階 和室A: 布団2組
    F("washitsuA", "futon", -1.40, 0.60, "S"),
    F("yoB", "bedSingle", 0.055, 0.125, "S"),              // 2階 洋室B: ベッド・机・本棚
    F("yoB", "desk", 2.00, 2.845, "N"),
    F("yoB", "bookshelf", 2.775, 0.30, "W"),
  ];

  const floorY = (f) => f === 1 ? yFloor : yG;                                        // 床の高さ
  const ceilY = (f) => f === 1 ? yFloor + 2.45 : yG + 2.30;                            // 天井の高さ
  const roomArea = (r) => (r.rect[1] - r.rect[0]) * (r.rect[3] - r.rect[2]);
  const outer = (f) => f === 1 ? { W, D } : { W: S.W2, D: S.D2 };
  const bounds = (f) => f === 1 ? { x0: iX0, x1: iX1, z0: iZ0, z1: iZ1 } : { x0: jX0, x1: jX1, z0: jZ0, z1: jZ1 };
  return { name: "和風住宅(入母屋)", W, D, iX0, iX1, iZ0, iZ1, jX0, jX1, jZ0, jZ1, G, stair, rooms, partitions, openings, furniture,
           floorY, ceilY, roomArea, outer, bounds, perimeter: (f) => rectPerimeter(bounds(f)), wallT: 0.0325, stories: 2, tatamiTop2: 0.08 };
})();

function buildWafuHouse() {
  const S = WSPEC;
  const g = new THREE.Group();
  const site = new THREE.Group();
  site.userData.isSite = true;
  g.add(site);

  const yFloor = S.foundH;
  const y1F = yFloor + S.f1;                 // 1階軒/2階床レベル
  const yG = y1F + 0.35;                     // 下屋が2階壁に取り付く高さ
  const yTop2 = yG + S.f2;                   // 2階の軒高
  const W1h = S.W1 / 2, D1h = S.D1 / 2, W2h = S.W2 / 2, D2h = S.D2 / 2;
  // 南面の割付(設計情報 WAFU_PLAN): 西寄りに縁側+掃出し建具、東寄りに玄関。柱はこれらを避けて配置する
  const WP = WAFU_PLAN;
  const oEn = WP.openings.find((o) => o.kind === "engawa"), oG = WP.openings.find((o) => o.kind === "genkanW");
  const enCx = oEn.at, enW = oEn.w, enD = 0.90;  // 縁側・建具(中心x, 幅, 出=3尺。軒の出0.95m内に収める)
  const gx = oG.at, gW = oG.w;                    // 玄関(中心x, 幅) — 土間 x3.35〜5.25
  const openOnW = (face, floor) => WP.openings.filter((o) => o.face === face && o.floor === floor);
  const rectsW = (face, floor) => openOnW(face, floor).map((o) => openingRect(o, WP));
  const enL = enCx - enW / 2, enR = enCx + enW / 2;
  const gL = gx - gW / 2, gR = gx + gW / 2;
  const We = W2h + S.ovR, Ze = D2h + S.ovR;  // 主屋根の軒先
  const inset = S.hHip / S.tanA;
  const rx = We - inset, rz = Ze - inset;    // 入母屋の隅棟頂部の矩形
  const y1 = yTop2 + S.hHip;
  const y2 = y1 + rz * S.tanA;               // 棟高

  /* 材質 */
  const kawara = texturedMaterial("roof", "kawara", (S.W2 + 2 * S.ovR) / 1.2, 3.0);
  kawara.color = new THREE.Color(0x8f959a);   // いぶし瓦
  const kawaraG = texturedMaterial("roof", "kawara", S.W1 / 1.2, 1.6);
  kawaraG.color = new THREE.Color(0x8f959a);
  const M2 = {
    kawara, kawaraG,
    mune:  new THREE.MeshStandardMaterial({ color: 0x5e6367, roughness: 0.7 }),
    oni:   new THREE.MeshStandardMaterial({ color: 0x4e5357, roughness: 0.65 }),
    shikkui: new THREE.MeshStandardMaterial({ color: 0xe9e5d8, roughness: 0.92, side: THREE.DoubleSide }),
    ita:   new THREE.MeshStandardMaterial({ color: 0xa9814f, roughness: 0.85, side: THREE.DoubleSide }),
    hashira: new THREE.MeshStandardMaterial({ color: 0xc2a06a, roughness: 0.75 }),
    hafu:  new THREE.MeshStandardMaterial({ color: 0xd9c9a8, roughness: 0.7, side: THREE.DoubleSide }),
    nokiten: new THREE.MeshStandardMaterial({ color: 0xb08d5c, roughness: 0.85, side: THREE.DoubleSide }),
    shoji: new THREE.MeshStandardMaterial({ color: 0xf2ede0, roughness: 0.9, side: THREE.DoubleSide }),
    garasu: MAT.glass,   // 透明ガラス(縁側・玄関の建具)
    kigumi: new THREE.MeshStandardMaterial({ color: 0x8c6239, roughness: 0.8 }),
    amado: new THREE.MeshStandardMaterial({ color: 0x6f5334, roughness: 0.8 }),
    engawa: new THREE.MeshStandardMaterial({ color: 0xc9a469, roughness: 0.8 }),
    conc:  new THREE.MeshStandardMaterial({ color: 0x8d8d86, roughness: 0.9 }),
    ishi:  new THREE.MeshStandardMaterial({ color: 0x9aa0a4, roughness: 0.95 }),
    gutter: new THREE.MeshStandardMaterial({ color: 0x4a4f52, roughness: 0.5, metalness: 0.35 }),
  };
  const P = { roof: "屋根", wall: "外壁", open: "開口部", gut: "雨樋・附帯", frame: "軸組(構造材)", found: "基礎", eq: "附帯設備", int: "内装" };
  const T = (m, part, member, layer) => { m.userData.part = part; m.userData.member = member; m.userData.layer = layer || "ext"; m.userData.baseMat = m.material; g.add(m); return m; };
  const V = (x, y, z) => new THREE.Vector3(x, y, z);

  /* ---- 基礎(布基礎)・床下換気 ---- */
  [[S.W1 + 0.2, D1h], [S.W1 + 0.2, -D1h]].forEach(([lw, z]) => {
    T(box(lw, S.foundH, 0.3, M2.conc, 0, S.foundH / 2, z), P.found, "基礎(布基礎)");
  });
  [[W1h], [-W1h]].forEach(([x]) => T(box(0.3, S.foundH, S.D1 + 0.2, M2.conc, x, S.foundH / 2, 0), P.found, "基礎(布基礎)"));
  for (let x = -W1h + 1.5; x < W1h; x += 2.4) {
    T(box(0.36, 0.14, 0.32, M2.ishi, x, S.foundH - 0.12, D1h + 0.02), P.found, "床下換気口");
  }
  /* ---- 土台・柱(真壁の化粧柱) ---- */
  const sillY = S.foundH + 0.095;   // 基礎天と面を一致させない
  T(box(S.W1, 0.16, 0.16, M2.kigumi, 0, sillY, D1h), P.frame, "土台");
  T(box(S.W1, 0.16, 0.16, M2.kigumi, 0, sillY, -D1h), P.frame, "土台");
  T(box(0.16, 0.16, S.D1, M2.kigumi, W1h, sillY, 0), P.frame, "土台");
  T(box(0.16, 0.16, S.D1, M2.kigumi, -W1h, sillY, 0), P.frame, "土台");
  // 真壁の化粧柱: 1間半(1.5m)ごとを基本に、窓・建具の脇に柱を立て、開口に掛かる柱は除く
  const pillarXs = [];
  for (let x = -W1h; x <= W1h + 0.01; x += S.W1 / 8) pillarXs.push(+x.toFixed(3));
  // 柱が寄り集まって見えないように間引く(隅柱は残す)
  //  ・窓・建具の脇の柱から0.6m未満に残った基本割付の柱は除く
  //  ・隅柱から0.45m未満の窓脇の柱は除く(隅柱が窓の脇を兼ねる)
  //  ・隣り合う窓の間(0.6m未満)の2本は、窓の間の中央の1本にまとめる
  const thinPosts = (posts, rects, edge, corner) => {
    const side = rects.flatMap((r) => [r.u0 - edge, r.u1 + edge]);
    const isSide = (u) => side.some((s) => Math.abs(s - u) < 1e-6);
    const isCorner = (u) => Math.abs(u) >= corner - 0.01;
    const ps = posts.filter((u) => isSide(u) || isCorner(u) || !posts.some((p) => isSide(p) && Math.abs(p - u) < 0.6))
      .filter((u) => isCorner(u) || !isSide(u) || corner - Math.abs(u) >= 0.45)
      .sort((a, b) => a - b);
    const out = [];
    for (let i = 0; i < ps.length; i++) {
      if (i + 1 < ps.length && isSide(ps[i]) && isSide(ps[i + 1]) && ps[i + 1] - ps[i] < 0.6) { out.push((ps[i] + ps[i + 1]) / 2); i++; }
      else out.push(ps[i]);
    }
    return out;
  };
  ["S", "N", "E", "W"].forEach((face) => {
    const sn = face === "S" || face === "N";
    const c = sn ? FACE[face].nz * D1h : FACE[face].nx * W1h;
    const base = { posts: sn ? pillarXs : [-D1h + 1.8, 0, D1h - 1.8], studs: [], braces: [] };
    const lay = frameLayout(base, sn ? S.W1 + 0.4 : S.D1 - 0.2, rectsW(face, 1), 0.09);
    thinPosts(lay.posts, rectsW(face, 1), 0.09, sn ? W1h : D1h).forEach((u) => {
      const w = sn ? 0.155 : 0.15;   // 土台(0.16角)と外面を一致させない
      const hP = S.f1 - 0.11;  // 柱の頭は桁の中に納め(桁の上面・外壁の上端とも一致させない)、下屋の屋根面から出さない
      T(box(w, hP, w, M2.hashira, sn ? u : c, yFloor + hP / 2, sn ? c : u), P.frame, "柱(化粧柱)");
    });
  });
  // 桁・梁(下屋の屋根面より下に収める)
  T(box(S.W1 + 0.2, 0.24, 0.18, M2.kigumi, 0, y1F - 0.22, D1h), P.frame, "桁");
  T(box(S.W1 + 0.2, 0.24, 0.18, M2.kigumi, 0, y1F - 0.22, -D1h), P.frame, "桁");
  T(box(0.18, 0.24, S.D1, M2.kigumi, W1h, y1F - 0.22, 0), P.frame, "梁");
  T(box(0.18, 0.24, S.D1, M2.kigumi, -W1h, y1F - 0.22, 0), P.frame, "梁");

  /* ---- 1階 外壁(真壁: 腰板張り＋漆喰)。設計情報の開口部に穴を空ける ---- */
  const koshiH = 0.95;
  ["S", "N", "E", "W"].forEach((face) => {
    const sn = face === "S" || face === "N";
    const c = sn ? FACE[face].nz * D1h : FACE[face].nx * W1h;
    const L = sn ? S.W1 : S.D1 + 0.065;
    const rects = rectsW(face, 1);
    const y0 = yFloor + 0.025, yK = y0 + koshiH, yTop = yFloor + S.f1 - 0.12;   // 上端は桁の裏に納める(下屋の屋根面から出さない)
    T(wallWithOpenings(face, c, 0.06, -L / 2, L / 2, y0, yK, rects, M2.ita), P.wall, "外壁(腰板張り)");
    T(wallWithOpenings(face, c, 0.065, -L / 2, L / 2, yK, yTop, rects, M2.shikkui), P.wall, "外壁(漆喰・土壁)");
  });
  // 窓(縁側・玄関以外)。真壁の外面から室内側の京壁まで枠を回し、和室・座敷は室内側に障子を立てる
  const wafuWinMats = {
    sash: new THREE.MeshStandardMaterial({ color: 0x4a4038, roughness: 0.45, metalness: 0.45 }),   // ブロンズのアルミサッシ
    glass: MAT.glass,
    shoji: new THREE.MeshStandardMaterial({ color: 0xf6f3ea, roughness: 0.9, side: THREE.DoubleSide }),
    shojiWaku: new THREE.MeshStandardMaterial({ color: 0xcdb48c, roughness: 0.6 }),
  };
  WP.openings.filter((o) => o.kind === "koshi" || o.kind === "small").forEach((o) => {
    const sn = o.face === "S" || o.face === "N";
    const half = o.floor === 1 ? (sn ? D1h : W1h) : (sn ? D2h : W2h);
    const unit = buildOpeningUnit(o, half, o.floor === 1 ? 0.098 : 0.088, wafuWinMats, WP);
    unit.traverse((m) => { if (m.isMesh) m.userData.layer = "ext"; });
    g.add(unit);
  });

  /* ---- 縁側・濡れ縁・建具(南面) ---- */
  T(box(enW + 0.5, 0.1, enD, M2.engawa, enCx, yFloor - 0.02, D1h + enD / 2), P.int, "縁側(濡れ縁)", "ext");
  for (let x = enL + 0.2; x <= enR; x += 1.9) {
    T(box(0.14, 0.5, 0.14, M2.kigumi, x, yFloor - 0.3, D1h + enD - 0.15), P.frame, "縁束");
    T(box(0.24, 0.1, 0.24, M2.ishi, x, yFloor - 0.55, D1h + enD - 0.15), P.found, "束石");
  }
  // 掃き出しの建具(ガラス戸＋障子)
  const tateguH = 1.85, nPanel = 5, pw = enW / nPanel;
  for (let i = 0; i < nPanel; i++) {
    const cx = enL + pw * (i + 0.5);
    T(box(pw - 0.04, tateguH, 0.05, M2.garasu, cx, yFloor + tateguH / 2 + 0.05, D1h + 0.04), P.open, "ガラス戸(掃出し)");
    T(box(pw - 0.01, tateguH - 0.02, 0.03, M2.shoji, cx, yFloor + tateguH / 2 + 0.05, D1h - 0.06 + (i % 2) * 0.035), P.open, "障子");   // 隣と重ねて隙間を残さない(溝を交互に)
    T(box(0.05, tateguH, 0.07, M2.kigumi, cx - pw / 2, yFloor + tateguH / 2 + 0.05, D1h + 0.04), P.open, "建具枠");
  }
  T(box(0.05, tateguH, 0.07, M2.kigumi, enR, yFloor + tateguH / 2 + 0.05, D1h + 0.04), P.open, "建具枠");   // 東端の枠(柱との隙間をふさぐ)
  T(box(enW + 0.12, 0.12, 0.09, M2.kigumi, enCx, yFloor + tateguH + 0.11, D1h + 0.085), P.frame, "鴨居・長押");   // 外壁面と一致させない
  // 雨戸の戸袋(建具の西端に1か所)
  T(box(0.85, tateguH + 0.16, 0.24, M2.amado, enL - 0.52, yFloor + 0.04 + (tateguH + 0.16) / 2, D1h + 0.14), P.open, "雨戸・戸袋");

  /* ---- 玄関(南東寄り・切妻ポーチ) ---- */
  {
    T(box(gW, 2.15, 0.08, M2.garasu, gx, yFloor + 1.08, D1h + 0.05), P.open, "玄関建具");
    for (let i = 1; i < 3; i++) T(box(0.06, 2.15, 0.1, M2.kigumi, gx - gW / 2 + i * (gW / 3), yFloor + 1.08, D1h + 0.09), P.open, "玄関建具");
    [gL, gR].forEach((x) => T(box(0.06, 2.15, 0.1, M2.kigumi, x, yFloor + 1.08, D1h + 0.09), P.open, "玄関建具"));   // 左右の枠(柱との隙間をふさぐ)
    T(box(gW + 0.2, 0.12, 0.1, M2.kigumi, gx, yFloor + 2.215, D1h + 0.06), P.frame, "鴨居・長押");
    T(box(2.4, 0.16, 0.9, M2.ishi, gx, yFloor - 0.06, D1h + 0.5), P.int, "式台・沓脱石", "ext");
    T(box(2.6, 0.12, 1.2, M2.conc, gx, 0.06, D1h + 1.5), P.found, "玄関たたき");
    // 切妻ポーチ屋根
    const pz = D1h + 1.35, pW = 3.2, pRise = 0.75, pY = yFloor + 2.55;
    [1, -1].forEach((sf) => {
      const half = 1.35;
      const slope = Math.hypot(half, pRise);
      const pnl = box(pW, 0.1, slope, M2.kawaraG, gx, pY + pRise / 2, D1h + 0.5 + sf * half / 2 + 0.5);
      pnl.rotation.x = sf > 0 ? Math.atan2(pRise, half) : -Math.atan2(pRise, half);
      T(pnl, P.roof, "玄関ポーチ屋根");
    });
    T(box(pW + 0.1, 0.14, 0.2, M2.mune, gx, pY + pRise + 0.08, D1h + 1.0), P.roof, "棟瓦");
    const gTri = new THREE.Shape();
    gTri.moveTo(-1.35, 0); gTri.lineTo(1.35, 0); gTri.lineTo(0, pRise); gTri.lineTo(-1.35, 0);
    [pW / 2, -pW / 2].forEach((ox) => {
      const t = new THREE.Mesh(new THREE.ShapeGeometry(gTri), M2.hafu);
      t.rotation.y = Math.PI / 2;
      t.position.set(gx + ox + Math.sign(ox) * 0.035, pY, D1h + 1.0);
      T(t, P.roof, "破風・懸魚");
    });
    [gx - 1.35, gx + 1.35].forEach((px) => T(box(0.16, 2.5, 0.16, M2.hashira, px, yFloor + 1.25, D1h + 1.55), P.frame, "ポーチ柱"));   // 玄関ポーチ屋根の下に立てる
  }

  /* ---- 下屋(1階まわりの腰屋根) ---- */
  {
    const ix = W2h, iz = D2h, ox = W1h + S.ovG, oz = D1h + S.ovG;
    const yi = yG, yo = y1F - 0.35;
    const I = (x, z) => V(x, yi + 0.03, z), O = (x, z) => V(x, yo, z);
    const faces = [
      [I(-ix, iz), I(ix, iz), O(ox, oz), O(-ox, oz)],
      [I(ix, -iz), I(-ix, -iz), O(-ox, -oz), O(ox, -oz)],
      [I(ix, iz), I(ix, -iz), O(ox, -oz), O(ox, oz)],
      [I(-ix, -iz), I(-ix, iz), O(-ox, oz), O(-ox, -oz)],
    ];
    faces.forEach((f) => T(quadMesh(f[0], f[1], f[2], f[3], M2.kawaraG), P.roof, "下屋根(瓦)"));
    // 隅棟
    [[ox, oz, ix, iz], [ox, -oz, ix, -iz], [-ox, oz, -ix, iz], [-ox, -oz, -ix, -iz]].forEach(([axx, azz, bxx, bzz]) => {
      T(beamBetween(V(axx, yo + 0.06, azz), V(bxx, yi + 0.06, bzz), 0.075, M2.mune), P.roof, "隅棟(降り棟)");
    });
    // 軒先の瓦の見切り・軒天
    T(box(S.W1 + 2 * S.ovG + 0.1, 0.12, 0.12, M2.mune, 0, yo, oz), P.roof, "軒瓦(万十軒)");
    T(box(S.W1 + 2 * S.ovG + 0.1, 0.12, 0.12, M2.mune, 0, yo, -oz), P.roof, "軒瓦(万十軒)");
    T(box(0.12, 0.12, S.D1 + 2 * S.ovG, M2.mune, ox, yo, 0), P.roof, "軒瓦(万十軒)");
    T(box(0.12, 0.12, S.D1 + 2 * S.ovG, M2.mune, -ox, yo, 0), P.roof, "軒瓦(万十軒)");
    // 化粧垂木(軒の出の下に見える垂木。屋根面の下に、屋根と同じ勾配で配置する)
    {
      const ang = Math.atan2(yi - yo, oz - iz);          // 下屋の勾配
      const rz0 = D1h - 0.30, rz1 = oz - 0.03;           // 軒の出の範囲(軒先の内側まで)
      const rzc = (rz0 + rz1) / 2;
      const surfY = yi - (yi - yo) * ((rzc - iz) / (oz - iz));   // その位置の屋根面の高さ
      const len = (rz1 - rz0) / Math.cos(ang);
      // 隅は寄棟の下り面になるため、南面の範囲(隅棟の内側)にとどめる
      const hipX = ix + (ox - ix) * ((rz0 - iz) / (oz - iz)) - 0.25;
      for (let x = -hipX; x <= hipX + 0.01; x += 0.6) {
        const r = box(0.07, 0.09, len, M2.nokiten, +x.toFixed(3), surfY - 0.11, rzc);
        r.rotation.x = ang;                               // 屋根と同じ向きに傾ける
        T(r, P.roof, "化粧垂木");
      }
    }
    // 雨樋(下屋の軒先)
    const gt = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, S.W1 + 2 * S.ovG, 10), M2.gutter);
    gt.rotation.z = Math.PI / 2; gt.position.set(0, yo - 0.02, oz + 0.09);
    T(gt, P.gut, "軒樋");
    const gt2 = gt.clone(); gt2.position.z = -(oz + 0.09);
    T(gt2, P.gut, "軒樋");
    // 竪樋: 軒樋から呼び樋で寄せ、1階の壁の角に沿って地面まで下ろす
    [[1, 1], [-1, -1]].forEach(([sx, sz]) => {
      const wx = sx * (W1h + 0.09), wz = sz * (D1h + 0.09);   // 1階外壁の角
      const gz = sz * (oz + 0.09);                             // 軒樋の位置
      const topY = yo - 0.06;
      T(beamBetween(V(wx, topY, gz), V(wx, topY - 0.42, wz), 0.05, M2.gutter), P.gut, "呼び樋");
      const dp = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, topY - 0.42, 10), M2.gutter);
      dp.position.set(wx, (topY - 0.42) / 2, wz);
      T(dp, P.gut, "竪樋");
      for (let by = 0.9; by < topY - 0.5; by += 1.3) {
        T(box(0.13, 0.05, 0.13, M2.gutter, wx, by, wz), P.gut, "竪樋");
      }
    });
  }

  /* ---- 2階 外壁・開口部(設計情報の開口部に穴を空け、窓の脇に柱を立てる) ---- */
  {
    const h2 = yTop2 - yG;
    ["S", "N", "E", "W"].forEach((face) => {
      const sn = face === "S" || face === "N";
      const c = sn ? FACE[face].nz * D2h : FACE[face].nx * W2h;
      const L = sn ? S.W2 : S.D2 + 0.06;
      T(wallWithOpenings(face, c, 0.06, -L / 2, L / 2, yG, yTop2, rectsW(face, 2), M2.shikkui), P.wall, "外壁(漆喰・土壁)");
      if (!sn) return;
      // 化粧柱(1.5mごと。窓に掛かる柱は除き、窓の脇に立てる)
      const base = [];
      for (let x = -W2h; x <= W2h + 0.01; x += S.W2 / 6) base.push(+x.toFixed(3));
      thinPosts(frameLayout({ posts: base, studs: [], braces: [] }, S.W2, rectsW(face, 2), 0.085).posts, rectsW(face, 2), 0.085, W2h).forEach((px) =>
        T(box(0.14, h2, 0.14, M2.hashira, px, yG + h2 / 2, c), P.frame, "柱(化粧柱)"));
    });
    T(box(S.W2 + 0.1, 0.1, 0.09, M2.kigumi, 0, yG + h2 - 0.12, D2h + 0.048), P.frame, "鴨居・長押");   // 壁に少し食い込ませ、面の一致を避ける
    // 手すり: 下屋の面に足を下ろし、2階の壁際に取り付ける
    const tesuriZ = D2h + 0.16;
    const tesuriBase = yG - 0.10;              // 下屋の面に少し埋める
    const tesuriTop = yG + 0.85;               // 窓台(床+0.95)より下に収める
    T(box(S.W2 - 1.0, 0.08, 0.08, M2.kigumi, 0, tesuriTop, tesuriZ), P.open, "手すり");
    T(box(S.W2 - 1.0, 0.08, 0.08, M2.kigumi, 0, yG + 0.42, tesuriZ), P.open, "手すり");
    for (let x = -(S.W2 - 1.0) / 2; x <= (S.W2 - 1.0) / 2 + 0.01; x += 1.6) {
      const hgt = tesuriTop - tesuriBase;
      T(box(0.07, hgt, 0.07, M2.kigumi, +x.toFixed(3), tesuriBase + hgt / 2, tesuriZ), P.open, "手すり");
      T(box(0.06, 0.06, 0.2, M2.kigumi, +x.toFixed(3), tesuriTop, D2h + 0.06), P.open, "手すり");   // 壁への取付材
    }
  }

  /* ---- 主屋根(入母屋) ---- */
  {
    const E = (x, z) => V(x, yTop2 + 0.03, z), H = (x, z) => V(x, y1, z);
    // 下部の寄棟部分
    T(quadMesh(E(-We, Ze), E(We, Ze), H(rx, rz), H(-rx, rz), M2.kawara), P.roof, "屋根葺き材(瓦)");
    T(quadMesh(E(We, -Ze), E(-We, -Ze), H(-rx, -rz), H(rx, -rz), M2.kawara), P.roof, "屋根葺き材(瓦)");
    T(quadMesh(E(We, Ze), E(We, -Ze), H(rx, -rz), H(rx, rz), M2.kawara), P.roof, "屋根葺き材(瓦)");
    T(quadMesh(E(-We, -Ze), E(-We, Ze), H(-rx, rz), H(-rx, -rz), M2.kawara), P.roof, "屋根葺き材(瓦)");
    // 上部の切妻部分
    T(quadMesh(H(-rx, rz), H(rx, rz), V(rx, y2, 0), V(-rx, y2, 0), M2.kawara), P.roof, "屋根葺き材(瓦)");
    T(quadMesh(H(rx, -rz), H(-rx, -rz), V(-rx, y2, 0), V(rx, y2, 0), M2.kawara), P.roof, "屋根葺き材(瓦)");
    // 妻壁(入母屋の三角)と破風・懸魚
    [rx, -rx].forEach((px) => {
      T(triMesh(V(px * 0.985, y1, rz), V(px * 0.985, y1, -rz), V(px * 0.985, y2, 0), M2.shikkui), P.wall, "妻壁(入母屋)");   // 屋根の端面と重ねない
      [rz, -rz].forEach((sz) => {
        T(beamBetween(V(px, y1 - 0.05, sz), V(px, y2 + 0.02, 0), 0.11, M2.hafu), P.roof, "破風・懸魚");
      });
      T(box(0.16, 0.55, 0.3, M2.hafu, px, y2 - 0.35, 0), P.roof, "破風・懸魚");
    });
    // 大棟・鬼瓦
    T(box(2 * rx + 0.3, 0.26, 0.42, M2.mune, 0, y2 + 0.1, 0), P.roof, "棟瓦(大棟)");
    [rx + 0.1, -(rx + 0.1)].forEach((px) => T(box(0.24, 0.62, 0.5, M2.oni, px, y2 + 0.28, 0), P.roof, "鬼瓦"));
    // 隅棟(4本)
    [[We, Ze, rx, rz], [We, -Ze, rx, -rz], [-We, Ze, -rx, rz], [-We, -Ze, -rx, -rz]].forEach(([ax, az, bx, bz]) => {
      T(beamBetween(V(ax, yTop2 + 0.08, az), V(bx, y1 + 0.08, bz), 0.1, M2.mune), P.roof, "隅棟(降り棟)");
    });
    // 軒瓦・軒樋
    T(box(2 * We + 0.1, 0.13, 0.13, M2.mune, 0, yTop2, Ze), P.roof, "軒瓦(万十軒)");
    T(box(2 * We + 0.1, 0.13, 0.13, M2.mune, 0, yTop2, -Ze), P.roof, "軒瓦(万十軒)");
    const gtR = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 2 * We, 10), M2.gutter);
    gtR.rotation.z = Math.PI / 2; gtR.position.set(0, yTop2 - 0.03, Ze + 0.09);
    T(gtR, P.gut, "軒樋");
    const gtR2 = gtR.clone(); gtR2.position.z = -(Ze + 0.09);
    T(gtR2, P.gut, "軒樋");
    // 主屋根から下屋へ落とす竪樋
    // 竪樋: 主屋根の軒樋から呼び樋で2階の壁へ寄せ、下屋の面まで下ろす
    [[1, 1], [-1, -1]].forEach(([sx, sz]) => {
      const wx = sx * (W2h + 0.09), wz = sz * (D2h + 0.09);
      const gz = sz * (Ze + 0.09);
      const topY = yTop2 - 0.1;
      const botY = yG + 0.12;
      T(beamBetween(V(wx, topY, gz), V(wx, topY - 0.4, wz), 0.05, M2.gutter), P.gut, "呼び樋");
      const h = topY - 0.4 - botY;
      const dp = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, h, 10), M2.gutter);
      dp.position.set(wx, botY + h / 2, wz);
      T(dp, P.gut, "竪樋");
      T(box(0.13, 0.05, 0.13, M2.gutter, wx, botY + h * 0.55, wz), P.gut, "竪樋");
    });
  }

  /* ============================================================
     内装(農家住宅の田の字型プラン)
       1F: 広縁 / 座敷8帖(床の間・押入) / 次の間8帖(仏間) / 台所 / 茶の間
           浴室(1616) / 洗面脱衣 / 便所 / 廊下・階段 / 玄関土間・ホール / 東納戸
       2F: 和室A12帖 / 洋室B11帖 / 北側廊下(踊り場) / 納戸 / 階段室
  ============================================================ */
  {
    const MW = {
      tatami: new THREE.MeshStandardMaterial({ color: 0xc2cd92, roughness: 0.92 }),
      heri:   new THREE.MeshStandardMaterial({ color: 0x4c5340, roughness: 0.9 }),
      ita:    new THREE.MeshStandardMaterial({ color: 0xc9a469, roughness: 0.72 }),
      yuka:   new THREE.MeshStandardMaterial({ color: 0xbf9a68, roughness: 0.68 }),
      tile:   new THREE.MeshStandardMaterial({ color: 0xdedcd5, roughness: 0.42 }),
      doma:   new THREE.MeshStandardMaterial({ color: 0x7f7a70, roughness: 0.85 }),
      kabe:   new THREE.MeshStandardMaterial({ color: 0xdfd6bf, roughness: 0.95, side: THREE.DoubleSide }),
      kabe2:  new THREE.MeshStandardMaterial({ color: 0xefe9dc, roughness: 0.95, side: THREE.DoubleSide }),
      tenjo:  new THREE.MeshStandardMaterial({ color: 0xc8a877, roughness: 0.9, side: THREE.DoubleSide }),
      sao:    new THREE.MeshStandardMaterial({ color: 0x8c6239, roughness: 0.8 }),
      fusuma: new THREE.MeshStandardMaterial({ color: 0xefe8d6, roughness: 0.9 }),
      shoji:  new THREE.MeshStandardMaterial({ color: 0xf3eee1, roughness: 0.9, side: THREE.DoubleSide }),
      toko:   new THREE.MeshStandardMaterial({ color: 0x7a5a35, roughness: 0.7 }),
      butsu:  new THREE.MeshStandardMaterial({ color: 0x4a3524, roughness: 0.6 }),
      cab:    new THREE.MeshStandardMaterial({ color: 0xd6cab6, roughness: 0.72 }),
      counter:new THREE.MeshStandardMaterial({ color: 0xe9e7e1, roughness: 0.45 }),
      tub:    new THREE.MeshStandardMaterial({ color: 0xf1f3f3, roughness: 0.33 }),
      toki:   new THREE.MeshStandardMaterial({ color: 0xfcfcfb, roughness: 0.33 }),
      kanagu: new THREE.MeshStandardMaterial({ color: 0xbcc2c6, roughness: 0.35, metalness: 0.6 }),
    };
    const IW = (m, member, part) => { g.add(tag(m, part || "内装", member, "int")); return m; };
    /* ---------------- 基準線(設計情報 WAFU_PLAN) ---------------- */
    const { iX0, iX1, iZ0, iZ1 } = WP;
    const fY = WP.floorY(1);           // 1階の床面
    const cH = WP.ceilY(1);            // 1階の天井
    const { zEn, zMid, xA, xB, xC, xD, zW, zW2, zT, zH, domaX0, domaX1 } = WP.G;
    /* ---------------- 床(設計情報の部屋ごと) ---------------- */
    // 板張りの床は板の目地・木目を張る(細長い床は長手方向に板を流す。広縁は明るく、台所・廊下は落ち着いた色味)
    // 和風の板張りは縁甲板(細い板を長手に通す。広縁は明るい桧、台所・廊下は飴色に落ち着いた松)。洋室だけフローリング
    const boardMat = (mat, w, d, style = "engawa") => (mat === MW.yuka || mat === MW.ita)
      ? flooringMaterial(w, d, { alongX: w > d * 1.6, style, tint: style === "engawa" ? (mat === MW.ita ? 0xfff6e8 : 0xd6b894) : 0xe8d2b4 })
      : mat;
    const slab = (x0, x1, z0, z1, mat, member, y, th) =>
      IW(box(x1 - x0, th || 0.06, z1 - z0, boardMat(mat, x1 - x0, z1 - z0), (x0 + x1) / 2, y === undefined ? fY : y, (z0 + z1) / 2), member, "床");
    // 畳の間(縁付き畳)を敷き詰める
    const tatamiRoom = (x0, x1, z0, z1, cols, rows) => {
      const mw = (x1 - x0) / cols, ml = (z1 - z0) / rows;
      IW(box(x1 - x0 - 0.05, 0.04, z1 - z0 - 0.05, MW.yuka, (x0 + x1) / 2, fY - 0.012, (z0 + z1) / 2), "床(畳)", "床");   // 畳の下地(隣の床と面を共有しないよう少し内側に)
      for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
        const px = x0 + i * mw, pz = z0 + j * ml;
        IW(box(mw - 0.006, 0.07, ml - 0.006, MW.tatami, px + mw / 2, fY + 0.005, pz + ml / 2), "床(畳)", "床");
        [pz + 0.032, pz + ml - 0.032].forEach((ez) =>
          IW(box(mw - 0.006, 0.073, 0.05, MW.heri, px + mw / 2, fY + 0.0065, ez), "床(畳)", "床"));
      }
    };
    WP.rooms.filter((r) => r.floor === 1).forEach((r) => {
      const [x0, x1, z0, z1] = r.rect;
      if (r.finish === "畳") tatamiRoom(x0, x1, z0, z1, r.tatami[0], r.tatami[1]);
      else if (r.finish === "タイル") slab(x0 + 0.012, x1 - 0.012, z0 + 0.012, z1 - 0.012, MW.tile, "床(タイル)", fY - 0.004);
      else if (r.finish === "土間") {
        slab(x0, x1, z0, z1, MW.doma, "玄関土間", yFloor - 0.42, 0.06);
        [x0, x1].forEach((x) => IW(box(0.14, 0.16, z1 - z0, MW.sao, x, fY - 0.03, (z0 + z1) / 2), "上がり框"));
      } else slab(x0, x1, z0, z1, r.light ? MW.ita : MW.yuka, r.member || "床(板張り)");
    });
    /* ---------------- 天井 ---------------- */
    IW(box(iX1 - iX0, 0.04, iZ1 - iZ0, MW.tenjo, (iX0 + iX1) / 2, cH, (iZ0 + iZ1) / 2), "天井(竿縁天井)");
    for (let x = iX0 + 0.65; x < iX1; x += 0.65)
      IW(box(0.05, 0.06, iZ1 - iZ0, MW.sao, x, cH - 0.05, (iZ0 + iZ1) / 2), "天井(竿縁天井)");
    /* ---------------- 外壁の室内側の仕上げ(京壁) ----------------
       間仕切り・床・天井・畳寄せの端を受け、外壁との間の隙間をふさぐ。「内部(外装を透過)」表示では外壁と一緒に透過させる(layer=ext)。
       開口部(縁側の建具・玄関・窓)は外壁と同じ位置に穴を空ける */
    const liningW = (floor, b, y0, y1, mat, member) => {
      const t = 0.02, ln = 0.012;
      [["N", b.z0 - ln + t / 2, b.x0, b.x1], ["S", b.z1 + ln - t / 2, b.x0, b.x1], ["W", b.x0 - ln + t / 2, b.z0, b.z1], ["E", b.x1 + ln - t / 2, b.z0, b.z1]]
        .forEach(([face, c, a, bb]) => g.add(tag(wallWithOpenings(face, c, t, a - 0.02, bb + 0.02, y0, y1, rectsW(face, floor), mat), "内装", member, "ext")));
    };
    liningW(1, WP.bounds(1), fY - 0.04, cH - 0.02, MW.kabe, "内壁(京壁)");
    /* ---------------- 建具(枠を回し、戸は鴨居・上枠まで隙間なく納める) ---------------- */
    const MWD = {
      waku:       new THREE.MeshStandardMaterial({ color: 0x6a4a2e, roughness: 0.6 }),                  // 枠・鴨居・敷居
      doorLeaf:   MW.ita,                                                                              // 板戸
      doorGroove: new THREE.MeshStandardMaterial({ color: 0x8a6a44, roughness: 0.65 }),
      fuchi:      new THREE.MeshStandardMaterial({ color: 0x2a211b, roughness: 0.4 }),                  // 襖縁(黒塗り)
      hikite:     new THREE.MeshStandardMaterial({ color: 0x8a7443, roughness: 0.35, metalness: 0.6 }), // 引手
      fusuma:     new THREE.MeshStandardMaterial({ color: 0xe2d2aa, roughness: 0.85 }),                 // 襖紙
      shoji:      new THREE.MeshStandardMaterial({ color: 0xf6f3ea, roughness: 0.9, side: THREE.DoubleSide }),   // 障子紙
      shojiWaku:  new THREE.MeshStandardMaterial({ color: 0xcdb48c, roughness: 0.6 }),                  // 障子の框・組子
      kanagu:     MW.kanagu,
    };
    const doorSetW = makeDoorKit(IW, MWD, { openH: 1.98, wallT: 0.05, frameMember: "建具枠(内部)" });
    /* ---------------- 間仕切り(設計情報の partitions。建具の開口を空け、上部に小壁を付けて建具を納める) ---------------- */
    const partitionsW = (floor, fy, ih, ft, kabe, member) => {
      WP.partitions.filter((p) => p.floor === floor).forEach((p) => {
        const mat = p.mat === "kabe2" ? MW.kabe2 : kabe;
        const seg = (a, b, y0, h) => {
          if (b - a <= 0.06) return;
          IW(p.axis === "x" ? box(0.05, h, b - a, mat, p.at, y0 + h / 2, (a + b) / 2) : box(b - a, h, 0.05, mat, (a + b) / 2, y0 + h / 2, p.at), member);
        };
        const ds = [...p.doors].sort((d1, d2) => d1.a - d2.a);
        let cur = p.from;
        ds.forEach((d) => { seg(cur, d.a, fy, ih); seg(d.a, d.b, fy + 1.98, ih - 1.98); cur = d.b; });
        seg(cur, p.to, fy, ih);
        ds.forEach((d) => doorSetW(fy, ft, p.axis, p.at, d.a, d.b, d.kind, d.member, d.opt || {}));
      });
    };
    const ih = cH - fY;
    partitionsW(1, fY, ih, 0.03, MW.kabe, "内壁(京壁)");
    // 玄関建具は外部側に既にあるため内部は框のみ
    /* ---------------- 座敷の造作(床の間・押入) ---------------- */
    {
      const tx0 = iX0 + 0.1, tkW = 1.82;
      IW(box(tkW, 0.16, 0.90, MW.toko, tx0 + tkW / 2, fY + 0.09, zMid + 0.55), "床の間");
      IW(box(tkW, ih - 0.2, 0.06, MW.kabe, tx0 + tkW / 2, fY + 0.2 + (ih - 0.2) / 2, zMid + 0.12), "床の間");
      IW(box(tkW + 0.1, 0.22, 0.16, MW.toko, tx0 + tkW / 2, cH - 0.35, zMid + 0.55), "床の間");
      IW(box(0.14, ih - 0.3, 0.14, MW.toko, tx0 + tkW, fY + 0.3 + (ih - 0.3) / 2, zMid + 0.95), "床柱");
      // 押入(床の間の東隣)。床柱の東から次の間との境の壁(xA)の手前まで(これまで境の壁を越えていた)
      const ox0 = tx0 + tkW + 0.08, ox1 = xA - 0.03;
      IW(box(ox1 - ox0, 2.00, 0.88, MW.ita, (ox0 + ox1) / 2, fY + 1.00, zMid + 0.54), "押入");
      doorSetW(fY, 0.04, "z", zMid + 0.98, ox0 + 0.01, ox1 - 0.01, "fusuma", "押入", { noFrame: true, sillH: 0, yTop: fY + 1.98, v: 0.03 });   // 押入の襖
    }
    /* ---------------- 次の間の仏壇 ---------------- */
    IW(box(0.55, 1.85, 0.95, MW.butsu, xB - 0.30, fY + 0.93, 0.70), "仏壇");   // 次の間の東の壁際(北側の襖・座敷の押入と重ならない位置)
    /* ---------------- 台所の造作 ---------------- */
    {
      const kx = iX0 + 0.35, kz0 = iZ0 + 0.5, kz1 = iZ0 + 3.1, kzc = (kz0 + kz1) / 2, kl = kz1 - kz0;
      IW(box(0.65, 0.86, kl, MW.cab, kx, fY + 0.445, kzc), "システムキッチン");
      IW(box(0.69, 0.05, kl + 0.04, MW.counter, kx, fY + 0.885, kzc), "システムキッチン");

function cValueNoise(seed) {
  const G = 256, r = mulberry32(seed), g = new Float32Array(G * G);

  const nc = document.createElement("canvas"); nc.width = w; nc.height = h;

  const cd = c2.createImageData(w, h), nd = n2.createImageData(w, h);
  const G = (x, y) => H[((y + h) % h) * w + ((x + w) % w)];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4, hv = H[y * w + x], col = shade(hv, x / w, y / h, n);
    cd.data[i] = col[0]; cd.data[i + 1] = col[1]; cd.data[i + 2] = col[2]; cd.data[i + 3] = 255;
    const dx = (G(x + 1, y) - G(x - 1, y)) * (nScale || 6), dy = (G(x, y + 1) - G(x, y - 1)) * (nScale || 6);
    const l = Math.hypot(-dx, -dy, 1);

/* キューブ型の室内(設計情報 CUBE_PLAN から床・天井・室内側の仕上げ・間仕切り・建具・階段・造作・家具類を作る) */
function buildCubeInterior(g) {
  const P = CUBE_PLAN;
  const IN = (m, member, part) => { g.add(tag(m, part || "内装", member, "int")); return m; };
  const S = (color, roughness, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness, ...extra });
  const M = {
    tile: S(0xdedcd5, 0.42), doma: S(0x8e8981, 0.8), kabe: S(0xf4f2ec, 0.95, { side: THREE.DoubleSide }),
    tenjo: S(0xf7f6f2, 0.95, { side: THREE.DoubleSide }), tategu: S(0xbb9166, 0.7), cabinet: S(0xd6cab6, 0.72),
    counter: S(0xe9e7e1, 0.45), kanagu: S(0xbcc2c6, 0.35, { metalness: 0.6 }), toki: S(0xfcfcfb, 0.33),
    waku: S(0x6f5237, 0.55), doorLeaf: S(0xcfa878, 0.5), doorGroove: S(0x8f6d4a, 0.6), fuchi: S(0x2a211b, 0.4),
    hikite: S(0x8a7443, 0.35, { metalness: 0.6 }), fusuma: S(0xe2d2aa, 0.85),
    shoji: S(0xf6f3ea, 0.9, { side: THREE.DoubleSide }), shojiWaku: S(0xcdb48c, 0.6),
  };
  const top = (f) => P.floorY(f) + (f === 1 ? 0.03 : 0.04);   // 床仕上げの上面
  const domaTop = 0.50;                                        // 玄関土間・土間収納の上面(上がり框で12cm下げる)
  /* 床(部屋ごと) */
  // 部屋の矩形から欠け(cut)を除いた矩形の集まり
  const roomRects = (r) => {
    if (!r.cut) return [r.rect];
    const [x0, x1, z0, z1] = r.rect, [c0, c1, d0, d1] = r.cut, zl = Math.max(z0, d0), zh = Math.min(z1, d1);
    return [[x0, x1, z0, d0], [x0, x1, d1, z1], [x0, c0, zl, zh], [c1, x1, zl, zh]]
      .map(([a, b, e, f]) => [a, b, Math.max(e, z0), Math.min(f, z1)]).filter(([a, b, e, f]) => b - a > 1e-3 && f - e > 1e-3);
  };
  P.rooms.forEach((room) => roomRects(room).forEach((rect) => {
    const r = { ...room, rect };
    if (r.finish === "吹抜け") return;
    const [x0, x1, z0, z1] = r.rect, w = x1 - x0, d = z1 - z0, cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
    const y = P.floorY(r.floor), th = r.floor === 1 ? 0.06 : 0.08;
    if (r.finish === "タイル") IN(box(w - 0.024, th, d - 0.024, M.tile, cx, y - 0.004, cz), "床(タイル)", "床");
    else if (r.finish === "土間") IN(box(w, 0.05, d, M.doma, cx, domaTop - 0.025, cz), r.id === "doma" ? "玄関土間" : "土間収納", "床");
    else IN(box(w, th, d, flooringMaterial(w, d), cx, y, cz), r.floor === 1 ? "床(フローリング)" : "床(2階フローリング)", "床");
    // 天井(階段の上と吹抜けは張らない)
    if (!r.noCeil) IN(box(w, 0.04, d, M.tenjo, cx, P.ceilY(r.floor), cz), "天井");
  }));
  // 上がり框(ホール ⇔ 玄関土間)
  const doma = P.rooms.find((r) => r.id === "doma");
  IN(box(doma.rect[1] - doma.rect[0], top(1) - domaTop, 0.14, M.tategu, (doma.rect[0] + doma.rect[1]) / 2, (top(1) + domaTop) / 2, doma.rect[2] + 0.07), "上がり框");
  /* 外壁の室内側の仕上げ(クロス)。凹みの段差も含めて外周をたどり、開口部の位置に穴を空ける。
     「内部(外装を透過)」表示では外壁と一緒に透過させるため layer は ext */
  [1, 2].forEach((f) => {
    const y0 = f === 1 ? 0.45 : P.floorY(f) - 0.04, y1 = P.ceilY(f) - 0.02;
    P.perimeter(f).forEach((s) => {
      const face = s.axis === "z" ? (s.out > 0 ? "S" : "N") : (s.out > 0 ? "E" : "W");
      const t = 0.02, c = s.at + s.out * (0.012 - t / 2);
      const rects = P.openings.filter((o) => o.floor === f && o.face === face && Math.abs(o.ci - s.at) < 0.03).map((o) => openingRect(o, P));
      g.add(tag(wallWithOpenings(face, c, t, s.from - 0.02, s.to + 0.02, y0, y1, rects, M.kabe), "内装", "内壁(クロス)", "ext"));
    });
  });
  /* 間仕切り(建具の開口を空け、上部に垂れ壁)。1階の壁は土間の高さまで下ろす */
  const doorSet = makeDoorKit(IN, M, { openH: 2.02, wallT: 0.07, frameMember: "建具枠" });
  P.partitions.forEach((p) => {
    const fy = P.floorY(p.floor), cy = P.ceilY(p.floor), base = p.floor === 1 ? 0.45 : fy;
    const seg = (a, b, y0, y1) => {
      if (b - a <= 0.06) return;
      const h = y1 - y0;
      IN(p.axis === "x" ? box(0.07, h, b - a, M.kabe, p.at, y0 + h / 2, (a + b) / 2) : box(b - a, h, 0.07, M.kabe, (a + b) / 2, y0 + h / 2, p.at), "内壁(クロス)");
    };
    const ds = [...p.doors].sort((d1, d2) => d1.a - d2.a);
    let cur = p.from;
    ds.forEach((d) => { seg(cur, d.a, base, cy); seg(d.a, d.b, fy + 2.02, cy); cur = d.b; });
    seg(cur, p.to, base, cy);
    ds.forEach((d) => doorSet(fy, p.floor === 1 ? 0.03 : 0.04, p.axis, p.at, d.a, d.b, d.kind, d.member));
  });
  /* 階段(ホール側 z=0.80 から北へ上る)と吹抜けの手すり */
  {
    const ST = P.stair, t1 = top(1), rise = (top(2) - t1) / ST.nStep;
    for (let i = 0; i < ST.nStep; i++) {
      const zc = ST.zBottom - ST.run * i;
      IN(box(ST.w, 0.05, ST.run + 0.03, M.tategu, ST.cx, t1 + rise * (i + 1) - 0.025, zc), "階段");
      IN(box(ST.w, rise - 0.05, 0.03, M.cabinet, ST.cx, t1 + rise * (i + 1) - rise / 2, zc + ST.run / 2), "階段");
    }
    const t2 = top(2);
    IN(box(0.05, 0.85, 1.30, M.tategu, P.G.xAB + 0.05, t2 + 0.43, -1.25), "階段");      // 廊下(2階)側
    IN(box(0.05, 0.85, 2.80, M.tategu, 1.95 - 0.05, t2 + 0.43, -0.50), "階段");                                   // 廊下(2階・東)側
  }
  /* 造作・設備 */
  const t1 = top(1), t2 = top(2);
  // システムキッチン(LDKの北の壁。シンクは北の窓の下、コンロは西寄り)
  {
    const x0 = -1.90, x1 = 0.80, kz = P.zn + 0.335, cx = (x0 + x1) / 2;   // 室内側の仕上げ面(8mm内側)に当てる
    IN(box(x1 - x0, 0.86, 0.65, M.cabinet, cx, t1 + 0.43, kz), "システムキッチン");
    IN(box(x1 - x0 + 0.04, 0.05, 0.69, M.counter, cx, t1 + 0.885, kz), "システムキッチン");
    IN(box(0.55, 0.03, 0.45, M.kanagu, -0.30, t1 + 0.90, kz + 0.02), "システムキッチン");            // シンク
    IN(box(0.04, 0.30, 0.04, M.kanagu, -0.30, t1 + 1.05, kz - 0.20), "システムキッチン");            // 水栓
    IN(box(0.55, 0.02, 0.48, M.kanagu, -1.50, t1 + 0.91, kz), "システムキッチン");                   // コンロ
    IN(box(0.60, 0.40, 0.50, M.kanagu, -1.50, t1 + 1.75, P.zn + 0.25), "システムキッチン");          // レンジフード(窓の西)
  }
  // 洗面脱衣: 洗面化粧台(西の壁)と洗濯機置場(北の窓の下)
  IN(box(0.46, 0.82, 0.75, M.cabinet, P.G.xAB + 0.265, t1 + 0.41, -2.70), "洗面化粧台");
  IN(box(0.50, 0.05, 0.79, M.counter, P.G.xAB + 0.285, t1 + 0.845, -2.70), "洗面化粧台");
  IN(box(0.06, 0.75, 0.70, M.kanagu, P.G.xAB + 0.065, t1 + 1.34, -2.70), "洗面化粧台");
  IN(box(0.64, 0.92, 0.62, M.cabinet, 2.55, t1 + 0.46, P.zn + 0.34), "洗濯機置場");
  // ユニットバス(入口 x=3.00 の折れ戸から東の外壁へ)
  buildUnitBath(IN, "浴槽(ユニットバス)", {
    axis: "x", sign: 1, v0: 3.035, Lv: P.xe - 0.008 - 3.035, u0: P.zn, Lu: (-1.935) - P.zn,
    fy: P.floorY(1), top: P.ceilY(1) - 0.02, door: [-2.90 - P.zn, -2.20 - P.zn], doorTop: P.floorY(1) + 2.02,
  });
  // 便器(1階は東の壁を背に西向き、2階は北の壁を背に南向き)
  {
    const tx = P.xe - 0.10, tz = -1.325;
    IN(box(0.20, 0.52, 0.36, M.toki, tx, t1 + 0.36, tz), "便器");
    IN(box(0.62, 0.42, 0.38, M.toki, tx - 0.41, t1 + 0.21, tz), "便器");
    IN(box(0.38, 0.10, 0.44, M.toki, tx - 0.46, t1 + 0.45, tz), "便器");
    const ux = 3.90, uz = P.zn + 0.10;
    IN(box(0.36, 0.52, 0.20, M.toki, ux, t2 + 0.36, uz), "便器");
    IN(box(0.38, 0.42, 0.62, M.toki, ux, t2 + 0.21, uz + 0.41), "便器");
    IN(box(0.44, 0.10, 0.38, M.toki, ux, t2 + 0.45, uz + 0.46), "便器");
  }
  // 土間収納の棚(ホール側の壁。勝手口への通路を空ける)
  IN(box(0.35, 1.80, 1.00, M.cabinet, 3.55 + 0.035 + 0.175, domaTop + 0.90, 1.45), "玄関収納");
  /* 家具類 */
  placeFurniture(g, P, 2);
}

function buildCubeHouse() {
  const T = cubeTextures();
  const NS = (v) => new THREE.Vector2(v, v);
  const CM = {
    dark:   new THREE.MeshStandardMaterial({ ...T.dark, roughness: .90, normalScale: NS(.80) }),
    light:  new THREE.MeshStandardMaterial({ ...T.light, roughness: .88, normalScale: NS(.80) }),
    fascia: new THREE.MeshStandardMaterial({ color: 0x24282d, roughness: .55 }),
    glass:  new THREE.MeshPhysicalMaterial({ color: 0x26323d, roughness: .06, metalness: .15, reflectivity: .7 }),
    sash:   new THREE.MeshStandardMaterial({ color: 0x1d2126, roughness: .45, metalness: .35 }),
    wood:   new THREE.MeshStandardMaterial({ ...T.wood, roughness: .72, normalScale: NS(.6) }),
    gravel: new THREE.MeshStandardMaterial({ ...T.gravel, roughness: .98, normalScale: NS(1.2) }),
    conc:   new THREE.MeshStandardMaterial({ ...T.conc, roughness: .94, normalScale: NS(.5) }),
    tile:   new THREE.MeshStandardMaterial({ ...T.tile, roughness: .55, normalScale: NS(.8) }),
    stone:  new THREE.MeshStandardMaterial({ ...T.stone, roughness: .90, normalScale: NS(1.0) }),
    metal:  new THREE.MeshStandardMaterial({ color: 0xb9bec2, roughness: .35, metalness: .6 }),
    pipeD:  new THREE.MeshStandardMaterial({ color: 0x22262b, roughness: .5, metalness: .25 }),
    cream:  new THREE.MeshStandardMaterial({ color: 0xe6e0d2, roughness: .55 }),
    white:  new THREE.MeshStandardMaterial({ color: 0xdfe1e0, roughness: .6 }),
    neigh:  new THREE.MeshStandardMaterial({ color: 0xb7ada0, roughness: .95 }),
    terra:  new THREE.MeshStandardMaterial({ color: 0xb35f3c, roughness: .85 }),
    base:   new THREE.MeshStandardMaterial({ ...T.conc, roughness: .95, color: 0xa8a49c, normalScale: NS(.4) }),
    recess: new THREE.MeshStandardMaterial({ color: 0x3d444c, roughness: .86, side: THREE.DoubleSide }),
    recessD:new THREE.MeshStandardMaterial({ ...T.dark, roughness: .90, normalScale: NS(.75), side: THREE.DoubleSide }),
    recessL:new THREE.MeshStandardMaterial({ ...T.light, roughness: .88, normalScale: NS(.75), side: THREE.DoubleSide }),
    core:   new THREE.MeshStandardMaterial({ color: 0x171b1f, roughness: 1 }),
  };
  const S = CSPEC;
  const zF = S.D / 2, zR = -S.D / 2, xW = -S.W / 2, xE = S.W / 2;
  const A = { x0: xW, x1: S.splitX, zF: zF, zR: zR, top: S.eaveA };
  const B = { x0: S.splitX, x1: xE, zF: zF + S.bFront, zR: zR, top: S.eaveB };
  const g = new THREE.Group();
  const site = new THREE.Group();   // 敷地・外構(評価対象外の背景として非タグ)
  site.userData.isSite = true;
  g.add(site);

  const P = { wall: "外壁", roof: "屋根", open: "開口部", gut: "雨樋・附帯", found: "基礎", eq: "附帯設備" };
  const T2 = (m, part, member) => { m.userData.part = part; m.userData.member = member; m.userData.layer = "ext"; m.userData.baseMat = m.material; return m; };

  /* 壁パネル(開口部で分割・UV連続) */
  function planarUV(geo, u0, v0, w, h, TU, TV) {
    const uv = geo.attributes.uv;
    for (let i = 0; i < uv.count; i++) {
      const u = uv.getX(i), v = uv.getY(i);
      uv.setXY(i, (u0 + u * w) / TU, (v0 + v * h) / TV);
    }
    uv.needsUpdate = true;
  }
  function wallPanels(f) {
    const vs = new Set([f.v0, f.v1]);
    for (const o of f.holes || []) { vs.add(o.v0); vs.add(o.v1); }
    const V = [...vs].filter((x) => x >= f.v0 - 1e-6 && x <= f.v1 + 1e-6).sort((a, b) => a - b);
    const out = [];
    for (let j = 0; j < V.length - 1; j++) {
      if (V[j + 1] - V[j] < 1e-4) continue;
      const vm = (V[j] + V[j + 1]) / 2;
      const act = (f.holes || []).filter((o) => vm > o.v0 && vm < o.v1);
      const us = new Set([f.u0, f.u1]);
      for (const o of act) { us.add(o.u0); us.add(o.u1); }
      const U = [...us].filter((x) => x >= f.u0 - 1e-6 && x <= f.u1 + 1e-6).sort((a, b) => a - b);
      for (let i = 0; i < U.length - 1; i++) {
        if (U[i + 1] - U[i] < 1e-4) continue;
        const um = (U[i] + U[i + 1]) / 2;
        if (act.some((o) => um > o.u0 && um < o.u1)) continue;
        out.push({ u0: U[i], u1: U[i + 1], v0: V[j], v1: V[j + 1] });
      }
    }
    return out;
  }
  function buildWall(dir, at, f, mat, member) {
    for (const p of wallPanels(f)) {
      const w = p.u1 - p.u0, h = p.v1 - p.v0;
      const geo = new THREE.PlaneGeometry(w, h);
      planarUV(geo, p.u0, p.v0, w, h, SIDE_U, SIDE_V);
      const m = new THREE.Mesh(geo, mat);
      const cu = (p.u0 + p.u1) / 2, cv = (p.v0 + p.v1) / 2;
      if (dir === "S") m.position.set(cu, cv, at);
      if (dir === "N") { m.position.set(cu, cv, at); m.rotation.y = Math.PI; }
      if (dir === "E") { m.position.set(at, cv, cu); m.rotation.y = Math.PI / 2; }
      if (dir === "W") { m.position.set(at, cv, cu); m.rotation.y = -Math.PI / 2; }
      g.add(T2(m, P.wall, member || "外壁"));
    }
  }
  function addSash(dir, at, cu, cv, w, h, off) {
    const grp = new THREE.Group();
    const fr = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.07), CM.sash);
    const gl = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.10, h - 0.10), CM.glass);
    gl.position.z = 0.037; fr.add(gl);   // 枠(厚0.07)の前面より手前に出す
    const inner = new THREE.Mesh(new THREE.BoxGeometry(w - 0.10, h - 0.10, 0.02), new THREE.MeshStandardMaterial({ color: 0x11161b, roughness: .9 }));
    inner.position.z = -0.015; fr.add(inner);   // 凹みの奥面と重ねない
    grp.add(fr);
    const d = (off === undefined ? -0.03 : off);
    if (dir === "S") grp.position.set(cu, cv, at + d);
    if (dir === "N") { grp.position.set(cu, cv, at - d); grp.rotation.y = Math.PI; }
    if (dir === "E") { grp.position.set(at + d, cv, cu); grp.rotation.y = Math.PI / 2; }
    if (dir === "W") { grp.position.set(at - d, cv, cu); grp.rotation.y = -Math.PI / 2; }
    grp.traverse((m) => { if (m.isMesh) T2(m, P.open, "サッシ・窓"); });
    g.add(grp);
  }
  function addRecess(dir, at, cu, cv, w, h, depth, sideMat, member, holes) {
    const grp = new THREE.Group();
    // 奥の面(室内との境)。窓・玄関ドアの開口を空ける(holes は実座標の u・v)
    for (const p of wallPanels({ u0: cu - w / 2, u1: cu + w / 2, v0: cv - h / 2, v1: cv + h / 2, holes: holes || [] })) {
      const back = new THREE.Mesh(new THREE.PlaneGeometry(p.u1 - p.u0, p.v1 - p.v0), CM.recess);
      back.position.set((p.u0 + p.u1) / 2 - cu, (p.v0 + p.v1) / 2 - cv, -depth);
      grp.add(back);
    }
    const top = new THREE.Mesh(new THREE.PlaneGeometry(w, depth), CM.recess);
    top.rotation.x = Math.PI / 2; top.position.set(0, h / 2, -depth / 2); grp.add(top);
    const bot = new THREE.Mesh(new THREE.PlaneGeometry(w, depth), CM.recess);
    bot.rotation.x = -Math.PI / 2; bot.position.set(0, -h / 2 + 0.02, -depth / 2); grp.add(bot);   // 基礎天と重ねない
    for (const sd of [-1, 1]) {
      const p = new THREE.Mesh(new THREE.PlaneGeometry(depth, h), sideMat || CM.recess);
      p.rotation.y = -sd * Math.PI / 2; p.position.set(sd * w / 2, 0, -depth / 2); grp.add(p);
    }
    if (dir === "S") grp.position.set(cu, cv, at);
    if (dir === "N") { grp.position.set(cu, cv, at); grp.rotation.y = Math.PI; }
    if (dir === "E") { grp.position.set(at, cv, cu); grp.rotation.y = Math.PI / 2; }
    if (dir === "W") { grp.position.set(at, cv, cu); grp.rotation.y = -Math.PI / 2; }
    grp.traverse((m) => { if (m.isMesh) T2(m, P.wall, member || "外壁(凹み部)"); });
    g.add(grp);
  }
  function louver(w, h, cu, cv, at, dir, member) {
    const n = Math.max(3, Math.round(h / 0.20));
    const bh = h / n * 0.72;
    const grp = new THREE.Group();
    for (let i = 0; i < n; i++) {
      const b = new THREE.Mesh(new THREE.BoxGeometry(w, bh, 0.035), CM.wood);
      b.position.y = -h / 2 + (i + 0.5) * (h / n); grp.add(b);
    }
    if (dir === "S") grp.position.set(cu, cv, at);
    if (dir === "E") { grp.position.set(at, cv, cu); grp.rotation.y = Math.PI / 2; }
    grp.traverse((m) => { if (m.isMesh) T2(m, P.open, member || "木目ルーバー"); });

  }

/* 外壁の面ごとの座標(u=面に沿った向き。S/N は x、E/W は z) */
const FACE = {
  S: { nx: 0, nz: 1, rotY: 0 },
  N: { nx: 0, nz: -1, rotY: Math.PI },
  E: { nx: 1, nz: 0, rotY: Math.PI / 2 },
  W: { nx: -1, nz: 0, rotY: -Math.PI / 2 },
};
// 開口部の矩形(v は y の実高さ)
function openingRect(o, plan = STD_PLAN) {
  const y0 = plan.floorY(o.floor) + o.sill;
  return { u0: o.at - o.w / 2, u1: o.at + o.w / 2, y0, y1: y0 + o.h };
}
/* 開口部の穴を空けた壁(面材)。面に沿って u0〜u1、高さ y0〜y1、厚み t。
   面の中心線は法線方向の位置 c(S/N は z、E/W は x)。
   開口の縁で面を格子に分け、開口に掛からない升目を行ごとにつないだ矩形の集まりとして押し出す。
   開口が壁の上端・下端に掛かる場合(戸の切り欠き、腰壁と上部の壁に分けた真壁など)もそのまま扱える */
function wallWithOpenings(face, c, t, u0, u1, y0, y1, rects, mat) {
  const H = y1 - y0;
  const holes = rects
    .map((r) => ({ a: Math.max(r.u0, u0), b: Math.min(r.u1, u1), v0: Math.max(r.y0 - y0, 0), v1: Math.min(r.y1 - y0, H) }))
    .filter((r) => r.b - r.a > 0.005 && r.v1 - r.v0 > 0.005);
  const us = [...new Set([u0, u1, ...holes.flatMap((r) => [r.a, r.b])].map((v) => +v.toFixed(4)))].sort((p, q) => p - q);
  const vs = [...new Set([0, H, ...holes.flatMap((r) => [r.v0, r.v1])].map((v) => +v.toFixed(4)))].sort((p, q) => p - q);
  const shapes = [];
  for (let j = 0; j + 1 < vs.length; j++) {
    const vm = (vs[j] + vs[j + 1]) / 2;
    let run = null;
    const flush = (end) => { if (run !== null && end - run > 0.001) {
      const s = new THREE.Shape();
      s.moveTo(run, vs[j]); s.lineTo(end, vs[j]); s.lineTo(end, vs[j + 1]); s.lineTo(run, vs[j + 1]); s.lineTo(run, vs[j]);
      shapes.push(s);
    } run = null; };
    for (let i = 0; i + 1 < us.length; i++) {
      const um = (us[i] + us[i + 1]) / 2;
      const inHole = holes.some((r) => um > r.a && um < r.b && vm > r.v0 && vm < r.v1);
      if (inHole) flush(us[i]);
      else if (run === null) run = us[i];
    }
    flush(us[us.length - 1]);
  }
  const geo = new THREE.ExtrudeGeometry(shapes, { depth: t, bevelEnabled: false });   // UV は面の実寸(m)
  const m = new THREE.Mesh(geo, mat);
  if (face === "S" || face === "N") m.position.set(0, y0, c - t / 2);
  else { m.rotation.y = -Math.PI / 2; m.position.set(c + t / 2, y0, 0); }
  return m;
}
/* 開口部に納める建具(外壁の面から室内側の仕上げ面までの枠+ガラス、または玄関戸)。
   外壁の中心線(法線方向の位置 c)を原点に、+z が屋外側のローカル座標で組み、面の向きに回す */
function buildOpeningUnit(o, c, depthIn, mats, plan = STD_PLAN) {
  const r = openingRect(o, plan);
  const grp = new THREE.Group();
  const f = FACE[o.face];
  const uc = o.at, yc = (r.y0 + r.y1) / 2;
  grp.position.set(f.nx ? f.nx * c : uc, yc, f.nz ? f.nz * c : uc);
  grp.rotation.y = f.rotY;
  const w = o.w, h = o.h, fw = 0.045;            // 枠の見付
  const zOut = 0.045, zIn = -depthIn;            // 外壁の外面より少し出し、室内側の仕上げ面まで回す
  const fd = zOut - zIn, fz = (zOut + zIn) / 2;
  const isDoor = o.kind === "door" || o.kind === "doorFrame";   // 戸は下枠の代わりに沓摺を付ける(doorFrame は枠だけ。戸は別に作る)
  const sideH = isDoor ? h - fw : h - 2 * fw, sideY = isDoor ? -fw / 2 : 0;
  const parts = [
    [boxGeo(w, fw, fd, 0, h / 2 - fw / 2, fz), mats.sash],
    [boxGeo(fw, sideH, fd, -w / 2 + fw / 2, sideY, fz), mats.sash],
    [boxGeo(fw, sideH, fd, w / 2 - fw / 2, sideY, fz), mats.sash],
  ];
  if (!isDoor) parts.push([boxGeo(w, fw, fd, 0, -h / 2 + fw / 2, fz), mats.sash]);
  const zG = zOut - 0.05;                        // ガラス・戸の面(外寄り)
  if (o.kind === "door") {
    // 片開きの玄関ドア(木目調)。吊元側に縦長の採光スリット、縦の化粧溝、プッシュプル錠、下に沓摺
    const lw = w - 2 * fw, th = 0.025, lh = h - fw - th, ly = -h / 2 + th + lh / 2;
    parts.push([boxGeo(lw, lh, 0.05, 0, ly, zG), mats.door]);
    const slitX = -lw / 2 + 0.16;
    parts.push([boxGeo(0.11, lh - 0.56, 0.054, slitX, ly, zG), mats.frost]);                    // 採光スリット(型板ガラス)
    [slitX - 0.075, slitX + 0.075].forEach((x) => parts.push([boxGeo(0.018, lh - 0.52, 0.058, x, ly, zG), mats.handle]));
    [0.02, 0.17, 0.32].forEach((x) => parts.push([boxGeo(0.008, lh - 0.3, 0.054, x, ly, zG), mats.doorDark]));   // 縦の化粧溝
    const hx = lw / 2 - 0.12, hy = -h / 2 + 1.0;
    parts.push([boxGeo(0.028, 0.62, 0.028, hx, hy, zG + 0.075), mats.handle]);                     // プッシュプルの握り
    [-0.25, 0.25].forEach((dy) => parts.push([boxGeo(0.022, 0.022, 0.05, hx, hy + dy, zG + 0.045), mats.handle]));
    [-0.34, 0.34].forEach((dy) => parts.push([boxGeo(0.045, 0.07, 0.012, hx + 0.07, hy + dy * 0.5, zG + 0.028), mats.handle]));   // 錠(2ロック)
    parts.push([boxGeo(w, th, fd + 0.02, 0, -h / 2 + th / 2, fz), mats.sash]);                   // 沓摺
  } else if (o.kind !== "small") {
    // 引違い: 召合せ框(中央の縦框)と、内外の障子の上下框
    parts.push([boxGeo(0.06, h - 2 * fw, 0.07, 0, 0, zG - 0.01), mats.sash]);
    [[-1, zG], [1, zG - 0.03]].forEach(([s, z]) => {
      parts.push([boxGeo(w / 2 - fw, 0.035, 0.035, s * (w / 4), h / 2 - fw - 0.018, z), mats.sash]);
      parts.push([boxGeo(w / 2 - fw, 0.035, 0.035, s * (w / 4), -h / 2 + fw + 0.018, z), mats.sash]);
    });
  }
  if (o.shoji && mats.shoji) {
    // 室内側の障子(引違い2枚。框・組子・障子紙)
    const sw = (w - 2 * fw) / 2 + 0.015, sh = h - 2 * fw;
    [[-1, zIn + 0.03], [1, zIn + 0.058]].forEach(([s, z]) => {
      const cx = s * (sw / 2 - 0.0075);
      parts.push([boxGeo(sw - 0.05, sh - 0.05, 0.005, cx, 0, z), mats.shoji]);
      [sh / 2 - 0.015, -sh / 2 + 0.015].forEach((y) => parts.push([boxGeo(sw, 0.03, 0.028, cx, y, z), mats.shojiWaku]));
      [cx - sw / 2 + 0.015, cx + sw / 2 - 0.015].forEach((x) => parts.push([boxGeo(0.03, sh, 0.028, x, 0, z), mats.shojiWaku]));
      const nx = Math.max(1, Math.round((sw - 0.05) / 0.22)), ny = Math.max(1, Math.round((sh - 0.05) / 0.28));

  const FACE_ROT = { S: 0, N: Math.PI, E: Math.PI / 2, W: -Math.PI / 2 };
  plan.furniture.forEach((it) => {

    const { mesh, member } = buildFurniture(it.type);

    mesh.rotation.y = FACE_ROT[it.face];
    g.add(tag(mesh, "家具類", member, "int"));
