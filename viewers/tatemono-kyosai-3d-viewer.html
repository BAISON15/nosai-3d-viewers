const panel = document.getElementById("panel");

/* ============================================================
   間取り(平面図・面積表) — 設計情報 STD_PLAN から描く
   面積は室内側の仕上げ面(内法)による概算。壁面積は壁のある辺の長さ × 天井高から、
   外部の開口部(窓・玄関戸)と室内建具の開口を差し引く(クロス張替え面積の目安)
============================================================ */
const JO = 1.62;                 // 1帖あたりの面積(㎡)。不動産表示の基準
const FINISH_FILL = { "フローリング": "#f1e2c6", "板張り": "#ead3ae", "畳": "#dde5b4", "タイル": "#d9e2e8", "土間": "#d4d0c8", "吹抜け": "#ffffff" };
function planAreas(P, stories) {
  const eps = 0.02;

  const overlap = (a0, a1, b0, b1) => Math.max(0, Math.min(a1, b1) - Math.max(a0, b0));
  return P.rooms.filter((r) => r.floor <= stories).map((r) => {
    const [x0, x1, z0, z1] = r.rect;
    const area = P.roomArea(r);
    if (r.finish === "吹抜け") return { room: r, area, wall: 0, ch: 0, openings: 0 };
    const ch = P.ceilY(r.floor, stories) - 0.02 - P.floorY(r.floor);
    const perim = P.perimeter(r.floor);                                          // その階の外壁の室内側の面
    const sides = [
      { axis: "z", at: z0, a: x0, b: x1 }, { axis: "z", at: z1, a: x0, b: x1 },
      { axis: "x", at: x0, a: z0, b: z1 }, { axis: "x", at: x1, a: z0, b: z1 },
    ];
    let walled = 0, doorArea = 0;
    sides.forEach((s) => {
      perim.filter((q) => q.axis === s.axis && Math.abs(q.at - s.at) < eps).forEach((q) => { walled += overlap(s.a, s.b, q.from, q.to); });   // 外壁側
      P.partitions.filter((p) => p.floor === r.floor && p.axis === s.axis && Math.abs(p.at - s.at) < 0.05).forEach((p) => {
        walled += overlap(s.a, s.b, p.from, p.to);
        p.doors.forEach((d) => { doorArea += overlap(s.a, s.b, d.a, d.b) * Math.min(2.02, ch); });
      });
    });
    const extOpen = P.openings.filter((o) => o.floor <= stories && o.room === r.id)
      .reduce((sum, o) => sum + o.w * Math.min(o.h, ch - Math.max(0, o.sill)), 0);
    const gross = walled * ch;
    return { room: r, area, ch, wallGross: gross, openings: extOpen + doorArea, wall: Math.max(0, gross - extOpen - doorArea) };
  });
}
/* 平面図(SVG)。北が上。widthPx: 図の幅(px) */
function planSVG(P, floor, stories, widthPx, hoverId) {
  const m = 0.9, OU = P.outer(floor), wt = Math.max(P.wallT, 0.06);
  const s = widthPx / (P.W + 2 * m);
  const X = (x) => ((x + P.W / 2 + m) * s).toFixed(1), Z = (z) => ((z + P.D / 2 + m) * s).toFixed(1);
  const L = (v) => (v * s).toFixed(1);
  const H = (P.D + 2 * m) * s;
  const out = [];
  out.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${widthPx.toFixed(0)} ${H.toFixed(0)}" width="100%" style="display:block;background:#fff;font-family:inherit">`);
  // 外壁(外周の芯から内外へ)
  if (floor === 2 && (OU.W !== P.W || OU.D !== P.D))   // 2階が小さい場合は1階の外周を破線で示す
    out.push(`<rect x="${X(-P.W / 2)}" y="${Z(-P.D / 2)}" width="${L(P.W)}" height="${L(P.D)}" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>`);
  if (P.drawPerimeter) {
    // 外周が矩形でない(凹みの段差がある)場合は、外壁の室内側の面から外へ壁厚ぶんの帯を描く
    P.perimeter(floor).forEach((q) => {
      const o0 = q.at, o1 = q.at + q.out * P.wallT, a = q.from - P.wallT, b = q.to + P.wallT;
      const [x0, x1, z0, z1] = q.axis === "z" ? [a, b, Math.min(o0, o1), Math.max(o0, o1)] : [Math.min(o0, o1), Math.max(o0, o1), a, b];
      out.push(`<rect x="${X(x0)}" y="${Z(z0)}" width="${L(x1 - x0)}" height="${L(z1 - z0)}" fill="#334155"/>`);
    });
  } else {
    out.push(`<rect x="${X(-OU.W / 2 - wt)}" y="${Z(-OU.D / 2 - wt)}" width="${L(OU.W + 2 * wt)}" height="${L(OU.D + 2 * wt)}" fill="#334155"/>`);
  }
  // 部屋(床仕上げ別の塗り)
  const areas = planAreas(P, stories);
  P.rooms.filter((r) => r.floor === floor).forEach((r) => {
    const [x0, x1, z0, z1] = r.rect;
    const hl = hoverId === r.id;
    out.push(`<rect data-room="${r.id}" x="${X(x0)}" y="${Z(z0)}" width="${L(x1 - x0)}" height="${L(z1 - z0)}" fill="${hl ? "#fde68a" : FINISH_FILL[r.finish] || "#eee"}" style="cursor:default"/>`);
    if (r.finish === "吹抜け") {
      out.push(`<path d="M${X(x0)} ${Z(z0)}L${X(x1)} ${Z(z1)}M${X(x1)} ${Z(z0)}L${X(x0)} ${Z(z1)}" stroke="#94a3b8" stroke-width="0.8" fill="none"/>`);
    }
    if (r.finish === "畳") {   // 畳割り(部屋の設計情報の枚数。未指定は2×3枚)
      const [nc, nr] = r.tatami || [2, 3];
      const mw = (x1 - x0) / nc, ml = (z1 - z0) / nr;
      let d = "";
      for (let k = 1; k < nc; k++) d += `M${X(x0 + mw * k)} ${Z(z0)}L${X(x0 + mw * k)} ${Z(z1)}`;
      for (let k = 1; k < nr; k++) d += `M${X(x0)} ${Z(z0 + ml * k)}L${X(x1)} ${Z(z0 + ml * k)}`;
      out.push(`<path d="${d}" stroke="#a3ad78" stroke-width="0.8" fill="none"/>`);
    }
  });
  // 家具類(上から見た輪郭。敷物 → 本体 → 椅子・座布団・枕などの順に重ねる)
  {
    const shapes = (P.furniture || []).filter((it) => {
      const room = P.rooms.find((r) => r.id === it.room);
      return room && room.floor === floor && floor <= stories;
    }).flatMap(furnitureFootprint);
    const order = { rug: 0, main: 1, sub: 2, round: 3, line: 4 };
    shapes.sort((p, q) => order[p.kind] - order[q.kind]).forEach((r) => {
      const x = X(r.x0), y = Z(r.z0), w = L(r.x1 - r.x0), h = L(r.z1 - r.z0);
      if (r.kind === "rug") out.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#e7dcc8" fill-opacity="0.75" pointer-events="none"/>`);
      else if (r.kind === "round") out.push(`<ellipse cx="${X((r.x0 + r.x1) / 2)}" cy="${Z((r.z0 + r.z1) / 2)}" rx="${L((r.x1 - r.x0) / 2)}" ry="${L((r.z1 - r.z0) / 2)}" fill="#ffffff" stroke="#64748b" stroke-width="0.7" pointer-events="none"/>`);
      else if (r.kind === "line") out.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#64748b" pointer-events="none"/>`);
      else out.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${r.kind === "main" ? "#ffffff" : "#eef2f6"}" fill-opacity="0.92" stroke="${r.kind === "main" ? "#64748b" : "#94a3b8"}" stroke-width="${r.kind === "main" ? 0.8 : 0.6}" pointer-events="none"/>`);
    });
  }
  // 階段(1階は踏面の線と上り方向の矢印)
  const ST = P.stair, sx0 = ST.cx - ST.w / 2, sx1 = ST.cx + ST.w / 2;
  if (floor === 1 && stories === 2) {
    let d = "";
    for (let i = 0; i <= ST.nStep; i++) { const z = ST.zBottom + ST.run / 2 - ST.run * i; d += `M${X(sx0)} ${Z(z)}L${X(sx1)} ${Z(z)}`; }
    d += `M${X(sx0)} ${Z(ST.zTop - ST.run / 2)}L${X(sx0)} ${Z(ST.zBottom + ST.run / 2)}M${X(sx1)} ${Z(ST.zTop - ST.run / 2)}L${X(sx1)} ${Z(ST.zBottom + ST.run / 2)}`;
    out.push(`<path d="${d}" stroke="#64748b" stroke-width="0.7" fill="none"/>`);
    const cx = X((sx0 + sx1) / 2);
    out.push(`<path d="M${cx} ${Z(ST.zBottom)}L${cx} ${Z(ST.zTop)}" stroke="#0f172a" stroke-width="1.2" marker-end="url(#arr)"/>`);
    out.push(`<text x="${cx}" y="${(+Z(ST.zBottom) + 11).toFixed(1)}" font-size="${Math.max(8, s * 0.26).toFixed(0)}" text-anchor="middle" fill="#0f172a">上</text>`);
  }
  // 間仕切り(建具の位置は空け、建具記号を描く)
  const wT = Math.max(2.2, s * 0.08);
  const doorSym = [];
  P.partitions.filter((p) => p.floor === floor).forEach((p) => {
    const seg = (a, b) => {
      if (b - a <= 0.01) return;
      out.push(p.axis === "x"
        ? `<line x1="${X(p.at)}" y1="${Z(a)}" x2="${X(p.at)}" y2="${Z(b)}" stroke="#334155" stroke-width="${wT}"/>`
        : `<line x1="${X(a)}" y1="${Z(p.at)}" x2="${X(b)}" y2="${Z(p.at)}" stroke="#334155" stroke-width="${wT}"/>`);
    };
    let cur = p.from;
    [...p.doors].sort((d1, d2) => d1.a - d2.a).forEach((d) => {
      seg(cur, d.a); cur = d.b;
      const w = d.b - d.a;
      const pt = (u, v) => p.axis === "x" ? [X(p.at + v), Z(u)] : [X(u), Z(p.at + v)];
      if (d.kind === "hiraki") {   // 開き戸: 戸板と開きの円弧(廊下・前室側へ)
        const [ax, ay] = pt(d.a, 0), [bx, by] = pt(d.a, w), [cx, cy] = pt(d.b, 0);
        doorSym.push(`<path d="M${ax} ${ay}L${bx} ${by}A${L(w)} ${L(w)} 0 0 1 ${cx} ${cy}" stroke="#475569" stroke-width="0.8" fill="none"/>`);
      } else {                     // 引戸・襖・折れ戸: 2本の建具線
        const [a1x, a1y] = pt(d.a, -0.03), [b1x, b1y] = pt(d.a + w * 0.55, -0.03);
        const [a2x, a2y] = pt(d.a + w * 0.45, 0.03), [b2x, b2y] = pt(d.b, 0.03);
        doorSym.push(`<path d="M${a1x} ${a1y}L${b1x} ${b1y}M${a2x} ${a2y}L${b2x} ${b2y}" stroke="#475569" stroke-width="1.4" fill="none"/>`);
      }
    });
    seg(cur, p.to);
  });
  out.push(...doorSym);
  // 外部の開口部(窓は3本線、玄関戸・勝手口は屋外側へ開く円弧)
  P.openings.filter((o) => o.floor === floor && o.floor <= stories).forEach((o) => {
    const sn = o.face === "S" || o.face === "N", sgn = sn ? FACE[o.face].nz : FACE[o.face].nx;

    ? `<tr data-room="${a.room.id}"><td>${a.room.name}</td><td>—</td><td class="n">(${a.area.toFixed(2)})</td><td class="n">—</td></tr>`
    : `<tr data-room="${a.room.id}"><td>${a.room.name}</td><td>${a.room.finish}</td><td class="n">${a.area.toFixed(2)}<span class="sub">${(a.area / JO).toFixed(1)}帖</span></td><td class="n">${a.wall.toFixed(1)}<span class="sub">天井高${a.ch.toFixed(2)}</span></td></tr>`).join("");
  const sum = rows.filter((a) => a.room.finish !== "吹抜け").reduce((s, a) => s + a.area, 0);

    + `<tbody>${tr}</tbody><tfoot><tr><td colspan="2">${floor}階 合計(内法)</td><td class="n">${sum.toFixed(2)}<span class="sub">${(sum / JO).toFixed(1)}帖</span></td><td class="n">${sumW.toFixed(1)}</td></tr></tfoot></table>`;
}
// 平面図と面積表を連動させる(部屋にポインタを乗せると両方を強調)
function bindPlanHover(root, P, floor, stories, widthPx) {
  let cur = null;

    if (id === cur) return;   // 同じ部屋の上では描き直さない
    cur = id;
    const holder = root.querySelector(".plan-svg");

    root.querySelectorAll("tr[data-room]").forEach((t) => t.classList.toggle("hl", t.dataset.room === id));
  };
  root.addEventListener("pointerover", (e) => {
    const t = e.target.closest("[data-room]");
    draw(t ? t.dataset.room : null);

}

        `<span class="sw" style="background:${memberColorHex(nm)}"></span>${nm}<span style="color:#94a3b8;margin-left:auto">×${ct}</span>`));
    });
    lg.appendChild(el("div", "legend-cap", "部材の種類ごとに色を変えています。柱・梁・筋かい・母屋・垂木などの違いを見分ける練習に使えます。外装は半透明にしているので、内部の軸組も同時に確認できます(「骨組み(軸組)」と併用すると分かりやすくなります)。"));
    secMode.appendChild(lg);
  }
  if (state.mode === "parts") {
    const lg = el("div", "legend");
    Object.keys(PART_COLORS).forEach((p) => {
      lg.appendChild(el("div", "legend-item", `<span class="sw" style="background:${PART_COLORS[p]}"></span>${p}`));
    });
    lg.appendChild(el("div", "legend-cap",
      "外装(屋根・外壁・開口部等)は半透明で表示し、内部の部位も同時に確認できます。※この部位区分は一般的な建築部位に基づく研修用の区分で、NOSAIの正式な評価様式の区分ではありません。"));
    secMode.appendChild(lg);
  }
  panel.appendChild(secMode);

  if (state.buildingModel === "standard") {
  // 屋根形状
  const secShape = el("div", "section", "<h2>屋根形状</h2>");
  const rowS = el("div", "btn-row");
  [["kiritsuma","切妻"],["yosemune","寄棟"],["katanagare","片流れ"],["rikuyane","陸屋根"]].forEach(([k, lb]) => {
    const b = el("button", "btn" + (state.roofShape === k ? " active" : ""), lb);
    b.addEventListener("click", () => { state.roofShape = k; rebuild(false); });
    rowS.appendChild(b);
  });
  secShape.appendChild(rowS);
  panel.appendChild(secShape);

  // 屋根材(陸屋根は防水層のため対象外)
  const secR = el("div", "section", "<h2>屋根材</h2>");
  if (state.roofShape === "rikuyane") {
    secR.appendChild(el("div", "legend-cap", "陸屋根はシート防水等の防水層で表現しているため、屋根材の選択は勾配屋根(切妻・寄棟・片流れ)で有効です。"));
  } else {
    Object.keys(ROOFS).forEach((k) => {
      const m = ROOFS[k];
      const b = el("button", "btn" + (state.roofKey === k ? " active" : ""),
        `<span class="swatch" style="background:#${m.color.toString(16).padStart(6,"0")}"></span>${m.label}`);
      b.addEventListener("click", () => { state.roofKey = k; rebuild(false); });
      secR.appendChild(b);
    });
  }
  panel.appendChild(secR);

  const secW = el("div", "section", "<h2>外壁材</h2>");
  Object.keys(WALLS).forEach((k) => {
    const m = WALLS[k];
    const b = el("button", "btn" + (state.wallKey === k ? " active" : ""),
      `<span class="swatch" style="background:#${m.color.toString(16).padStart(6,"0")}"></span>${m.label}`);
    b.addEventListener("click", () => { state.wallKey = k; rebuild(false); });
    secW.appendChild(b);
  });
  panel.appendChild(secW);
  }   // ← 屋根形状〜外壁材(標準モデルのみ)

  // 損害評価の練習(被害シミュレーション)。被害の出方はモデルごとの部位(和風住宅は瓦・下屋・縁側、キューブ型は金属屋根・サイディング等)に合わせる
  const secDmg = el("div", "section", "<h2>損害評価の練習(被害シミュレーション)</h2>");
  const rowSc = el("div", "btn-row");
  [["none", "被害なし"], ["wind", "台風・強風"], ["hail", "雹(ひょう)"], ["snow", "大雪"], ["flood", "水災(浸水)"]].forEach(([k, lb]) => {
    const b = el("button", "btn" + (state.dmgScenario === k ? " active" : ""), lb);
    b.addEventListener("click", () => { state.dmgScenario = k; state.selectedMember = null; rebuild(false); });
    rowSc.appendChild(b);
  });
  secDmg.appendChild(rowSc);
  if (state.dmgScenario !== "none") {
    const br = el("button", "btn", "🔄 別の被害パターンを生成");
    br.style.marginTop = "6px";
    br.addEventListener("click", () => { state.dmgSeed++; state.selectedMember = null; rebuild(false); });
    secDmg.appendChild(br);
    const dmgs = currentDef.members.filter((m) => m.isDamage);
    secDmg.appendChild(el("div", "legend-cap", `被害箇所は赤色マーカーで表示されます(全${dmgs.length}箇所)。各ボタンを押すと該当部がハイライトされ、評価の着眼点が表示されます。内部の被害は「内部(外装を透過)」表示で確認しやすくなります。`));
    dmgs.forEach((m) => {
      const b = el("button", "btn" + (state.selectedMember === m.key ? " active" : ""), m.name);
      b.style.borderColor = state.selectedMember === m.key ? "#f59e0b" : "#fca5a5";
      b.addEventListener("click", () => { state.selectedMember = state.selectedMember === m.key ? null : m.key; renderLabels(); renderPanel(); applyMode(); });
      secDmg.appendChild(b);
    });
    const activeD = dmgs.find((m) => m.key === state.selectedMember);
    if (activeD) secDmg.appendChild(el("div", "note-box", `<div class="title">${activeD.name}</div>${activeD.note}`));
  }
  panel.appendChild(secDmg);

  // 寸法
  const secD = el("div", "section", "<h2>寸法の名称</h2>");
  const bd = el("button", "btn" + (state.showDims ? " active" : ""),
    state.showDims ? "寸法名称を非表示にする" : "寸法線と名称を表示する(間口・奥行・軒高・棟高)");
  bd.addEventListener("click", () => { state.showDims = !state.showDims; if (!state.showDims) state.selectedDim = null; renderLabels(); renderPanel(); applyMode(); });
  secD.appendChild(bd);
  if (state.showDims) {
    const rowD = el("div", "btn-row");
    currentDef.dims.forEach((d) => {
      const b = el("button", "btn" + (state.selectedDim === d.name ? " active" : ""), d.name);
      b.addEventListener("click", () => {
        state.selectedDim = state.selectedDim === d.name ? null : d.name;
        renderLabels(); renderPanel();
      });
      rowD.appendChild(b);
    });
    secD.appendChild(rowD);
    secD.appendChild(el("div", "legend-cap", "寸法名を押すと該当する寸法線がオレンジ色に点滅します(もう一度押すと解除)。"));
  }
  panel.appendChild(secD);

  // 部材・部位
  // 部材の分け方
  const secGran = el("div", "section", "<h2>部材の分け方</h2>");
  const rowGran = el("div", "btn-row");
  [[false, "まとめて"], [true, "個別(部材ごと)"]].forEach(([v, lb]) => {
    const b = el("button", "btn" + (state.detailParts === v ? " active" : ""), lb);
    b.addEventListener("click", () => { state.detailParts = v; state.selectedMember = null; rebuild(false); });
    rowGran.appendChild(b);
  });
  secGran.appendChild(rowGran);
  const bFD = el("button", "btn" + (state.focusDim ? " active" : ""), (state.focusDim ? "☑ " : "☐ ") + "選択した部材以外を淡色化");
  bFD.style.marginTop = "6px";
  bFD.addEventListener("click", () => { state.focusDim = !state.focusDim; applyMode(); renderPanel(); });
  secGran.appendChild(bFD);
  secGran.appendChild(el("div", "legend-cap", state.detailParts
    ? "モデル上の部材名ごとに分けて表示しています(柱・梁・筋かい等を個別に選択できます)。"
    : "関連する部材をまとめた区分で表示しています。「個別」にすると柱・梁・筋かいなどを1つずつ選択できます。"));
  panel.appendChild(secGran);

  const secM = el("div", "section", "<h2>部位と評価の着眼点</h2><div class=\"legend-cap\" style=\"margin:0 0 6px\">選択した部位はモデル上でオレンジ色に点滅します。内部の部位を選ぶと外装が自動的に透けて表示されます</div>");
  const plain = currentDef.members.filter((m) => !m.isDamage);
  const mkBtn = (m) => {
    const b = el("button", "btn" + (state.selectedMember === m.key ? " active" : ""), m.name);
    b.addEventListener("click", () => { state.selectedMember = state.selectedMember === m.key ? null : m.key; renderLabels(); renderPanel(); applyMode(); });
    return b;
  };
  if (state.detailParts) {
    const groups = new Map();
    plain.forEach((m) => { const g = m.part || "その他"; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(m); });
    [...groups.entries()].forEach(([g, arr]) => {
      const h = el("div", "legend-cap", `<b style="color:#475569">${g}</b>`);
      h.style.margin = "8px 0 3px";
      secM.appendChild(h);
      arr.forEach((m) => secM.appendChild(mkBtn(m)));
    });
  } else {
    plain.forEach((m) => secM.appendChild(mkBtn(m)));
  }
  const active = currentDef.members.find((m) => m.key === state.selectedMember && !m.isDamage);
  if (active) {
    secM.appendChild(el("div", "note-box", `<div class="title">${active.name}</div>${active.note}`));
  }
  panel.appendChild(secM);

  // 共通メモ
  panel.appendChild(el("div", "section note-box",
    `<div class="title">建物共済の損害評価(公開情報に基づく一般的な枠組み)</div>損害額は再建築価額(新価特約付帯時)又は時価額を基礎に算定されます。総合共済の自然災害(地震等を除く)では、損害額から共済価額の5%又は1万円のいずれか低い額を控除する取扱いが一般的です。地震等は損害割合5%以上が支払要件、支払は共済金額の50%が限度とされる例が多くあります。ただし、具体的な算定方法・部位別の評価基準は各農業共済組合等の約款・損害評価要領によります。`));

  // 免責
  panel.appendChild(el("div", "disclaimer",
    "本モデルの部位区分・部材構成・説明文は、一般的な木造在来工法の部位名称とNOSAI各組合の公開情報に基づく研修用の参考です。NOSAI建物共済の正式な部位区分表・損害割合基準(損害評価要領等)を再現したものではありません。お手元の評価様式・基準資料をご提供いただければ、その区分に合わせて部位・着眼点ノートを再構成できます。"));
}

/* ============================================================
   ループ
============================================================ */
let _lastT = performance.now();
function animate() {
  const now = performance.now();
  const dt = Math.min((now - _lastT) / 1000, 0.1);
  _lastT = now;
  if (state.walk) {
    stepWalk(dt);
    if ((now / 250 | 0) % 2 === 0) updateWalkHud();
  } else {
    camera.position.set(
      orbit.target.x + orbit.radius * Math.sin(orbit.phi) * Math.sin(orbit.theta),
      orbit.target.y + orbit.radius * Math.cos(orbit.phi),
      orbit.target.z + orbit.radius * Math.sin(orbit.phi) * Math.cos(orbit.theta)
    );
    camera.lookAt(orbit.target);
  }
  updateEnvFade();
  updateMeasure();
  hlMat.emissiveIntensity = 0.35 + 0.3 * Math.sin(performance.now() * 0.004);
  dimHlMat.emissiveIntensity = 0.5 + 0.3 * Math.sin(performance.now() * 0.004);
  syncShadows();
  renderer.render(scene, camera);
  updateLabelPositions();
  requestAnimationFrame(animate);
}

rebuild(true);
animate();
</script>
</body>
</html>
