/* 壁1面の軸組(管柱・間柱・筋かい)の割付。開口部の両脇に柱を立て、開口に掛かる間柱・筋かいを除く。
   base: 標準の割付 { posts:[u...], studs:[u...], braces:[[u端, u内], ...] } / L: 面の長さ */
function frameLayout(base, L, rects, edge = 0.055) {   // edge: 開口の縁から脇の柱の芯まで
  const iv = rects.map((r) => [r.u0, r.u1]);
  const hit = (u, m) => iv.some(([a, b]) => u > a - m && u < b + m);
  const posts = base.posts.filter((u) => !hit(u, 0.06));
  iv.forEach(([a, b]) => [a - edge, b + edge].forEach((u) => {
    if (Math.abs(u) < L / 2 - 0.15 && !posts.some((p) => Math.abs(p - u) < 0.15)) posts.push(u);
  }));
  const studs = base.studs.filter((u) => !hit(u, 0.03) && !posts.some((p) => Math.abs(p - u) < 0.1));
  const overlaps = (a, b) => iv.some(([p, q]) => Math.max(a, p) < Math.min(b, q) + 0.05 && Math.min(a, p) < Math.max(b, q));
  const braces = [], used = [];
  const free = (a, b) => !overlaps(Math.min(a, b), Math.max(a, b)) && !used.some(([p, q]) => Math.max(Math.min(a, b), p) < Math.min(Math.max(a, b), q));
  base.braces.forEach(([uE, uI]) => {
    if (free(uE, uI)) { braces.push([uE, uI]); used.push([Math.min(uE, uI), Math.max(uE, uI)]); return; }
    // 開口に掛かる筋かいは、開口のない区間(0.9m以上)へ移す
    const edges = [-L / 2 + 0.15, ...iv.flat().map((v, i) => v + (i % 2 ? 0.1 : -0.1)), L / 2 - 0.15].sort((p, q) => p - q);
    const segs = [];
    for (let i = 0; i + 1 < edges.length; i += 2) segs.push([edges[i], edges[i + 1]]);
    const cand = segs.map(([a, b]) => [a, Math.min(b, a + 1.8)]).filter(([a, b]) => b - a >= 0.9 && free(a, b))
      .sort((p, q) => (q[1] - q[0]) - (p[1] - p[0]));
    if (cand.length) { const [a, b] = cand[0]; braces.push(uE > uI ? [b, a] : [a, b]); used.push([a, b]); }
  });
  return { posts, studs, braces };
}

function buildHouse(stories, roofShape, roofKey, wallKey) {
  const g = new THREE.Group();
  const n = stories;
  const { W, D, foundH, storyH } = STD_PLAN;
  const wallTop = foundH + storyH * n;
  const OPEN = STD_PLAN.openings.filter((o) => o.floor <= n);   // この階数で使う開口部
  const openOn = (face, floor) => OPEN.filter((o) => o.face === face && (floor === undefined || o.floor === floor));
  const ov = 0.5;
  const We = W / 2 + ov, Ze = D / 2 + ov;
  const roofW = W + 2 * ov;

  // 屋根形状ごとの基本量
  const rise = 1.8;                                  // 切妻・寄棟
  const riseT = 1.6;                                 // 片流れの高低差
  const angle = Math.atan2(rise, Ze);
  const slopeLen = Math.sqrt(Ze * Ze + rise * rise);
  const angleK = Math.atan2(riseT, 2 * Ze);
  const slopeLenK = Math.sqrt((2 * Ze) * (2 * Ze) + riseT * riseT);
  const rh = We - Ze;                                // 寄棟の棟の半長(等勾配)
  let ridgeY;
  if (roofShape === "katanagare") ridgeY = wallTop + riseT;
  else if (roofShape === "rikuyane") ridgeY = wallTop + 0.62;   // パラペット天端
  else ridgeY = wallTop + rise;

  // 材質(面の実寸に応じて模様を繰り返す)
  const roofCell = CELLS["roof_" + roofKey], wallCell = CELLS["wall_" + wallKey];
  const roofMatFor = (u, v) => texturedMaterial("roof", roofKey, Math.max(1, u / roofCell), Math.max(1, v / roofCell));
  const wallMatFor = (u, v) => texturedMaterial("wall", wallKey, Math.max(1, u / wallCell), Math.max(1, v / wallCell));
  const flatRoofMat = new THREE.MeshStandardMaterial({ color: 0x878e94, roughness: 0.92 });
  const fasciaMat = new THREE.MeshStandardMaterial({ color: 0xf5f2ea, roughness: 0.8 });
  const capMat = new THREE.MeshStandardMaterial({ color: 0xb9bec3, roughness: 0.35, metalness: 0.5 });

  /* ---- 基礎(布基礎) ---- */
  [[W + 0.12, 0.16, 0,  D / 2], [W + 0.12, 0.16, 0, -D / 2]].forEach(([lw, ld, x, z]) => {
    g.add(tag(box(lw, foundH, ld, MAT.conc, x, foundH / 2, z), "基礎", "布基礎", "found"));
  });
  [[ W / 2], [-W / 2]].forEach(([x]) => {
    g.add(tag(box(0.16, foundH, D + 0.12, MAT.conc, x, foundH / 2, 0), "基礎", "布基礎", "found"));
  });
  g.add(tag(box(W - 0.4, foundH - 0.05, 0.14, MAT.conc, 0, (foundH - 0.05) / 2, 0), "基礎", "布基礎(中通り)", "found"));

  /* ---- 土台・床組 ---- */
  const sillY = foundH + 0.075;   // 基礎天(foundH)と面を一致させない
  g.add(tag(box(W, 0.12, 0.12, MAT.woodD, 0, sillY,  D / 2), "軸組(構造材)", "土台", "frame"));
  g.add(tag(box(W, 0.12, 0.12, MAT.woodD, 0, sillY, -D / 2), "軸組(構造材)", "土台", "frame"));
  g.add(tag(box(0.12, 0.12, D, MAT.woodD,  W / 2, sillY, 0), "軸組(構造材)", "土台", "frame"));
  g.add(tag(box(0.12, 0.12, D, MAT.woodD, -W / 2, sillY, 0), "軸組(構造材)", "土台", "frame"));
  [-2, -1, 0, 1, 2].forEach((z) => {
    g.add(tag(box(W - 0.3, 0.09, 0.09, MAT.woodD, 0, foundH + 0.03, z), "軸組(構造材)", "床組(大引)", "frame"));
  });

  /* ---- 柱・間柱・筋かい(階ごと) ---- */
  const cornerName = n === 2 ? "通し柱" : "柱(隅柱)";
  [[ W/2,  D/2], [ W/2, -D/2], [-W/2,  D/2], [-W/2, -D/2]].forEach(([x, z]) => {
    const h = wallTop - (foundH + 0.12);
    g.add(tag(box(0.13, h, 0.13, MAT.wood, x, foundH + 0.12 + h / 2, z), "軸組(構造材)", cornerName, "frame"));
  });
  for (let f = 0; f < n; f++) {
    const yb = foundH + 0.12 + storyH * f;
    const yt = foundH + storyH * (f + 1);
    const h = yt - yb;
    // 標準の割付(開口部に掛かるものは frameLayout で避ける)
    const kura = [-1, -1 / 3, 1 / 3, 1].map((t) => +(t * (W / 2 - 0.85)).toFixed(3));
    const eX = W / 2 - 0.15;
    const baseSN = { posts: kura, studs: [-(W / 2 - 0.45), W / 2 - 0.45], braces: [[eX, eX - 1.8], [-eX, -eX + 1.8]] };
    const baseEW = { posts: [-(D / 2 - 1.6), D / 2 - 1.6], studs: [-(D / 2 - 1.0), 0, D / 2 - 1.0], braces: [] };
    ["S", "N", "E", "W"].forEach((face) => {
      const sn = face === "S" || face === "N";
      const c = sn ? FACE[face].nz * D / 2 : FACE[face].nx * W / 2;
      const at = (u, y) => sn ? new THREE.Vector3(u, y, c) : new THREE.Vector3(c, y, u);
      const rects = openOn(face, f + 1).map((o) => openingRect(o));
      const L = sn ? W : D;
      const lay = frameLayout(sn ? baseSN : baseEW, L, rects);
      lay.posts.forEach((u) => { const p = at(u, yb + h / 2); g.add(tag(box(0.11, h, 0.11, MAT.wood, p.x, p.y, p.z), "軸組(構造材)", "管柱", "frame")); });
      lay.studs.forEach((u) => { const p = at(u, yb + h / 2); g.add(tag(box(sn ? 0.045 : 0.1, h, sn ? 0.1 : 0.045, MAT.wood, p.x, p.y, p.z), "軸組(構造材)", "間柱", "frame")); });
      lay.braces.forEach(([u0, u1]) => g.add(tag(beamBetween(at(u0, yb), at(u1, yt), 0.045, MAT.wood), "軸組(構造材)", "筋かい", "frame")));
      // 開口部のまぐさ(上)・窓台(下)
      rects.forEach((r) => {
        const len = r.u1 - r.u0 + 0.11, uc = (r.u0 + r.u1) / 2;
        const sz = (y) => { const p = at(uc, y); return box(sn ? len : 0.105, 0.105, sn ? 0.105 : len, MAT.wood, p.x, p.y, p.z); };
        g.add(tag(sz(r.y1 + 0.055), "軸組(構造材)", "まぐさ・窓台", "frame"));
        if (r.y0 > yb + 0.2) g.add(tag(sz(r.y0 - 0.055), "軸組(構造材)", "まぐさ・窓台", "frame"));
      });
    });
  }

  /* ---- 胴差し・2階床組(2階建てのみ) ---- */
  if (n === 2) {
    const y2 = foundH + storyH;
    g.add(tag(box(W, 0.24, 0.12, MAT.woodD, 0, y2,  D / 2), "軸組(構造材)", "胴差し", "frame"));
    g.add(tag(box(W, 0.24, 0.12, MAT.woodD, 0, y2, -D / 2), "軸組(構造材)", "胴差し", "frame"));
    g.add(tag(box(0.12, 0.24, D, MAT.woodD,  W / 2, y2, 0), "軸組(構造材)", "胴差し", "frame"));
    g.add(tag(box(0.12, 0.24, D, MAT.woodD, -W / 2, y2, 0), "軸組(構造材)", "胴差し", "frame"));
    for (let bx = -(W / 2 - 0.7); bx <= W / 2 - 0.69; bx += (W - 1.4) / 5) {
      g.add(tag(box(0.1, 0.2, D - 0.2, MAT.woodD, +bx.toFixed(3), y2, 0), "軸組(構造材)", "床梁(2階床組)", "frame"));
    }
  }

  /* ---- 小屋組(屋根形状別・簡略) ---- */
  g.add(tag(box(W + 0.2, 0.15, 0.12, MAT.woodD, 0, wallTop,  D / 2), "軸組(構造材)", "桁", "frame"));
  g.add(tag(box(W + 0.2, 0.15, 0.12, MAT.woodD, 0, wallTop, -D / 2), "軸組(構造材)", "桁", "frame"));
  g.add(tag(box(0.12, 0.15, D, MAT.woodD,  W / 2 - 0.03, wallTop, 0), "軸組(構造材)", "妻梁", "frame"));   // 妻壁の面と重ねない
  g.add(tag(box(0.12, 0.15, D, MAT.woodD, -(W / 2 - 0.03), wallTop, 0), "軸組(構造材)", "妻梁", "frame"));
  if (roofShape === "kiritsuma") {
    for (let bx = -(W / 2 - 1.0); bx <= W / 2 - 0.99; bx += (W - 2.0) / 3) {
      const px = +bx.toFixed(3);
      g.add(tag(box(0.12, 0.18, D, MAT.woodD, px, wallTop + 0.02, 0), "軸組(構造材)", "小屋梁", "frame"));
      g.add(tag(box(0.1, 1.5, 0.1, MAT.wood, px, wallTop + 0.11 + 0.75, 0), "軸組(構造材)", "小屋束", "frame"));
    }
    g.add(tag(box(W + 0.2, 0.12, 0.12, MAT.woodD, 0, wallTop + 1.7, 0), "軸組(構造材)", "棟木", "frame"));
    [1.7, -1.7].forEach((z) => {
      const y = wallTop + rise * (1 - Math.abs(z) / Ze);
      g.add(tag(box(W + 0.2, 0.1, 0.1, MAT.wood, 0, y - 0.04, z), "軸組(構造材)", "母屋", "frame"));
    });
    for (let x = -(W / 2 + ov - 0.25); x <= W / 2 + ov - 0.24; x += 0.6) {
      [[Ze], [-Ze]].forEach(([sz]) => {
        g.add(tag(beamBetween(new THREE.Vector3(x, wallTop + 0.02, sz), new THREE.Vector3(x, wallTop + rise - 0.06, 0), 0.035, MAT.wood), "軸組(構造材)", "垂木", "frame"));
      });
    }
  } else if (roofShape === "yosemune") {
    [-2, 0, 2].forEach((x) => {
      g.add(tag(box(0.12, 0.18, D, MAT.woodD, x, wallTop + 0.02, 0), "軸組(構造材)", "小屋梁", "frame"));
    });
    [-0.6, 0.6].forEach((x) => g.add(tag(box(0.1, 1.5, 0.1, MAT.wood, x, wallTop + 0.86, 0), "軸組(構造材)", "小屋束", "frame")));
    // 屋根面は厚みのない面(軒で wallTop+0.03)なので、垂木・隅木は面より十分下げて突き抜けないようにする
    const rDrop = 0.1;
    g.add(tag(box(2 * rh + 0.2, 0.12, 0.12, MAT.woodD, 0, wallTop + rise - 0.16, 0), "軸組(構造材)", "棟木", "frame"));
    for (let x = -rh + 0.25; x <= rh - 0.24; x += 0.5) {
      [[Ze], [-Ze]].forEach(([sz]) => {
        g.add(tag(beamBetween(new THREE.Vector3(x, wallTop + 0.03 - rDrop, sz), new THREE.Vector3(x, ridgeY - rDrop, 0), 0.035, MAT.wood), "軸組(構造材)", "垂木", "frame"));
      });
    }
    // 主平部の垂木(隅木ラインまで)
    [1.6, 2.2, 2.8, 3.4, 4.0, 4.6, 5.2].filter((v) => v < W / 2 + ov - 0.2).forEach((ax) => [[1], [-1]].forEach(([sx]) => {
      const x = sx * ax;
      const t = (We - Math.abs(x)) / (We - rh);
      [[1], [-1]].forEach(([sz]) => {
        g.add(tag(beamBetween(
          new THREE.Vector3(x, wallTop + 0.03 - rDrop, sz * Ze),
          new THREE.Vector3(x, wallTop + 0.03 + (rise - 0.03) * t - rDrop, sz * Ze * (1 - t)), 0.035, MAT.wood), "軸組(構造材)", "垂木", "frame"));
      });
    }));
    // 隅木・配付垂木(端部)
    [[We, Ze, rh], [We, -Ze, rh], [-We, Ze, -rh], [-We, -Ze, -rh]].forEach(([cx, cz, rx]) => {
      g.add(tag(beamBetween(new THREE.Vector3(cx, wallTop + 0.03 - rDrop, cz), new THREE.Vector3(rx, ridgeY - rDrop, 0), 0.04, MAT.wood), "軸組(構造材)", "垂木", "frame"));
    });
    // 配付垂木は妻側の下り面に沿って、軒から隅木まで(軒と直交)
    [[We, rh], [-We, -rh]].forEach(([cx, rx]) => [-(D / 2 + ov - 1.2), -1.2, 0, 1.2, D / 2 + ov - 1.2].forEach((z) => {
      const t = 1 - Math.abs(z) / Ze;                       // 隅木に当たる位置(0=軒, 1=棟端)
      const x1 = cx + (rx - cx) * t;
      g.add(tag(beamBetween(new THREE.Vector3(cx, wallTop + 0.03 - rDrop, z), new THREE.Vector3(x1, wallTop + 0.03 + (rise - 0.03) * t - rDrop, z), 0.035, MAT.wood), "軸組(構造材)", "垂木", "frame"));
    }));
  } else if (roofShape === "katanagare") {
    for (let bx = -(W / 2 - 1.0); bx <= W / 2 - 0.99; bx += (W - 2.0) / 3) g.add(tag(box(0.12, 0.18, D, MAT.woodD, +bx.toFixed(3), wallTop + 0.02, 0), "軸組(構造材)", "小屋梁", "frame"));
    const hHigh = riseT * (Ze + D / 2) / (2 * Ze);
    g.add(tag(box(W + 0.2, 0.15, 0.12, MAT.woodD, 0, wallTop + hHigh - 0.1, -D / 2), "軸組(構造材)", "桁", "frame"));
    [1 / 3, 2 / 3].forEach((t) => {
      const z = Ze - 2 * Ze * t, y = wallTop + riseT * t;
      g.add(tag(box(W + 0.2, 0.1, 0.1, MAT.wood, 0, y - 0.06, z), "軸組(構造材)", "母屋", "frame"));
    });
    for (let x = -(W / 2 + ov - 0.25); x <= W / 2 + ov - 0.24; x += 0.6) {
      g.add(tag(beamBetween(new THREE.Vector3(x, wallTop - 0.02, Ze), new THREE.Vector3(x, wallTop + riseT - 0.06, -Ze), 0.035, MAT.wood), "軸組(構造材)", "垂木", "frame"));
    }
  } else { // 陸屋根: 屋根梁のみ
    for (let bx = -(W / 2 - 0.7); bx <= W / 2 - 0.69; bx += (W - 1.4) / 5) g.add(tag(box(0.1, 0.2, D - 0.2, MAT.woodD, +bx.toFixed(3), wallTop + 0.02, 0), "軸組(構造材)", "小屋梁", "frame"));
  }

  /* ---- 外壁(矩形部) ---- */
  const wallY0 = foundH + 0.02;                 // 基礎天と面を一致させない
  const wallH = wallTop - wallY0;
  const wallYc = wallY0 + wallH / 2;
  // 設計情報の開口部に合わせて穴を空ける(模様は面の実寸で連続させる)
  const wallMatM = texturedMaterial("wall", wallKey, 1 / wallCell, 1 / wallCell);
  ["S", "N", "E", "W"].forEach((face) => {
    const sn = face === "S" || face === "N", L = sn ? W : D;
    const c = sn ? FACE[face].nz * (D / 2 + 0.05) : FACE[face].nx * (W / 2 + 0.05);
    g.add(tag(wallWithOpenings(face, c, 0.07, -L / 2, L / 2, wallY0, wallTop, openOn(face).map((o) => openingRect(o)), wallMatM), "外壁", "外壁", "ext"));
  });

  /* ---- 外壁(屋根形状別の上部) ---- */
  if (roofShape === "kiritsuma") {
    const triShape = new THREE.Shape();
    triShape.moveTo(-D / 2, 0); triShape.lineTo(D / 2, 0); triShape.lineTo(0, rise); triShape.lineTo(-D / 2, 0);
    const triGeo = new THREE.ShapeGeometry(triShape);
    const gableMat = wallMatFor(D, D);
    [[ W / 2 + 0.06], [-(W / 2 + 0.06)]].forEach(([x]) => {
      const t = new THREE.Mesh(triGeo, gableMat);
      t.rotation.y = Math.PI / 2;
      t.position.set(x, wallTop, 0);
      g.add(tag(t, "外壁", "外壁(妻壁)", "ext"));
    });
  } else if (roofShape === "katanagare") {
    const hAt = (zw) => riseT * (Ze - zw) / (2 * Ze);
    const trap = new THREE.Shape();
    trap.moveTo(-D / 2, 0); trap.lineTo(D / 2, 0); trap.lineTo(D / 2, hAt(-D / 2)); trap.lineTo(-D / 2, hAt(D / 2)); trap.lineTo(-D / 2, 0);
    const trapGeo = new THREE.ShapeGeometry(trap);
    const trapMat = wallMatFor(D, riseT);
    [[ W / 2 + 0.06], [-(W / 2 + 0.06)]].forEach(([x]) => {
      const t = new THREE.Mesh(trapGeo, trapMat);
      t.rotation.y = Math.PI / 2;
      t.position.set(x, wallTop, 0);
      g.add(tag(t, "外壁", "外壁(妻壁)", "ext"));
    });
    const hHigh = hAt(-D / 2);
    g.add(tag(box(W, hHigh + 0.05, 0.065, wallMatFor(W, hHigh), 0, wallTop - 0.05 + (hHigh + 0.05) / 2, -(D / 2 + 0.045)), "外壁", "外壁(妻壁)", "ext"));   // 下端を壁天端より下げ、面の一致を避ける   // 下部の壁と面を一致させない   // 壁天端と面を一致させない
  } else if (roofShape === "rikuyane") {
    const ph = 0.45, pb = wallTop + 0.125;
    [[0,  D / 2 + 0.02, W + 0.3, 0.12], [0, -(D / 2 + 0.02), W + 0.3, 0.12]].forEach(([x, z, lx, lz]) => {
      g.add(tag(box(lx, ph, lz, wallMatFor(lx, ph), x, pb + ph / 2, z), "外壁", "パラペット・笠木", "ext"));
      g.add(tag(box(lx + 0.06, 0.05, 0.22, capMat, x, pb + ph + 0.03, z), "外壁", "パラペット・笠木", "ext"));
    });
    [[ W / 2 + 0.02, 0, 0.12, D + 0.3], [-(W / 2 + 0.02), 0, 0.12, D + 0.3]].forEach(([x, z, lx, lz]) => {
      g.add(tag(box(lx, ph, lz, wallMatFor(D, ph), x, pb + ph / 2, z), "外壁", "パラペット・笠木", "ext"));
      g.add(tag(box(0.22, 0.05, lz + 0.06, capMat, x, pb + ph + 0.03, z), "外壁", "パラペット・笠木", "ext"));
    });
  }
  // 寄棟は矩形壁のみ(妻壁の三角なし)

  /* ---- 屋根(形状別) ---- */
  if (roofShape === "kiritsuma") {
    [[+1], [-1]].forEach(([sflag]) => {
      const p = box(roofW, 0.09, slopeLen + 0.15, roofMatFor(roofW, slopeLen), 0, wallTop + rise / 2 + 0.05, sflag * Ze / 2);
      p.rotation.x = sflag > 0 ? angle : -angle;
      g.add(tag(p, "屋根", "屋根葺き材", "ext"));
    });
    g.add(tag(box(roofW, 0.1, 0.3, roofMatFor(roofW, 0.3), 0, ridgeY + 0.08, 0), "屋根", "棟(棟瓦・棟板金)", "ext"));
  } else if (roofShape === "yosemune") {
    const RA = new THREE.Vector3(rh, ridgeY, 0), RB = new THREE.Vector3(-rh, ridgeY, 0);
    const C = (x, z) => new THREE.Vector3(x, wallTop + 0.03, z);   // 壁天端と面を一致させない
    g.add(tag(quadMesh(C(-We, Ze), C(We, Ze), RA, RB, roofMatFor(roofW, slopeLen)), "屋根", "屋根葺き材", "ext"));
    g.add(tag(quadMesh(C(We, -Ze), C(-We, -Ze), RB, RA, roofMatFor(roofW, slopeLen)), "屋根", "屋根葺き材", "ext"));
    g.add(tag(triMesh(C(We, Ze), C(We, -Ze), RA, roofMatFor(D + 2 * ov, slopeLen)), "屋根", "屋根葺き材", "ext"));
    g.add(tag(triMesh(C(-We, -Ze), C(-We, Ze), RB, roofMatFor(D + 2 * ov, slopeLen)), "屋根", "屋根葺き材", "ext"));
    g.add(tag(box(2 * rh + 0.3, 0.1, 0.3, roofMatFor(2 * rh, 0.3), 0, ridgeY + 0.09, 0), "屋根", "棟(棟瓦・棟板金)", "ext"));
    [[We, Ze, rh], [We, -Ze, rh], [-We, Ze, -rh], [-We, -Ze, -rh]].forEach(([cx, cz, rx]) => {
      g.add(tag(beamBetween(new THREE.Vector3(cx, wallTop + 0.06, cz), new THREE.Vector3(rx, ridgeY + 0.06, 0), 0.05, capMat), "屋根", "隅棟", "ext"));
    });
  } else if (roofShape === "katanagare") {
    const p = quadMesh(
      new THREE.Vector3(-We, wallTop + 0.04, Ze),
      new THREE.Vector3( We, wallTop + 0.04, Ze),
      new THREE.Vector3( We, wallTop + riseT + 0.04, -Ze),
      new THREE.Vector3(-We, wallTop + riseT + 0.04, -Ze),
      roofMatFor(roofW, slopeLenK));
    g.add(tag(p, "屋根", "屋根葺き材", "ext"));
  } else {
    g.add(tag(box(W + 0.24, 0.12, D + 0.24, flatRoofMat, 0, wallTop + 0.07, 0), "屋根", "屋根葺き材", "ext"));
  }

  /* ---- 破風・鼻隠し(陸屋根以外) ---- */
  if (roofShape === "kiritsuma") {
    [[Ze], [-Ze]].forEach(([z]) => {
      g.add(tag(box(roofW, 0.18, 0.04, fasciaMat, 0, wallTop - 0.03, z + Math.sign(z) * 0.03), "屋根", "破風・鼻隠し", "ext"));
    });
    [[+1], [-1]].forEach(([sx]) => [[+1], [-1]].forEach(([sz]) => {
      const b = box(0.04, 0.2, slopeLen, fasciaMat, sx * (We + 0.05), wallTop + rise / 2, sz * Ze / 2);   // 屋根の端面と重ねない
      b.rotation.x = sz > 0 ? angle : -angle;
      g.add(tag(b, "屋根", "破風・鼻隠し", "ext"));
    }));
  } else if (roofShape === "yosemune") {
    [[Ze], [-Ze]].forEach(([z]) => {
      g.add(tag(box(roofW, 0.18, 0.04, fasciaMat, 0, wallTop - 0.03, z + Math.sign(z) * 0.03), "屋根", "破風・鼻隠し", "ext"));
    });
    [[We], [-We]].forEach(([x]) => {
      g.add(tag(box(0.04, 0.18, D + 2 * ov, fasciaMat, x + Math.sign(x) * 0.03, wallTop - 0.03, 0), "屋根", "破風・鼻隠し", "ext"));
    });
  } else if (roofShape === "katanagare") {
    g.add(tag(box(roofW, 0.18, 0.04, fasciaMat, 0, wallTop - 0.03, Ze + 0.03), "屋根", "破風・鼻隠し", "ext"));
    g.add(tag(box(roofW, 0.2, 0.04, fasciaMat, 0, wallTop + riseT - 0.06, -(Ze + 0.03)), "屋根", "破風・鼻隠し", "ext"));
    [[+1], [-1]].forEach(([sx]) => {
      const b = box(0.04, 0.2, slopeLenK, fasciaMat, sx * (We + 0.05), wallTop + riseT / 2, 0);   // 屋根の端面と重ねない
      b.rotation.x = angleK;
      g.add(tag(b, "屋根", "破風・鼻隠し", "ext"));
    });
  }

  /* ---- 雨樋(形状別) ---- */
  const gutterY = wallTop + 0.02;
  function eavesGutterX(z) {
    const gt = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, roofW, 8), MAT.gutter);
    gt.rotation.z = Math.PI / 2;
    gt.position.set(0, gutterY, z);
    g.add(tag(gt, "雨樋・附帯", "軒樋", "ext"));
  }
  function downspout(x, z, topY) {
    const dt = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, topY - 0.15, 8), MAT.gutter);
    dt.position.set(x, (topY - 0.15) / 2 + 0.1, z);
    g.add(tag(dt, "雨樋・附帯", "竪樋", "ext"));
  }
  if (roofShape === "kiritsuma") {
    eavesGutterX(Ze + 0.1); eavesGutterX(-(Ze + 0.1));
    downspout(W / 2 - 0.3, Ze + 0.07, wallTop);
    downspout(-(W / 2 - 0.3), -(Ze + 0.07), wallTop);
  } else if (roofShape === "yosemune") {
    eavesGutterX(Ze + 0.1); eavesGutterX(-(Ze + 0.1));
    [[We + 0.1], [-(We + 0.1)]].forEach(([x]) => {
      const gt = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, D + 2 * ov, 8), MAT.gutter);
      gt.rotation.x = Math.PI / 2;
      gt.position.set(x, gutterY, 0);
      g.add(tag(gt, "雨樋・附帯", "軒樋", "ext"));
    });
    downspout(W / 2 - 0.3, Ze + 0.07, wallTop);
    downspout(-(W / 2 - 0.3), -(Ze + 0.07), wallTop);
  } else if (roofShape === "katanagare") {
    eavesGutterX(Ze + 0.1);
    downspout(W / 2 - 0.3, Ze + 0.07, wallTop);
    downspout(-(W / 2 - 0.3), Ze + 0.07, wallTop);
  } else {
    downspout(W / 2 - 0.3, -(D / 2 + 0.08), wallTop + 0.1);
  }

  /* ---- 庇・雨戸・玄関ポーチ(設計情報の hisashi / tobukuro / 玄関戸) ---- */
  const hisaMat = new THREE.MeshStandardMaterial({ color: 0x8c9094, roughness: 0.4, metalness: 0.5 });   // アルミ庇(ステンカラー)
  const amadoM = {
    body:  new THREE.MeshStandardMaterial({ color: 0xdcd9d0, roughness: 0.55, metalness: 0.15 }),   // 戸袋の鏡板(アイボリー)
    rib:   new THREE.MeshStandardMaterial({ color: 0xc4c0b5, roughness: 0.6, metalness: 0.1 }),
    frame: MAT.sash,
  };
  const localSide = (face, s) => (face === "S" || face === "W" ? s : -s);   // 面のローカル x と実座標の向きの対応
  OPEN.forEach((o) => {
    const r = openingRect(o), sn = o.face === "S" || o.face === "N";
    const cOut = (sn ? D : W) / 2 + 0.085;                                    // 外壁の外面
    if (o.hisashi && sn) {
      g.add(tag(placeOnFace(hisashiMesh(o.w + 0.3, o.face === "S" ? 0.5 : 0.45, hisaMat), o.face, o.at, r.y1 + 0.14, cOut), "雨樋・附帯", "庇", "ext"));
    }
    if (o.tobukuro && sn) {
      g.add(tag(placeOnFace(amadoMesh(o.w, o.h, localSide(o.face, o.tobukuro), amadoM), o.face, o.at, (r.y0 + r.y1) / 2, cOut), "開口部", "雨戸・戸袋", "ext"));
    }
    if (o.kind === "door") {
      // 玄関の庇(戸より一回り広く深く)
      g.add(tag(placeOnFace(hisashiMesh(o.w + 0.8, 0.8, hisaMat), o.face, o.at, r.y1 + 0.3, cOut), "雨樋・附帯", "庇", "ext"));
      // 玄関ポーチ(土間コンクリート+タイル)と2段の踏段。上面は戸の沓摺の下
      const top = r.y0 - 0.015, pw = o.w + 0.9;
      const porchMat = new THREE.MeshStandardMaterial({ color: 0xb5aea2, roughness: 0.8 });
      const porch = mergeGeoms([
        [boxGeo(pw, top, 1.0, 0, top / 2, 0.5), porchMat],
        [boxGeo(pw, top * 2 / 3, 0.3, 0, top / 3, 1.15), porchMat],
        [boxGeo(pw, top / 3, 0.3, 0, top / 6, 1.45), porchMat],
      ]);
      g.add(tag(placeOnFace(porch, o.face, o.at, 0, cOut - 0.02), "基礎", "玄関ポーチ", "found"));
    }
  });

  /* ---- 開口部(設計情報の openings。外壁の穴に枠・ガラス・戸を納める) ---- */
  const unitMats = {
    sash: MAT.sash, glass: MAT.glass, door: doorWoodMaterial(), handle: MAT.gutter,
    doorDark: new THREE.MeshStandardMaterial({ color: 0x3b2a1c, roughness: 0.7 }),
    frost: new THREE.MeshStandardMaterial({ color: 0xe2e8eb, roughness: 0.35, transparent: true, opacity: 0.8 }),   // 型板ガラス
  };
  OPEN.forEach((o) => {
    const sn = o.face === "S" || o.face === "N";
    g.add(buildOpeningUnit(o, (sn ? D : W) / 2 + 0.05, 0.148, unitMats));   // 室内側の仕上げ面(外周の芯から0.098内側)まで枠を回す
  });

  /* ---- 附帯設備 ----
     配置の考え方: 玄関(東面)のアプローチを避け、窓と竪樋にも干渉しない位置に置く。
       ・エコキュート … 北面の和室の腰窓と浴室の小窓の間(洗面・浴室の外)
       ・室外機       … 開口部のない西面
       ・立水栓       … 南西の庭先  ・電気メーター … 玄関と反対の西面    */
  const EQP = "附帯設備";
  const zN = -(D / 2 + 0.05);
  const xWface = -(W / 2 + 0.05);
  // エコキュート(北面・和室と浴室の窓の間)
  {
    const bx = -0.62, bz = zN - 0.48;
    g.add(tag(box(0.62, 0.1, 0.86, MAT.conc, bx, 0.05, bz), EQP, "エコキュート(基礎)", "ext"));
    const tank = new THREE.Mesh(new THREE.CylinderGeometry(0.29, 0.29, 1.85, 18), MAT.equip);
    tank.position.set(bx, 1.02, bz);
    g.add(tag(tank, EQP, "エコキュート(貯湯タンク)", "ext"));
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.07, 18), MAT.equip);
    cap.position.set(bx, 1.98, bz);
    g.add(tag(cap, EQP, "エコキュート(貯湯タンク)", "ext"));
    [1.55, 0.5].forEach((y) => g.add(tag(box(0.14, 0.17, 0.03, MAT.gutter, bx + 0.1, y, bz - 0.29), EQP, "エコキュート(貯湯タンク)", "ext")));
    g.add(tag(box(0.05, 0.75, 0.05, MAT.gutter, bx - 0.18, 0.4, bz + 0.3), EQP, "エコキュート(配管)", "ext"));
    // ヒートポンプ(タンクの東隣、送風は北向き)
    const hx = 0.62, hz = zN - 0.5;
    g.add(tag(box(0.95, 0.12, 0.55, MAT.conc, hx, 0.06, hz), EQP, "エコキュート(基礎)", "ext"));
    g.add(tag(box(0.82, 0.68, 0.38, MAT.equip, hx, 0.475, hz), EQP, "エコキュート(ヒートポンプ)", "ext"));
    const fan = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.04, 16), MAT.black);
    fan.rotation.x = Math.PI / 2;
    fan.position.set(hx, 0.48, hz - 0.2);
    g.add(tag(fan, EQP, "エコキュート(ヒートポンプ)", "ext"));
    g.add(tag(box(0.05, 0.5, 0.05, MAT.gutter, hx - 0.3, 0.9, hz + 0.22), EQP, "エコキュート(配管)", "ext"));
  }
  // 室外機(開口部のない西面。送風は西向き)
  const acAt = (ax, az, ry) => {
    const u = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.66, 0.32), MAT.equip);
    body.position.set(0, 0.5, 0);
    u.add(body);
    const f = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.035, 16), MAT.black);
    f.rotation.x = Math.PI / 2; f.position.set(-0.08, 0.5, 0.17);
    u.add(f);
    [-0.3, 0.3].forEach((bx2) => {
      const blk = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.13, 0.38), MAT.conc);
      blk.position.set(bx2, 0.065, 0); u.add(blk);
    });
    const pipe = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.45, 0.05), MAT.gutter);
    pipe.position.set(0.36, 0.85, -0.1); u.add(pipe);
    u.position.set(ax, 0, az); u.rotation.y = ry;
    u.traverse((m) => { if (m.isMesh) { m.userData.part = EQP; m.userData.member = "室外機"; m.userData.layer = "ext"; m.userData.baseMat = m.material; } });
    g.add(u);
  };
  acAt(xWface - 0.4, -1.0, -Math.PI / 2);
  if (n === 2) acAt(xWface - 0.4, 0.6, -Math.PI / 2);
  // 立水栓(南西の庭先)
  {
    const sx = -(W / 2 + 0.6), sz = D / 2 + 0.4;   // 南西の角の外側(戸袋・窓の正面を避ける)
    g.add(tag(box(0.12, 1.0, 0.12, MAT.equip, sx, 0.5, sz), EQP, "立水栓", "ext"));
    g.add(tag(box(0.62, 0.14, 0.44, MAT.equip, sx, 0.07, sz + 0.3), EQP, "立水栓", "ext"));
    const fc = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.16, 8), MAT.gutter);
    fc.rotation.x = Math.PI / 2; fc.position.set(sx, 0.9, sz + 0.12);
    g.add(tag(fc, EQP, "立水栓", "ext"));
  }
  // 電気メーター(西面・室外機から離す)
  g.add(tag(box(0.1, 0.34, 0.26, MAT.equip, xWface - 0.08, foundH + 1.55, 2.2), EQP, "電気メーター", "ext"));

  /* ============================================================
     内装(間取り・仕上げ・造作)   1階63㎡
       1F: LDK19帖 / 和室6帖 / 洗面脱衣 / 浴室(1616) / トイレ / 玄関ホール・廊下
       2F: 洋室2室 / 北側廊下(階段の踊り場) / 階段室
     階段は玄関ホールの隣から北へ上り、1階の動線と交差しない
  ============================================================ */
  const MI = {
    yuka:    new THREE.MeshStandardMaterial({ color: 0xc6a274, roughness: 0.62 }),
    tatami:  new THREE.MeshStandardMaterial({ color: 0xc2cd92, roughness: 0.92 }),
    heri:    new THREE.MeshStandardMaterial({ color: 0x4c5340, roughness: 0.9 }),
    tile:    new THREE.MeshStandardMaterial({ color: 0xdedcd5, roughness: 0.42 }),
    doma:    new THREE.MeshStandardMaterial({ color: 0x8e8981, roughness: 0.8 }),
    kabe:    new THREE.MeshStandardMaterial({ color: 0xf4f2ec, roughness: 0.95, side: THREE.DoubleSide }),
    tenjo:   new THREE.MeshStandardMaterial({ color: 0xf7f6f2, roughness: 0.95, side: THREE.DoubleSide }),
    habaki:  new THREE.MeshStandardMaterial({ color: 0x8a6a49, roughness: 0.7 }),
    tategu:  new THREE.MeshStandardMaterial({ color: 0xbb9166, roughness: 0.7 }),
    fusuma:  new THREE.MeshStandardMaterial({ color: 0xe2d2aa, roughness: 0.85 }),   // 襖紙(壁より黄味を強くして見分ける)
    counter: new THREE.MeshStandardMaterial({ color: 0xe9e7e1, roughness: 0.45 }),
    cabinet: new THREE.MeshStandardMaterial({ color: 0xd6cab6, roughness: 0.72 }),
    tub:     new THREE.MeshStandardMaterial({ color: 0xf1f3f3, roughness: 0.33 }),
    toki:    new THREE.MeshStandardMaterial({ color: 0xfcfcfb, roughness: 0.33 }),
    kanagu:  new THREE.MeshStandardMaterial({ color: 0xbcc2c6, roughness: 0.35, metalness: 0.6 }),
    waku:    new THREE.MeshStandardMaterial({ color: 0x6f5237, roughness: 0.55 }),                 // 建具枠・鴨居・敷居(壁の白と対比させる)
    doorLeaf: new THREE.MeshStandardMaterial({ color: 0xcfa878, roughness: 0.5 }),                // 洋室の戸
    doorGroove: new THREE.MeshStandardMaterial({ color: 0x8f6d4a, roughness: 0.6 }),              // 戸の框の見切り線
    fuchi:   new THREE.MeshStandardMaterial({ color: 0x2a211b, roughness: 0.4 }),                  // 襖縁(黒塗り)・引手の彫込み
    hikite:  new THREE.MeshStandardMaterial({ color: 0x8a7443, roughness: 0.35, metalness: 0.6 }), // 襖の引手
  };
  const IN = (m, member, part) => { g.add(tag(m, part || "内装", member, "int")); return m; };
  const { iX0, iX1, iZ0, iZ1 } = STD_PLAN;
  const f1 = STD_PLAN.floorY(1);
  const c1 = STD_PLAN.ceilY(1, n);
  const ih1 = c1 - f1;

  /* 間取りの基準線(設計情報 STD_PLAN.G。造作・幅木の割付に使う) */
  const { xCor, zMid, xWa, zWat, xBath, xToi, domaX0, domaZ0, domaZ1 } = STD_PLAN.G;

  /* 床(設計情報の部屋ごとに仕上げを分ける) */
  const slabF = (x0, x1, z0, z1, mat, member, y, th) => {
    const inset = (mat === MI.tile) ? 0.012 : 0;   // タイルは側面を隣の床と共有しない
    const w = x1 - x0 - inset * 2, d = z1 - z0 - inset * 2;
    const m = (mat === MI.yuka) ? flooringMaterial(w, d) : mat;   // フローリングは板の目地・木目を張って床材を見分けやすくする
    return IN(box(w, th || 0.06, d, m, (x0 + x1) / 2, y === undefined ? f1 : y, (z0 + z1) / 2), member, "床");
  };
  const tileY = f1 - 0.004;   // タイルはフローリングよりわずかに低くし、面を一致させない
  // 畳敷き(縁付き。長手を z 方向に、x 方向2枚 × z 方向3枚で割り付ける)
  const tatamiFloor = (x0r, x1r, z0r, z1r) => {
    const mw = (x1r - x0r) / 2, ml = (z1r - z0r) / 3;
    // 畳の下地(隙間から下が見えないように敷く。隣の床と面を共有しないよう少し内側に)
    IN(box(x1r - x0r - 0.05, 0.04, z1r - z0r - 0.05, MI.yuka, (x0r + x1r) / 2, f1 - 0.012, (z0r + z1r) / 2), "床(畳)", "床");
    for (let cx = 0; cx < 2; cx++) for (let rz = 0; rz < 3; rz++) {
      const x0 = x0r + cx * mw, z0 = z0r + rz * ml;
      // 畳本体(合わせ目は6mm。畳は突き付けで敷くため隙間はほとんど無い)
      IN(box(mw - 0.006, 0.07, ml - 0.006, MI.tatami, x0 + mw / 2, f1 + 0.005, z0 + ml / 2), "床(畳)", "床");
      // 畳縁(長辺の上面に乗せる)
      [z0 + 0.032, z0 + ml - 0.032].forEach((ez) =>
        IN(box(mw - 0.006, 0.073, 0.05, MI.heri, x0 + mw / 2, f1 + 0.0065, ez), "床(畳)", "床"));
    }
  };
  STD_PLAN.rooms.filter((r) => r.floor === 1).forEach((r) => {
    const [x0, x1, z0, z1] = r.rect;
    if (r.finish === "フローリング") slabF(x0, x1, z0, z1, MI.yuka, "床(フローリング)");
    else if (r.finish === "タイル") slabF(x0, x1, z0, z1, MI.tile, "床(タイル)", tileY);
    else if (r.finish === "畳") tatamiFloor(x0, x1, z0, z1);
    else if (r.finish === "土間") {
      slabF(x0, x1, z0, z1, MI.doma, "玄関土間", foundH + 0.02, 0.05);
      IN(box(0.14, 0.16, z1 - z0, MI.tategu, x0, f1 - 0.02, (z0 + z1) / 2), "上がり框");
    }
  });

  /* 天井 */
  IN(box(iX1 - iX0, 0.04, iZ1 - iZ0, MI.tenjo, (iX0 + iX1) / 2, c1, (iZ0 + iZ1) / 2), "天井");
  /* 外壁の室内側の仕上げ(クロス)
     間仕切り・床・天井・幅木の端(境界線 iX0〜iX1 / iZ0〜iZ1)を受け、外壁との間に隙間を残さない。
     室内側の面は境界線より8mm内側(ユニットバスの壁パネルと面を重ねない)。開口部は外壁と同じ位置に穴を空ける。
     「内部(外装を透過)」表示では外壁と一緒に透過させるため layer は ext とする */
  const liningAt = (y0, y1, floor) => {
    const t = 0.02, ln = 0.012;
    [
      ["N", iZ0 - ln + t / 2, iX0, iX1],
      ["S", iZ1 + ln - t / 2, iX0, iX1],
      ["W", iX0 - ln + t / 2, iZ0, iZ1],
      ["E", iX1 + ln - t / 2, iZ0, iZ1],
    ].forEach(([face, c, a, b]) => g.add(tag(
      wallWithOpenings(face, c, t, a - 0.02, b + 0.02, y0, y1, openOn(face, floor).map((o) => openingRect(o)), MI.kabe), "内装", "内壁(クロス)", "ext")));
  };
  liningAt(foundH + 0.02, c1 - 0.02, 1);

  /* 建具
     開口ごとに枠(縦枠2本・上枠)を回し、戸は開口の上端(垂れ壁の下端)まで隙間なく納める。
     戸は取手・引手・襖縁ごと1枚=1部材にまとめる(使用数・ハイライト・汚損表示を戸の単位で扱うため)。
     枠は部材ごとに分ける(汚損表示は部材の外形で描くため、まとめると開口をふさいでしまう) */
  const doorSet = makeDoorKit(IN, MI, { openH: 2.02, wallT: 0.07, frameMember: "建具枠" });
  /* 間仕切り壁(設計情報の partitions。建具の開口を空け、上部に垂れ壁を付けて建具を納める) */
  const buildPartitions = (floor, fy, ih, ft) => {
    STD_PLAN.partitions.filter((p) => p.floor === floor).forEach((p) => {
      const seg = (a, b, y0, h) => {
        if (b - a <= 0.06) return;
        IN(p.axis === "x" ? box(0.07, h, b - a, MI.kabe, p.at, y0 + h / 2, (a + b) / 2)
                          : box(b - a, h, 0.07, MI.kabe, (a + b) / 2, y0 + h / 2, p.at), "内壁(クロス)");
      };
      const ds = [...p.doors].sort((d1, d2) => d1.a - d2.a);
      let cur = p.from;
      ds.forEach((d) => { seg(cur, d.a, fy, ih); seg(d.a, d.b, fy + 2.02, ih - 2.02); cur = d.b; });
      seg(cur, p.to, fy, ih);
      ds.forEach((d) => doorSet(fy, ft, p.axis, p.at, d.a, d.b, d.kind, d.member));
    });
  };
  buildPartitions(1, f1, ih1, 0.03);

  /* 幅木 */
  const habakiX = (x, z0, z1) => IN(box(0.02, 0.09, z1 - z0, MI.habaki, x, f1 + 0.075, (z0 + z1) / 2), "幅木");
  const habakiZ = (z, x0, x1) => IN(box(x1 - x0, 0.09, 0.02, MI.habaki, (x0 + x1) / 2, f1 + 0.075, z), "幅木");
  habakiZ(iZ1 - 0.02, iX0, xCor);
  habakiZ(zMid + 0.05, iX0, -3.20); habakiZ(zMid + 0.05, -1.80, 0.10); habakiZ(zMid + 0.05, 0.80, xCor);   // 和室・前室の開口で切る

function envBox(w, h, d, mat, x, y, z, ry) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  if (ry) m.rotation.y = ry;

function neighborHouse(x, z, w, d, wallH, rise, wallCol, roofCol, ry) {
  const g = new THREE.Group();
  const wm = new THREE.MeshStandardMaterial({ color: wallCol, roughness: 0.85, side: THREE.DoubleSide });   // 妻壁の三角は左右で向きが逆になるため両面描画
  const rm = new THREE.MeshStandardMaterial({ color: roofCol, roughness: 0.7, side: THREE.DoubleSide });
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, wallH, d), wm);
  body.position.y = wallH / 2;
  g.add(body);
  const ov = 0.4, half = d / 2 + ov;
  const ang = Math.atan2(rise, half);
  const slope = Math.sqrt(half * half + rise * rise);
  [1, -1].forEach((sf) => {
    const pnl = new THREE.Mesh(new THREE.BoxGeometry(w + ov * 2, 0.09, slope), rm);
    pnl.rotation.x = sf > 0 ? ang : -ang;
    pnl.position.set(0, wallH + rise / 2, (sf * half) / 2);
    g.add(pnl);
  });
  const tri = new THREE.Shape();
  tri.moveTo(-d / 2, 0); tri.lineTo(d / 2, 0); tri.lineTo(0, rise); tri.lineTo(-d / 2, 0);
  const tg = new THREE.ShapeGeometry(tri);
  [w / 2 + 0.02, -(w / 2 + 0.02)].forEach((px) => {
    const t = new THREE.Mesh(tg, wm);
    t.rotation.y = Math.PI / 2; t.position.set(px, wallH, 0);
    g.add(t);
  });
  // 窓(簡略)
  const gm = new THREE.MeshStandardMaterial({ color: 0x3a5260, roughness: 0.25 });
  for (let i = -1; i <= 1; i++) {
    const win = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.0, 0.06), gm);
    win.position.set(i * (w / 3.2), wallH * 0.55, d / 2 + 0.02);
    g.add(win);
  }
  g.position.set(x, 0, z);
  if (ry) g.rotation.y = ry;
  envGroup.add(g);
  return g;
}

const pmrem = new THREE.PMREMGenerator(renderer);
const skyCache = {};
function sunVec(el, az) {
  const e = THREE.MathUtils.degToRad(el), a = THREE.MathUtils.degToRad(az);
  return new THREE.Vector3(Math.sin(a) * Math.cos(e), Math.sin(e), Math.cos(a) * Math.cos(e));
}
// 正距円筒の空テクスチャ(天頂→地平→地面のグラデーション+太陽のにじみ)
function skyTextures(key) {
  if (skyCache[key]) return skyCache[key];
  const p = LIGHT_PRESETS[key], W = 1024, H = 512;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  const lg = g.createLinearGradient(0, 0, 0, H);
  lg.addColorStop(0, p.sky.top); lg.addColorStop(0.3, p.sky.mid); lg.addColorStop(0.495, p.sky.hor);
  lg.addColorStop(0.52, p.sky.gnd); lg.addColorStop(1, p.sky.gnd);
  g.fillStyle = lg; g.fillRect(0, 0, W, H);
  const s = sunVec(p.sun.el, p.sun.az);
  const u = Math.atan2(s.z, s.x) / (2 * Math.PI) + 0.5, v = Math.asin(s.y) / Math.PI + 0.5;
  const sx = u * W, sy = (1 - v) * H;
  for (const dx of [-W, 0, W]) {   // 継ぎ目をまたいでも途切れないよう左右にも描く
    const rg = g.createRadialGradient(sx + dx, sy, 0, sx + dx, sy, H * 0.45);
    rg.addColorStop(0, p.sky.glow); rg.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = rg; g.fillRect(0, 0, W, H * 0.51);
    g.fillStyle = "rgba(255,252,240,0.95)";
    g.beginPath(); g.arc(sx + dx, sy, 5, 0, Math.PI * 2); g.fill();
  }
  const bg = new THREE.CanvasTexture(cv);
  bg.mapping = THREE.EquirectangularReflectionMapping;
  bg.colorSpace = THREE.SRGBColorSpace;
  const env = pmrem.fromEquirectangular(bg).texture;
  return (skyCache[key] = { bg, env });
}

function placeInteriorLights(intensity) {
  interiorLights.forEach((pl) => { pl.intensity = 0; });
  if (!intensity || !modelGroup) return;
  const LP = currentPlan();
  if (LP) {
    // 設計情報の部屋の中央(天井下)に灯す。灯数が足りない場合は広い部屋を優先
    LP.rooms
      .filter((r) => r.floor <= planStories() && r.finish !== "吹抜け")
      .sort((a, b) => LP.roomArea(b) - LP.roomArea(a))
      .slice(0, interiorLights.length)
      .forEach((r, i) => {
        const [x0, x1, z0, z1] = r.rect;
        interiorLights[i].position.set((x0 + x1) / 2, LP.floorY(r.floor) + 2.1, (z0 + z1) / 2);
        interiorLights[i].intensity = intensity * Math.min(1.6, Math.max(0.6, LP.roomArea(r) / 10));
      });
    return;
  }
  const bb = new THREE.Box3();
  modelGroup.children.forEach((c) => { if (!(c.userData && c.userData.isSite)) bb.expandByObject(c); });
  if (bb.isEmpty()) return;
  const floors = (bb.max.y - bb.min.y) > 6.2 ? [2.4, 5.15] : [2.4];   // 基礎天端+天井付近
  const xs = [0.28, 0.72].map((f) => THREE.MathUtils.lerp(bb.min.x, bb.max.x, f));
  const zs = [0.3, 0.7].map((f) => THREE.MathUtils.lerp(bb.min.z, bb.max.z, f));
  let n = 0;
  floors.forEach((y) => xs.forEach((x) => zs.forEach((z) => {
    const pl = interiorLights[n++];
    pl.position.set(x, bb.min.y + y, z);
    pl.intensity = intensity;
  })));
}

// ガラスの判定(暗い青系で平滑な材質)。モデルごとに材質が異なるため色と粗さで見分ける
const glassOrig = new Map();
function isGlassMat(m) {
  if (!m || !m.isMeshStandardMaterial || !m.color) return false;
  const c = m.color;
  return m.roughness <= 0.25 && c.b > c.r && (c.r + c.g + c.b) / 3 < 0.35;   // リニア値で判定
}
function applyGlass(p) {
  const mats = new Set();
  [modelGroup, envGroup].forEach((grp) => grp && grp.traverse((o) => {
    const m = o.isMesh && (o.userData.baseMat || o.userData.origMat || o.material);
    if (isGlassMat(m)) mats.add(m);
  }));
  glassOrig.forEach((_, m) => mats.add(m));
  mats.forEach((m) => {
    if (!glassOrig.has(m)) glassOrig.set(m, { transparent: m.transparent, opacity: m.opacity, emissive: m.emissive.getHex(), ei: m.emissiveIntensity, roughness: m.roughness, envI: m.envMapIntensity });
    const o = glassOrig.get(m);
    if (!p) {
      Object.assign(m, { transparent: o.transparent, opacity: o.opacity, emissiveIntensity: o.ei, roughness: o.roughness, envMapIntensity: o.envI });
      m.emissive.setHex(o.emissive);
    } else {
      Object.assign(m, { emissiveIntensity: p.glass.ei, roughness: 0.04, envMapIntensity: 1.6 });
      m.emissive.setHex(p.glass.emissive);
    }
    m.needsUpdate = true;
  });
}

function applyLighting() {

// 影を落とす部材を表示状態に合わせる(透過表示・淡色化中の外装は影を落とさない)
let shadowSig = null;
function syncShadows() {
  if (state.light === "legacy") return;
  let sig = 17;
  const visit = (o) => {
    if (!o.isMesh) return;
    const m = o.material;
    const cast = !(m.transparent && m.opacity < 0.6) && !(m.isMeshBasicMaterial);
    o.castShadow = cast;
    o.receiveShadow = true;
    if (cast) sig = (sig * 31 + o.id) | 0;
  };
  if (modelGroup) modelGroup.traverseVisible(visit);
  if (envGroup.visible) envGroup.traverseVisible(visit);
  if (sig !== shadowSig) { shadowSig = sig; renderer.shadowMap.needsUpdate = true; }
}

  ? `家具類「${name.replace(/^家具類\(|\)$/g, "")}」。建物とは別の共済目的です。損傷の有無・程度を確認し、建物の損害と区別して記録します。`
  : `${part ? part + "の" : ""}部材「${name}」。損傷の有無・範囲を確認し、修理費(復旧に必要な額)を新調達価額の範囲で見積もります。`;

/* ============================================================
   部材の個別分割: モデルの実データから部材名ごとにエントリを自動生成
============================================================ */
function buildDetailedMembers() {
  const map = new Map();
  modelGroup.updateMatrixWorld(true);
  modelGroup.traverse((m) => {
    if (!m.isMesh || !m.userData.member) return;
    const name = m.userData.member;
    if (name.indexOf("DMG") === 0) return;           // 被害エントリは対象外
    if (!map.has(name)) map.set(name, { box: new THREE.Box3(), part: m.userData.part || "", count: 0 });
    const e = map.get(name);
    const g = m.geometry.clone().applyMatrix4(m.matrixWorld);
    g.computeBoundingBox();
    e.box.union(g.boundingBox);
    if (!m.userData.noCount) e.count++;   // 窓のガラスは枠と合わせて1か所
  });
  const out = [];
  let i = 0;
  for (const [name, e] of map) {
    if (e.count === 0 || e.box.isEmpty()) continue;
    i++;
    const c = e.box.getCenter(new THREE.Vector3());
    const flat = new THREE.Vector3(c.x, 0, c.z);
    let pos;
    if (flat.length() < 0.4) pos = [c.x, e.box.max.y + 0.3, c.z];
    else { flat.normalize().multiplyScalar(0.55); pos = [c.x + flat.x, c.y, c.z + flat.z]; }
    const note = DETAIL_NOTES[name] || DETAIL_FALLBACK(name, e.part, e.count);
    out.push({ key: "dp" + i, part: e.part, name: name + (e.count > 1 ? " ×" + e.count : ""), targets: [name],
               pos, note: note + `\n\n(この部材の使用数: ${e.count}${e.part ? " / 区分: " + e.part : ""})` });
  }
  return out;
}

/* ============================================================
   損害評価の練習: 被害シミュレーション(建物共済)
============================================================ */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

  metalRoof: "金属屋根の捲れ・剥がれ。緩勾配の金属屋根は端部(軒先・けらば)から風で捲れやすく、捲れた範囲と下地(野地板・ルーフィング)の損傷を確認します。",
  siding:    "窯業系サイディングの割れ・欠け・打痕。飛来物の衝突痕か、経年・凍害による欠けかを区別します。柄・色の廃番で部分張替えが難しい場合があり、張替えの範囲(面単位)に影響します。",
  louver:    "木目ルーバー(バルコニー手すり・目隠しフェンス)の外れ・破損。風を受けやすい付帯部位で、羽板の枚数と取付金物の損傷を確認します。",
  balcony:   "インナーバルコニーの防水層の破断。積雪や排水不良で滞水すると、直下の室内への漏水につながります。ドレン(排水口)の詰まりと直下の天井のシミも確認します。",
  downpipe:  "縦樋の外れ・変形。受け金物(でんでん)の外れや継手の破損を確認し、損傷した本数・延長を把握します。",
  equip:     "附帯設備(室外機・エコキュート等)の冠水。浸水深が機器の設置高さを超えると内部の電装品まで被害が及び、交換になることがあります。機器ごとに浸水痕の高さを記録します。",
};

function tagAll(obj, part, member, layer) {
  obj.traverse((m) => { if (m.isMesh) { m.userData.part = part; m.userData.member = member; m.userData.layer = layer; m.userData.baseMat = m.material; } });
  return obj;
}
function jaggedPatch(size, rng, mat, seg) {
  const shp = new THREE.Shape();
  const n = seg || 9;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const rr = size * (0.5 + rng() * 0.55);
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
    if (i) shp.lineTo(px, py); else shp.moveTo(px, py);
  }
  shp.closePath();
  return new THREE.Mesh(new THREE.ShapeGeometry(shp), mat);
}
function crackLines(size, rng, mat) {
  const g = new THREE.Group();
  const n = 5 + ((rng() * 4) | 0);
  for (let i = 0; i < n; i++) {
    const a = rng() * Math.PI * 2;
    const len = size * (0.5 + rng() * 0.8);
    const b = new THREE.Mesh(new THREE.BoxGeometry(len, 0.018, 0.006), mat);
    b.position.set(Math.cos(a) * len / 2, Math.sin(a) * len / 2, 0);
    b.rotation.z = a;
    g.add(b);
  }
  return g;
}
function dentGrid(size, rng, mat, count) {
  const g = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const d = new THREE.Mesh(new THREE.CircleGeometry(0.03 + rng() * 0.04, 8), mat);
    d.position.set((rng() - 0.5) * size, (rng() - 0.5) * size, rng() * 0.004);
    g.add(d);
  }
  return g;
}
function placeOn(obj, pos, normal) {
  obj.position.copy(pos.clone().addScaledVector(normal, 0.03));
  obj.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal.clone().normalize());
  return obj;
}

function applyDamage() {
  const out = [];
  if (state.dmgScenario === "none") return out;
  const sc = state.dmgScenario;
  const seedMix = { wind: 131, hail: 313, snow: 977, flood: 613 }[sc] || 1;
  const rng = mulberry32(state.dmgSeed * 7919 + seedMix);
  let idx = 0;
  const reg = (label, kind, pos, member) => {
    idx++;
    out.push({ key: "dmg" + idx, isDamage: true, name: `被害${idx}: ${label}`, targets: [member], pos: [pos.x, pos.y, pos.z], note: DMG_NOTES[kind] });
  };
  const addPatch = (label, kind, part, layer, pos, nrm, obj) => {
    const member = "DMG" + (idx + 1) + ":" + label;
    tagAll(placeOn(obj, pos, nrm), part, member, layer);
    modelGroup.add(obj);
    reg(label, kind, pos.clone().addScaledVector(nrm, 0.3), member);
  };
  // 外壁に残る浸水痕(面に沿った半透明の帯)。face の外側 c の位置に u0〜u1 の幅で貼る
  const floodBand = (label, face, c, u0, u1, lvl) => {
    const member = "DMG" + (idx + 1) + ":浸水痕";
    const f = FACE[face], sn = face === "S" || face === "N";
    const nrm = new THREE.Vector3(f.nx, 0, f.nz);
    const um = (u0 + u1) / 2;
    const band = new THREE.Mesh(new THREE.PlaneGeometry(u1 - u0, lvl), dmgWaterMat);
    tagAll(placeOn(band, sn ? new THREE.Vector3(um, lvl / 2, c) : new THREE.Vector3(c, lvl / 2, um), nrm), "外壁", member, "ext");
    modelGroup.add(band);
    const u = um + (rng() - 0.5) * 3;
    reg(label, "flood", (sn ? new THREE.Vector3(u, lvl + 0.2, c) : new THREE.Vector3(c, lvl + 0.2, u)).addScaledVector(nrm, 0.3), member);
  };
  const ctx = { sc, rng, addPatch, floodBand };
  if (state.buildingModel === "wafu") damageWafu(ctx);
  else if (state.buildingModel === "cube") damageCube(ctx);
  else damageStandard(ctx);
  return out;
}

/* 外壁上のランダム点。faces は候補の面 [{ face, c, u0, u1, y0, y1, ... }]。
   avoidOf(f) が返す矩形 {u0,u1,y0,y1}(開口部など)に余白0.35mで掛かる点は引き直す */
function randomWallPoint(rng, faces, avoidOf) {
  let p;
  for (let k = 0; k < 10; k++) {
    const f = faces[(rng() * faces.length) | 0];
    const u = f.u0 + rng() * (f.u1 - f.u0), y = f.y0 + rng() * (f.y1 - f.y0);
    const fc = FACE[f.face], sn = f.face === "S" || f.face === "N";
    p = { f, pos: sn ? new THREE.Vector3(u, y, f.c) : new THREE.Vector3(f.c, y, u), nrm: new THREE.Vector3(fc.nx, 0, fc.nz) };
    if (!avoidOf(f).some((r) => u > r.u0 - 0.35 && u < r.u1 + 0.35 && y > r.y0 - 0.35 && y < r.y1 + 0.35)) break;
  }
  return p;
}
/* 開口部のガラス面上の点(外側の面 c から法線方向へ off だけ出す) */
function glassPoint(o, plan, c, off) {
  const r = openingRect(o, plan), fc = FACE[o.face], sn = o.face === "S" || o.face === "N";
  const y = (r.y0 + r.y1) / 2, cc = c + off;
  return { pos: sn ? new THREE.Vector3(o.at, y, fc.nz * cc) : new THREE.Vector3(fc.nx * cc, y, o.at), nrm: new THREE.Vector3(fc.nx, 0, fc.nz) };
}

function damageStandard({ sc, rng, addPatch, floodBand }) {
  const shape = state.roofShape, n = state.stories;
  const { W, D, foundH, storyH } = STD_PLAN, ov = 0.5;   // 寸法・開口部は設計情報に合わせる
  const sWins = STD_PLAN.openings.filter((o) => o.floor === 1 && o.face === "S" && o.kind === "hakidashi");
  const winY = (o) => { const r = openingRect(o); return (r.y0 + r.y1) / 2; };
  const hisaY = (o) => openingRect(o).y1 + 0.12;
  const tobO = sWins.find((o) => o.tobukuro) || sWins[0];
  const wallTop = foundH + storyH * n;
  const We = W / 2 + ov, Ze = D / 2 + ov;
  const rise = 1.8, riseT = 1.6;
  const ridgeY = shape === "katanagare" ? wallTop + riseT : (shape === "rikuyane" ? wallTop + 0.62 : wallTop + rise);
  // 屋根面上のランダム点と法線(形状別)
  const roofPoint = () => {
    if (shape === "kiritsuma" || shape === "yosemune") {
      const sf = rng() < 0.5 ? 1 : -1, u = 0.15 + rng() * 0.7;
      const ang = Math.atan2(rise, Ze);
      return { pos: new THREE.Vector3((rng() - 0.5) * (W - 1), wallTop + rise * u + 0.06, sf * Ze * (1 - u)),
               nrm: new THREE.Vector3(0, Math.cos(ang), sf * Math.sin(ang)) };
    }
    if (shape === "katanagare") {
      const u = 0.15 + rng() * 0.7;
      const ang = Math.atan2(riseT, 2 * Ze);
      return { pos: new THREE.Vector3((rng() - 0.5) * (W - 1), wallTop + riseT * u + 0.08, Ze - 2 * Ze * u),
               nrm: new THREE.Vector3(0, Math.cos(ang), Math.sin(ang)) };
    }
    return { pos: new THREE.Vector3((rng() - 0.5) * (W - 1), wallTop + 0.14, (rng() - 0.5) * (D - 1)), nrm: new THREE.Vector3(0, 1, 0) };
  };
  // 外壁上のランダム点(開口部に掛かる点は引き直す)
  const onOpening = (face, u, y) => STD_PLAN.openings.some((o) => o.floor <= n && o.face === face && (() => {
    const r = openingRect(o); return u > r.u0 - 0.35 && u < r.u1 + 0.35 && y > r.y0 - 0.35 && y < r.y1 + 0.35;
  })());
  const wallPoint = (side) => {
    let p;
    for (let k = 0; k < 8; k++) {
      const sf = side !== undefined ? side : (rng() < 0.5 ? 1 : -1);
      const front = rng() < 0.6;
      const y = foundH + 0.5 + rng() * 1.6;
      if (front) {
        const x = (rng() - 0.5) * (W - 1.5);
        p = { pos: new THREE.Vector3(x, y, sf * (D / 2 + 0.09)), nrm: new THREE.Vector3(0, 0, sf) };
        if (!onOpening(sf > 0 ? "S" : "N", x, y)) break;
      } else {
        const z = (rng() - 0.5) * (D - 1.5);
        p = { pos: new THREE.Vector3(sf * (W / 2 + 0.09), y, z), nrm: new THREE.Vector3(sf, 0, 0) };
        if (!onOpening(sf > 0 ? "E" : "W", z, y)) break;
      }
    }
    return p;
  };

  if (sc === "wind") {
    if (shape === "rikuyane") {
      const p = roofPoint();
      addPatch("防水層の破断・膨れ", "waterproof", "屋根", "ext", p.pos, p.nrm, jaggedPatch(0.5 + rng() * 0.3, rng, dmgHoleMat));
      const sf = rng() < 0.5 ? 1 : -1;
      addPatch("笠木の外れ", "parapet", "外壁", "ext", new THREE.Vector3((rng() - 0.5) * (W - 2), wallTop + 0.6, sf * (D / 2 + 0.1)), new THREE.Vector3(0, 0, sf), jaggedPatch(0.4, rng, dmgHoleMat, 6));
    } else {
      const nP = 1 + ((rng() * 2) | 0);
      for (let i = 0; i < nP; i++) {
        const p = roofPoint();
        addPatch("屋根葺き材のめくれ・飛散", "roofPeel", "屋根", "ext", p.pos, p.nrm, jaggedPatch(0.55 + rng() * 0.35, rng, dmgWoodMat));
      }
      if (shape !== "katanagare" && rng() > 0.35) {
        addPatch("棟(棟瓦・棟板金)の飛散", "ridge", "屋根", "ext",
          new THREE.Vector3((rng() - 0.5) * (W - 1), ridgeY + 0.16, 0), new THREE.Vector3(0, 1, 0), jaggedPatch(0.4, rng, dmgHoleMat, 7));
      }
      if (rng() > 0.4) {
        const sf = rng() < 0.5 ? 1 : -1;
        addPatch("破風・鼻隠しの捲れ", "hafu", "屋根", "ext",
          new THREE.Vector3((rng() - 0.5) * (W - 1.5), wallTop - 0.03, sf * (Ze + 0.09)), new THREE.Vector3(0, 0, sf), jaggedPatch(0.3, rng, dmgWoodMat, 6));
      }
    }
    if (rng() > 0.3) {
      const sf = rng() < 0.5 ? 1 : -1;
      addPatch("雨樋の変形・脱落", "gutter", "雨樋・附帯", "ext",
        new THREE.Vector3((rng() - 0.5) * (W - 2), wallTop + 0.02, sf * (shape === "rikuyane" ? D / 2 + 0.12 : Ze + 0.16)), new THREE.Vector3(0, 0, sf), jaggedPatch(0.26, rng, dmgHoleMat, 6));
    }
    if (rng() > 0.45) {
      addPatch("庇の変形・脱落", "hisashi", "雨樋・附帯", "ext",
        new THREE.Vector3(sWins[1].at, hisaY(sWins[1]), D / 2 + 0.56), new THREE.Vector3(0, 0, 1), jaggedPatch(0.3, rng, dmgHoleMat, 6));
    }
    if (rng() > 0.4) {
      const wo = sWins[rng() < 0.5 ? 0 : 1];
      addPatch("窓ガラスの破損", "glass", "開口部", "ext",
        new THREE.Vector3(wo.at, winY(wo), D / 2 + 0.04), new THREE.Vector3(0, 0, 1), crackLines(0.6, rng, dmgGlassMat));
    }
    if (rng() > 0.55) {
      addPatch("雨戸・戸袋の変形", "amado", "開口部", "ext",
        new THREE.Vector3(tobO.at + tobO.tobukuro * (tobO.w / 2 + 0.5), winY(tobO), D / 2 + 0.235), new THREE.Vector3(0, 0, 1), jaggedPatch(0.28, rng, dmgHoleMat, 6));
    }
  }

  if (sc === "hail") {
    const nH = 2 + ((rng() * 2) | 0);
    for (let i = 0; i < nH; i++) {
      const p = roofPoint();
      addPatch("雹による葺き材の割れ・打痕", "hailRoof", "屋根", "ext", p.pos, p.nrm, dentGrid(0.7, rng, dmgCrackMat, 7 + ((rng() * 6) | 0)));
    }
    const wo = sWins[rng() < 0.5 ? 0 : 1];
    addPatch("窓ガラスの破損", "glass", "開口部", "ext",
      new THREE.Vector3(wo.at, winY(wo), D / 2 + 0.04), new THREE.Vector3(0, 0, 1), crackLines(0.55, rng, dmgGlassMat));
    if (rng() > 0.4) {
      const wp = wallPoint(1);
      addPatch("外壁の打痕・剥落", "wallCrack", "外壁", "ext", wp.pos, wp.nrm, dentGrid(0.6, rng, dmgCrackMat, 6));
    }
    if (rng() > 0.5) {
      addPatch("雨樋の変形", "gutter", "雨樋・附帯", "ext",
        new THREE.Vector3((rng() - 0.5) * (W - 2), wallTop + 0.02, Ze + 0.16), new THREE.Vector3(0, 0, 1), dentGrid(0.25, rng, dmgCrackMat, 5));
    }
  }

  if (sc === "snow") {
    if (shape === "rikuyane") {
      const p = roofPoint();
      addPatch("防水層の破断(積雪荷重)", "waterproof", "屋根", "ext", p.pos, p.nrm, jaggedPatch(0.5, rng, dmgHoleMat));
    } else {
      const p = roofPoint();
      addPatch("積雪荷重による屋根面の変形", "snowRoof", "屋根", "ext", p.pos, p.nrm, jaggedPatch(0.75 + rng() * 0.4, rng, dmgWoodMat, 11));
      if (rng() > 0.35) {
        const p2 = roofPoint();
        addPatch("葺き材のずれ・脱落", "roofPeel", "屋根", "ext", p2.pos, p2.nrm, jaggedPatch(0.5, rng, dmgWoodMat));
      }
    }
    for (let i = 0; i < 2; i++) {
      const sf = i === 0 ? 1 : -1;
      addPatch("雨樋の変形・脱落(雪の重み)", "gutter", "雨樋・附帯", "ext",
        new THREE.Vector3((rng() - 0.5) * (W - 2), wallTop + 0.02, sf * (shape === "rikuyane" ? D / 2 + 0.12 : Ze + 0.16)), new THREE.Vector3(0, 0, sf), jaggedPatch(0.28, rng, dmgHoleMat, 6));
    }
    if (rng() > 0.4) {
      addPatch("庇の変形(雪の重み)", "hisashi", "雨樋・附帯", "ext",
        new THREE.Vector3(sWins[0].at, hisaY(sWins[0]), D / 2 + 0.56), new THREE.Vector3(0, 0, 1), jaggedPatch(0.32, rng, dmgHoleMat, 6));
    }
    if (rng() > 0.5) {
      const c1 = foundH + (n === 1 ? 2.4 : 2.55);
      addPatch("天井の雨漏りシミ", "leak", "内装", "int",
        new THREE.Vector3((rng() - 0.5) * 3, c1 - 0.04, (rng() - 0.5) * 3), new THREE.Vector3(0, -1, 0), jaggedPatch(0.55, rng, dmgStainMat, 10));
    }
  }

  if (sc === "flood") {
    const deep = rng() < 0.5;                       // 床上浸水 or 床下浸水
    const lvl = deep ? foundH + 0.55 + rng() * 0.5 : foundH * 0.7;
    [["S", D / 2 + 0.09], ["N", -(D / 2 + 0.09)]].forEach(([face, z]) =>
      floodBand((deep ? "床上浸水の浸水痕" : "床下浸水の浸水痕") + "(外壁)", face, z, -(W - 0.2) / 2, (W - 0.2) / 2, lvl));
    if (deep) {
      const f1 = foundH + 0.16;
      addPatch("床の浸水被害", "floorWet", "床", "int",
        new THREE.Vector3((rng() - 0.5) * 3, f1 + 0.05, (rng() - 0.5) * 3), new THREE.Vector3(0, 1, 0), jaggedPatch(1.1, rng, dmgStainMat, 11));
      addPatch("内壁の浸水痕", "flood", "内装", "int",
        new THREE.Vector3(0.86, f1 + (lvl - f1) / 2, -1.2), new THREE.Vector3(1, 0, 0), jaggedPatch(0.6, rng, dmgStainMat, 9));
    }
    addPatch("土台・床組の含水", "floorWet", "軸組(構造材)", "frame",
      new THREE.Vector3((rng() - 0.5) * 3, foundH + 0.06, D / 2 + 0.02), new THREE.Vector3(0, 0, 1), jaggedPatch(0.35, rng, dmgStainMat, 8));
    if (rng() > 0.5) {
      addPatch("基礎の汚損・洗掘", "flood", "基礎", "found",
        new THREE.Vector3((rng() - 0.5) * 4, foundH / 2, D / 2 + 0.09), new THREE.Vector3(0, 0, 1), jaggedPatch(0.3, rng, dmgStainMat, 8));
    }
  }
}

/* 和風住宅(入母屋・瓦葺き・下屋・縁側)の被害。寸法は WSPEC・WAFU_PLAN から buildWafuHouse と同じ式で求める */
function damageWafu({ sc, rng, addPatch, floodBand }) {
  const S = WSPEC, WP = WAFU_PLAN;
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const yFloor = S.foundH, y1F = yFloor + S.f1, yG = y1F + 0.35, yTop2 = yG + S.f2;
  const W1h = S.W1 / 2, D1h = S.D1 / 2, W2h = S.W2 / 2, D2h = S.D2 / 2;
  const We = W2h + S.ovR, Ze = D2h + S.ovR;
  const rx = We - S.hHip / S.tanA, rz = Ze - S.hHip / S.tanA;
  const y1 = yTop2 + S.hHip, y2 = y1 + rz * S.tanA;
  const ix = W2h, iz = D2h, ox = W1h + S.ovG, oz = D1h + S.ovG, yi = yG + 0.03, yo = y1F - 0.35;   // 下屋
  const oEn = WP.openings.find((o) => o.kind === "engawa"), gx = WP.openings.find((o) => o.kind === "genkanW").at;
  const enL = oEn.at - oEn.w / 2, pw = oEn.w / 5, tateguH = 1.85;
  const sgn = () => (rng() < 0.5 ? 1 : -1);

  // 主屋根(入母屋)の面上の点: 下部の寄棟部分(台形)と上部の切妻部分を勾配でつなぐ
  const mainRoofPoint = () => {
    const sf = sgn(), zA = (0.12 + rng() * 0.78) * Ze;
    let y, xMax;
    if (zA >= rz) { const t = (Ze - zA) / (Ze - rz); y = yTop2 + 0.03 + t * (y1 - yTop2 - 0.03); xMax = rx + (1 - t) * (We - rx); }
    else { y = y1 + (rz - zA) / rz * (y2 - y1); xMax = rx; }
    const ang = Math.atan(S.tanA);
    return { pos: V((rng() - 0.5) * 2 * (xMax - 0.7), y + 0.04, sf * zA), nrm: V(0, Math.cos(ang), sf * Math.sin(ang)) };
  };
  // 下屋の面上の点(南面は玄関ポーチ屋根の下を避ける)
  const geyaPoint = () => {
    const sf = sgn(), t = 0.15 + rng() * 0.7;
    const xMax = ix + t * (ox - ix) - 0.5, xHi = sf > 0 ? Math.min(xMax, gx - 2.0) : xMax;
    const ang = Math.atan2(yi - yo, oz - iz);
    return { pos: V(-xMax + rng() * (xHi + xMax), yi + t * (yo - yi) + 0.03, sf * (iz + t * (oz - iz))), nrm: V(0, Math.cos(ang), sf * Math.sin(ang)) };
  };
  // 玄関ポーチ(切妻)の南側の屋根面
  const porchPoint = () => {
    const pY = yFloor + 2.55, pRise = 0.75, half = 1.35, d = (0.2 + rng() * 0.6) * half, ang = Math.atan2(pRise, half);
    return { pos: V(gx + (rng() - 0.5) * 2.2, pY + pRise - d * pRise / half + 0.06, D1h + 1.0 + d), nrm: V(0, Math.cos(ang), Math.sin(ang)) };
  };
  // 軒樋(main: 主屋根 / 下屋)
  const gutterPoint = (main, sf) => main
    ? { pos: V((rng() - 0.5) * 2 * (We - 0.6), yTop2 - 0.03, sf * (Ze + 0.17)), nrm: V(0, 0, sf) }
    : { pos: V((rng() - 0.5) * 2 * (ox - 0.6), yo - 0.02, sf * (oz + 0.17)), nrm: V(0, 0, sf) };
  // 外壁(1階は下屋の下、2階は下屋の上)。開口部を避ける
  const wallFaces = [
    ...["S", "N"].map((f) => ({ face: f, floor: 1, c: FACE[f].nz * (D1h + 0.09), u0: -W1h + 0.4, u1: W1h - 0.4, y0: yFloor + 0.4, y1: y1F - 0.6 })),
    ...["E", "W"].map((f) => ({ face: f, floor: 1, c: FACE[f].nx * (W1h + 0.09), u0: -D1h + 0.4, u1: D1h - 0.4, y0: yFloor + 0.4, y1: y1F - 0.6 })),
    ...["S", "N"].map((f) => ({ face: f, floor: 2, c: FACE[f].nz * (D2h + 0.09), u0: -W2h + 0.4, u1: W2h - 0.4, y0: yG + 0.5, y1: yTop2 - 0.4 })),
    ...["E", "W"].map((f) => ({ face: f, floor: 2, c: FACE[f].nx * (W2h + 0.09), u0: -D2h + 0.4, u1: D2h - 0.4, y0: yG + 0.5, y1: yTop2 - 0.4 })),
  ];
  const wallAvoid = (f) => WP.openings.filter((o) => o.face === f.face && o.floor === f.floor).map((o) => openingRect(o, WP));
  // 窓ガラス(縁側のガラス戸、または腰窓)
  const glassAt = () => {
    if (rng() < 0.5) {
      const i = (rng() * 5) | 0;
      return { pos: V(enL + pw * (i + 0.5), yFloor + 0.05 + tateguH / 2, D1h + 0.07), nrm: V(0, 0, 1) };
    }
    const wins = WP.openings.filter((o) => o.kind === "koshi");
    const o = wins[(rng() * wins.length) | 0], sn = o.face === "S" || o.face === "N";
    return glassPoint(o, WP, o.floor === 1 ? (sn ? D1h : W1h) : (sn ? D2h : W2h), 0.06);
  };
  const tobukuro = V(enL - 0.52, yFloor + 0.04 + (tateguH + 0.16) / 2, D1h + 0.27);

  if (sc === "wind") {
    const nP = 1 + ((rng() * 2) | 0);
    for (let i = 0; i < nP; i++) {
      const p = mainRoofPoint();
      addPatch("瓦のずれ・飛散(主屋根)", "kawara", "屋根", "ext", p.pos, p.nrm, jaggedPatch(0.5 + rng() * 0.3, rng, dmgWoodMat));
    }
    if (rng() > 0.35) {
      addPatch("棟瓦(大棟)の崩れ・ずれ", "ridge", "屋根", "ext",
        V((rng() - 0.5) * 2 * (rx - 0.4), y2 + 0.24, 0), V(0, 1, 0), jaggedPatch(0.4, rng, dmgWoodMat, 7));
    }
    if (rng() > 0.7) {
      const sx = sgn();
      addPatch("鬼瓦の欠け・ずれ", "oni", "屋根", "ext", V(sx * (rx + 0.23), y2 + 0.28, 0), V(sx, 0, 0), jaggedPatch(0.2, rng, dmgHoleMat, 6));
    }
    if (rng() > 0.6) {
      const sx = sgn();
      addPatch("破風板・懸魚の剥離", "gegyo", "屋根", "ext", V(sx * (rx + 0.09), y2 - 0.35, 0), V(sx, 0, 0), jaggedPatch(0.26, rng, dmgWoodMat, 6));
    }
    if (rng() > 0.5) {
      const p = geyaPoint();
      addPatch("下屋根の瓦のずれ・飛散", "kawara", "屋根", "ext", p.pos, p.nrm, jaggedPatch(0.45, rng, dmgWoodMat));
    }
    if (rng() > 0.65) {
      const p = porchPoint();
      addPatch("玄関ポーチ屋根の瓦のずれ", "porch", "屋根", "ext", p.pos, p.nrm, jaggedPatch(0.3, rng, dmgWoodMat, 7));
    }
    if (rng() > 0.5) {
      const p = gutterPoint(rng() < 0.5, sgn());
      addPatch("軒樋の変形・脱落", "gutter", "雨樋・附帯", "ext", p.pos, p.nrm, jaggedPatch(0.26, rng, dmgHoleMat, 6));
    }
    if (rng() > 0.55) {
      const p = glassAt();
      addPatch("窓ガラスの破損", "glass", "開口部", "ext", p.pos, p.nrm, crackLines(0.55, rng, dmgGlassMat));
    }
    if (rng() > 0.5) {
      addPatch("雨戸・戸袋の変形", "amado", "開口部", "ext", tobukuro, V(0, 0, 1), jaggedPatch(0.28, rng, dmgHoleMat, 6));
    }
    if (rng() > 0.7) {
      const p = randomWallPoint(rng, wallFaces, wallAvoid);
      addPatch("漆喰の剥落(飛来物)", "shikkui", "外壁", "ext", p.pos, p.nrm, jaggedPatch(0.35, rng, dmgWoodMat, 8));
    }
  }

  if (sc === "hail") {
    const nH = 2 + ((rng() * 2) | 0);
    for (let i = 0; i < nH; i++) {
      const p = mainRoofPoint();
      addPatch("雹による瓦の割れ・打痕", "hailRoof", "屋根", "ext", p.pos, p.nrm, dentGrid(0.7, rng, dmgCrackMat, 7 + ((rng() * 6) | 0)));
    }
    const pg = geyaPoint();
    addPatch("雹による下屋根の瓦の割れ", "hailRoof", "屋根", "ext", pg.pos, pg.nrm, dentGrid(0.6, rng, dmgCrackMat, 6 + ((rng() * 4) | 0)));
    const pw2 = glassAt();
    addPatch("窓ガラスの破損", "glass", "開口部", "ext", pw2.pos, pw2.nrm, crackLines(0.5, rng, dmgGlassMat));
    if (rng() > 0.5) {
      const p = randomWallPoint(rng, wallFaces, wallAvoid);
      addPatch("漆喰外壁の打痕・剥落", "shikkui", "外壁", "ext", p.pos, p.nrm, dentGrid(0.6, rng, dmgCrackMat, 7));
    }
    if (rng() > 0.5) {
      const p = gutterPoint(rng() < 0.5, 1);
      addPatch("軒樋の変形", "gutter", "雨樋・附帯", "ext", p.pos, p.nrm, dentGrid(0.25, rng, dmgCrackMat, 5));
    }
  }

  if (sc === "snow") {
    const p = mainRoofPoint();
    addPatch("積雪荷重による瓦のずれ・割れ", "snowRoof", "屋根", "ext", p.pos, p.nrm, jaggedPatch(0.7 + rng() * 0.3, rng, dmgWoodMat, 11));
    const nG = 1 + (rng() > 0.5 ? 1 : 0);
    for (let i = 0; i < nG; i++) {
      const pg = geyaPoint();
      addPatch("落雪による下屋根の瓦の割れ・ずれ", "geya", "屋根", "ext", pg.pos, pg.nrm, jaggedPatch(0.5, rng, dmgWoodMat, 9));
    }
    [1, -1].forEach((sf) => {
      const pt = gutterPoint(false, sf);
      addPatch("下屋の軒樋の変形・脱落(雪の重み)", "gutter", "雨樋・附帯", "ext", pt.pos, pt.nrm, jaggedPatch(0.28, rng, dmgHoleMat, 6));
    });
    if (rng() > 0.6) {
      const pp = porchPoint();
      addPatch("玄関ポーチ屋根の破損(落雪)", "porch", "屋根", "ext", pp.pos, pp.nrm, jaggedPatch(0.35, rng, dmgWoodMat, 8));
    }
    if (rng() > 0.5) {
      addPatch("広縁の天井の雨漏りシミ", "leak", "内装", "int",
        V(WP.iX0 + 0.8 + rng() * 4.5, WP.ceilY(1) - 0.03, (WP.G.zEn + WP.iZ1) / 2), V(0, -1, 0), jaggedPatch(0.4, rng, dmgStainMat, 10));
    } else if (rng() > 0.4) {
      addPatch("天井(2階)の雨漏りシミ", "leak", "内装", "int",
        V((rng() - 0.5) * 5, WP.ceilY(2) - 0.03, (rng() - 0.5) * 3), V(0, -1, 0), jaggedPatch(0.5, rng, dmgStainMat, 10));
    }
  }

  if (sc === "flood") {
    const deep = rng() < 0.5;                       // 床上浸水 or 床下浸水(床が高いので床下の範囲が広い)
    const fl = yFloor + 0.04;                       // 1階の床面(畳の上面)
    const lvl = deep ? fl + 0.2 + rng() * 0.6 : yFloor * 0.7;
    const lb = deep ? "床上浸水の浸水痕" : "床下浸水の浸水痕";
    floodBand(lb + "(北面外壁)", "N", -(D1h + 0.17), -W1h, W1h, lvl);
    floodBand(lb + "(東面外壁)", "E", W1h + 0.17, -D1h, D1h, lvl);
    if (deep) {
      addPatch("縁側(濡れ縁)の浸水", "engawaW", "内装", "ext",
        V(oEn.at + (rng() - 0.5) * 4, yFloor + 0.035, D1h + 0.45), V(0, 1, 0), jaggedPatch(0.5, rng, dmgStainMat, 9));
      addPatch("畳の浸水(入替え)", "tatami", "床", "int",
        V(-1.7 + rng() * 2.4, fl + 0.006, 0.5 + rng() * 2.2), V(0, 1, 0), jaggedPatch(0.9, rng, dmgStainMat, 11));   // 次の間(家具のない室)
      addPatch("京壁(繊維壁)の浸水痕", "kyokabe", "内装", "int",
        V(-1.4 + rng() * 2.0, fl + (lvl - fl) / 2, WP.iZ0 + 0.005), V(0, 0, 1), jaggedPatch(0.55, rng, dmgStainMat, 9));
    }
    addPatch("土台・床組の含水", "floorWet", "軸組(構造材)", "frame",
      V((rng() - 0.5) * 8, yFloor + 0.095, -(D1h + 0.09)), V(0, 0, -1), jaggedPatch(0.35, rng, dmgStainMat, 8));
    if (rng() > 0.5) {
      addPatch("基礎の汚損・洗掘", "flood", "基礎", "found",
        V((rng() - 0.5) * 8, yFloor / 2, -(D1h + 0.17)), V(0, 0, -1), jaggedPatch(0.3, rng, dmgStainMat, 8));
    }
    if (rng() > 0.4) {
      addPatch("室外機の冠水", "equip", "附帯設備", "ext",
        V(rng() < 0.5 ? 1.4 : 2.8, 0.42, -(D1h + S.ovG + 0.5 + 0.17)), V(0, 0, -1), jaggedPatch(0.26, rng, dmgStainMat, 8));
    }
  }
}

/* キューブ型(緩勾配の片流れ・金属屋根・窯業系サイディング)の被害。寸法は CSPEC・CUBE_PLAN から buildCubeHouse と同じ式で求める */
function damageCube({ sc, rng, addPatch, floodBand }) {
  const S = CSPEC, CP = CUBE_PLAN;
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const zF = S.D / 2, zR = -S.D / 2, xW = -S.W / 2, xE = S.W / 2;
  const A = { x0: xW, x1: S.splitX, zF, zR, top: S.eaveA };
  const B = { x0: S.splitX, x1: xE, zF: zF + S.bFront, zR, top: S.eaveB };
  const balc = { u0: A.x0 + 0.55, u1: A.x0 + 4.75, y0: 3.95, y1: 5.85 };
  const liv  = { u0: A.x0 + 0.75, u1: A.x0 + 4.15, y0: S.baseH, y1: 2.95 };
  const ent  = { u0: B.x0 + 0.75, u1: B.x0 + 2.85, y0: 0.60, y1: 3.05 };
  const oKatte = CP.openings.find((o) => o.member === "勝手口");
  const pitchA = Math.atan(S.pitch);

  // 屋根面(南へ下がる片流れ)上の点
  const roofPoint = () => {
    const Vv = rng() < 0.6 ? A : B, cz = (Vv.zF + Vv.zR) / 2, rise = (Vv.zF - Vv.zR) * S.pitch;
    const x = Vv.x0 + 0.5 + rng() * (Vv.x1 - Vv.x0 - 1.0), z = Vv.zR + 0.5 + rng() * (Vv.zF - Vv.zR - 1.0);
    return { pos: V(x, Vv.top + 0.20 + rise / 2 + 0.05 - (z - cz) * S.pitch, z), nrm: V(0, Math.cos(pitchA), Math.sin(pitchA)) };
  };
  // 笠木・見切り(屋根の端部)
  const kasagiPoint = () => {
    const k = (rng() * 4) | 0;
    if (k === 0) return { pos: V(A.x0 + 0.4 + rng() * (A.x1 - A.x0 - 0.8), A.top + 0.085, A.zF + 0.055), nrm: V(0, 0, 1) };
    if (k === 1) return { pos: V(B.x0 + 0.4 + rng() * (B.x1 - B.x0 - 0.8), B.top + 0.085, B.zF + 0.055), nrm: V(0, 0, 1) };
    if (k === 2) return { pos: V(A.x0 - 0.055, A.top + 0.085, zR + 0.5 + rng() * (S.D - 1.0)), nrm: V(-1, 0, 0) };
    return { pos: V(B.x1 + 0.055, B.top + 0.085, zR + 0.5 + rng() * (S.D - 1.0)), nrm: V(1, 0, 0) };
  };
  // 縦樋(4本の外周の樋)
  const pipes = [[A.x0 - 0.09, A.zF - 0.30, -1, S.eaveA], [A.x0 - 0.09, zR + 0.30, -1, S.eaveA], [B.x1 + 0.09, B.zF - 0.35, 1, S.eaveB], [B.x1 + 0.09, zR + 0.30, 1, S.eaveB]];
  const pipePoint = (i) => { const [x, z, sx, h] = pipes[i]; return { pos: V(x + sx * 0.04, h * (0.35 + rng() * 0.4), z), nrm: V(sx, 0, 0) }; };
  // 外壁(light=淡色面、それ以外は濃色面)。開口部・凹み・庇を避ける
  const wallFaces = [
    { face: "S", c: A.zF + 0.02, u0: A.x0 + 0.3, u1: A.x1 - 0.3, y0: 3.30, y1: 3.60, light: true },
    { face: "S", c: B.zF + 0.02, u0: B.x0 + 0.3, u1: B.x1 - 0.3, y0: 3.40, y1: B.top - 0.35, light: true },
    { face: "W", c: A.x0 - 0.02, u0: zR + 0.5, u1: A.zF - 0.5, y0: 1.0, y1: A.top - 0.4, light: true },
    { face: "N", c: zR - 0.02, u0: xW + 0.4, u1: xE - 0.4, y0: 0.9, y1: B.top - 0.4 },
    { face: "E", c: B.x1 + 0.02, u0: zR + 0.5, u1: B.zF - 0.5, y0: 2.2, y1: B.top - 0.4 },
  ];
  const wallAvoid = (f) => CP.openings.filter((o) => o.face === f.face && !o.recess).map((o) => openingRect(o, CP))
    .concat(f.face === "S" ? [balc, liv, ent] : [], f.face === "E" ? [{ u0: oKatte.at - 0.7, u1: oKatte.at + 0.7, y0: 2.6, y1: 2.85 }] : []);
  // 窓ガラス(玄関ドア・勝手口以外)
  const glassAt = () => {
    const wins = CP.openings.filter((o) => o.kind !== "doorFrame");
    const o = wins[(rng() * wins.length) | 0];
    return glassPoint(o, CP, Math.abs(o.c), 0.0);
  };
  const hisashi = V(B.x1 + 0.26, 2.72 + 0.04, oKatte.at);

  if (sc === "wind") {
    const nP = 1 + ((rng() * 2) | 0);
    for (let i = 0; i < nP; i++) {
      const p = roofPoint();
      addPatch("金属屋根の捲れ・剥がれ", "metalRoof", "屋根", "ext", p.pos, p.nrm, jaggedPatch(0.6 + rng() * 0.4, rng, dmgBareMat));
    }
    if (rng() > 0.4) {
      const p = kasagiPoint();
      addPatch("笠木・見切りの外れ", "parapet", "屋根", "ext", p.pos, p.nrm, jaggedPatch(0.28, rng, dmgBareMat, 6));
    }
    if (rng() > 0.5) {
      const p = pipePoint((rng() * 4) | 0);
      addPatch("縦樋の外れ・変形", "downpipe", "雨樋・附帯", "ext", p.pos, p.nrm, jaggedPatch(0.22, rng, dmgCoreMat, 6));
    }
    if (rng() > 0.65) addPatch("庇の変形・脱落", "hisashi", "雨樋・附帯", "ext", hisashi, V(0, 1, 0), jaggedPatch(0.3, rng, dmgBareMat, 6));
    if (rng() > 0.5) {
      const fence = rng() < 0.5;
      addPatch(fence ? "目隠しフェンス(木目ルーバー)の外れ" : "バルコニー手すり(木目ルーバー)の外れ", "louver", "開口部", "ext",
        fence ? V(-1.95 + (rng() - 0.5) * 2.6, 0.9 + rng() * 0.8, A.zF + 0.66) : V(-1.9 + (rng() - 0.5) * 2.8, 4.08 + 0.2 * ((rng() * 5) | 0), A.zF - 0.22),
        V(0, 0, 1), jaggedPatch(0.3, rng, dmgHoleMat, 6));
    }
    if (rng() > 0.6) {
      const p = glassAt();
      addPatch("窓ガラスの破損", "glass", "開口部", "ext", p.pos, p.nrm, crackLines(0.5, rng, dmgGlassMat));
    }
    if (rng() > 0.6) {
      const p = randomWallPoint(rng, wallFaces, wallAvoid);
      addPatch("サイディングの割れ・欠け(飛来物)", "siding", "外壁", "ext", p.pos, p.nrm, jaggedPatch(0.32, rng, p.f.light ? dmgHoleMat : dmgCoreMat, 7));
    }
  }

  if (sc === "hail") {
    const nH = 2 + ((rng() * 2) | 0);
    for (let i = 0; i < nH; i++) {
      const p = roofPoint();
      addPatch("雹による金属屋根の凹み", "hailRoof", "屋根", "ext", p.pos, p.nrm, dentGrid(0.7, rng, dmgDentLightMat, 8 + ((rng() * 6) | 0)));
    }
    const pg = glassAt();
    addPatch("窓ガラスの破損", "glass", "開口部", "ext", pg.pos, pg.nrm, crackLines(0.5, rng, dmgGlassMat));
    if (rng() > 0.4) {
      const p = randomWallPoint(rng, wallFaces, wallAvoid);
      addPatch("サイディングの打痕・欠け", "siding", "外壁", "ext", p.pos, p.nrm, dentGrid(0.6, rng, p.f.light ? dmgCrackMat : dmgDentLightMat, 7));
    }
    if (rng() > 0.5) addPatch("庇の凹み", "hisashi", "雨樋・附帯", "ext", hisashi, V(0, 1, 0), dentGrid(0.35, rng, dmgDentLightMat, 6));
  }

  if (sc === "snow") {
    const p = roofPoint();
    addPatch("積雪荷重による屋根面の変形", "snowRoof", "屋根", "ext", p.pos, p.nrm, jaggedPatch(0.8 + rng() * 0.4, rng, dmgBareMat, 11));
    if (rng() > 0.4) {
      addPatch("インナーバルコニー防水層の破断", "balcony", "外壁", "ext",
        V(-1.9 + (rng() - 0.5) * 2.6, balc.y0 + 0.025, A.zF - 0.35 - rng() * 0.8), V(0, 1, 0), jaggedPatch(0.4, rng, dmgBareMat, 8));
    }
    const i0 = (rng() * 4) | 0;
    [i0, (i0 + 2) % 4].forEach((i) => {
      const pp = pipePoint(i);
      addPatch("縦樋の変形・外れ(雪の重み)", "downpipe", "雨樋・附帯", "ext", pp.pos, pp.nrm, jaggedPatch(0.22, rng, dmgCoreMat, 6));
    });
    if (rng() > 0.5) addPatch("庇の変形(雪の重み)", "hisashi", "雨樋・附帯", "ext", hisashi, V(0, 1, 0), jaggedPatch(0.3, rng, dmgBareMat, 6));
    if (rng() > 0.5) {
      addPatch("天井(主寝室)の雨漏りシミ", "leak", "内装", "int",
        V(-3.6 + rng() * 3.0, CP.ceilY(2) - 0.03, -0.1 + rng() * 1.6), V(0, -1, 0), jaggedPatch(0.5, rng, dmgStainMat, 10));
    }
  }

  if (sc === "flood") {
    const deep = rng() < 0.5;                       // 床上浸水 or 床下浸水
    const fl = CP.floorY(1) + 0.03;                 // 1階の床仕上げ面
    const lvl = deep ? fl + 0.2 + rng() * 0.6 : S.baseH * 0.6 + rng() * 0.12;
    const lb = deep ? "床上浸水の浸水痕" : "床下浸水の浸水痕";
    floodBand(lb + "(北面外壁)", "N", zR - 0.09, xW, xE, lvl);
    floodBand(lb + "(西面外壁)", "W", A.x0 - 0.09, zR, A.zF, lvl);
    if (deep) {
      addPatch("床(フローリング)の浸水被害", "floorWet", "床", "int",
        V(-3.6 + rng() * 2.6, fl + 0.006, 1.95 + rng() * 0.2), V(0, 1, 0), jaggedPatch(0.8, rng, dmgStainMat, 11));   // 掃出し窓の前(家具を避ける)
      addPatch("内壁(クロス)の浸水痕", "flood", "内装", "int",
        V(CP.xw + 0.005, fl + (lvl - fl) / 2, -2.4 + rng() * 1.0), V(1, 0, 0), jaggedPatch(0.55, rng, dmgStainMat, 9));
    }
    addPatch("土台・床組の含水", "floorWet", "軸組(構造材)", "frame",
      V((rng() - 0.5) * 7, S.baseH + 0.08, zR - 0.03), V(0, 0, -1), jaggedPatch(0.32, rng, dmgStainMat, 8));
    if (rng() > 0.5) {
      addPatch("基礎の汚損・洗掘", "flood", "基礎", "found",
        V((rng() - 0.5) * 7, S.baseH / 2, zR - 0.10), V(0, 0, -1), jaggedPatch(0.28, rng, dmgStainMat, 8));
    }
    if (rng() > 0.4) {

    // ヒステリシス: 2回続けて遮られたら隠し、2回続けて見えたら表示する(境目でのちらつき防止)
    e.occScore = Math.max(0, Math.min(5, (e.occScore === undefined ? (raw ? 5 : 0) : e.occScore) + (raw ? 1 : -1)));
    if (e.occScore >= 4) e.occluded = true;
    else if (e.occScore <= 0) e.occluded = false;   // 1〜3は直前の状態を維持(境目でのちらつき防止)
  });
}
function updateLabelPositions() {
  const w = holder.clientWidth, h = holder.clientHeight;
  updateOcclusion(false);
  const items = labelEntries.map((e) => {
    const pr = e.pos.clone().project(camera);
    return { e, x: (pr.x * 0.5 + 0.5) * w, y: (-pr.y * 0.5 + 0.5) * h, z: pr.z, behind: pr.z > 1 };
  });
  // 優先度: 選択中 > 被害 > 通常。近いものを優先
  const prio = (it) => {
    const chip = it.e.el.firstElementChild;
    let p = 0;
    if (chip && chip.classList.contains("active")) p += 100;
    if (chip && chip.classList.contains("dmg")) p += 10;
    return p;
  };
  items.sort((a, b) => (prio(b) - prio(a)) || (a.z - b.z));
  const placed = [];
  items.forEach((it) => {
    const el = it.e.el;
    if (it.behind || it.e.occluded || it.x < -60 || it.x > w + 60 || it.y < -40 || it.y > h + 40) {
      el.style.visibility = "hidden"; return;
    }
    if (!it.e.cw) { it.e.cw = el.offsetWidth || 90; it.e.ch = el.offsetHeight || 22; }
    const cw = it.e.cw, ch = it.e.ch;
    let y = it.y - 6; // 少し上げて被害・部材の視覚表現に重ねない
    let ok = false;
    for (let step = 0; step < 5; step++) {
      const rect = { l: it.x - cw / 2 - 3, r: it.x + cw / 2 + 3, t: y - ch, b: y };
      if (!placed.some((r) => r.l < rect.r && rect.l < r.r && r.t < rect.b && rect.t < r.b)) {
        ok = true; placed.push(rect); break;
      }
      y -= ch + 4; // 重なる場合は上に段積み退避
    }
    if (!ok) { el.style.visibility = "hidden"; return; }
    el.style.visibility = "visible";
    el.style.transform = `translate(-50%,-100%) translate(${it.x}px, ${y}px)`;
  });
}

/* ============================================================
   歩行モード(ウォークスルー)
============================================================ */
const walkState = {
  pos: new THREE.Vector3(0, 1.6, 9),
  yaw: 0, pitch: -0.03, eye: 1.6,
  keys: {}, touch: {},
};
const walkUI = document.getElementById("walk-ui");
const walkHud = document.getElementById("walk-hud");
let walkColliders = [];

function buildWalkColliders() {
  walkColliders = [];
  if (!modelGroup) return;
  modelGroup.updateMatrixWorld(true);
  modelGroup.traverse((m) => {
    if (!m.isMesh || !m.userData.member) return;
    const mem = m.userData.member;
    if (mem !== "外壁" && mem !== "外壁(妻壁)" && mem !== "布基礎" && mem !== "布基礎(中通り)") return;
    const g = m.geometry.clone().applyMatrix4(m.matrixWorld);
    g.computeBoundingBox();
    walkColliders.push(g.boundingBox.expandByScalar(0.28));
  });
}
function walkBlocked(x, z, y) {
  if (state.walkPass) return false;
  for (const b of walkColliders) {
    if (x > b.min.x && x < b.max.x && z > b.min.z && z < b.max.z && y > b.min.y && y < b.max.y) return true;
  }
  return false;
}
function setWalk(on) {
  state.walk = on;
  walkUI.classList.toggle("on", on);
  document.getElementById("walk-toggle").classList.toggle("on", on);
  if (on) {
    buildWalkColliders();
    // 建物の南側手前から開始
    walkState.pos.set(0, walkState.eye, 9);
    walkState.yaw = 0; walkState.pitch = -0.03;
  } else if (document.pointerLockElement === dom) {
    document.exitPointerLock();
  }
  updateWalkHud();
  renderPanel();
}
function updateWalkHud() {
  if (!state.walk) return;
  const locked = document.pointerLockElement === dom;
  const floor = walkState.eye > 3.0 ? "2階の目線" : (walkState.eye > 2.2 ? "中間" : "1階の目線");
  walkHud.innerHTML = locked
    ? `歩行中 — W A S D 移動 / Shift 早歩き / Q E 高さ / Esc 解除 ・ ${floor}(視点 ${walkState.eye.toFixed(1)}m)`
    : `画面をクリックすると視点操作が始まります ・ ${floor}(視点 ${walkState.eye.toFixed(1)}m)`;
}
function stepWalk(dt) {
  const k = walkState.keys, t = walkState.touch;
  camera.rotation.set(walkState.pitch, walkState.yaw, 0, "YXZ");
  const fast = k.ShiftLeft || k.ShiftRight;
  const sp = (fast ? 3.4 : 1.5) * dt;
  let f = (k.KeyW || k.ArrowUp || t.f || t.ql || t.qr ? 1 : 0) - (k.KeyS || k.ArrowDown || t.b ? 1 : 0);
  let sd = (k.KeyD || k.ArrowRight || t.r || t.qr ? 1 : 0) - (k.KeyA || k.ArrowLeft || t.l || t.ql ? 1 : 0);
  if (k.KeyQ || t.dn) walkState.eye = Math.max(0.4, walkState.eye - 1.2 * dt);
  if (k.KeyE || t.up) walkState.eye = Math.min(9.0, walkState.eye + 1.2 * dt);
  if (f || sd) {
    const dir = new THREE.Vector3(-Math.sin(walkState.yaw), 0, -Math.cos(walkState.yaw));
    const rgt = new THREE.Vector3(Math.cos(walkState.yaw), 0, -Math.sin(walkState.yaw));
    const nx = walkState.pos.x + (dir.x * f + rgt.x * sd) * sp;
    const nz = walkState.pos.z + (dir.z * f + rgt.z * sd) * sp;
    const y = walkState.eye;
    if (!walkBlocked(nx, walkState.pos.z, y)) walkState.pos.x = Math.max(-30, Math.min(30, nx));
    if (!walkBlocked(walkState.pos.x, nz, y)) walkState.pos.z = Math.max(-30, Math.min(30, nz));
  }
  camera.position.set(walkState.pos.x, walkState.eye, walkState.pos.z);
}

const dom = renderer.domElement;
dom.style.touchAction = "none";
const drag = { on: false, x: 0, y: 0 };
let lastPinch = null;

dom.addEventListener("pointerdown", (e) => {
  if (state.walk) { if (document.pointerLockElement !== dom && dom.requestPointerLock) dom.requestPointerLock(); drag.on = true; drag.x = e.clientX; drag.y = e.clientY; return; }
  drag.on = true; drag.x = e.clientX; drag.y = e.clientY;

window.addEventListener("pointermove", (e) => {
  if (state.walk) {
    if (document.pointerLockElement === dom) {
      walkState.yaw -= e.movementX * 0.0024;
      walkState.pitch = Math.max(-1.3, Math.min(1.3, walkState.pitch - e.movementY * 0.0024));
    } else if (drag.on) {
      walkState.yaw -= (e.clientX - drag.x) * 0.005;
      walkState.pitch = Math.max(-1.3, Math.min(1.3, walkState.pitch - (e.clientY - drag.y) * 0.005));
      drag.x = e.clientX; drag.y = e.clientY;

  orbit.theta -= (e.clientX - drag.x) * 0.006;
  orbit.phi   -= (e.clientY - drag.y) * 0.006;

window.addEventListener("pointerup", () => { drag.on = false; });
dom.addEventListener("wheel", (e) => {

    if (lastPinch !== null) orbit.radius = Math.max(5, Math.min(40, orbit.radius - (d - lastPinch) * 0.03));
    lastPinch = d;
    drag.on = false;
  }
}, { passive: true });
dom.addEventListener("touchend", () => { lastPinch = null; });

dom.addEventListener("click", (e) => {
  if (state.walk && document.pointerLockElement === dom) return;
  const rect = dom.getBoundingClientRect();
  const mouse = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1

window.addEventListener("keydown", (e) => {
