<script type="module">
import * as THREE from "three";
if (THREE.ColorManagement) THREE.ColorManagement.enabled = false;

/* ============================================================
   マテリアル
============================================================ */
function mat(color, o) { return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.55, metalness: 0.2 }, o)); }
const M = {
  tire:   mat(0x23292e, { roughness: 0.9, metalness: 0 }),
  hub:    mat(0xb2bec3, { roughness: 0.4, metalness: 0.4 }),
  glass:  mat(0x35505f, { roughness: 0.2, metalness: 0.1, transparent: true, opacity: 0.75 }),
  steel:  mat(0x8b949c, { metalness: 0.5 }),
  steelD: mat(0x4b5563, { metalness: 0.5 }),
  steelDS: mat(0x8b949c, { metalness: 0.5, side: THREE.DoubleSide }),
  black:  mat(0x1f2937, { roughness: 0.8, metalness: 0 }),
  seat:   mat(0x2d3436, { roughness: 0.85, metalness: 0 }),
  tBody:  mat(0xd35400),
  pBody:  mat(0x2e9e4f),
  cBody:  mat(0xc0392b),
  kBody:  mat(0x2471a3),
  nae:    mat(0x58c76b, { roughness: 0.8, metalness: 0 }),
  white:  mat(0xe8e6df, { roughness: 0.6, metalness: 0 }),
  attRed: mat(0xa93226),
  attRedDS: mat(0xa93226, { side: THREE.DoubleSide }),
  attBlu: mat(0x2471a3),
  attGrn: mat(0x1e8449),
  attYel: mat(0xd4ac0d),
  // トラクタ高精細モデル用
  tPaint:   mat(0xc94000, { roughness: 0.42, metalness: 0 }),
  tPaintDS: mat(0xc94000, { roughness: 0.42, metalness: 0, side: THREE.DoubleSide }),
  gloss:    mat(0x15171a, { roughness: 0.28, metalness: 0.25 }),
  frame:    mat(0x1d2024, { roughness: 0.45, metalness: 0.3 }),
  rubber:   mat(0x1b1e21, { roughness: 0.93, metalness: 0, side: THREE.DoubleSide }),
  rim:      mat(0xeeece6, { roughness: 0.4, metalness: 0.1, side: THREE.DoubleSide }),
  chrome:   mat(0xc9cfd4, { roughness: 0.18, metalness: 0.9 }),
  lens:     mat(0xe4edf2, { roughness: 0.06, metalness: 0.6, emissive: 0x3a444c }),
  amber:    mat(0xff8a1c, { roughness: 0.25, metalness: 0, emissive: 0xb34700, emissiveIntensity: 0.4 }),
  tail:     mat(0xc2262e, { roughness: 0.25, metalness: 0, emissive: 0x5a0a0a }),
  cabGlass: mat(0x2a4858, { roughness: 0.04, metalness: 0.35, transparent: true, opacity: 0.3, side: THREE.DoubleSide, depthWrite: false }),
  cRed:     mat(0x8e0f1e, { roughness: 0.44, metalness: 0.03 }),
  cRedDS:   mat(0x8e0f1e, { roughness: 0.44, metalness: 0.03, side: THREE.DoubleSide }),
  paintW:   mat(0xeceae6, { roughness: 0.35, metalness: 0.05 }),
  imRed:    mat(0xbe2a1c, { roughness: 0.38, metalness: 0.05 }),                 // 作業機の赤
  paintWDS: mat(0xeceae6, { roughness: 0.35, metalness: 0.05, side: THREE.DoubleSide }),
  beigeDS:  mat(0xd6c49c, { roughness: 0.5, metalness: 0.02, side: THREE.DoubleSide }),   // 樹脂ホッパー
  plastic:  mat(0xcdc4b6, { roughness: 0.18, metalness: 0, transparent: true, opacity: 0.58 }), // 半透明の樹脂ホッパー
  mint:     mat(0x3fb3a0, { roughness: 0.42, metalness: 0.05 }),                  // ライムソワーの塗装色
  inox:     mat(0xb9c0c6, { roughness: 0.32, metalness: 0.55 }),                  // ステンレス
};
const hlMat = mat(0xffb020, { emissive: 0xff7a00, emissiveIntensity: 0.5, side: THREE.DoubleSide });

/* ============================================================
   ヘルパー
============================================================ */
const v = (x, y, z) => new THREE.Vector3(x, y, z);
function tag(mesh, member) { mesh.userData.member = member; mesh.userData.baseMat = mesh.material; return mesh; }
function box(w, h, d, m, x, y, z, member) {
  const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  o.position.set(x, y, z);
  return tag(o, member);
}
function cylZ(r, len, m, x, y, z, member) {
  const o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 18), m);
  o.rotation.x = Math.PI / 2; o.position.set(x, y, z);
  return tag(o, member);
}
function cylY(r1, r2, len, m, x, y, z, member) {
  const o = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, len, 14), m);
  o.position.set(x, y, z);
  return tag(o, member);
}
function beam(p1, p2, r, m, member) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, dir.length(), 8), m);
  o.position.copy(p1).addScaledVector(dir, 0.5);
  o.quaternion.setFromUnitVectors(v(0, 1, 0), dir.clone().normalize());
  return tag(o, member);
}
function wheel(g, r, w, x, y, z, member) {
  g.add(cylZ(r, w, M.tire, x, y, z, member));
  g.add(cylZ(r * 0.45, w + 0.04, M.hub, x, y, z, member));
}
/* 円筒シェル(カバー・撥土板などの曲面) 軸=Z */
function shell(r, len, thetaStart, arc, m, x, y, z, member) {
  const o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 14, 1, true, thetaStart, arc), m);
  o.rotation.x = Math.PI / 2; o.position.set(x, y, z);
  return tag(o, member);
}

/* ============================================================
   高精細モデル用ヘルパー(角丸ボックス・押し出し断面・ラグ付き車輪など)
============================================================ */
function mergeGeos(list) {
  const parts = list.map((gg) => (gg.index ? gg.toNonIndexed() : gg));
  let n = 0;
  parts.forEach((p) => { n += p.attributes.position.count; });
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3);
  let o = 0;
  parts.forEach((p) => {
    pos.set(p.attributes.position.array, o * 3);
    nor.set(p.attributes.normal.array, o * 3);
    o += p.attributes.position.count;
  });
  const out = new THREE.BufferGeometry();
  out.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  out.setAttribute("normal", new THREE.BufferAttribute(nor, 3));
  return out;
}
/* 押し出し形状はフラット法線になるため、角度しきい値内の法線を平均して滑らかにする */
function smoothNormals(geo, deg = 50) {
  const p = geo.attributes.position, nr = geo.attributes.normal, cmin = Math.cos(deg * Math.PI / 180);
  const groups = new Map();
  for (let i = 0; i < p.count; i++) {
    const k = Math.round(p.getX(i) * 1e4) + "," + Math.round(p.getY(i) * 1e4) + "," + Math.round(p.getZ(i) * 1e4);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(i);
  }
  const out = new Float32Array(nr.array.length);
  groups.forEach((idx) => {
    idx.forEach((i) => {
      const ax = nr.getX(i), ay = nr.getY(i), az = nr.getZ(i);
      let sx = 0, sy = 0, sz = 0;
      idx.forEach((j) => {
        const bx = nr.getX(j), by = nr.getY(j), bz = nr.getZ(j);
        if (ax * bx + ay * by + az * bz >= cmin) { sx += bx; sy += by; sz += bz; }
      });
      const l = Math.hypot(sx, sy, sz) || 1;
      out[i * 3] = sx / l; out[i * 3 + 1] = sy / l; out[i * 3 + 2] = sz / l;
    });
  });
  nr.array.set(out); nr.needsUpdate = true;
  return geo;
}
function roundRectShape(w, h, rc) {
  rc = Math.max(0.001, Math.min(rc, w / 2 - 0.001, h / 2 - 0.001));
  const s = new THREE.Shape(), x0 = -w / 2, y0 = -h / 2;
  s.moveTo(x0 + rc, y0);
  s.lineTo(x0 + w - rc, y0); s.absarc(x0 + w - rc, y0 + rc, rc, -Math.PI / 2, 0);
  s.lineTo(x0 + w, y0 + h - rc); s.absarc(x0 + w - rc, y0 + h - rc, rc, 0, Math.PI / 2);
  s.lineTo(x0 + rc, y0 + h); s.absarc(x0 + rc, y0 + h - rc, rc, Math.PI / 2, Math.PI);
  s.lineTo(x0, y0 + rc); s.absarc(x0 + rc, y0 + rc, rc, Math.PI, Math.PI * 1.5);
  return s;
}
/* 角丸ボックス: w×h(XY)×d(Z)、b=エッジの丸み、rc=XY方向の角の丸み */
function rboxGeo(w, h, d, b, rc) {
  b = Math.max(0.002, Math.min(b, w / 2 - 0.002, h / 2 - 0.002, d / 2 - 0.002));
  const g = new THREE.ExtrudeGeometry(roundRectShape(w - 2 * b, h - 2 * b, (rc ?? b) - b),
    { depth: d - 2 * b, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 3, curveSegments: 5 });
  g.translate(0, 0, -(d - 2 * b) / 2);
  return smoothNormals(g);
}
function rbox(w, h, d, b, m, x, y, z, member) {
  const o = new THREE.Mesh(rboxGeo(w, h, d, b), m);
  o.position.set(x, y, z);
  return tag(o, member);
}
/* 側面断面(XY)をZ方向に押し出し(Z中心) */
function profileGeo(pts, depth, b) {
  const s = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: b > 0, bevelThickness: b, bevelSize: b, bevelSegments: 4, curveSegments: 8 });
  g.translate(0, 0, -depth / 2);
  return b > 0 ? smoothNormals(g) : g;
}
/* X位置に応じてZ幅を絞る(ボンネット先端のすぼまり)。法線も変形に合わせて補正 */
function taperZ(geo, fn) {
  const p = geo.attributes.position, nr = geo.attributes.normal, e = 1e-3;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), s = fn(x), ds = (fn(x + e) - fn(x - e)) / (2 * e);
    p.setZ(i, z * s);
    const nx = nr.getX(i) - (z * ds / s) * nr.getZ(i), ny = nr.getY(i), nz = nr.getZ(i) / s;
    const l = Math.hypot(nx, ny, nz) || 1;
    nr.setXYZ(i, nx / l, ny / l, nz / l);
  }
  return geo;
}
function cylX(r, len, m, x, y, z, member) {
  const o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 20), m);
  o.rotation.z = Math.PI / 2; o.position.set(x, y, z);
  return tag(o, member);
}
/* 2点間の角柱(ピラー・フレーム) */
function bar(p1, p2, w, d, m, member) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const o = new THREE.Mesh(new THREE.BoxGeometry(w, dir.length(), d), m);
  o.position.copy(p1).addScaledVector(dir, 0.5);
  o.quaternion.setFromUnitVectors(v(0, 1, 0), dir.clone().normalize());
  return tag(o, member);
}
/* 4点の面(ガラス) */
function quad(a, b, c, d, m, member) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute([...a, ...b, ...c, ...a, ...c, ...d], 3));
  geo.computeVertexNormals();
  return tag(new THREE.Mesh(geo, m), member);
}
/* ラグ付きタイヤ+白色ディッシュホイール(車軸=Z、外側の面は z の符号側) */
function lugWheel(g, o) {
  const { r, w, rimR, member } = o;
  const rimM = o.rimMat || M.rim, hubM = o.hubMat || M.hub;
  const hw = w / 2, side = o.z < 0 ? -1 : 1;
  const put = (geo, m) => {
    const ms = new THREE.Mesh(geo, m);
    ms.position.set(o.x, o.y, o.z);
    if (side < 0) ms.scale.z = -1;              // 鏡像にしてもラグの向き(進行方向)は左右で揃う
    g.add(tag(ms, member));
  };
  // タイヤ本体: 断面を回転体で作成
  const prof = [[rimR, -hw * 0.82], [r * 0.84, -hw], [r * 0.95, -hw * 0.97], [r - 0.012, -hw * 0.82], [r, -hw * 0.55],
                [r, hw * 0.55], [r - 0.012, hw * 0.82], [r * 0.95, hw * 0.97], [r * 0.84, hw], [rimR, hw * 0.82]]
    .map(([a, b]) => new THREE.Vector2(a, b));
  const tire = new THREE.LatheGeometry(prof, 56); tire.rotateX(Math.PI / 2);
  const geos = [tire];
  // ハの字ラグ(左右で半ピッチずらす)
  const n = o.lugs, step = (Math.PI * 2) / n, L = hw * 1.02, lh = r * 0.075, lt = r * 0.08;
  for (let i = 0; i < n; i++) {
    [1, -1].forEach((sg) => {
      const b = new THREE.BoxGeometry(lt, lh, L);
      b.rotateY(sg * 0.6);
      b.translate(0, r + lh * 0.25, sg * hw * 0.47);
      b.rotateZ(i * step + (sg > 0 ? 0 : step / 2));
      geos.push(b);
    });
  }
  put(mergeGeos(geos), M.rubber);
  // ホイール: リム胴+ディッシュ+リム縁
  const barrel = new THREE.CylinderGeometry(rimR, rimR, w * 0.84, 48, 1, true); barrel.rotateX(Math.PI / 2);
  const disc = new THREE.LatheGeometry([[rimR * 0.99, -hw * 0.05], [rimR * 0.82, hw * 0.08], [rimR * 0.5, hw * 0.3], [r * 0.17, hw * 0.34], [0.001, hw * 0.34]]
    .map(([a, b]) => new THREE.Vector2(a, b)), 48); disc.rotateX(Math.PI / 2);
  const lipA = new THREE.TorusGeometry(rimR + 0.01, 0.016, 6, 48); lipA.translate(0, 0, hw * 0.84);
  const lipB = new THREE.TorusGeometry(rimR + 0.01, 0.016, 6, 48); lipB.translate(0, 0, -hw * 0.84);
  put(mergeGeos([barrel, disc, lipA, lipB]), rimM);
  // ハブ・ナット・センターキャップ
  const hubR = r * 0.14;
  const hub = new THREE.CylinderGeometry(hubR, hubR, hw * 0.3, 24); hub.rotateX(Math.PI / 2); hub.translate(0, 0, hw * 0.48);
  const cap = new THREE.CylinderGeometry(hubR * 0.5, hubR * 0.6, hw * 0.2, 16); cap.rotateX(Math.PI / 2); cap.translate(0, 0, hw * 0.68);
  const hubGeos = [hub, cap];
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2, rr = r * 0.2;
    const nut = new THREE.CylinderGeometry(0.018, 0.018, 0.05, 6); nut.rotateX(Math.PI / 2);
    nut.translate(rr * Math.cos(a), rr * Math.sin(a), hw * 0.38);
    hubGeos.push(nut);
  }
  put(mergeGeos(hubGeos), hubM);
}
/* ゴムクローラ(履帯・ラグ・駆動輪・遊動輪・転輪・トラックフレーム) */
function crawlerTrack(g, o) {
  const { x0, x1, r, w, y, z, member } = o;
  const capShape = (rr) => {
    const sh = new THREE.Shape();
    sh.absarc(x1, y, rr, -Math.PI / 2, Math.PI / 2, false);
    sh.absarc(x0, y, rr, Math.PI / 2, Math.PI * 1.5, false);
    sh.closePath();
    return sh;
  };
  const belt = capShape(r);
  belt.holes.push(new THREE.Path(capShape(r - 0.07).getPoints(72)));
  const bg = new THREE.ExtrudeGeometry(belt, { depth: w, bevelEnabled: false, curveSegments: 20 });
  bg.translate(0, 0, z - w / 2);
  g.add(tag(new THREE.Mesh(bg, M.rubber), member));
  const lugs = [];
  const pushLug = (lx, ly, ang) => {
    const b = new THREE.BoxGeometry(0.05, 0.05, w + 0.06);
    b.rotateZ(ang); b.translate(lx, ly, z); lugs.push(b);
  };
  for (let lx = x0; lx <= x1 + 1e-6; lx += 0.15) { pushLug(lx, y - r - 0.02, 0); pushLug(lx, y + r + 0.02, 0); }
  for (let a = -Math.PI / 2; a <= Math.PI / 2 + 1e-6; a += 0.31) {
    pushLug(x1 + (r + 0.02) * Math.cos(a), y + (r + 0.02) * Math.sin(a), a);
    pushLug(x0 - (r + 0.02) * Math.cos(a), y + (r + 0.02) * Math.sin(a), -a);
  }
  g.add(tag(new THREE.Mesh(mergeGeos(lugs), M.rubber), member));
  g.add(cylZ(r * 0.73, w * 0.4, M.steelD, x1, y, z, member));                       // 駆動輪
  for (let a = 0; a < 10; a++) {
    const th = box(0.07, 0.1, w * 0.4, M.steelD, x1 + r * 0.83 * Math.cos(a * 0.628), y + r * 0.83 * Math.sin(a * 0.628), z, member);
    th.rotation.z = a * 0.628; g.add(th);
  }
  g.add(cylZ(r * 0.67, w * 0.4, M.steelD, x0, y, z, member));                       // 遊動輪
  for (let lx = x0 + 0.35; lx <= x1 - 0.25; lx += 0.32) g.add(cylZ(0.095, w * 0.45, M.gloss, lx, y - r + 0.1, z, member)); // 転輪
  g.add(rbox((x1 - x0) * 0.95, 0.14, 0.18, 0.04, M.steelD, (x0 + x1) / 2, y + 0.08, z, member));
}

/* ============================================================
   トラクタ(前方=+X)。3点リンク先端座標:
   下部リンク端 (-2.15, 0.52, ±0.35) / トップリンク端 (-2.10, 0.98, 0)
   PTO軸端 (-1.72, 0.72, 0) / ドローバー先端 (-1.98, 0.42, 0)
============================================================ */
const HITCH = { lowX: -2.15, lowY: 0.52, lowZ: 0.35, topX: -2.10, topY: 0.98 };

function hitchMast(g, AM) {
  // 作業機側マスト: 下部横梁+三角マスト+ヒッチピン(リンク端と同座標で噛み合う)
  g.add(box(0.1, 0.14, 0.86, M.steelD, HITCH.lowX - 0.03, HITCH.lowY, 0, AM));
  g.add(beam(v(HITCH.lowX - 0.03, HITCH.lowY + 0.04, 0.3), v(HITCH.topX - 0.03, HITCH.topY, 0), 0.03, M.steelD, AM));
  g.add(beam(v(HITCH.lowX - 0.03, HITCH.lowY + 0.04, -0.3), v(HITCH.topX - 0.03, HITCH.topY, 0), 0.03, M.steelD, AM));
  [HITCH.lowZ, -HITCH.lowZ].forEach((z) => g.add(cylZ(0.038, 0.14, M.hub, HITCH.lowX, HITCH.lowY, z, AM)));
  g.add(cylZ(0.032, 0.12, M.hub, HITCH.topX, HITCH.topY, 0, AM));
  // 後方フレームレール(マストと装置本体をつなぐ)
  [[0.3], [-0.3]].forEach(([z]) => {
    g.add(beam(v(HITCH.lowX - 0.06, HITCH.lowY, z), v(HITCH.lowX - 0.5, HITCH.lowY + 0.05, z), 0.032, M.steelD, AM));
  });
}
function ptoShaft(g, AM, to) {
  g.add(beam(v(-1.72, 0.72, 0), to, 0.034, M.black, AM));
  g.add(beam(v(-1.72, 0.72, 0), v(-1.72 + (to.x + 1.72) * 0.45, 0.72 + (to.y - 0.72) * 0.45, to.z * 0.45), 0.05, M.steelD, AM)); // シャフトカバー
}

const ATT = {
  rotary:      { label: "ロータリー",        camR: 8,   use: "爪を回転させて土を耕し、細かく砕きます。田畑の耕うんに使う最も基本的な作業機です。" },
  harrow:      { label: "ハロー(代かき)",    camR: 8.5, use: "田植え前に水を張った田で土をかき混ぜて平らにならします(代かき)。苗を植えやすくし、水もれも防ぎます。" },
  plow:        { label: "プラウ",            camR: 8,   use: "土を深く掘り起こして反転させ、稲わらや雑草などを土の中にすき込みます(反転耕)。" },
  broadcaster: { label: "ブロードキャスター", camR: 8,   use: "ホッパーの肥料や種子を、回転する円盤(スピンナー)で広い範囲にまき散らします。" },
  fertseed:    { label: "施肥播種機",        camR: 8.5, use: "種をまくと同時に、肥料を種の横に入れます。播種と施肥を1回の作業で行えます。" },
  seeder:      { label: "播種機",            camR: 8.5, use: "麦・大豆・そばなどの種を、列ごとに一定の間隔と深さでまきます。" },
  rotaryseeder:{ label: "ロータリーシーダー", camR: 8,   use: "ロータリーで耕しながら同時に種をまき、後部のローラで押さえます(耕うん同時播種)。" },
  lime:        { label: "ライムソワー",      camR: 8.5, use: "石灰や粒状の肥料を、横長のホッパーから帯状に均一に落としてまきます。土壌改良の石灰散布などに使います。" },
  manure:      { label: "マニュアスプレッダー", camR: 10, use: "荷台に積んだ堆肥を、後部のビーターで細かく砕きながら田畑に散布します。トラクタでけん引して使います。" },
  trencher:    { label: "溝堀機",            camR: 8,   use: "田畑に排水用の溝を掘り、掘った土を左右に飛ばします。水はけの改善に使います。" },
  azenuri:     { label: "あぜ塗機",          camR: 8,   use: "田の畦(あぜ)に土を塗り固めて形を整え、水もれを防ぎます。畦の補修を機械化します。" },
  chuko:       { label: "中耕ロータ",        camR: 8.5, use: "畑の作物の列と列の間を浅く耕し、除草・土寄せや土の通気改善を行います。" },
  stubble:     { label: "スタブルカルチ",    camR: 8.5, use: "収穫後の刈り株が残る圃場を爪で砕土し、残さを土と混ぜます。プラウより速く広く作業できます。" },
  subsoiler:   { label: "サブソイラー",      camR: 8,   use: "地中深くの硬い土の層を爪で切り裂き、排水性と通気性を改善します(心土破砕)。" },
  sprayer:     { label: "ブームスプレーヤ",  camR: 10,  use: "タンクの農薬や液肥を、左右に広げたブームのノズルから広い範囲に均一に散布します。" },
};
const attMemberName = (k) => ATT[k].label + "(附属装置)";

function buildAttachment(g, key) {
  const AM = attMemberName(key);
  if (key !== "manure") hitchMast(g, AM);

  if (key === "rotary") {
    const W = 2.06, HZ = W / 2, CX = -2.62, CY = 0.32;   // 作業幅・耕うん軸の中心
    ptoShaft(g, AM, v(-2.36, 0.92, 0));
    // センターギヤボックス・入力軸
    g.add(rbox(0.3, 0.38, 0.3, 0.04, M.steelD, -2.44, 0.94, 0, AM));
    g.add(cylX(0.05, 0.16, M.black, -2.31, 0.92, 0, AM));
    g.add(rbox(0.16, 0.16, W - 0.3, 0.03, M.tPaint, -2.5, 0.95, 0, AM));         // メインフレーム(横梁)
    [0.32, -0.32].forEach((z) => {                                                // 吊りアーム
      g.add(beam(v(-2.65, 0.57, z), v(-2.52, 0.9, z), 0.034, M.tPaint, AM));
      g.add(beam(v(-2.42, 0.9, z * 0.6), v(-2.56, 0.96, z), 0.028, M.steelD, AM));
    });
    // 主カバー(前方が丸い箱形の本体)
    const coverGeo = profileGeo([[-2.18, 0.34], [-2.2, 0.76], [-2.3, 0.94], [-2.5, 1.02], [-2.95, 1.03], [-3.08, 0.98], [-3.12, 0.56], [-3.1, 0.3], [-2.9, 0.26], [-2.4, 0.26]], W - 0.06, 0.03);
    g.add(tag(new THREE.Mesh(coverGeo, M.tPaint), AM));
    for (let z = -0.7; z <= 0.71; z += 0.46) {                                     // 天面の補強リブ
      g.add(rbox(0.5, 0.05, 0.06, 0.02, M.tPaint, -2.7, 1.05, z, AM));
    }
    [1, -1].forEach((s) => {                                                       // サイドプレート
      const sp = profileGeo([[-2.16, 0.08], [-3.1, 0.08], [-3.16, 0.62], [-2.18, 0.62]], 0.035, 0);
      sp.translate(0, 0, s * (HZ - 0.01));
      g.add(tag(new THREE.Mesh(sp, M.tPaint), AM));
    });
    // サイドドライブケース(片側)
    const dc = profileGeo([[-2.4, 0.98], [-2.78, 0.98], [-2.82, 0.4], [-2.6, 0.22], [-2.42, 0.34]], 0.14, 0.02);
    dc.translate(0, 0, HZ + 0.08);
    g.add(tag(new THREE.Mesh(dc, M.tPaint), AM));
    g.add(cylZ(0.09, 0.2, M.steelD, CX, CY, HZ + 0.04, AM));                       // 出力軸ハウジング
    // 耕うん軸・なた爪
    g.add(cylZ(0.07, W - 0.3, M.steelD, CX, CY, 0, AM));
    const blades = [];
    const NB = 12;
    for (let i = 0; i < NB; i++) {
      const z = -HZ + 0.22 + i * ((W - 0.44) / (NB - 1));
      const fl = new THREE.CylinderGeometry(0.1, 0.1, 0.03, 16); fl.rotateX(Math.PI / 2); fl.translate(CX, CY, z);
      blades.push(fl);
      for (let k = 0; k < 4; k++) {
        const a = i * 1.15 + k * (Math.PI / 2), sg = (k % 2) ? 1 : -1;
        const b1 = new THREE.BoxGeometry(0.035, 0.19, 0.05);
        b1.translate(0, 0.17, 0); b1.rotateZ(a); b1.translate(CX, CY, z);
        const b2 = new THREE.BoxGeometry(0.035, 0.07, 0.11);      // 先端の曲がり
        b2.translate(0, 0.26, sg * 0.045); b2.rotateZ(a); b2.translate(CX, CY, z);
        blades.push(b1, b2);
      }
    }
    g.add(tag(new THREE.Mesh(mergeGeos(blades), M.steel), AM));
    // 後部整地板(均平板)とヒンジ・調整ロッド
    g.add(cylZ(0.035, W - 0.08, M.steelD, -3.08, 0.6, 0, AM));                     // ヒンジ軸
    const ap = rbox(0.56, 0.05, W - 0.08, 0.02, M.tPaint, -3.3, 0.44, 0, AM); ap.rotation.z = -0.62; g.add(ap);
    [0.5, -0.5].forEach((z) => {
      g.add(beam(v(-2.92, 1.06, z), v(-3.3, 0.5, z), 0.022, M.steelD, AM));        // 調整ロッド
      g.add(cylY(0.045, 0.045, 0.16, M.steelD, -3.07, 0.82, z, AM));               // スプリング部
    });
    g.add(cylZ(0.035, W * 0.78, M.steelD, -2.88, 1.1, 0, AM));                     // 上部の連結ロッド
    for (let z = -0.6; z <= 0.61; z += 0.3) g.add(cylZ(0.055, 0.06, M.steelD, -2.88, 1.1, z, AM));
    for (let z = -0.66; z <= 0.67; z += 0.44) {                                     // 後部のフック
      g.add(bar(v(-3.0, 1.02, z), v(-3.08, 0.82, z), 0.04, 0.03, M.gloss, AM));
    }
    // ゲージ輪(上げた状態)
    const gz = HZ - 0.3;
    g.add(bar(v(-2.94, 1.0, gz), v(-3.2, 1.24, gz), 0.055, 0.05, M.tPaint, AM));
    g.add(cylZ(0.14, 0.08, M.tire, -3.28, 1.22, gz, AM));
    g.add(cylZ(0.05, 0.1, M.steelD, -3.28, 1.22, gz, AM));
  }

  if (key === "harrow") {
    const W = 2.9, HZ = W / 2, RX = -2.58, RY = 0.26;   // 作業幅・耕うん軸の中心
    ptoShaft(g, AM, v(-2.3, 0.78, 0));
    g.add(rbox(0.28, 0.36, 0.3, 0.04, M.steelD, -2.38, 0.8, 0, AM));              // センターギヤボックス
    g.add(cylX(0.05, 0.16, M.black, -2.25, 0.78, 0, AM));
    [0.3, -0.3].forEach((z) => g.add(beam(v(-2.65, 0.57, z), v(-2.45, 0.76, z), 0.032, M.imRed, AM))); // 吊りアーム
    // 本体カバー(横長)+上部の丸パイプ
    const cov = profileGeo([[-2.26, 0.36], [-2.28, 0.6], [-2.38, 0.76], [-2.74, 0.78], [-2.88, 0.68], [-2.92, 0.42], [-2.86, 0.3], [-2.4, 0.3]], W - 0.1, 0.03);
    g.add(tag(new THREE.Mesh(cov, M.imRed), AM));
    g.add(cylZ(0.075, W - 0.2, M.imRed, -2.42, 0.88, 0, AM));
    [1, -1].forEach((s) => {
      g.add(cylY(0.08, 0.08, 0.12, M.imRed, -2.42, 0.94, s * (HZ - 0.2), AM));    // パイプ端の立ち上がり
      g.add(rbox(0.62, 0.52, 0.045, 0.02, M.imRed, -2.58, 0.52, s * (HZ + 0.02), AM)); // 端板
      // 折りたたみウイングのヒンジ
      g.add(rbox(0.5, 0.22, 0.05, 0.02, M.imRed, -2.56, 0.7, s * 1.02, AM));
      [-2.36, -2.76].forEach((x) => g.add(cylZ(0.035, 0.12, M.steelD, x, 0.7, s * 1.02, AM)));
      // 尾輪(キャスター)
      g.add(bar(v(-2.88, 0.46, s * 1.38), v(-3.06, 0.2, s * 1.38), 0.05, 0.05, M.imRed, AM));
      g.add(cylZ(0.085, 0.055, M.tire, -3.08, 0.11, s * 1.38, AM));
      g.add(cylZ(0.03, 0.07, M.steelD, -3.08, 0.11, s * 1.38, AM));
    });
    // 前面の爪取付ボルト列
    const bolts = [];
    for (let z = -HZ + 0.18; z <= HZ - 0.17; z += 0.13) {
      const b = new THREE.CylinderGeometry(0.03, 0.03, 0.04, 10); b.rotateZ(Math.PI / 2); b.translate(-2.25, 0.45, z);
      bolts.push(b);
    }
    g.add(tag(new THREE.Mesh(mergeGeos(bolts), M.gloss), AM));
    // 耕うん軸・代かき爪
    g.add(cylZ(0.06, W - 0.34, M.steelD, RX, RY, 0, AM));
    const tines = [];
    const NF = 18;
    for (let i = 0; i < NF; i++) {
      const z = -HZ + 0.26 + i * ((W - 0.52) / (NF - 1));
      const fl = new THREE.CylinderGeometry(0.085, 0.085, 0.025, 14); fl.rotateX(Math.PI / 2); fl.translate(RX, RY, z);
      tines.push(fl);
      for (let k = 0; k < 4; k++) {
        const a = i * 1.25 + k * (Math.PI / 2), sg = (k % 2) ? 1 : -1;
        const t1 = new THREE.BoxGeometry(0.03, 0.15, 0.04);
        t1.translate(0, 0.14, 0); t1.rotateZ(a); t1.translate(RX, RY, z);
        const t2 = new THREE.BoxGeometry(0.03, 0.06, 0.09);
        t2.translate(0, 0.2, sg * 0.035); t2.rotateZ(a); t2.translate(RX, RY, z);
        tines.push(t1, t2);
      }
    }
    g.add(tag(new THREE.Mesh(mergeGeos(tines), M.steel), AM));
    // 後部整地板(均平板)+のこ歯状の後端
    g.add(cylZ(0.03, W - 0.1, M.steelD, -2.88, 0.46, 0, AM));                     // ヒンジ軸
    const lv = rbox(0.52, 0.045, W, 0.02, M.gloss, -3.06, 0.3, 0, AM); lv.rotation.z = 0.52; g.add(lv);
    const teeth = [];
    for (let z = -HZ + 0.03; z <= HZ - 0.02; z += 0.062) {
      const t = new THREE.BoxGeometry(0.06, 0.035, 0.045); t.rotateY(Math.PI / 4); t.translate(-3.28, 0.17, z);
      teeth.push(t);
    }
    g.add(tag(new THREE.Mesh(mergeGeos(teeth), M.gloss), AM));
    [0.62, -0.62].forEach((z) => {                                                 // 調整ロッド+スプリング
      g.add(beam(v(-2.72, 0.82, z), v(-3.1, 0.34, z), 0.02, M.steelD, AM));
      g.add(cylY(0.04, 0.04, 0.14, M.steelD, -2.9, 0.6, z, AM));
    });
    g.add(rbox(0.26, 0.04, W, 0.01, M.gloss, -2.18, 0.3, 0, AM));                 // 前部のならし板
  }

  if (key === "plow") {
    // リバーシブル(双用)プラウ: 斜めのメインビームに複数のボトム、上側に反転用のボトム
    const YAW = -0.26, BY = 0.86;                                   // ビームの振れ角・高さ
    const dir = v(-Math.cos(YAW), 0, Math.sin(YAW));
    const p0 = v(-2.62, BY, 0.2), p1 = p0.clone().addScaledVector(dir, 2.75);
    // ヘッドストック(反転機構)
    g.add(rbox(0.3, 0.62, 0.36, 0.04, M.paintW, -2.44, 0.88, 0.14, AM));
    g.add(cylX(0.075, 0.42, M.steelD, -2.62, 0.86, 0.18, AM));                    // 反転軸
    g.add(beam(v(-2.3, 1.18, 0.12), v(-2.78, 1.0, 0.3), 0.055, M.steelD, AM));    // 反転シリンダ
    g.add(beam(v(-2.5, 1.09, 0.19), v(-2.86, 0.95, 0.33), 0.03, M.chrome, AM));   // シリンダロッド
    g.add(bar(p0, p1, 0.16, 0.18, M.paintW, AM));                                 // メインビーム
    g.add(bar(p0.clone().addScaledVector(dir, 0.1).setY(BY + 0.2), p1.clone().addScaledVector(dir, -0.5).setY(BY + 0.2), 0.08, 0.1, M.paintW, AM)); // 上部補強
    // ボトム(下向き4連+反転用の上向き4連)
    const makeBody = (t, up) => {
      const grp = new THREE.Group();
      grp.position.copy(p0.clone().addScaledVector(dir, t));
      grp.rotation.set(0, YAW, 0);
      if (up) grp.rotateX(Math.PI);
      const part = (o) => grp.add(o);
      part(bar(v(0.02, -0.02, 0), v(0.06, -0.42, 0.02), 0.1, 0.08, M.paintW, AM));   // 支柱(上)
      part(bar(v(0.06, -0.42, 0.02), v(0.2, -0.64, 0.03), 0.09, 0.08, M.paintW, AM)); // 支柱(下)
      part(rbox(0.34, 0.12, 0.11, 0.02, M.steelD, 0.24, -0.68, 0.01, AM));            // フロッグ
      const mb = shell(0.3, 0.52, 2.15, 1.75, M.paintWDS, 0.03, -0.46, 0.15, AM);     // 撥土板(曲面)
      mb.rotation.set(0, 0.9, -0.3); part(mb);
      const sh = box(0.36, 0.055, 0.18, M.steelD, 0.32, -0.75, -0.02, AM);            // シェア(先端)
      sh.rotation.set(0, 0.32, -0.08); part(sh);
      part(box(0.42, 0.17, 0.03, M.steelD, 0.04, -0.72, -0.11, AM));                  // ランドサイド
      part(rbox(0.1, 0.16, 0.1, 0.02, M.steelD, 0.02, -0.06, 0, AM));                 // ビームへの取付金具
      g.add(grp);
    };
    [0.45, 1.08, 1.71, 2.34].forEach((t) => { makeBody(t, false); makeBody(t, true); });
    // ゲージ輪(デプスホイール)
    const gp = p0.clone().addScaledVector(dir, 1.45);
    g.add(beam(gp, v(gp.x - 0.05, 0.3, gp.z + 0.5), 0.04, M.paintW, AM));
    g.add(cylZ(0.19, 0.11, M.tire, gp.x - 0.05, 0.2, gp.z + 0.55, AM));
    g.add(cylZ(0.07, 0.13, M.hub, gp.x - 0.05, 0.2, gp.z + 0.55, AM));
    // 後端の延長フレーム
    g.add(bar(p1, p1.clone().addScaledVector(dir, 0.45).setY(BY + 0.05), 0.1, 0.12, M.gloss, AM));
  }

  if (key === "broadcaster") {
    const BX = -2.5;
    ptoShaft(g, AM, v(-2.34, 0.62, 0));
    // フレーム
    g.add(rbox(0.5, 0.12, 0.72, 0.03, M.imRed, BX, 0.62, 0, AM));                  // ベースフレーム
    g.add(rbox(0.14, 0.5, 0.14, 0.03, M.imRed, -2.3, 0.82, 0, AM));                // 縦フレーム
    [1, -1].forEach((s) => {
      g.add(beam(v(-2.18, 0.55, s * 0.3), v(BX + 0.1, 0.62, s * 0.3), 0.035, M.imRed, AM));
      g.add(beam(v(-2.3, 1.02, 0), v(BX + 0.06, 1.3, s * 0.42), 0.03, M.imRed, AM));  // 上部ステー

    for (let z = -0.5; z <= 0.51; z += 0.25) pushNoz(z);
    [1, -1].forEach((s) => {
      g.add(rbox(0.1, 0.22, 0.12, 0.02, M.imRed, BX, BY, s * 0.7, AM));            // ヒンジ

      g.add(cylZ(0.022, 2.6, M.inox, BX, BY - 0.08, s * 2.0, AM));                 // 下弦材
      for (let i = 0; i < 9; i++) {
        const z0 = 0.72 + i * 0.29, z1 = z0 + 0.29;
        g.add(beam(v(BX, BY + (i % 2 ? 0.08 : -0.08), s * z0), v(BX, BY + (i % 2 ? -0.08 : 0.08), s * z1), 0.012, M.inox, AM)); // 斜材
      }

      g.add(beam(v(BX, 1.2, s * 0.36), v(BX, BY + 0.1, s * 2.4), 0.009, M.gloss, AM)); // 吊りワイヤ
      for (let z = 0.8; z <= 3.25; z += 0.3) pushNoz(s * z);

    g.add(tag(new THREE.Mesh(mergeGeos(nozzles), M.gloss), AM));                    // ノズル
  }
}

  sw.quaternion.setFromUnitVectors(v(0, 0, 1), v(-0.42, 0.91, 0).normalize());
  sw.position.set(-0.57, 1.75, 0);
  g.add(tag(sw, CAB));
  // 3点リンク・PTO・ドローバー(先端座標はHITCH定数と一致)
  [[HITCH.lowZ], [-HITCH.lowZ]].forEach(([z]) => {
    g.add(beam(v(-1.55, 0.55, z), v(HITCH.lowX, HITCH.lowY, z), 0.035, M.steel, HIT));
    g.add(beam(v(-1.35, 1.15, z * 0.8), v(-1.85, 0.62, z), 0.022, M.steel, HIT));  // リフトロッド
  });
  g.add(beam(v(-1.55, 1.05, 0), v(HITCH.topX, HITCH.topY, 0), 0.03, M.steel, HIT));
  g.add(cylZ(0.05, 0.14, M.steelD, -1.7, 0.72, 0, HIT));
  const ptoStub = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.14, 10), M.black);
  ptoStub.rotation.z = Math.PI / 2; ptoStub.position.set(-1.72, 0.72, 0);
  g.add(tag(ptoStub, HIT));
  g.add(box(0.5, 0.06, 0.14, M.steelD, -1.78, 0.42, 0, HIT));                      // ドローバー
  g.add(rbox(0.16, 0.03, 0.26, 0.01, M.steel, -1.7, 0.82, 0, HIT));                // PTOシールド

  if (att !== "none") buildAttachment(g, att);

  const attCaveat = "附属装置(作業機)の加入区分は組合により異なります。本体と作業機(ロータリー・ハロー等)を別々に加入させる組合と、ロータリー等を本体の附属装置としてセットで加入できる組合があるため、装着状態と加入内容の確認が重要です。";
  const members = [
    { key:"engine", name:"エンジン・ボンネット", targets:[ENG], pos:[1.0, 1.75, 0.5], note:"火災事故の起点になりやすい部位。焼損の範囲(配線・補機類まで及んでいるか)を確認します。農機具共済は格納中・稼働中を問わず火災等・自然災害(地震を除く)・衝突・接触・墜落・転覆などの事故を対象とするのが一般的です。" },
    { key:"cabin", name:"キャビン(ガラス・外装)", targets:[CAB], pos:[-0.8, 2.85, 0.6], note:"転覆・衝突時に損傷しやすい部位。ガラス割れ・フレーム変形・外装の凹みを確認します。転覆は稼働中事故の代表例です。" },
    { key:"wheel", name:"走行部(タイヤ・ホイール)", targets:[WHL], pos:[-1.0, 0.8, 1.2], note:"衝突・接触や落輪でのホイール変形・タイヤ損傷を確認します。ただし摩滅・自然消耗による損害は共済の対象外とされるのが一般的です。" },
    { key:"hitch", name:"3点リンク・PTO(装着部)", targets:[HIT], pos:[-1.9, 1.15, 0.35], note:"作業機を装着する部位。事故時は本体側の装着部(リンク・PTO軸・ドローバー)と作業機側マストの双方の損傷を確認します。" },
    { key:"body", name:"車体・シャーシ", targets:[BODY], pos:[0.2, 0.85, -0.7], note:"フレームの曲がり・亀裂は走行・作業に直結する損害です。修理費(復旧に必要な額)を新調達価額の範囲で見積もる新価ベースの支払いが一般的です(1年以内に復旧しない場合は時価ベース等、条件は組合によります)。" },
  ];
  if (att !== "none") {
    const allAtt = Object.keys(ATT).map(attMemberName);
    members.push({ key:"att", name: attMemberName(att), targets: allAtt, pos:[-2.7, 1.7, 1.1], note: `<b>用途:</b> ${ATT[att].use}<br><br>${attCaveat}` });
  }
  return { group: g, members, camR: att !== "none" ? ATT[att]?.camR || 8 : 7.5, targetY: 1.0 };
}

/* ============================================================
   田植機(前方=+X)
============================================================ */
function buildTaue(opt) {
  const g = new THREE.Group();
  const BODY = "車体・エンジン部", DRV = "走行部(車輪)", OPE = "操縦部(ハンドル・座席)", UE = "植付部(植付爪・フロート)", NAE = "苗のせ台・予備苗台", FERT = "施肥機(附属装置)", SPRAY = "薬剤散布装置(附属装置)";

  const add = (o) => { g.add(o); return o; };
  const mesh = (geo, m, member) => add(tag(new THREE.Mesh(geo, m), member));

  /* ---- 走行部(前輪小径・後輪大径のラグ付きタイヤ・黒ホイール) ---- */
  [1, -1].forEach((s) => {
    lugWheel(g, { r: 0.34, w: 0.16, rimR: 0.19, lugs: 16, x: 1.02, y: 0.34, z: s * 0.64, member: DRV, rimMat: M.gloss, hubMat: M.steelD });
    lugWheel(g, { r: 0.46, w: 0.2, rimR: 0.25, lugs: 18, x: -0.55, y: 0.46, z: s * 0.64, member: DRV, rimMat: M.gloss, hubMat: M.steelD });
  });

  /* ---- 車体・白色フロアデッキ ---- */
  add(rbox(2.5, 0.16, 0.6, 0.05, M.steelD, 0.25, 0.8, 0, BODY));                   // メインフレーム
  add(rbox(2.45, 0.06, 1.78, 0.03, M.white, 0.3, 0.93, 0, BODY));                   // フロアデッキ
  add(rbox(2.3, 0.04, 1.6, 0.02, M.steel, 0.3, 0.965, 0, BODY));                    // 縞板(滑り止め)
  [1, -1].forEach((s) => add(rbox(2.42, 0.1, 0.07, 0.025, M.white, 0.3, 0.99, s * 0.88, BODY))); // デッキ縁
  add(rbox(0.55, 0.32, 0.72, 0.06, M.gloss, -1.0, 0.82, 0, BODY));                  // ミッション部
  add(rbox(0.5, 0.26, 0.5, 0.05, M.gloss, 1.0, 0.72, 0, BODY));                     // 前部伝動ケース

  /* ---- エンジンフード(先端がすぼまる曲面) ---- */
  const hoodTaper = (x) => { const t = Math.min(1, Math.max(0, (x - 0.7) / 0.8)); return 1 - 0.28 * t * t; };
  mesh(taperZ(profileGeo([[0.42, 0.97], [1.42, 0.97], [1.52, 1.06], [1.5, 1.22], [1.34, 1.34], [0.9, 1.4], [0.45, 1.34]], 0.6, 0.035), hoodTaper), M.tPaint, BODY);
  mesh(taperZ(profileGeo([[1.24, 0.99], [1.46, 0.99], [1.56, 1.08], [1.52, 1.22], [1.28, 1.28]], 0.5, 0.02), hoodTaper), M.gloss, BODY); // フロントグリル
  add(cylX(0.045, 0.02, M.chrome, 1.575, 1.16, 0, BODY));                            // エンブレム台座
  [1, -1].forEach((s) => {
    add(rbox(0.05, 0.07, 0.22, 0.02, M.lens, 1.55, 1.13, s * 0.15, BODY));           // LEDヘッドライト
    const sv = profileGeo([[0.6, 1.0], [1.14, 1.0], [1.28, 1.1], [1.2, 1.26], [0.68, 1.3]], 0.012, 0);
    sv.translate(0, 0, s * 0.317);
    mesh(taperZ(sv, hoodTaper), M.gloss, BODY);                                       // 側面ベンチレーター
  });

  /* ---- 操縦部 ---- */
  add(rbox(0.42, 0.28, 0.42, 0.05, M.steelD, -0.02, 1.08, 0, OPE));                  // シートベース
  add(rbox(0.52, 0.13, 0.54, 0.06, M.seat, -0.02, 1.28, 0, OPE));                    // 座面
  const bk2 = add(rbox(0.12, 0.56, 0.5, 0.05, M.seat, -0.3, 1.6, 0, OPE)); bk2.rotation.z = 0.16;
  [1, -1].forEach((s) => add(rbox(0.34, 0.07, 0.1, 0.03, M.seat, -0.05, 1.43, s * 0.31, OPE))); // アームレスト
  add(rbox(0.34, 0.3, 0.62, 0.05, M.gloss, 0.52, 1.2, 0, OPE));                      // 操作パネル
  add(beam(v(0.5, 1.32, 0), v(0.36, 1.53, 0), 0.03, M.steelD, OPE));                 // ステアリングコラム
  const sw = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.022, 10, 28), M.black);
  sw.quaternion.setFromUnitVectors(v(0, 0, 1), v(-0.42, 0.91, 0).normalize());
  sw.position.set(0.34, 1.56, 0);
  g.add(tag(sw, OPE));
  [1, -1].forEach((s) => add(rbox(0.06, 0.26, 0.06, 0.02, M.gloss, 0.66, 1.3, s * 0.36, OPE))); // 操作レバー
  add(beam(v(1.12, 0.96, -0.72), v(1.06, 1.76, -0.78), 0.022, M.gloss, OPE));        // ミラー支柱
  const tmr = add(rbox(0.05, 0.3, 0.18, 0.02, M.gloss, 1.06, 1.88, -0.78, OPE)); tmr.rotation.y = 0.3;
  [1, -1].forEach((s) => {                                                            // 白色ハンドレール
    add(beam(v(1.3, 0.96, s * 0.8), v(1.3, 1.44, s * 0.82), 0.028, M.white, OPE));
    add(beam(v(0.5, 0.96, s * 0.84), v(0.5, 1.44, s * 0.86), 0.028, M.white, OPE));
    add(beam(v(1.3, 1.44, s * 0.82), v(0.5, 1.44, s * 0.86), 0.028, M.white, OPE));
    add(beam(v(-0.62, 0.96, s * 0.82), v(-0.62, 1.32, s * 0.86), 0.028, M.white, OPE));
  });

  /* ---- 予備苗台(前方の2段トレイ) ---- */
  [1, -1].forEach((s) => {
    add(beam(v(1.24, 0.96, s * 0.74), v(1.2, 1.98, s * 0.82), 0.035, M.steelD, NAE));
    [1.38, 1.78].forEach((y) => {
      const tray = add(rbox(0.72, 0.04, 0.32, 0.02, M.hub, 1.58, y, s * 0.86, NAE));
      tray.rotation.set(0, s * 0.12, 0.12);
      const na = add(rbox(0.58, 0.05, 0.24, 0.02, M.nae, 1.56, y + 0.05, s * 0.86, NAE));
      na.rotation.set(0, s * 0.12, 0.12);
      add(beam(v(1.22, y - 0.03, s * 0.78), v(1.5, y + 0.02, s * 0.88), 0.022, M.steelD, NAE));
    });
    add(beam(v(1.2, 1.98, s * 0.82), v(1.44, 2.02, s * 0.86), 0.018, M.steel, NAE));
  });

  /* ---- 苗のせ台(傾斜したレール付きの台) ---- */
  const tilt = 0.6, TX = -1.55, TY = 1.3, cs = Math.cos(tilt), sn = Math.sin(tilt);
  const table = mesh(rboxGeo(1.5, 0.06, 2.3, 0.03), M.hub, NAE);
  table.position.set(TX, TY, 0); table.rotation.z = tilt;
  for (let z = -1.05; z <= 1.06; z += 0.15) {
    const rail = add(rbox(1.46, 0.035, 0.05, 0.015, M.steel, TX - sn * 0.05, TY + cs * 0.05, z, NAE));
    rail.rotation.z = tilt;
  }
  [-0.78, -0.26, 0.26, 0.78].forEach((z) => {                                        // 苗マット
    const na = add(rbox(1.15, 0.06, 0.4, 0.02, M.nae, TX - sn * 0.11 + cs * 0.1, TY + cs * 0.11 + sn * 0.1, z, NAE));
    na.rotation.z = tilt;
  });
  const topX = TX + cs * 0.75, topY = TY + sn * 0.75;
  add(rbox(0.06, 0.06, 2.34, 0.02, M.tPaint, topX + 0.05, topY + 0.18, 0, NAE));     // 上部ガード(橙)
  for (let z = -1.05; z <= 1.06; z += 0.3) add(rbox(0.05, 0.24, 0.05, 0.02, M.tPaint, topX + 0.04, topY + 0.08, z, NAE));
  add(beam(v(TX - cs * 0.7, TY - sn * 0.7, 0), v(-1.1, 0.9, 0), 0.05, M.steelD, NAE)); // 支持フレーム

  /* ---- 植付部(植付爪・フロート) ---- */
  add(rbox(0.34, 0.26, 2.15, 0.05, M.steelD, -2.02, 0.62, 0, UE));                   // 植付伝動ケース
  add(beam(v(-1.3, 0.85, 0), v(-1.95, 0.7, 0), 0.05, M.steelD, UE));                 // 昇降リンク
  for (let z = -0.9; z <= 0.91; z += 0.36) {
    add(rbox(0.3, 0.32, 0.16, 0.04, M.gloss, -2.18, 0.5, z, UE));                    // 植付アームケース
    const c1 = add(rbox(0.26, 0.05, 0.05, 0.02, M.steel, -2.3, 0.34, z, UE)); c1.rotation.z = -0.5;  // 植付爪
    const c2 = add(rbox(0.26, 0.05, 0.05, 0.02, M.steel, -2.24, 0.28, z, UE)); c2.rotation.z = 0.7;
  }
  [-0.72, 0, 0.72].forEach((z) => {                                                   // フロート
    const fg = profileGeo([[-2.52, 0.06], [-1.74, 0.06], [-1.68, 0.18], [-2.46, 0.24]], 0.46, 0.02);
    fg.translate(0, 0, z);
    mesh(fg, M.white, UE);

  [1, -1].forEach((s) => {                                                            // 線引きマーカー

    add(beam(v(-1.5, 1.35, s * 1.14), v(-2.08, 1.5, s * 1.24), 0.026, M.tPaint, UE));
    add(cylZ(0.05, 0.05, M.tPaint, -2.15, 1.5, s * 1.26, UE));
    for (let a = 0; a < 6; a++) {
      const sp = add(box(0.04, 0.28, 0.03, M.tPaint, -2.15, 1.5, s * 1.26, UE)); sp.rotation.z = a * 0.52;
    }

  if (opt.fert) {
    add(rbox(0.66, 0.44, 1.7, 0.06, M.white, -0.72, 1.22, 0, FERT));                  // 肥料ホッパー
    add(rbox(0.6, 0.05, 1.62, 0.02, M.steelD, -0.72, 1.46, 0, FERT));                 // 上蓋

    for (let z = -0.9; z <= 0.91; z += 0.36) add(beam(v(-0.72, 0.9, z * 0.85), v(-2.0, 0.55, z), 0.026, M.white, FERT)); // 施肥ホース
  }
  if (opt.spray) {
    add(rbox(0.46, 0.4, 0.92, 0.06, M.attBlu, -0.72, 1.74, 0, SPRAY));               // 薬剤タンク
    add(cylY(0.08, 0.08, 0.08, M.attBlu, -0.72, 1.97, 0.26, SPRAY));

      if (!opt.fert) add(beam(v(-0.72, 1.56, s * 0.38), v(-0.66, 0.96, s * 0.48), 0.025, M.steelD, SPRAY));
      add(beam(v(-0.72, 1.6, s * 0.42), v(-1.9, 0.72, s * 0.9), 0.02, M.black, SPRAY));
    });
  }

  const attCaveat = "附属装置(施肥機等)の加入区分は組合により異なります。本体とセットで附属装置として扱う場合と、別加入とする場合があるため、装着状態と加入内容の確認が重要です。";
  const members = [
    { key:"ue", name:"植付部(植付爪・フロート)", targets:[UE], pos:[-2.15, 1.0, 0.95], note:"田植機の中核部位。畦や障害物との接触で爪・フロート・フレームが損傷しやすく、稼働中事故の代表的な確認箇所です。" },
    { key:"nae", name:"苗のせ台・予備苗台", targets:[NAE], pos:[-1.55, 2.05, 0.6], note:"転倒・接触時に変形しやすい部位。重心が後ろ寄りのため、あぜ越えや積み降ろし時の転覆事故にも注意が必要です。" },
    { key:"drive", name:"走行部(車輪)", targets:[DRV], pos:[-0.55, 0.62, 0.95], note:"落輪・接触によるホイール・車軸の損傷を確認します。摩滅・自然消耗は対象外とされるのが一般的です。" },
    { key:"body", name:"車体・エンジン部", targets:[BODY], pos:[1.25, 1.6, 0.5], note:"水田で使用するため、冠水・水没時は電装系まで含めた損害範囲の確認が重要です。" },
    { key:"ope", name:"操縦部", targets:[OPE], pos:[0.1, 1.98, 0.45], note:"転覆時にハンドル・座席まわりが損傷しやすい部位です。" },

  if (opt.spray) members.push({ key:"spray", name:"薬剤散布装置(附属装置)", targets:[SPRAY], pos:[-0.72, 2.12, 0.55], note:"薬剤散布装置。" + attCaveat });
  return { group: g, members, camR: 8, targetY: 1.1 };
}

/* ============================================================

============================================================ */
function buildCombineJidatsu(opt) {
  const g = new THREE.Group();
  const CRW = "走行部(クローラ)", DAK = "脱穀部(こぎ胴)", TAN = "グレンタンク", AUG = "排出オーガ", KAR = "刈取部(ディバイダ・引起し・刈刃)", OPE = "運転部", CUT = "排わらカッター(附属装置)";

  const add = (o) => { g.add(o); return o; };
  const mesh = (geo, m, member) => add(tag(new THREE.Mesh(geo, m), member));

  /* ---- 走行部: ゴムクローラ(履帯・駆動輪・転輪) ---- */
  [1, -1].forEach((s) => crawlerTrack(g, { x0: -1.25, x1: 1.0, r: 0.3, w: 0.36, y: 0.32, z: s * 0.68, member: CRW }));

  /* ---- 機体・脱穀部 ---- */

  add(rbox(2.3, 1.0, 0.95, 0.07, M.tPaint, -0.35, 1.33, -0.45, DAK));               // 脱穀部本体
  add(rbox(2.16, 0.1, 0.88, 0.04, M.gloss, -0.35, 1.87, -0.45, DAK));               // こぎ胴上部カバー

  add(rbox(0.7, 0.5, 0.9, 0.05, M.gloss, -1.6, 1.1, -0.45, DAK));                   // 排わら処理部
  add(rbox(1.5, 0.88, 0.84, 0.07, M.tPaint, -0.6, 1.36, 0.48, TAN));                // グレンタンク
  add(rbox(1.42, 0.1, 0.76, 0.04, M.gloss, -0.6, 1.85, 0.48, TAN));                 // タンク上蓋
  add(rbox(0.5, 0.42, 0.8, 0.05, M.gloss, 0.32, 1.1, 0.48, TAN));                   // タンク前部(フィーダ)

  /* ---- 運転部(ガラスキャビン・右前) ---- */
  const KX0 = 0.2, KX1 = 1.08, KZ0 = 0.1, KZ1 = 0.9, KY0 = 0.95, KY1 = 2.12;
  add(rbox(0.96, 0.12, 0.86, 0.03, M.gloss, (KX0 + KX1) / 2, KY0, (KZ0 + KZ1) / 2, OPE)); // 床
  [[KX0, KZ0], [KX0, KZ1], [KX1, KZ0], [KX1, KZ1]].forEach(([x, z]) => add(bar(v(x, KY0, z), v(x, KY1, z), 0.06, 0.06, M.frame, OPE)));
  [[KX0, KZ0, KX1, KZ0], [KX0, KZ1, KX1, KZ1], [KX0, KZ0, KX0, KZ1], [KX1, KZ0, KX1, KZ1]]
    .forEach(([a, b, c, d]) => add(bar(v(a, KY1, b), v(c, KY1, d), 0.05, 0.05, M.frame, OPE)));
  add(quad([KX1, KY0, KZ0], [KX1, KY0, KZ1], [KX1, KY1, KZ1], [KX1, KY1, KZ0], M.cabGlass, OPE)); // 前面
  add(quad([KX0, KY0, KZ1], [KX1, KY0, KZ1], [KX1, KY1, KZ1], [KX0, KY1, KZ1], M.cabGlass, OPE)); // 側面(ドア)

    { key:"crawler", name:"走行部(クローラ)", targets:[CRW], pos:[-0.15, 0.45, 1.0], note:"クローラの切損・脱輪・転輪の損傷を確認します。摩滅・自然消耗による損害は対象外とされるのが一般的です。" },
    { key:"ope", name:"運転部", targets:[OPE], pos:[0.64, 2.42, 0.62], note:"転覆時にキャビンのガラス割れ・フレーム変形やハンドルまわりの損傷が生じやすい部位です。" },

  return { group: g, members, camR: 9, targetY: 1.3 };
}

/* ============================================================
   普通型コンバイン(汎用・前方=+X)
============================================================ */
function buildCombineFutsu(opt) {
  const g = new THREE.Group();
  const CRW = "走行部(クローラ)", SEN = "脱穀・選別部(機体)", TAN = "グレンタンク", AUG = "排出オーガ", HED = "刈取部(ヘッダー・リール)", FEED = "フィーダー", CAB = "キャビン";

  const mesh = (geo, m, member) => add(tag(new THREE.Mesh(geo, m), member));

  add(rbox(2.1, 0.09, 1.72, 0.03, M.cRed, -0.68, 1.73, 0, TAN));                     // タンク下の赤帯
  add(rbox(1.94, 0.08, 1.58, 0.03, M.gloss, -0.68, 2.4, 0, TAN));                    // タンク上面
  add(rbox(0.5, 0.66, 1.5, 0.06, M.paintW, -1.9, 1.45, 0, SEN));                     // エンジンカバー
  add(rbox(0.08, 0.5, 1.3, 0.03, M.gloss, -2.13, 1.45, 0, SEN));                     // ラジエータグリル
  for (let z = -0.56; z <= 0.57; z += 0.14) add(box(0.03, 0.44, 0.03, M.steelD, -2.16, 1.45, z, SEN));
  add(rbox(0.5, 0.4, 0.3, 0.04, M.gloss, -1.35, 1.9, 0.86, SEN));                    // 排気・マフラー部
  [1.02, 0.7].forEach((y) => add(rbox(0.32, 0.03, 0.26, 0.01, M.steel, -1.45, y, 0.95, SEN))); // ステップ
  add(beam(v(-1.3, 1.75, 0.94), v(-1.3, 0.68, 1.0), 0.025, M.steelD, SEN));          // 手すり

  /* ---- 運転部(ガラスキャビン・右前) ---- */
  const KX0 = 0.45, KX1 = 1.35, KZ0 = -0.02, KZ1 = 0.86, KY0 = 1.5, KY1 = 2.7;
  add(rbox(0.94, 0.62, 0.88, 0.05, M.cRed, 0.9, 1.2, 0.42, CAB));                    // キャビン架台
  add(rbox(0.98, 0.12, 0.92, 0.03, M.gloss, (KX0 + KX1) / 2, KY0, (KZ0 + KZ1) / 2, CAB)); // 床
  [[KX0, KZ0], [KX0, KZ1], [KX1, KZ0], [KX1, KZ1]].forEach(([x, z]) => add(bar(v(x, KY0, z), v(x, KY1, z), 0.06, 0.06, M.frame, CAB)));
  [[KX0, KZ0, KX1, KZ0], [KX0, KZ1, KX1, KZ1], [KX0, KZ0, KX0, KZ1], [KX1, KZ0, KX1, KZ1]]
    .forEach(([a, b, c, d]) => add(bar(v(a, KY1, b), v(c, KY1, d), 0.05, 0.05, M.frame, CAB)));
  add(quad([KX1, KY0, KZ0], [KX1, KY0, KZ1], [KX1, KY1, KZ1], [KX1, KY1, KZ0], M.cabGlass, CAB)); // 前面
  add(quad([KX0, KY0, KZ1], [KX1, KY0, KZ1], [KX1, KY1, KZ1], [KX0, KY1, KZ1], M.cabGlass, CAB)); // 右側面
  add(quad([KX0, KY0, KZ0], [KX0, KY0, KZ1], [KX0, KY1, KZ1], [KX0, KY1, KZ0], M.cabGlass, CAB)); // 後面
  add(quad([KX0, KY0, KZ0], [KX1, KY0, KZ0], [KX1, KY1, KZ0], [KX0, KY1, KZ0], M.cabGlass, CAB)); // 左側面(ドア)
  add(bar(v(KX0, 1.9, KZ0 - 0.005), v(KX1, 1.9, KZ0 - 0.005), 0.03, 0.02, M.frame, CAB));         // ドア枠
  add(box(0.12, 0.025, 0.03, M.frame, 0.7, 2.05, KZ0 - 0.03, CAB));                  // ドアハンドル
  const froof = rboxGeo(1.08, 1.04, 0.13, 0.04, 0.16); froof.rotateX(Math.PI / 2);
  const frf = mesh(froof, M.cRed, CAB); frf.position.set((KX0 + KX1) / 2, 2.75, (KZ0 + KZ1) / 2);
  add(rbox(0.16, 0.12, 0.98, 0.03, M.gloss, KX1 - 0.02, 2.66, (KZ0 + KZ1) / 2, CAB)); // 前面の黒トリム
  [0.12, 0.42, 0.72].forEach((z) => {
    add(rbox(0.1, 0.09, 0.14, 0.02, M.frame, KX1 - 0.01, 2.64, z, CAB));
    add(cylX(0.037, 0.02, M.lens, KX1 + 0.055, 2.64, z, CAB));                       // 作業灯
  });
  add(cylY(0.07, 0.09, 0.1, M.amber, (KX0 + KX1) / 2, 2.86, 0.42, CAB));             // 回転灯
  add(bar(v(0.72, 2.82, 0.1), v(0.72, 3.5, 0.1), 0.012, 0.012, M.frame, CAB));       // アンテナ
  add(bar(v(KX1 - 0.02, 2.5, KZ0), v(KX1 + 0.12, 2.54, KZ0 - 0.32), 0.025, 0.025, M.frame, CAB));
  const fmr = add(rbox(0.05, 0.32, 0.2, 0.02, M.gloss, KX1 + 0.12, 2.34, KZ0 - 0.34, CAB)); fmr.rotation.y = 0.25; // ミラー
  add(rbox(0.06, 0.13, 0.05, 0.02, M.amber, KX1 - 0.01, 2.3, KZ0 + 0.02, CAB));      // ウインカー
  add(rbox(0.4, 0.11, 0.44, 0.05, M.seat, 0.78, 1.86, 0.42, CAB));                   // 座席
  const bk4 = add(rbox(0.1, 0.48, 0.42, 0.04, M.seat, 0.58, 2.15, 0.42, CAB)); bk4.rotation.z = 0.14;
  add(rbox(0.22, 0.32, 0.54, 0.04, M.black, 1.2, 1.9, 0.42, CAB));                   // ダッシュボード
  add(beam(v(1.16, 1.98, 0.42), v(1.02, 2.2, 0.42), 0.026, M.steelD, CAB));

  g.add(tag(sw, CAB));

  /* ---- フィーダー(ヘッダー→機体) ---- */
  const fd = add(rbox(1.05, 0.58, 0.92, 0.05, M.gloss, 1.05, 1.22, -0.32, FEED)); fd.rotation.z = -0.3;
  add(rbox(0.3, 0.3, 0.98, 0.04, M.cRed, 0.62, 1.42, -0.32, FEED));                  // 接続部カバー
  [1, -1].forEach((s) => add(beam(v(0.75, 1.0, -0.32 + s * 0.45), v(1.45, 0.78, -0.32 + s * 0.5), 0.045, M.cRed, FEED))); // 昇降シリンダ

  /* ---- 刈取部(ヘッダー・リール) ---- */
  mesh(profileGeo([[1.52, 0.56], [2.44, 0.6], [2.44, 0.72], [1.74, 0.84], [1.7, 1.45], [1.52, 1.45]], 2.72, 0.02), M.gloss, HED); // プラットフォーム
  add(rbox(0.07, 0.6, 2.72, 0.02, M.cRed, 1.66, 1.16, 0, HED));                      // 背面パネル(赤)
  add(rbox(0.16, 0.08, 2.74, 0.02, M.steel, 2.46, 0.58, 0, HED));                    // 刈刃バー
  const guards = [];
  for (let z = -1.32; z <= 1.33; z += 0.09) {
    const gd = new THREE.BoxGeometry(0.17, 0.045, 0.05); gd.translate(2.56, 0.57, z); guards.push(gd);
  }
  mesh(mergeGeos(guards), M.attYel, HED);                                             // 刈刃ガード
  add(cylZ(0.2, 2.6, M.steelD, 1.98, 0.97, 0, HED));                                  // ヘッダーオーガ
  for (let a = 0; a < 10; a++) {                                                      // オーガのらせん羽根

    fl.rotation.set(0, 0.5, a * 0.9);
  }
  // リール(バット+タイン)
  const RX = 2.14, RY = 1.42, RR = 0.36;
  add(cylZ(0.05, 2.76, M.steelD, RX, RY, 0, HED));
  const tines = [];
  for (let a = 0; a < 6; a++) {
    const ang = (a / 6) * Math.PI * 2;
    add(cylZ(0.035, 2.7, M.gloss, RX + RR * Math.cos(ang), RY + RR * Math.sin(ang), 0, HED));
    for (let z = -1.26; z <= 1.27; z += 0.13) {
      const tn = new THREE.BoxGeometry(0.025, 0.24, 0.02);
      tn.translate(0, -0.12, 0);
      tn.rotateZ(ang - Math.PI / 2);
      tn.translate(RX + (RR + 0.02) * Math.cos(ang), RY + (RR + 0.02) * Math.sin(ang), z);
      tines.push(tn);

  }
  mesh(mergeGeos(tines), M.steel, HED);
  [1, -1].forEach((s) => {
    for (let a = 0; a < 5; a++) {                                                     // リール端部のスポーク

  if (opt.auger === "stored") {
    add(beam(v(-1.45, 2.78, 0.68), v(0.3, 3.05, 0.5), 0.11, M.paintW, AUG));
    add(rbox(0.26, 0.24, 0.24, 0.03, M.paintW, 0.38, 3.06, 0.49, AUG));

  } else {
    add(beam(v(-1.45, 2.78, 0.68), v(0.15, 3.15, 2.6), 0.11, M.paintW, AUG));

  const members = [
    { key:"header", name:"刈取部(ヘッダー・リール)", targets:[HED], pos:[2.5, 1.95, -1.2], note:"普通型(汎用)コンバインはリール+刈刃+ヘッダーオーガで汎用作物を刈り取ります。障害物接触によるリール・刈刃の損傷、石の巻き込みが代表的な事故です。" },
    { key:"feeder", name:"フィーダー", targets:[FEED], pos:[1.1, 1.78, -0.85], note:"ヘッダーから機体へ搬送する部位。異物の噛み込みでチェーン・搬送部が損傷することがあります。" },
    { key:"sen", name:"脱穀・選別部(機体)", targets:[SEN], pos:[-0.8, 1.5, -1.05], note:"内部のこぎ胴・シーブは外観から見えないため、異物巻き込み事故では内部確認が必要です。" },
    { key:"tank", name:"グレンタンク", targets:[TAN], pos:[-0.75, 2.62, -0.95], note:"上部にあるため、施設出入口や枝との接触で損傷することがあります。" },
    { key:"auger", name:"排出オーガ", targets:[AUG], pos: opt.auger === "stored" ? [0.45, 3.25, 0.5] : [0.28, 3.45, 2.55], note:"展開したままの走行接触が典型事故です。格納/展開を切り替えて確認できます。" },
    { key:"crawler", name:"走行部(クローラ)", targets:[CRW], pos:[-0.4, 0.58, 1.12], note:"クローラの切損・脱輪・転輪の損傷を確認します。摩滅・自然消耗は対象外とされるのが一般的です。" },
    { key:"cabin", name:"キャビン", targets:[CAB], pos:[0.9, 3.0, 0.95], note:"ガラス・外装の損傷を確認します。" },
  ];
  return { group: g, members, camR: 11, targetY: 1.6 };

/* ============================================================
   薬剤散布用乗用管理機(ブームスプレーヤ一体型・前方=+X)
============================================================ */
function buildKanriki(opt) {
  const g = new THREE.Group();
  const DRV = "走行部(車輪)", BODY = "車体・エンジン部", OPE = "操縦部", TANK = "薬液タンク", BOOM = "ブーム・ノズル(散布装置)";

  const add = (o) => { g.add(o); return o; };
  const mesh = (geo, m, member) => add(tag(new THREE.Mesh(geo, m), member));

  /* ---- 走行部(細幅ラグタイヤ・白色ディッシュホイール) ---- */
  [0.9, -0.95].forEach((x) => [1, -1].forEach((s) =>
    lugWheel(g, { r: 0.5, w: 0.15, rimR: 0.34, lugs: 20, x, y: 0.5, z: s * 0.62, member: DRV })));

  /* ---- 高床シャーシ ---- */
  add(rbox(2.5, 0.16, 0.62, 0.05, M.steelD, 0, 1.02, 0, BODY));                      // メインフレーム
  [0.9, -0.95].forEach((x) => [1, -1].forEach((s) => {
    add(rbox(0.2, 0.56, 0.18, 0.04, M.gloss, x, 0.76, s * 0.54, BODY));              // 脚部(ファイナルケース)
    add(cylZ(0.055, 0.2, M.steelD, x, 0.5, s * 0.56, BODY));
  }));
  add(rbox(1.9, 0.1, 0.24, 0.03, M.steelD, -0.05, 0.92, 0, BODY));                   // 前後連結フレーム
  // 前部フード(赤)
  const kTaper = (x) => { const t = Math.min(1, Math.max(0, (x - 0.65) / 0.75)); return 1 - 0.26 * t * t; };
  mesh(taperZ(profileGeo([[0.45, 1.06], [1.28, 1.06], [1.4, 1.16], [1.38, 1.34], [1.2, 1.46], [0.8, 1.5], [0.48, 1.44]], 0.62, 0.035), kTaper), M.cRed, BODY);
  mesh(taperZ(profileGeo([[1.1, 1.08], [1.32, 1.08], [1.42, 1.18], [1.38, 1.32], [1.14, 1.38]], 0.5, 0.02), kTaper), M.gloss, BODY); // グリル
  [1, -1].forEach((s) => add(rbox(0.05, 0.08, 0.2, 0.02, M.lens, 1.42, 1.26, s * 0.14, BODY)));  // ヘッドライト
  add(cylX(0.04, 0.02, M.chrome, 1.435, 1.26, 0, BODY));
  // 後部エンジンカバー(赤)
  add(rbox(0.9, 0.46, 0.72, 0.06, M.cRed, -1.05, 1.33, 0, BODY));
  add(rbox(0.82, 0.06, 0.64, 0.02, M.gloss, -1.05, 1.58, 0, BODY));
  add(cylY(0.035, 0.035, 0.5, M.black, -1.38, 1.78, 0.22, BODY));                    // マフラー
  [1, -1].forEach((s) => add(rbox(0.52, 0.04, 0.24, 0.02, M.steel, 0.25, 1.0, s * 0.62, BODY))); // ステップ

  /* ---- 操縦部 ---- */
  add(rbox(0.4, 0.26, 0.42, 0.05, M.steelD, -0.05, 1.18, 0, OPE));                   // シートベース
  add(rbox(0.5, 0.12, 0.5, 0.06, M.seat, -0.05, 1.38, 0, OPE));                      // 座面
  const bk5 = add(rbox(0.11, 0.5, 0.46, 0.05, M.seat, -0.3, 1.66, 0, OPE)); bk5.rotation.z = 0.16;
  add(rbox(0.3, 0.32, 0.5, 0.05, M.gloss, 0.46, 1.32, 0, OPE));                      // 操作パネル
  add(beam(v(0.44, 1.44, 0), v(0.3, 1.64, 0), 0.028, M.steelD, OPE));                // コラム
  const sw = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.021, 10, 26), M.black);
  sw.quaternion.setFromUnitVectors(v(0, 0, 1), v(-0.42, 0.91, 0).normalize());
  sw.position.set(0.28, 1.67, 0);
  g.add(tag(sw, OPE));
  [1, -1].forEach((s) => add(rbox(0.06, 0.26, 0.06, 0.02, M.gloss, 0.58, 1.42, s * 0.3, OPE))); // 操作レバー

  /* ---- 薬液タンク ---- */
  add(rbox(0.72, 0.46, 0.8, 0.07, M.paintW, -0.6, 1.3, 0, TANK));
  add(rbox(0.66, 0.06, 0.74, 0.02, M.cRed, -0.6, 1.55, 0, TANK));                    // タンク上面の赤帯
  add(cylY(0.09, 0.09, 0.08, M.paintW, -0.6, 1.61, 0.24, TANK));                     // 注入口
  add(rbox(0.24, 0.22, 0.26, 0.04, M.steelD, -0.25, 1.15, 0.24, TANK));              // ポンプ
  add(beam(v(-0.25, 1.15, 0.24), v(1.05, 1.02, 0.2), 0.018, M.black, TANK));         // 送液ホース(ブームへ)

  /* ---- ブーム・ノズル(散布装置): 前方に1組(センター+左右ウイング) ---- */
  const BX = 1.32, boomY = 0.9, nozGeos = [];
  const pushNoz = (x, y, z) => {
    const st = new THREE.CylinderGeometry(0.014, 0.014, 0.1, 8); st.translate(x, y - 0.07, z);
    const cp = new THREE.CylinderGeometry(0.032, 0.014, 0.06, 8); cp.translate(x, y - 0.14, z);
    nozGeos.push(st, cp);
  };
  add(rbox(0.12, 0.5, 0.12, 0.03, M.gloss, BX, 1.02, 0, BOOM));                       // 取付フレーム(縦)

  add(rbox(0.1, 0.1, 1.2, 0.03, M.gloss, BX, boomY, 0, BOOM));                        // センター支持
  add(cylZ(0.035, 1.3, M.steel, BX, boomY, 0, BOOM));                                 // センターブーム

  [1, -1].forEach((s) => {

    if (opt.boom === "extended") {
      add(cylZ(0.03, 2.3, M.steel, BX, boomY, s * 1.85, BOOM));                       // ウイングブーム
      add(cylZ(0.012, 2.3, M.black, BX, boomY + 0.05, s * 1.85, BOOM));               // 送液パイプ
      for (let z = 0.8; z <= 2.96; z += 0.31) pushNoz(BX, boomY, s * z);
      add(beam(v(BX, 1.28, s * 0.25), v(BX, boomY + 0.03, s * 2.85), 0.01, M.gloss, BOOM)); // 吊りワイヤ
    } else {
      // 格納: 前方の支点から後方斜め上へウイングを折りたたむ(移動時の姿勢)
      const p1 = v(BX, boomY + 0.08, s * 0.8), p2 = v(BX - 2.16, boomY + 0.93, s * 0.74);
      add(beam(p1, p2, 0.03, M.steel, BOOM));                                          // ウイングブーム
      add(beam(p1.clone().setY(p1.y + 0.05), p2.clone().setY(p2.y + 0.05), 0.012, M.black, BOOM)); // 送液パイプ
      for (let t = 0.08; t <= 0.97; t += 0.125) {
        const p = p1.clone().lerp(p2, t);
        pushNoz(p.x, p.y, p.z);
      }
      const mid = p1.clone().lerp(p2, 0.55);
      add(beam(v(0.15, 1.08, s * 0.5), mid, 0.028, M.gloss, BOOM));                    // 受けフレーム
      add(rbox(0.09, 0.16, 0.09, 0.02, M.gloss, mid.x, mid.y - 0.08, mid.z, BOOM));    // 受け金具
    }
  });
  mesh(mergeGeos(nozGeos), M.gloss, BOOM);                                            // ノズル

  const members = [
    { key:"boom", name:"ブーム・ノズル(散布装置)", targets:[BOOM], pos: opt.boom === "extended" ? [1.32, 1.35, 2.7] : [0.1, 1.95, 0.8], note:"一体型のため散布装置は機体の一部として評価します。ブームはセンター部と左右のウイングで1組を機体前方に装着し、移動時は左右のウイングを後方斜め上に折りたたみます。展開したままの走行で電柱・支柱に接触するブーム損傷が典型事故です。格納/展開を切り替えて確認できます。" },
    { key:"tank", name:"薬液タンク", targets:[TANK], pos:[-0.6, 1.88, 0.5], note:"転覆・衝突時の割れ・変形を確認します。ポンプ・配管まで損害が及んでいないかも確認します。" },
    { key:"drive", name:"走行部(車輪)", targets:[DRV], pos:[0.9, 0.66, 0.95], note:"高床・細輪距のため転覆リスクが高い機種です。畦越えや傾斜地での転覆時は車軸・ホイールの損傷を確認します。" },
    { key:"body", name:"車体・エンジン部", targets:[BODY], pos:[1.15, 1.78, 0.45], note:"薬剤を扱うため、事故時は薬液漏れによる二次被害の確認も必要です。" },
    { key:"ope", name:"操縦部", targets:[OPE], pos:[-0.05, 2.02, 0.45], note:"転覆時にハンドル・座席まわりが損傷しやすい部位です。キャノピー付きの機種ではキャノピーの変形も確認します。" },
  ];
  return { group: g, members, camR: 10, targetY: 1.2 };
}

const DETAIL_FALLBACK = (name, part, count) =>
  `部材「${name}」。事故による損傷の有無・範囲を確認します。共済金は新調達価額を基準に修理費を補填する新価ベースが一般的です(摩滅・自然消耗による損害は対象外)。`;

/* ============================================================
   部材の個別分割: モデルの実データから部材名ごとにエントリを自動生成
============================================================ */
function buildDetailedMembers() {
  const map = new Map();
  modelGroup.updateMatrixWorld(true);
  modelGroup.traverse((m) => {
    if (!m.isMesh || !m.userData.member) return;
    const name = m.userData.member;
    if (name.indexOf("DMG") === 0) return;           // 被害エントリは対象外
    if (!map.has(name)) map.set(name, { box: new THREE.Box3(), part: m.userData.part || "", count: 0 });
    const e = map.get(name);
    const g = m.geometry.clone().applyMatrix4(m.matrixWorld);
    g.computeBoundingBox();
    e.box.union(g.boundingBox);
    e.count++;
  });
  const out = [];
  let i = 0;
  for (const [name, e] of map) {
    if (e.count === 0 || e.box.isEmpty()) continue;
    i++;
    const c = e.box.getCenter(new THREE.Vector3());
    const flat = new THREE.Vector3(c.x, 0, c.z);
    let pos;
    if (flat.length() < 0.4) pos = [c.x, e.box.max.y + 0.3, c.z];
    else { flat.normalize().multiplyScalar(0.55); pos = [c.x + flat.x, c.y, c.z + flat.z]; }
    const note = DETAIL_NOTES[name] || DETAIL_FALLBACK(name, e.part, e.count);
    out.push({ key: "dp" + i, part: e.part, name: name + (e.count > 1 ? " ×" + e.count : ""), targets: [name],
               pos, note: note + `\n\n(この部材の使用数: ${e.count}${e.part ? " / 区分: " + e.part : ""})` });
  }
  return out;
}

  const geo = new THREE.SphereGeometry(0.09, 16, 16);
  currentDef.members.forEach((mk) => {
    const m = new THREE.Mesh(geo, mat(0xffb020, { emissive: 0xff8c00, emissiveIntensity: 0.6 }));
    m.position.set(mk.pos[0], mk.pos[1], mk.pos[2]);
    m.userData.key = mk.key;
    scene.add(m);
    markerMeshes.push(m);
  });
  if (resetCam) {
    orbit.theta = Math.PI / 4; orbit.phi = Math.PI / 3;
    orbit.radius = currentDef.camR;
    orbit.target.set(0, currentDef.targetY, 0);
  }
  if (state.selectedMember && !currentDef.members.find((m) => m.key === state.selectedMember)) state.selectedMember = null;
  applyHighlight();
  renderLabels();
  renderPanel();
}

/* ============================================================
   ラベル・操作
============================================================ */
const labelsHolder = document.getElementById("labels");
let labelEntries = [];
function renderLabels() {
  labelsHolder.innerHTML = "";
  labelEntries = [];
  currentDef.members.forEach((mk) => {
    const div = document.createElement("div");
    div.className = "label";
    div.innerHTML = `<div class="label-chip${state.selectedMember === mk.key ? " active" : ""}">${mk.name}</div>`;
    div.addEventListener("click", () => { state.selectedMember = state.selectedMember === mk.key ? null : mk.key; renderLabels(); renderPanel(); applyHighlight(); });
    labelsHolder.appendChild(div);
    labelEntries.push({ occluded: false, el: div, pos: new THREE.Vector3(mk.pos[0], mk.pos[1], mk.pos[2]) });
  });
}
function occluderTargets() { return modelGroup ? [modelGroup] : []; }
/* ラベルの遮蔽判定: 壁などの陰にあるラベルは隠す(半透明の面は遮蔽物とみなさない) */
const occRay = new THREE.Raycaster();
let occTick = 0;
function updateOcclusion(force) {
  occTick++;
  if (!force && occTick % 3 !== 0) return;
  const targets = occluderTargets();
  if (!targets.length) return;
  const camPos = camera.position;
  labelEntries.forEach((e) => {
    const v = e.pos.clone().sub(camPos);
    const dist = v.length();
    if (dist < 0.6) { e.occluded = false; return; }
    occRay.set(camPos, v.normalize());
    occRay.far = dist - 0.35;
    const hits = occRay.intersectObjects(targets, true);
    e.occluded = hits.some((h) => {
      const o = h.object, mat = o.material;
      if (!o.visible || !mat) return false;
      if (mat.transparent && (mat.opacity === undefined ? 1 : mat.opacity) < 0.6) return false;
      return true;
    });
  });
}
function updateLabelPositions() {
  const w = holder.clientWidth, h = holder.clientHeight;
  updateOcclusion(false);
  const items = labelEntries.map((e) => {
    const pr = e.pos.clone().project(camera);
    return { e, x: (pr.x * 0.5 + 0.5) * w, y: (-pr.y * 0.5 + 0.5) * h, z: pr.z, behind: pr.z > 1 };
  });
  // 優先度: 選択中 > 被害 > 通常。近いものを優先
  const prio = (it) => {
    const chip = it.e.el.firstElementChild;
    let p = 0;
    if (chip && chip.classList.contains("active")) p += 100;
    if (chip && chip.classList.contains("dmg")) p += 10;
    return p;
  };
  items.sort((a, b) => (prio(b) - prio(a)) || (a.z - b.z));
  const placed = [];
  items.forEach((it) => {
    const el = it.e.el;
    if (it.behind || it.e.occluded || it.x < -60 || it.x > w + 60 || it.y < -40 || it.y > h + 40) {
      el.style.visibility = "hidden"; return;
    }
    if (!it.e.cw) { it.e.cw = el.offsetWidth || 90; it.e.ch = el.offsetHeight || 22; }
    const cw = it.e.cw, ch = it.e.ch;
    let y = it.y - 6; // 少し上げて被害・部材の視覚表現に重ねない
    let ok = false;
    for (let step = 0; step < 5; step++) {
      const rect = { l: it.x - cw / 2 - 3, r: it.x + cw / 2 + 3, t: y - ch, b: y };
      if (!placed.some((r) => r.l < rect.r && rect.l < r.r && r.t < rect.b && rect.t < r.b)) {
        ok = true; placed.push(rect); break;
      }
      y -= ch + 4; // 重なる場合は上に段積み退避
    }
    if (!ok) { el.style.visibility = "hidden"; return; }
    el.style.visibility = "visible";
    el.style.transform = `translate(-50%,-100%) translate(${it.x}px, ${y}px)`;
  });
}
const dom = renderer.domElement;
dom.style.touchAction = "none";
const drag = { on: false, x: 0, y: 0 };
let lastPinch = null;
dom.addEventListener("pointerdown", (e) => { drag.on = true; drag.x = e.clientX; drag.y = e.clientY; });
window.addEventListener("pointermove", (e) => {
  if (!drag.on) return;
  orbit.theta -= (e.clientX - drag.x) * 0.006;
  orbit.phi = Math.max(0.22, Math.min(Math.PI / 2 - 0.02, orbit.phi - (e.clientY - drag.y) * 0.006));
  drag.x = e.clientX; drag.y = e.clientY;
});
window.addEventListener("pointerup", () => { drag.on = false; });
dom.addEventListener("wheel", (e) => {
  e.preventDefault();
  orbit.radius = Math.max(3, Math.min(28, orbit.radius + e.deltaY * 0.01));
}, { passive: false });
dom.addEventListener("touchmove", (e) => {
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (lastPinch !== null) orbit.radius = Math.max(3, Math.min(28, orbit.radius - (d - lastPinch) * 0.02));
    lastPinch = d; drag.on = false;
  }
}, { passive: true });
dom.addEventListener("touchend", () => { lastPinch = null; });
dom.addEventListener("click", (e) => {
  const rect = dom.getBoundingClientRect();
  const mouse = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(markerMeshes);
  if (hits.length > 0) { const hk = hits[0].object.userData.key; state.selectedMember = state.selectedMember === hk ? null : hk; renderLabels(); renderPanel(); applyHighlight(); }
});
window.addEventListener("resize", () => {
  camera.aspect = holder.clientWidth / holder.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(holder.clientWidth, holder.clientHeight);
});
document.getElementById("reset-view").addEventListener("click", () => {
  orbit.theta = Math.PI / 4; orbit.phi = Math.PI / 3;
  orbit.radius = currentDef.camR;
  orbit.target.set(0, currentDef.targetY, 0);
});

/* ============================================================
   パネル
============================================================ */
const panel = document.getElementById("panel");
function el(t, cls, html) {
  const e = document.createElement(t);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
/* ビューア下部(視点リセットの左)に、選択中の附属装置の用途を表示 */
function updateUseBox() {
  const ub = document.getElementById("use-box");
  const a = state.machine === "tractor" && state.tractorAtt !== "none" ? ATT[state.tractorAtt] : null;
  ub.hidden = !a;
  if (a) ub.innerHTML = `<b>${a.label}の用途</b>${a.use}`;
}

  updateUseBox();
  panel.innerHTML = "";

  const secM = el("div", "section", "<h2>機種</h2>");

    const d = MACHINES[k];

    b.addEventListener("click", () => { state.machine = k; state.selectedMember = null; rebuild(true); });
    secM.appendChild(b);
  });
  panel.appendChild(secM);

  const secA = el("div", "section", "<h2>附属装置・状態</h2>");
  if (state.machine === "tractor") {
    const row = el("div", "btn-row");
    const items = [["none", "なし"]].concat(Object.keys(ATT).map((k) => [k, ATT[k].label]));
    items.forEach(([k, lb]) => {
      const b = el("button", "btn" + (state.tractorAtt === k ? " active" : ""), lb);
      b.addEventListener("click", () => { state.tractorAtt = k; rebuild(true); });
      row.appendChild(b);
    });
    secA.appendChild(row);
    secA.appendChild(el("div", "legend-cap", "3点リンク(マニュアスプレッダーはドローバー)に装着する作業機を切り替えます。駆動式の作業機にはPTOシャフトが接続されます。"));
  } else if (state.machine === "taue") {
    [["taueFert", "施肥機(側条施肥)"], ["taueSpray", "薬剤散布装置"]].forEach(([k, lb]) => {
      const b = el("button", "btn" + (state[k] ? " active" : ""), (state[k] ? "☑ " : "☐ ") + lb);
      b.addEventListener("click", () => { state[k] = !state[k]; rebuild(false); });
      secA.appendChild(b);
    });
    secA.appendChild(el("div", "legend-cap", "タップで装着/取り外しを切り替えます(複数同時装着可)。"));
  } else if (state.machine === "combine") {
    const bc = el("button", "btn" + (state.combCutter ? " active" : ""), (state.combCutter ? "☑ " : "☐ ") + "排わらカッター");
    bc.addEventListener("click", () => { state.combCutter = !state.combCutter; rebuild(false); });
    secA.appendChild(bc);
    const rowAu = el("div", "btn-row");
    [["stored", "オーガ格納"], ["extended", "オーガ展開"]].forEach(([k, lb]) => {
      const b = el("button", "btn" + (state.combAuger === k ? " active" : ""), lb);
      b.addEventListener("click", () => { state.combAuger = k; rebuild(false); });
      rowAu.appendChild(b);
    });
    secA.appendChild(rowAu);
  } else if (state.machine === "combine2") {
    const rowAu = el("div", "btn-row");
    [["stored", "オーガ格納"], ["extended", "オーガ展開"]].forEach(([k, lb]) => {
      const b = el("button", "btn" + (state.comb2Auger === k ? " active" : ""), lb);
      b.addEventListener("click", () => { state.comb2Auger = k; rebuild(false); });
      rowAu.appendChild(b);
    });
    secA.appendChild(rowAu);
    secA.appendChild(el("div", "legend-cap", "普通型(汎用)コンバインは麦・大豆・そば等にも対応するリール式ヘッダーを備えます。"));
  } else {
    const rowB = el("div", "btn-row");
    [["extended", "ブーム展開"], ["folded", "ブーム格納"]].forEach(([k, lb]) => {
      const b = el("button", "btn" + (state.kanBoom === k ? " active" : ""), lb);
      b.addEventListener("click", () => { state.kanBoom = k; rebuild(false); });
      rowB.appendChild(b);
    });
    secA.appendChild(rowB);
    secA.appendChild(el("div", "legend-cap", "一体型のため散布装置(ブーム・タンク)は機体の一部です。"));
  }
  panel.appendChild(secA);

  // 部材の分け方
  const secGran = el("div", "section", "<h2>部材の分け方</h2>");
  const rowGran = el("div", "btn-row");
  [[false, "まとめて"], [true, "個別(部材ごと)"]].forEach(([v, lb]) => {
    const b = el("button", "btn" + (state.detailParts === v ? " active" : ""), lb);
    b.addEventListener("click", () => { state.detailParts = v; state.selectedMember = null; rebuild(false); });
    rowGran.appendChild(b);
  });
  secGran.appendChild(rowGran);
  const bFD = el("button", "btn" + (state.focusDim ? " active" : ""), (state.focusDim ? "☑ " : "☐ ") + "選択した部材以外を淡色化");
  bFD.style.marginTop = "6px";
  bFD.addEventListener("click", () => { state.focusDim = !state.focusDim; applyHighlight(); renderPanel(); });
  secGran.appendChild(bFD);
  const bMC = el("button", "btn" + (state.memberColorMode ? " active" : ""), (state.memberColorMode ? "☑ " : "☐ ") + "部材ごとに色分け");
  bMC.style.marginTop = "6px";
  bMC.addEventListener("click", () => { state.memberColorMode = !state.memberColorMode; applyHighlight(); renderPanel(); });
  secGran.appendChild(bMC);
  if (state.memberColorMode) {
    const lg = el("div", "legend");
    memberLegendItems().forEach(([nm, ct]) => {
      lg.appendChild(el("div", "legend-item",
        `<span class="sw" style="background:${memberColorHex(nm)}"></span>${nm}<span style="color:#94a3b8;margin-left:auto">×${ct}</span>`));
    });
    secGran.appendChild(lg);
  }
  secGran.appendChild(el("div", "legend-cap", state.detailParts
    ? "モデル上の部材名ごとに分けて表示しています(柱・梁・筋かい等を個別に選択できます)。"
    : "関連する部材をまとめた区分で表示しています。「個別」にすると柱・梁・筋かいなどを1つずつ選択できます。"));
  panel.appendChild(secGran);

  const secP = el("div", "section", "<h2>部位と評価の着眼点</h2><div class=\"legend-cap\" style=\"margin:0 0 6px\">選択した部位はモデル上でオレンジ色に点滅表示されます</div>");
  currentDef.members.forEach((mk) => {
    const b = el("button", "btn" + (state.selectedMember === mk.key ? " active" : ""), mk.name);
    b.addEventListener("click", () => { state.selectedMember = state.selectedMember === mk.key ? null : mk.key; renderLabels(); renderPanel(); applyHighlight(); });
    secP.appendChild(b);
  });
  const active = currentDef.members.find((m) => m.key === state.selectedMember);
  if (active) secP.appendChild(el("div", "note-box", `<div class="title">${active.name}</div>${active.note}`));
  panel.appendChild(secP);

  panel.appendChild(el("div", "section note-box",
    `<div class="title">農機具共済の基本(公開情報に基づく一般的な枠組み)</div>トラクター・田植機・コンバイン等の農機具を対象に、火災等・自然災害(地震を除く)・衝突・接触・墜落・転覆などの事故(格納中・稼働中を問わず)による損害を補償します。共済金は新調達価額を基準に修理費を補填する新価ベースが一般的で、事故から1年以内に復旧しない場合は時価ベース等の扱いになります。中古取得の農機具は付保割合条件付実損てん補特約を付帯して加入します。<b>附属装置(ロータリー・ハロー・結束機等)の加入区分は組合により異なる</b>ため、装着状態と加入内容の確認が評価実務で重要です。摩滅・腐食・サビ等の自然消耗による損害は対象外とされます。加入限度額・免責・特約の細部は各組合の約款によります。`));

  panel.appendChild(el("div", "disclaimer",
    "本モデルは研修用の簡略化イメージです。機体・作業機の形状/寸法/構造は実機と一致せず、共済の解説は各NOSAIの公開情報に基づく一般的な枠組みであり、正式な約款・損害評価基準を再現したものではありません。実際の引受・損害評価は各農業共済組合等の約款・基準に基づいて行ってください。"));
}

/* ============================================================
   ループ
============================================================ */
function animate() {
  camera.position.set(
    orbit.target.x + orbit.radius * Math.sin(orbit.phi) * Math.sin(orbit.theta),
    orbit.target.y + orbit.radius * Math.cos(orbit.phi),
    orbit.target.z + orbit.radius * Math.sin(orbit.phi) * Math.cos(orbit.theta)
  );
  camera.lookAt(orbit.target);
  hlMat.emissiveIntensity = 0.35 + 0.3 * Math.sin(performance.now() * 0.004);
  renderer.render(scene, camera);
  updateLabelPositions();
  requestAnimationFrame(animate);
}
rebuild(true);
animate();
