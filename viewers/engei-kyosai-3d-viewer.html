<script type="module">
import * as THREE from "three";

/* ============================================================
   共通マテリアル・色定義
============================================================ */
const MAT = {
  pipe:   new THREE.MeshStandardMaterial({ color: 0x9aa1a8, roughness: 0.45, metalness: 0.6 }),
  steel:  new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.5,  metalness: 0.55 }),
  steelW: new THREE.MeshStandardMaterial({ color: 0xe5e7eb, roughness: 0.4,  metalness: 0.5 }),
  wire:   new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.4,  metalness: 0.7 }),
  conc:   new THREE.MeshStandardMaterial({ color: 0x8d8d86, roughness: 0.9 }),
  stone:  new THREE.MeshStandardMaterial({ color: 0x9ca3af, roughness: 0.95 }),
  door:   new THREE.MeshStandardMaterial({ color: 0x2b3b47, roughness: 0.3, side: THREE.DoubleSide }),
};

/* 被覆材(別表2の代表的な種類を簡略化して表現) */
const COVERS = {
  noubi:      { label: "一般農ビ(農業用ポリ塩化ビニール)", color: 0xfff6dd, opacity: 0.34 },
  po:         { label: "一般農PO(ポリオレフィン系)",       color: 0xffffff, opacity: 0.30 },
  taikyu_po:  { label: "耐久農PO",                          color: 0xf2fbff, opacity: 0.33 },
  soft:       { label: "軟質フィルム〔61型系=Ⅳ類甲〕",     color: 0xffffff, opacity: 0.30 },
  hard:       { label: "硬質フィルム〔62型系=Ⅳ類乙〕",     color: 0xd8f0f8, opacity: 0.48 },
  kanreisha:  { label: "寒冷紗・ネット〔80型系=Ⅵ類相当〕", color: 0x334155, opacity: 0.40 },
  glass3:     { label: "ガラス 透明3mm",                    color: 0xd7ecf4, opacity: 0.22 },
  glass4:     { label: "ガラス 透明4mm",                    color: 0xcfe8f2, opacity: 0.25 },
  amiiri:     { label: "網入りガラス",                      color: 0xc4d4da, opacity: 0.32 },
  net_gen:    { label: "一般多目的ネット(ポリエチレン)",    color: 0x1f2937, opacity: 0.35 },
  net_taikyu: { label: "耐久性多目的ネット",                color: 0x111827, opacity: 0.40 },
};

/* 施設構造部分の色分け(第4-1(1): 妻面・側面・屋根面・基礎の4区分、Ⅶ類は周囲面・天井面・基礎) */
const PART_COLORS = {
  "妻面A": "#e11d48", "妻面B": "#fb923c",
  "側面A": "#2563eb", "側面B": "#7dd3fc",
  "屋根面A": "#16a34a", "屋根面B": "#86efac",
  "側屋根面A": "#0d9488", "側屋根面B": "#99f6e4",
  "周囲面": "#2563eb", "天井面": "#16a34a",
  "基礎": "#64748b",
  "施設内農作物": "#a855f7",
};

const partMatCache = {};
function partMat(part, isCover) {
  const key = part + (isCover ? "_c" : "_s");
  if (!partMatCache[key]) {
    partMatCache[key] = new THREE.MeshStandardMaterial({
      color: new THREE.Color(PART_COLORS[part] || "#a3a3a3"),
      roughness: 0.7, metalness: 0.05,
      transparent: !!isCover, opacity: isCover ? 0.6 : 1.0,
      side: THREE.DoubleSide,
    });
  }
  return partMatCache[key];
}

/* ============================================================
   ジオメトリ用ヘルパー
============================================================ */
function tag(mesh, part, member, isCover) {
  mesh.userData.part = part;
  mesh.userData.member = member;
  mesh.userData.isCover = !!isCover;
  mesh.userData.baseMat = mesh.material;
  return mesh;
}

function pipeBetween(p1, p2, r, mat) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 6), mat);
  mesh.position.copy(p1).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  return mesh;
}

function pipeAlongX(x0, x1, y, z, r, mat) {
  return pipeBetween(new THREE.Vector3(x0, y, z), new THREE.Vector3(x1, y, z), r, mat);
}

/* アーチ被覆(半円筒の一部)を確実な向きで生成: φ=0→+Z, φ=π/2→頂点, φ=π→−Z */
function archSkinGeometry(r, len, phi0, phi1, segX, segP) {
  segX = segX || 1; segP = segP || 14;
  const pos = [], norm = [], uv = [], idx = [];
  for (let i = 0; i <= segX; i++) {
    const x = -len / 2 + (len * i) / segX;
    for (let j = 0; j <= segP; j++) {
      const p = phi0 + ((phi1 - phi0) * j) / segP;
      pos.push(x, r * Math.sin(p), r * Math.cos(p));
      norm.push(0, Math.sin(p), Math.cos(p));
      uv.push(i / segX, j / segP);
    }
  }
  const row = segP + 1;
  for (let i = 0; i < segX; i++) for (let j = 0; j < segP; j++) {
    const a = i * row + j, b = (i + 1) * row + j;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("normal", new THREE.Float32BufferAttribute(norm, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  return g;
}

function coverMaterial(coverKey) {
  const c = COVERS[coverKey];
  return new THREE.MeshStandardMaterial({
    color: c.color, transparent: true, opacity: c.opacity,
    roughness: 0.25, metalness: 0.0, side: THREE.DoubleSide,
  });
}

/* 1/4アーチのパイプ(トーラス)。sideZ: +1 → +Z側(A面), −1 → −Z側(B面) */
function quarterRib(r, tube, x, yBase, sideZ, mat) {
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 8, 12, Math.PI / 2), mat);
  // 回転順XYZ(Rzが先に適用): zOff=π/2 の破片が +Z 側に来る
  mesh.rotation.set(0, Math.PI / 2, sideZ > 0 ? Math.PI / 2 : 0);
  mesh.position.set(x, yBase, 0);
  return mesh;
}

/* 妻面の半円被覆 */
function gableArcCover(r, xPos, yBase, mat) {
  const s = new THREE.Shape();
  s.moveTo(-r, 0);
  s.absarc(0, 0, r, Math.PI, 0, true);
  s.lineTo(-r, 0);
  const mesh = new THREE.Mesh(new THREE.ShapeGeometry(s, 24), mat);
  mesh.rotation.y = Math.PI / 2;
  mesh.position.set(xPos, yBase, 0);
  return mesh;
}

    const zm19 = Math.sqrt(r*r - 1.9*1.9);

/* --- 切妻(屋根型)骨組の共通ビルダー: Ⅳ類鉄骨 / ガラス室で共用 --- */
/* --- 切妻(屋根型)骨組の共通ビルダー: Ⅳ類鉄骨 / ガラス室で共用(単棟〜3連棟) --- */
function buildGableFrame(opt) {
  const g = new THREE.Group();
  const { W, D, eave, ridge, frameMat, coverKey, foundation, tenmado } = opt;
  const spans = opt.spans || 1;
  const rise = ridge - eave;
  const halfSpan = W / 2;
  const angle = Math.atan2(rise, halfSpan);
  const slopeLen = Math.sqrt(halfSpan * halfSpan + rise * rise);
  const cMat = coverMaterial(coverKey);
  const bay = 2;
  const nFrame = Math.round(D / bay);
  const totalW = W * spans;
  const zRow = [];
  for (let k = 0; k <= spans; k++) zRow.push(-totalW / 2 + k * W);
  const zCenter = (k) => -totalW / 2 + W / 2 + k * W;

  for (let i = 0; i <= nFrame; i++) {
    const x = -D / 2 + (D / nFrame) * i;
    // 柱列: 外側2列=側面、内側=接続側面(要領第4-1(1)エ: 屋根面A面に含める)
    zRow.forEach((z, idx) => {
      const outer = (idx === 0 || idx === spans);
      const part = outer ? (z > 0 ? "側面A" : "側面B") : "屋根面A";
      const member = outer ? "柱" : "接続側面(柱)";
      g.add(tag(pipeBetween(new THREE.Vector3(x, 0, z), new THREE.Vector3(x, eave, z), 0.05, frameMat), part, member));
    });
    for (let k = 0; k < spans; k++) {
      const zc = zCenter(k);
      g.add(tag(pipeBetween(new THREE.Vector3(x, eave, zc - halfSpan), new THREE.Vector3(x, eave, zc + halfSpan), 0.045, frameMat), "屋根面A", "梁"));
      g.add(tag(pipeBetween(new THREE.Vector3(x, eave, zc + halfSpan), new THREE.Vector3(x, ridge, zc), 0.04, frameMat), "屋根面A", "たる木(受け材)"));
      g.add(tag(pipeBetween(new THREE.Vector3(x, eave, zc - halfSpan), new THREE.Vector3(x, ridge, zc), 0.04, frameMat), "屋根面B", "たる木(受け材)"));
    }
    if (foundation === "independent") {
      zRow.forEach((z) => {
        const f = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), MAT.conc);
        f.position.set(x, 0.12, z);
        g.add(tag(f, "基礎", "独立基礎"));
      });
    }
  }
  // 棟木・母屋(棟ごと)
  for (let k = 0; k < spans; k++) {
    const zc = zCenter(k);
    g.add(tag(pipeAlongX(-D/2, D/2, ridge, zc, 0.05, frameMat), "屋根面A", "棟木"));
    [0.42, 0.75].forEach((t) => {
      const y = eave + rise * t, dz = halfSpan * (1 - t);
      g.add(tag(pipeAlongX(-D/2, D/2, y, zc + dz, 0.032, frameMat), "屋根面A", "母屋"));
      g.add(tag(pipeAlongX(-D/2, D/2, y, zc - dz, 0.032, frameMat), "屋根面B", "母屋"));
    });
  }
  // 桁(外側=側面)/接続側面の桁+谷樋(要領第4-1(1)オ: 連棟の樋は屋根面A面)
  zRow.forEach((z, idx) => {
    const outer = (idx === 0 || idx === spans);
    g.add(tag(pipeAlongX(-D/2, D/2, eave, z, 0.045, frameMat), outer ? (z > 0 ? "側面A" : "側面B") : "屋根面A", outer ? "桁" : "接続側面(桁)"));
    if (!outer) {
      const vd = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, D, 10), MAT.pipe);
      vd.rotation.z = Math.PI / 2;
      vd.position.set(0, eave + 0.08, z);
      g.add(tag(vd, "屋根面A", "谷樋"));
    }
  });
  // 胴ぶち・筋かい(外側側面のみ)
  [0.8, 1.6].forEach((y) => {
    g.add(tag(pipeAlongX(-D/2, D/2, y,  totalW / 2, 0.03, frameMat), "側面A", "胴ぶち"));
    g.add(tag(pipeAlongX(-D/2, D/2, y, -totalW / 2, 0.03, frameMat), "側面B", "胴ぶち"));
  });
  [[+1, "側面A"], [-1, "側面B"]].forEach(([sf, part]) => {
    const z = sf * totalW / 2;
    g.add(tag(pipeBetween(new THREE.Vector3( D/2, 0.1, z), new THREE.Vector3( D/2 - bay, eave, z), 0.028, frameMat), part, "筋かい"));
    g.add(tag(pipeBetween(new THREE.Vector3(-D/2, 0.1, z), new THREE.Vector3(-D/2 + bay, eave, z), 0.028, frameMat), part, "筋かい"));
  });
  // 妻面: 間柱・胴ぶち(全幅)
  [[D/2, "妻面A"], [-D/2, "妻面B"]].forEach(([x, part]) => {
    // 棟ごとに等分して棟中心に対し左右対称に配置(両端は柱列と重なるため除く)
    const nSeg = Math.max(2, Math.round(W / 1.5));
    for (let k = 0; k < spans; k++) {
      for (let j = 1; j < nSeg; j++) {
        const z = zCenter(k) - halfSpan + (W / nSeg) * j;
        const dz = Math.abs(z - zCenter(k));
        const yTop = Math.max(ridge - dz * (rise / halfSpan), eave * 0.6);
        g.add(tag(pipeBetween(new THREE.Vector3(x, 0, z), new THREE.Vector3(x, yTop, z), 0.04, frameMat), part, "妻面間柱"));
      }
    }
    [0.9, 1.8].forEach((y) => {
      g.add(tag(pipeBetween(new THREE.Vector3(x, y, -totalW / 2), new THREE.Vector3(x, y, totalW / 2), 0.028, frameMat), part, "妻面胴ぶち"));
    });
  });
  const doorZ = zCenter(Math.floor((spans - 1) / 2));
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.06, 2.0, 1.0), MAT.door);
  door.position.set(D / 2 + 0.04, 1.0, doorZ);
  g.add(tag(door, "妻面A", "出入口戸"));

  if (foundation === "strip") {
    [[ totalW / 2], [-totalW / 2]].forEach(([z]) => {
      const f = new THREE.Mesh(new THREE.BoxGeometry(D + 0.2, 0.3, 0.25), MAT.conc);
      f.position.set(0, 0.15, z);
      g.add(tag(f, "基礎", "布基礎"));
    });
    [[ D / 2], [-D / 2]].forEach(([x]) => {
      const f = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.3, totalW + 0.2), MAT.conc);
      f.position.set(x, 0.15, 0);
      g.add(tag(f, "基礎", "布基礎"));
    });
  }

  // 被覆: 側面(外側2面)
  [[+1, "側面A"], [-1, "側面B"]].forEach(([sf, part]) => {
    const pm = new THREE.Mesh(new THREE.BoxGeometry(D, eave, 0.04), cMat.clone());
    pm.position.set(0, eave / 2, sf * (totalW / 2 + 0.03));
    g.add(tag(pm, part, "被覆材", true));
  });
  // 被覆: 屋根(棟ごと)
  for (let k = 0; k < spans; k++) {
    const zc = zCenter(k);
    [[+1, "屋根面A"], [-1, "屋根面B"]].forEach(([sf, part]) => {
      const pm = new THREE.Mesh(new THREE.BoxGeometry(D + 0.2, 0.04, slopeLen), cMat.clone());
      pm.rotation.x = sf > 0 ? angle : -angle;
      pm.position.set(0, eave + rise / 2 + 0.03, zc + sf * halfSpan / 2);
      g.add(tag(pm, part, "被覆材", true));
    });
  }
  // 被覆: 妻面(矩形全幅+三角×棟数)
  [[D/2, "妻面A"], [-D/2, "妻面B"]].forEach(([x, part]) => {
    const rect = new THREE.Mesh(new THREE.BoxGeometry(0.04, eave, totalW), cMat.clone());
    rect.position.set(x + (x > 0 ? 0.05 : -0.05), eave / 2, 0);
    g.add(tag(rect, part, "被覆材", true));
    for (let k = 0; k < spans; k++) {
      const shp = new THREE.Shape();
      shp.moveTo(-halfSpan, 0); shp.lineTo(halfSpan, 0); shp.lineTo(0, rise); shp.lineTo(-halfSpan, 0);
      const tri = new THREE.Mesh(new THREE.ShapeGeometry(shp), cMat.clone());
      tri.rotation.y = Math.PI / 2;
      tri.position.set(x + (x > 0 ? 0.05 : -0.05), eave, zCenter(k));
      g.add(tag(tri, part, "被覆材", true));
    }
  });

  if (tenmado) {
    const t = 0.78, y = eave + rise * t, zc = zCenter(0);
    const w = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.05, 0.9), coverMaterial(coverKey));
    w.rotation.x = angle;
    w.position.set(2, y + 0.12, zc + halfSpan * (1 - t));
    g.add(tag(w, "屋根面A", "天窓"));
  }
  return { group: g, angle, slopeLen };
}

      { key:"tanidoi", name:"谷樋(連棟)", pos:[0, eave + 0.35, zv], note:"連棟の谷部に設ける樋。要領では連棟の樋は屋根面A面に含めて評価します(第4-1(1)オ)。20-7型(2連)・20-8型(3連)が該当します。" },
      { key:"setsuzoku", name:"接続側面(中柱列)", pos:[3, 1.3, zv], note:"連棟の接続側面に使用されている部材(柱・桁等)は屋根面A面に含めて評価します(第4-1(1)エ)。" },
    );
  }
  return {
    group, camR: 17 + (spans - 1) * 5, targetY: 1.7,
    members,
    dims: [
      { name: spans > 1 ? "間口(1棟分)" : "間口", from:[D / 2 + 0.6, 0.06, -totalW / 2], to:[D / 2 + 0.6, 0.06, -totalW / 2 + W] },
      { name:"奥行", from:[-D / 2, 0.06, totalW / 2 + 0.6], to:[D / 2, 0.06, totalW / 2 + 0.6] },
      { name:"軒高", from:[D / 2 + 0.6, 0, totalW / 2 + 0.2], to:[D / 2 + 0.6, eave, totalW / 2 + 0.2] },
      { name:"棟高", from:[D / 2 + 0.6, 0, zc0], to:[D / 2 + 0.6, ridge, zc0] },
    ],
    parts: ["妻面A","妻面B","側面A","側面B","屋根面A","屋根面B","基礎"],
  };
}

/* --- Ⅵ類 雨よけ施設(80型相当) --- */
function buildAmayoke(coverKey) {
  const g = new THREE.Group();
  const r = 2.7, D = 12, postH = 1.8, ribStep = 1.2, tube = 0.028;
  const cMat = coverMaterial(coverKey);

  const nRib = Math.round(D / ribStep) + 1;
  for (let i = 0; i < nRib; i++) {
    const x = -D/2 + ribStep * i;
    g.add(tag(quarterRib(r, tube, x, postH, +1, MAT.pipe), "屋根面A", "アーチ・パイプ"));
    g.add(tag(quarterRib(r, tube, x, postH, -1, MAT.pipe), "屋根面B", "アーチ・パイプ"));
    [[+1,"側面A"],[-1,"側面B"]].forEach(([s, part]) => {
      g.add(tag(pipeBetween(new THREE.Vector3(x,0,s*r), new THREE.Vector3(x,postH,s*r), 0.026, MAT.pipe), part, "支柱"));
    });
  }
  g.add(tag(pipeAlongX(-D/2, D/2, postH + r, 0, 0.026, MAT.pipe), "屋根面A", "母屋(直管)"));
  g.add(tag(pipeAlongX(-D/2, D/2, postH, r, 0.026, MAT.pipe), "側面A", "桁(直管)"));
  g.add(tag(pipeAlongX(-D/2, D/2, postH, -r, 0.026, MAT.pipe), "側面B", "桁(直管)"));

  g.add(tag(new THREE.Mesh(archSkinGeometry(r+0.02, D, 0, Math.PI/2, 2, 14), cMat.clone()), "屋根面A", "被覆材", true).translateY(postH));
  g.add(tag(new THREE.Mesh(archSkinGeometry(r+0.02, D, Math.PI/2, Math.PI, 2, 14), cMat.clone()), "屋根面B", "被覆材", true).translateY(postH));

  return {
    group: g, camR: 13, targetY: 2.0,
    members: [
      { key:"cover", name:"被覆(屋根面のみ)", pos:[-2, postH+2.5, -0.9], note:"雨よけ施設(80-1〜80-18型、Ⅵ類)は屋根面のみが被覆され、被覆面積構成割合は屋根面A・B各50%です(別表3)。側面は開放されています。" },
      { key:"arch", name:"アーチ・パイプ", pos:[1, postH+2.1, 1.4], note:"80型の被覆面積算定係数・部材別価額割合は、骨組が対応する30〜62型の値を準用します(別表3・別表5の備考)。" },
      { key:"post", name:"支柱", pos:[3, 0.9, 2.75], note:"損害評価では部材ごとに取替数・補修数を調査し、取替割合(取替数/総使用数)と補修割合(補修数/総使用数×0.7)を算出します。" },
    ],
    dims: [
      { name:"間口", from:[D/2+0.6, 0.06, -r], to:[D/2+0.6, 0.06, r] },
      { name:"奥行", from:[-D/2, 0.06, r+0.6], to:[D/2, 0.06, r+0.6] },
      { name:"軒高", from:[D/2+0.6, 0, r+0.25], to:[D/2+0.6, postH, r+0.25] },
      { name:"棟高", from:[D/2+0.6, 0, 0], to:[D/2+0.6, postH+r, 0] },
    ],
    parts: ["側面A","側面B","屋根面A","屋根面B"],
  };
}

/* --- Ⅶ類 多目的ネットハウス(平型・90-1型相当) --- */
function buildNetHouse(coverKey) {
  const g = new THREE.Group();
  const D = 20, W = 14, wallH = 2.6, poleH = 4.2;
  const cMat = coverMaterial(coverKey);

  // 周囲柱・隅柱
  const zSides = [-W/2, W/2], xSides = [-D/2, D/2];
  for (let k = 0; k <= 6; k++) {
    const x = -D/2 + (D/6)*k;
    zSides.forEach((z) => {
      const corner = (k === 0 || k === 6);
      const h = corner ? 3.0 : 2.8;
      const p = pipeBetween(new THREE.Vector3(x,0,z), new THREE.Vector3(x,h,z), corner?0.05:0.038, MAT.pipe);
      g.add(tag(p, "周囲面", corner ? "隅柱" : "周囲柱"));
    });
  }
  for (let k = 1; k <= 3; k++) {
    const z = -W/2 + (W/4)*k;
    xSides.forEach((x) => {
      g.add(tag(pipeBetween(new THREE.Vector3(x,0,z), new THREE.Vector3(x,2.8,z), 0.038, MAT.pipe), "周囲面", "周囲柱"));
    });
  }
  // 周囲線(上下2段)
  [wallH, 1.3].forEach((y) => {
    g.add(tag(pipeAlongX(-D/2, D/2, y,  W/2, 0.012, MAT.wire), "周囲面", "周囲線"));
    g.add(tag(pipeAlongX(-D/2, D/2, y, -W/2, 0.012, MAT.wire), "周囲面", "周囲線"));
    g.add(tag(pipeBetween(new THREE.Vector3( D/2,y,-W/2), new THREE.Vector3( D/2,y,W/2), 0.012, MAT.wire), "周囲面", "周囲線"));
    g.add(tag(pipeBetween(new THREE.Vector3(-D/2,y,-W/2), new THREE.Vector3(-D/2,y,W/2), 0.012, MAT.wire), "周囲面", "周囲線"));
  });
  // 中つり柱・受石・つり線
  const px = [-D/3, 0, D/3], pz = [-W/3, 0, W/3];
  px.forEach((x) => pz.forEach((z) => {
    g.add(tag(pipeBetween(new THREE.Vector3(x,0,z), new THREE.Vector3(x,poleH,z), 0.05, MAT.pipe), "天井面", "中つり柱"));
    const st = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.22,0.4), MAT.stone);
    st.position.set(x, 0.08, z);
    g.add(tag(st, "基礎", "受石"));
    [[x+3.3,z],[x-3.3,z],[x,z+3.3],[x,z-3.3]].forEach(([tx,tz]) => {
      g.add(tag(pipeBetween(new THREE.Vector3(x,poleH,z), new THREE.Vector3(tx,wallH,tz), 0.008, MAT.wire), "天井面", "つり線"));
    });
  }));
  // 幹線(天井の格子ワイヤー)
  pz.forEach((z) => g.add(tag(pipeAlongX(-D/2, D/2, wallH, z, 0.012, MAT.wire), "天井面", "幹線")));
  px.forEach((x) => g.add(tag(pipeBetween(new THREE.Vector3(x,wallH,-W/2), new THREE.Vector3(x,wallH,W/2), 0.012, MAT.wire), "天井面", "幹線")));
  // 控え線・アンカー(四隅)
  [[ D/2, W/2, 2.2, 1.8],[ D/2,-W/2, 2.2,-1.8],[-D/2, W/2,-2.2, 1.8],[-D/2,-W/2,-2.2,-1.8]].forEach(([cx,cz,ox,oz]) => {
    g.add(tag(pipeBetween(new THREE.Vector3(cx,3.0,cz), new THREE.Vector3(cx+ox,0,cz+oz), 0.01, MAT.wire), "周囲面", "控え線"));
    const a = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.35,6), MAT.steel);
    a.position.set(cx+ox, 0.05, cz+oz);
    g.add(tag(a, "基礎", "アンカー"));
  });
  // ネット(周囲面・天井面)
  [[0,wallH/2, W/2, D, wallH, 0],[0,wallH/2,-W/2, D, wallH, 0]].forEach(([x,y,z,lw,lh]) => {
    const n = new THREE.Mesh(new THREE.PlaneGeometry(lw, lh), cMat.clone());
    n.position.set(x,y,z);
    g.add(tag(n, "周囲面", "ネット(周囲面)", true));
  });
  xSides.forEach((x) => {
    const n = new THREE.Mesh(new THREE.PlaneGeometry(W, wallH), cMat.clone());
    n.rotation.y = Math.PI/2;
    n.position.set(x, wallH/2, 0);
    g.add(tag(n, "周囲面", "ネット(周囲面)", true));
  });
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(D, W), cMat.clone());
  ceil.rotation.x = -Math.PI/2;
  ceil.position.set(0, wallH, 0);
  g.add(tag(ceil, "天井面", "ネット(天井面)", true));

  return {
    group: g, camR: 30, targetY: 1.8,
    members: [
      { key:"shuui", name:"周囲柱・隅柱・周囲線", pos:[D/2+0.1, 1.5, 3.5], note:"周囲面の部材。Ⅶ類(多目的ネットハウス)は妻面・側面・屋根面ではなく、周囲面・天井面・基礎の3区分で評価します(第4-1(1)ア)。" },
      { key:"tenjo", name:"中つり柱・幹線・つり線", pos:[0, 3.6, 0], note:"天井面の部材。90-1型の主要骨材はφ76.3mm(一般)・φ48.6mm(耐久性)級の支柱です。※足場・足場用補強柱等は本モデルでは省略しています。" },
      { key:"hikae", name:"控え線", pos:[D/2+1.2, 1.4, W/2+1.0], note:"控え線は周囲面に含まれる部材です(別表5・90-1型)。" },
      { key:"kiso", name:"受石・アンカー", pos:[D/3, 0.25, W/3], note:"基礎の部材(受石・アンカー)。Ⅶ類のアンカーの被害態様は のび・まがり・引抜け・移動 で評価します。" },
      { key:"net", name:"多目的ネット", pos:[-D/2-0.1, 1.3, 0], note:"被覆面積構成割合は周囲面23.2%・天井面76.8%(別表3・90-1型)。ネットも「新たに被覆を要する面積が80%以上なら100%」の扱いは同様です。" },
    ],
    dims: [
      { name:"間口", from:[D/2+0.9, 0.06, -W/2], to:[D/2+0.9, 0.06, W/2] },
      { name:"奥行", from:[-D/2, 0.06, W/2+0.9], to:[D/2, 0.06, W/2+0.9] },
    ],
    parts: ["周囲面","天井面","基礎"],
  };
}

/* ============================================================
   施設内農作物(ボタンで表示)
   園芸施設共済では、施設内農作物は特定園芸施設にあわせて選択して加入する共済目的。
   区分を「施設内農作物」として施設本体と分ける。株・葉・果実は同じ形が多数並ぶため InstancedMesh で描く
============================================================ */
const CROPS = {
  tomato:     { label: "トマト(誘引栽培)", member: "施設内農作物(トマト)", pitch: 1.20, bed: 0.60 },
  strawberry: { label: "イチゴ(高設栽培)", member: "施設内農作物(イチゴ)", pitch: 1.10, bed: 0.35 },
  leafy:      { label: "葉物(ホウレンソウ等)", member: "施設内農作物(葉物)", pitch: 1.50, bed: 1.20 },
  flower:     { label: "花き(キク)",       member: "施設内農作物(キク)", pitch: 1.40, bed: 1.00 },
};
// 型式ごとの作付けできる範囲(妻面の出入口前は通路として空ける)と、位置 z での屋根下の高さ
function cropArea(typeKey, spans) {
  const r = 2.7;
  switch (typeKey) {
    case "pipe":    return { x0: -5.2, x1: 5.2, z0: -1.9, z1: 1.9, hAt: (z) => Math.sqrt(Math.max(r * r - z * z, 0)) };
    case "amayoke": return { x0: -5.2, x1: 5.2, z0: -2.2, z1: 2.2, hAt: (z) => 1.8 + Math.sqrt(Math.max(r * r - z * z, 0)) };
    case "steel":
    case "glass":   { const hw = 4 * (spans || 1) - 0.7; return { x0: -6.2, x1: 6.2, z0: -hw, z1: hw, hAt: () => 2.4 }; }
    default:        return { x0: -9.0, x1: 9.0, z0: -6.2, z1: 6.2, hAt: () => 2.6 };   // 多目的ネットハウス
  }
}
let _cropM = null;
function cropMats() {
  if (_cropM) return _cropM;
  const S = (color, roughness = 0.8, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness, ...extra });
  _cropM = {
    soil: S(0x6b4f36, 1.0), mulch: S(0x2b2b2b, 0.6), leaf: S(0xffffff, 0.75), stem: S(0x55803a, 0.8),
    tomato: S(0xd8322a, 0.35), berry: S(0xc81e2d, 0.4), trough: S(0xe4e7ea, 0.5), leg: S(0x9aa1a8, 0.45, { metalness: 0.5 }),
    string: S(0xf1f1ec, 0.9), wire: S(0x94a3b8, 0.4, { metalness: 0.6 }), flower: S(0xffffff, 0.7), net: S(0xf5f5f0, 0.9),
  };
  return _cropM;
}
// 同じ形を多数置く(matrices: THREE.Matrix4 の配列、colors: 株ごとの色のばらつき)
function instanced(geo, mat, matrices, colors) {
  const m = new THREE.InstancedMesh(geo, mat, Math.max(1, matrices.length));
  matrices.forEach((mx, i) => m.setMatrixAt(i, mx));
  if (colors) colors.forEach((c, i) => m.setColorAt(i, c));
  m.count = matrices.length;
  m.instanceMatrix.needsUpdate = true;
  if (m.instanceColor) m.instanceColor.needsUpdate = true;
  return m;
}
function buildCrops(cropKey, typeKey, spans) {
  const C = CROPS[cropKey], M = cropMats(), A = cropArea(typeKey, spans);
  const g = new THREE.Group();
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const mx = (x, y, z, sx = 1, sy = 1, sz = 1, ry = 0) =>
    new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, ry, 0)), new THREE.Vector3(sx, sy, sz));
  const green = (l) => new THREE.Color().setHSL(0.27 + rnd() * 0.05, 0.45 + rnd() * 0.15, l + rnd() * 0.08);
  const L = A.x1 - A.x0, cxm = (A.x0 + A.x1) / 2;
  const nRow = Math.max(1, Math.floor((A.z1 - A.z0) / C.pitch) + 1);
  const rows = [...Array(nRow)].map((_, i) => (A.z0 + A.z1) / 2 + (i - (nRow - 1) / 2) * C.pitch);
  const add = (mesh, member) => { g.add(tag(mesh, "施設内農作物", member)); return mesh; };
  const bedMember = cropKey === "strawberry" ? "高設栽培ベンチ" : "畝・マルチ";
  const beds = [], mulch = [];
  const leafM = [], leafC = [], stemM = [], fruitM = [], extraM = [], extra2M = [];
  const leafGeo = new THREE.IcosahedronGeometry(1, 0);

  if (cropKey === "tomato") {
    rows.forEach((z) => {
      beds.push(mx(cxm, 0.09, z, L, 0.18, C.bed)); mulch.push(mx(cxm, 0.185, z, L, 0.01, C.bed + 0.02));
      const hMax = Math.min(1.8, A.hAt(Math.abs(z)) - 0.25);
      extraM.push(mx(cxm, hMax + 0.12, z, L, 0.012, 0.012));                            // 誘引線(棚線)
      for (let x = A.x0 + 0.2; x <= A.x1 - 0.2; x += 0.40) {
        const h = hMax * (0.9 + rnd() * 0.1);
        stemM.push(mx(x, 0.19 + h / 2, z, 0.018, h, 0.018));
        extra2M.push(mx(x, 0.19 + (hMax + 0.12 - 0.19) / 2, z + 0.02, 0.004, hMax - 0.07, 0.004));   // 誘引ひも
        for (let k = 0; k < 5; k++) {
          const y = 0.45 + k * (h - 0.4) / 4.5;
          leafM.push(mx(x + (rnd() - 0.5) * 0.1, y, z + (rnd() - 0.5) * 0.2, 0.22, 0.09, 0.2, rnd() * 6.28)); leafC.push(green(0.26));
        }
        [0.55, 0.85, 1.15].filter((y) => y < h).forEach((y) => {                          // 果房(下から赤く色づく)
          for (let k = 0; k < 4; k++) fruitM.push(mx(x + (rnd() - 0.5) * 0.12, y + (rnd() - 0.5) * 0.08, z + (rnd() - 0.5) * 0.14, 0.04, 0.04, 0.04));
        });
      }
    });
    add(instanced(new THREE.CylinderGeometry(1, 1, 1, 6), M.stem, stemM), C.member);
    add(instanced(leafGeo, M.leaf, leafM, leafC), C.member);
    add(instanced(new THREE.SphereGeometry(1, 8, 6), M.tomato, fruitM), C.member);
    add(instanced(new THREE.BoxGeometry(1, 1, 1), M.wire, extraM), "誘引線・誘引ひも");
    add(instanced(new THREE.BoxGeometry(1, 1, 1), M.string, extra2M), "誘引線・誘引ひも");
  } else if (cropKey === "strawberry") {
    // 高設ベンチ(地上約0.9m)に2条植え。果実は栽培槽の外側へ垂らす
    const benchY = 0.9;
    rows.forEach((z) => {
      beds.push(mx(cxm, benchY - 0.12, z, L, 0.24, C.bed));
      for (let x = A.x0 + 0.3; x <= A.x1 - 0.3; x += 1.5) [-1, 1].forEach((s) => extraM.push(mx(x, (benchY - 0.24) / 2, z + s * 0.14, 0.03, benchY - 0.24, 0.03)));
      [-1, 1].forEach((s) => {
        for (let x = A.x0 + 0.1; x <= A.x1 - 0.1; x += 0.22) {
          const zz = z + s * 0.09;
          leafM.push(mx(x, benchY + 0.07, zz + s * 0.02, 0.15, 0.08, 0.14, rnd() * 6.28)); leafC.push(green(0.24));
          leafM.push(mx(x + 0.05, benchY + 0.1, zz, 0.1, 0.06, 0.1, rnd() * 6.28)); leafC.push(green(0.28));
          for (let k = 0; k < 2; k++) fruitM.push(mx(x + (rnd() - 0.5) * 0.15, benchY - 0.02 - rnd() * 0.12, z + s * (C.bed / 2 + 0.03), 0.028, 0.034, 0.028));
        }
      });
    });
    add(instanced(leafGeo, M.leaf, leafM, leafC), C.member);
    add(instanced(new THREE.SphereGeometry(1, 8, 6), M.berry, fruitM), C.member);
    add(instanced(new THREE.BoxGeometry(1, 1, 1), M.leg, extraM), bedMember);
  } else if (cropKey === "leafy") {
    rows.forEach((z) => {
      beds.push(mx(cxm, 0.08, z, L, 0.16, C.bed));
      for (let x = A.x0 + 0.1; x <= A.x1 - 0.1; x += 0.16)
        for (let zz = z - C.bed / 2 + 0.1; zz <= z + C.bed / 2 - 0.1; zz += 0.16) {
          leafM.push(mx(x + (rnd() - 0.5) * 0.04, 0.2, zz + (rnd() - 0.5) * 0.04, 0.075, 0.05, 0.075, rnd() * 6.28)); leafC.push(green(0.28));
        }
    });
    add(instanced(leafGeo, M.leaf, leafM, leafC), C.member);
  } else {
    // キク: 株を密に植え、倒伏防止のフラワーネットを張る
    rows.forEach((z) => {
      beds.push(mx(cxm, 0.08, z, L, 0.16, C.bed));
      // フラワーネット(15cm目の網を2段に水平に張る)。長手の糸と横糸を細い棒で格子に組む
      [0.45, 0.75].forEach((y) => {
        for (let zz = z - C.bed / 2; zz <= z + C.bed / 2 + 1e-6; zz += C.bed / 6) extra2M.push(mx(cxm, y, zz, L, 0.004, 0.004));
        for (let x = A.x0; x <= A.x1 + 1e-6; x += 0.15) extra2M.push(mx(x, y, z, 0.004, 0.004, C.bed));
      });
      for (let x = A.x0 + 0.1; x <= A.x1 - 0.1; x += 0.15)
        for (let zz = z - C.bed / 2 + 0.1; zz <= z + C.bed / 2 - 0.1; zz += 0.2) {
          const h = 0.8 + rnd() * 0.15;
          stemM.push(mx(x, 0.16 + h / 2, zz, 0.008, h, 0.008));
          leafM.push(mx(x, 0.16 + h * 0.55, zz, 0.07, 0.12, 0.07, rnd() * 6.28)); leafC.push(green(0.24));
          fruitM.push(mx(x, 0.16 + h + 0.02, zz, 0.045, 0.03, 0.045));
          extraM.push(new THREE.Color().setHSL(0.13 + rnd() * 0.03, 0.8, 0.55));
        }
    });
    add(instanced(new THREE.CylinderGeometry(1, 1, 1, 5), M.stem, stemM), C.member);
    add(instanced(leafGeo, M.leaf, leafM, leafC), C.member);
    add(instanced(new THREE.SphereGeometry(1, 8, 6), M.flower, fruitM, extraM), C.member);
    add(instanced(new THREE.BoxGeometry(1, 1, 1), M.net, extra2M), "フラワーネット");
  }
  add(instanced(new THREE.BoxGeometry(1, 1, 1), cropKey === "strawberry" ? M.trough : M.soil, beds), bedMember);
  if (mulch.length) add(instanced(new THREE.BoxGeometry(1, 1, 1), M.mulch, mulch), bedMember);
  g.userData.center = [cxm, 1.2, rows[0]];
  return g;
}

  `${part ? part + "の" : ""}部材「${name}」。部材ごとに取替え又は補修を要するかを調査し、取替割合(取替数/総使用数)・補修割合(補修数/総使用数×0.7)を算出、別表5の部材別価額割合を乗じて損害程度割合を求めます。`;

/* ============================================================
   部材の個別分割: モデルの実データから部材名ごとにエントリを自動生成
============================================================ */
function buildDetailedMembers() {
  const map = new Map();
  modelGroup.updateMatrixWorld(true);
  modelGroup.traverse((m) => {
    if (!m.isMesh || !m.userData.member) return;
    const name = m.userData.member;
    if (name.indexOf("DMG") === 0) return;           // 被害エントリは対象外
    if (!map.has(name)) map.set(name, { box: new THREE.Box3(), part: m.userData.part || "", count: 0 });
    const e = map.get(name);
    const g = m.geometry.clone().applyMatrix4(m.matrixWorld);
    g.computeBoundingBox();
    e.box.union(g.boundingBox);
    e.count++;
  });
  const out = [];
  let i = 0;
  for (const [name, e] of map) {
    if (e.count === 0 || e.box.isEmpty()) continue;
    i++;
    const c = e.box.getCenter(new THREE.Vector3());
    const flat = new THREE.Vector3(c.x, 0, c.z);
    let pos;
    if (flat.length() < 0.4) pos = [c.x, e.box.max.y + 0.3, c.z];
    else { flat.normalize().multiplyScalar(0.55); pos = [c.x + flat.x, c.y, c.z + flat.z]; }
    const note = DETAIL_NOTES[name] || DETAIL_FALLBACK(name, e.part, e.count);
    out.push({ key: "dp" + i, part: e.part, name: name + (e.count > 1 ? " ×" + e.count : ""), targets: [name],
               pos, note: note + `\n\n(この部材の使用数: ${e.count}${e.part ? " / 区分: " + e.part : ""})` });
  }
  return out;
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function tagAll(obj, part, member, isCover) {

function tearMesh(size, rng, withFlap) {
  const grp = new THREE.Group();
  const shp = new THREE.Shape();
  const n = 9;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const rr = size * (0.45 + rng() * 0.55);
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
    if (i) shp.lineTo(px, py); else shp.moveTo(px, py);
  }
  shp.closePath();
  grp.add(new THREE.Mesh(new THREE.ShapeGeometry(shp), dmgHoleMat));
  if (withFlap) {
    const f = new THREE.Shape();
    f.moveTo(0, 0); f.lineTo(size * 0.9, size * 0.25); f.lineTo(size * 0.55, size * 0.75); f.closePath();
    const fm = new THREE.Mesh(new THREE.ShapeGeometry(f), dmgFlapMat);
    fm.position.set(size * 0.15, size * 0.1, 0.015);
    fm.rotation.z = rng() * 1.5;
    grp.add(fm);
  }
  return grp;
}
function crackMesh(size, rng) {
  const grp = new THREE.Group();
  const n = 6 + ((rng() * 3) | 0);
  for (let i = 0; i < n; i++) {
    const a = rng() * Math.PI * 2;
    const len = size * (0.5 + rng() * 0.7);
    const b = new THREE.Mesh(new THREE.BoxGeometry(len, 0.016, 0.006), dmgCrackMat);
    b.position.set(Math.cos(a) * len / 2, Math.sin(a) * len / 2, 0);
    b.rotation.z = a;
    grp.add(b);
  }
  const c = new THREE.Mesh(new THREE.CircleGeometry(0.05, 10), dmgCrackMat);
  grp.add(c);
  return grp;
}
function placeOnSurface(obj, pos, normal) {
  obj.position.copy(pos.clone().addScaledVector(normal, 0.025));
  obj.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal.clone().normalize());
  return obj;
}
function beamEndpoints(m) {
  const len = m.geometry.parameters.height;
  const half = new THREE.Vector3(0, 1, 0).applyQuaternion(m.quaternion).multiplyScalar(len / 2);
  return [m.position.clone().sub(half), m.position.clone().add(half)];
}
function addBentArc(parent, r, x, yBase, sideZ, tube, mat, part, member, rng, topDent) {
  const phi0 = sideZ > 0 ? 0 : Math.PI / 2, phi1 = phi0 + Math.PI / 2;
  const dentPhi = topDent ? (Math.PI / 2 + (rng() - 0.5) * 0.2) : (phi0 + 0.3 + rng() * (Math.PI / 2 - 0.6));
  const depth = 0.3 + rng() * 0.25;
  const N = 10, pts = [];
  for (let i = 0; i <= N; i++) {
    const ph = phi0 + ((phi1 - phi0) * i) / N;
    const d = Math.max(0, 1 - Math.abs(ph - dentPhi) / 0.4);
    const rr = r - d * d * depth;
    pts.push(new THREE.Vector3(x, yBase + rr * Math.sin(ph), rr * Math.cos(ph)));
  }
  for (let i = 0; i < N; i++) parent.add(tag(pipeBetween(pts[i], pts[i + 1], tube, mat), part, member));
  // 大雪では凹みを頂部(アーチの端)付近に置くため、範囲外にならないよう端に寄せる
  return pts[Math.max(0, Math.min(N, Math.round(N * ((dentPhi - phi0) / (phi1 - phi0)))))];
}
function addSagged(parent, p1, p2, rr, mat, part, member, sag, sideways) {
  const mid = p1.clone().add(p2).multiplyScalar(0.5);
  if (sideways) mid.z += sag * (mid.z >= 0 ? 1 : -1); else mid.y -= sag;
  parent.add(tag(pipeBetween(p1, mid, rr, mat), part, member));
  parent.add(tag(pipeBetween(mid, p2, rr, mat), part, member));
  return mid;
}
function collectByMember(name, geomType) {
  const out = [];
  modelGroup.traverse((m) => {
    if (m.isMesh && m.userData.member === name && (!geomType || m.geometry.type === geomType)) out.push(m);
  });
  return out;
}
function pick(arr, rng) { return arr.length ? arr[(rng() * arr.length) | 0] : null; }

function applyDamage() {
  const damages = [];
  if (state.dmgScenario === "none") return damages;
  const rng = mulberry32(state.dmgSeed * 7919 + (state.dmgScenario === "typhoon" ? 131 : 977));
  const tkey = state.typeKey;
  const spans = TYPES[tkey].spansSelectable ? state.spans : 1;
  let idx = 0;
  const reg = (label, kind, pos, targetMember, part) => {
    idx++;
    damages.push({ key: "dmg" + idx, isDamage: true, name: `被害${idx}: ${label}`,
      targets: [targetMember], pos: [pos.x, pos.y, pos.z], note: DMG_NOTES[kind] });
    return targetMember;
  };
  const addTearAt = (label, part, pos, normal, size, withFlap) => {
    const member = "DMG" + (idx + 1) + ":" + label;
    const t = placeOnSurface(tearMesh(size, rng, withFlap), pos, normal);
    tagAll(t, part, member, true);
    modelGroup.add(t);
    reg(label + "(" + part + ")", label.includes("ネット") || label.includes("破れ") ? "tear" : "tear", pos.clone().addScaledVector(normal, 0.25), member, part);
  };
  const addCrackAt = (label, part, pos, normal, size, kind) => {
    const member = "DMG" + (idx + 1) + ":" + label;
    const c = kind === "pane"
      ? placeOnSurface(tagAll(new THREE.Group().add(new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.7), dmgHoleMat)) || new THREE.Group(), part, member, true), pos, normal)
      : placeOnSurface(crackMesh(size, rng), pos, normal);
    if (kind !== "pane") tagAll(c, part, member, true);
    modelGroup.add(c);
    reg(label + "(" + part + ")", kind, pos.clone().addScaledVector(normal, 0.25), member, part);
  };
  const bendArcOf = (memberName, label, yBase, rr, mat, topDent) => {
    const ribs = collectByMember(memberName, "TorusGeometry");
    const m = pick(ribs, rng);
    if (!m) return;
    const x = m.position.x;
    const sideZ = Math.abs(m.rotation.z) > 0.1 ? 1 : -1;
    const part = m.userData.part;
    const member = "DMG" + (idx + 1) + ":" + label;
    m.parent.remove(m);
    const dentPos = addBentArc(modelGroup, rr, x, yBase, sideZ, 0.032, mat, part, member, rng, topDent);
    reg(label + "(" + part + ")", "fold", dentPos.clone().add(new THREE.Vector3(0, 0.15, 0)), member, part);
  };
  const sagStraightOf = (memberName, label, mat, sag, sideways) => {
    const cands = collectByMember(memberName, "CylinderGeometry").filter((m) => m.geometry.parameters.height > 2);
    const m = pick(cands, rng);
    if (!m) return;
    const [p1, p2] = beamEndpoints(m);
    const part = m.userData.part;
    const rr = m.geometry.parameters.radiusTop;
    const member = "DMG" + (idx + 1) + ":" + label;
    m.parent.remove(m);
    const mid = addSagged(modelGroup, p1, p2, rr, mat, part, member, sag, sideways);
    reg(label + "(" + part + ")", "bend", mid.clone().add(new THREE.Vector3(0, 0.2, 0)), member, part);
  };
  const kinkPostOf = (memberName, label, mat) => {
    const cands = collectByMember(memberName, "CylinderGeometry");
    const m = pick(cands, rng);
    if (!m) return;
    const [pLow, pHigh] = beamEndpoints(m).sort((a, b) => a.y - b.y);
    const part = m.userData.part;
    const rr = m.geometry.parameters.radiusTop;
    const member = "DMG" + (idx + 1) + ":" + label;
    m.parent.remove(m);
    const mid = pLow.clone().lerp(pHigh, 0.55);
    mid.x += 0.22 * (rng() < 0.5 ? -1 : 1);
    modelGroup.add(tag(pipeBetween(pLow, mid, rr, mat), part, member));
    modelGroup.add(tag(pipeBetween(mid, pHigh.clone().add(new THREE.Vector3(mid.x - pHigh.x, 0, 0).multiplyScalar(0.5)), rr, mat), part, member));
    reg(label + "(" + part + ")", "fold", mid.clone().add(new THREE.Vector3(0, 0.15, 0)), member, part);
  };

  const T = state.dmgScenario === "typhoon";
  if (tkey === "pipe") {
    const r = 2.7, D = 12;
    const nT = T ? 2 + ((rng() * 2) | 0) : 1;
    for (let i = 0; i < nT; i++) {
      const ph = T ? 0.5 + rng() * 2.1 : Math.PI / 2 + (rng() - 0.5) * 0.5;
      const x = -5 + rng() * 10;
      const pos = new THREE.Vector3(x, r * Math.sin(ph), r * Math.cos(ph));
      const nrm = new THREE.Vector3(0, Math.sin(ph), Math.cos(ph));
      addTearAt("被覆材の破れ", ph < Math.PI / 2 ? "側屋根面A" : "側屋根面B", pos, nrm, 0.45 + rng() * 0.25, true);
    }
    const nB = T ? 1 + ((rng() * 2) | 0) : 2;
    for (let i = 0; i < nB; i++) bendArcOf("アーチ・パイプ", "アーチ・パイプの腰折れ", 0, r, MAT.pipe, !T);
    if (T && rng() > 0.4) {
      const gx = rng() < 0.5 ? D / 2 + 0.08 : -(D / 2 + 0.08);
      addTearAt("妻面被覆の破れ", gx > 0 ? "妻面A" : "妻面B",
        new THREE.Vector3(gx, 1.0 + rng() * 1.0, (rng() - 0.5) * 2.4), new THREE.Vector3(Math.sign(gx), 0, 0), 0.35, true);
    }
    if (!T) sagStraightOf("母屋(直管)", "母屋(直管)のまがり", MAT.pipe, 0.3, false);
  }
  if (tkey === "steel" || tkey === "glass") {
    const W = 8, D = 14, eave = tkey === "steel" ? 2.4 : 2.6, ridge = tkey === "steel" ? 4.0 : 4.3;
    const rise = ridge - eave, totalW = W * spans;
    const slopePt = () => {
      const k = (rng() * spans) | 0, sf = rng() < 0.5 ? 1 : -1, u = 0.15 + rng() * 0.65;
      const zc = -totalW / 2 + W / 2 + k * W;
      const pos = new THREE.Vector3(-6 + rng() * 12, eave + rise * u + 0.06, zc + sf * (W / 2) * (1 - u));
      const ang = Math.atan2(rise, W / 2);
      const nrm = new THREE.Vector3(0, Math.cos(ang), sf * Math.sin(ang));
      return { pos, nrm, part: sf > 0 ? "屋根面A" : "屋根面B" };
    };
    if (tkey === "steel") {
      const nT = T ? 2 : 1;
      for (let i = 0; i < nT; i++) { const sp = slopePt(); addTearAt("被覆材の破れ", sp.part, sp.pos, sp.nrm, 0.5, true); }
      if (T) {
        const sf = rng() < 0.5 ? 1 : -1;
        addTearAt("被覆材の破れ", sf > 0 ? "側面A" : "側面B",
          new THREE.Vector3(-5 + rng() * 10, 0.6 + rng() * 1.4, sf * (totalW / 2 + 0.06)), new THREE.Vector3(0, 0, sf), 0.42, true);
        sagStraightOf("胴ぶち", "胴ぶちのまがり", MAT.steel, 0.22, true);
      } else {
        sagStraightOf("母屋", "母屋のまがり", MAT.steel, 0.3, false);
        sagStraightOf("母屋", "母屋のまがり", MAT.steel, 0.25, false);
      }
    } else {
      const nC = 2;
      for (let i = 0; i < nC; i++) { const sp = slopePt(); addCrackAt("ガラスのひび割れ", sp.part, sp.pos, sp.nrm, 0.45, "glass"); }
      const sf = rng() < 0.5 ? 1 : -1;
      if (T) addCrackAt("ガラスのひび割れ", sf > 0 ? "側面A" : "側面B",
        new THREE.Vector3(-5 + rng() * 10, 0.8 + rng() * 1.4, sf * (totalW / 2 + 0.06)), new THREE.Vector3(0, 0, sf), 0.4, "glass");
      const sp2 = slopePt();
      addCrackAt("ガラスの脱落", sp2.part, sp2.pos, sp2.nrm, 0.4, "pane");
      if (!T) sagStraightOf("母屋", "母屋のまがり", MAT.steelW, 0.25, false);
    }
  }
  if (tkey === "amayoke") {
    const r = 2.7, postH = 1.8;
    const nT = T ? 2 : 1;
    for (let i = 0; i < nT; i++) {
      const ph = T ? 0.6 + rng() * 1.9 : Math.PI / 2 + (rng() - 0.5) * 0.4;
      const x = -5 + rng() * 10;
      const pos = new THREE.Vector3(x, postH + r * Math.sin(ph), r * Math.cos(ph));
      const nrm = new THREE.Vector3(0, Math.sin(ph), Math.cos(ph));
      addTearAt("被覆材の破れ", ph < Math.PI / 2 ? "屋根面A" : "屋根面B", pos, nrm, 0.45, true);
    }
    const nB = T ? 1 : 2;
    for (let i = 0; i < nB; i++) bendArcOf("アーチ・パイプ", "アーチ・パイプの腰折れ", postH, r, MAT.pipe, !T);
    if (T) kinkPostOf("支柱", "支柱の腰折れ", MAT.pipe);
  }
  if (tkey === "net") {
    const D = 20, W = 14, wallH = 2.6;
    if (T) {
      for (let i = 0; i < 2; i++) {
        const face = (rng() * 4) | 0;
        let pos, nrm, part = "周囲面";
        if (face < 2) { const sf = face === 0 ? 1 : -1; pos = new THREE.Vector3(-8 + rng() * 16, 0.7 + rng() * 1.5, sf * W / 2); nrm = new THREE.Vector3(0, 0, sf); }
        else { const sf = face === 2 ? 1 : -1; pos = new THREE.Vector3(sf * D / 2, 0.7 + rng() * 1.5, -5 + rng() * 10); nrm = new THREE.Vector3(sf, 0, 0); }
        addTearAt("ネットの破れ", part, pos, nrm, 0.55, false);
      }
      kinkPostOf("周囲柱", "周囲柱の腰折れ", MAT.pipe);
      for (let i = 0; i < 2; i++) {
        const wires = collectByMember("つり線", "CylinderGeometry");
        const m = pick(wires, rng);
        if (!m) break;
        const [pLow, pHigh] = beamEndpoints(m).sort((a, b) => a.y - b.y);
        m.parent.remove(m);
        const member = "DMG" + (idx + 1) + ":つり線の切断";
        const hang = pHigh.clone().add(new THREE.Vector3(0.08, -0.7, 0.08));
        modelGroup.add(tag(pipeBetween(pHigh, hang, 0.008, MAT.wire), "天井面", member));
        reg("つり線の切断(天井面)", "cut", pHigh.clone().add(new THREE.Vector3(0, 0.15, 0)), member, "天井面");
      }
    } else {
      addTearAt("ネットの破れ", "天井面",
        new THREE.Vector3(-7 + rng() * 14, wallH + 0.01, -5 + rng() * 10), new THREE.Vector3(0, 1, 0), 0.6, false);
      sagStraightOf("幹線", "幹線のまがり(たるみ)", MAT.wire, 0.35, false);
      kinkPostOf("中つり柱", "中つり柱の腰折れ", MAT.pipe);
    }
  }
  return damages;
}

function selectedTargets() {
  if (!state.selectedMember) return null;
  const entry = currentDef && currentDef.members.find((x) => x.key === state.selectedMember);
  if (entry && entry.targets) return new Set(entry.targets);
  const t = MEMBER_TARGETS[state.typeKey + ":" + state.selectedMember];
  return t ? new Set(t) : null;
}

/* ============================================================
   部材ごとの色分け(柱・梁・筋かい等を見分けるための表示)
   現モデルに存在する部材名を並べ、黄金角で色相を割り当てて識別性を確保
============================================================ */
const dimOutMat = new THREE.MeshStandardMaterial({ color: 0x9ca3af, transparent: true, opacity: 0.16, depthWrite: false, roughness: 1 });
let memberColorMap = new Map();
const memberMatCache = new Map();
function buildMemberColors() {
  memberColorMap = new Map();
  memberMatCache.clear();
  const names = new Set();
  modelGroup.traverse((m) => { if (m.isMesh && m.userData.member && m.userData.member.indexOf("DMG") !== 0) names.add(m.userData.member); });
  const sorted = [...names].sort();
  sorted.forEach((n, i) => {
    const hue = ((i * 137.508) % 360) / 360;
    const sat = 0.62 + (i % 3) * 0.10;
    const lig = 0.44 + (i % 4) * 0.06;
    memberColorMap.set(n, new THREE.Color().setHSL(hue, sat, lig));
  });
}
function memberMat(name, translucent) {
  const key = name + (translucent ? "_t" : "_s");
  if (!memberMatCache.has(key)) {
    const c = memberColorMap.get(name) || new THREE.Color(0xa3a3a3);
    memberMatCache.set(key, new THREE.MeshStandardMaterial({
      color: c, roughness: 0.65, metalness: 0.05, side: THREE.DoubleSide,
      transparent: !!translucent, opacity: translucent ? 0.42 : 1.0,
    }));
  }
  return memberMatCache.get(key);
}
function memberColorHex(name) {
  const c = memberColorMap.get(name);
  return c ? "#" + c.getHexString() : "#a3a3a3";
}
function memberLegendItems() {
  const counts = new Map();
  modelGroup.traverse((m) => {
    if (!m.isMesh || !m.userData.member || m.userData.member.indexOf("DMG") === 0) return;
    counts.set(m.userData.member, (counts.get(m.userData.member) || 0) + 1);
  });
  return [...counts.entries()].sort((a, b) => a[0].localeCompare(b[0], "ja"));
}

function applyMode() {
  const tg = selectedTargets();
  modelGroup.traverse((m) => {
    if (!m.isMesh || !m.userData.baseMat) return;
    const d = m.userData;
    let vis, mat;
    if (state.mode === "frame") {
      vis = !d.isCover; mat = d.baseMat;
    } else if (state.mode === "parts") {
      vis = true; mat = partMat(d.part, d.isCover);
    } else if (state.mode === "members") {
      vis = true; mat = memberMat(d.member, d.isCover);
    } else {
      vis = true; mat = d.baseMat;
    }
    if (tg && tg.has(d.member)) { vis = true; mat = d.isCover ? hlCover : hlSolid; }
    else if (tg && state.focusDim) { mat = dimOutMat; }
    m.visible = vis;
    m.material = mat;
  });
}

/* ============================================================
   ラベル(部材マーカー・寸法名称)
============================================================ */
const labelsHolder = document.getElementById("labels");
let labelEntries = [];
let dimGroup = null;
const dimMat = new THREE.MeshStandardMaterial({ color: 0xd97706, emissive: 0x92400e, emissiveIntensity: 0.35 });
const dimHlMat = new THREE.MeshStandardMaterial({ color: 0xffb020, emissive: 0xff7a00, emissiveIntensity: 0.6 });
function makeDimLine(from, to) {
  const g = new THREE.Group();
  const a = new THREE.Vector3(from[0], from[1], from[2]);
  const b = new THREE.Vector3(to[0], to[1], to[2]);
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const main = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, len, 6), dimMat);
  main.position.copy(a).addScaledVector(dir, 0.5);
  main.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  g.add(main);
  // 端部ティック(測定範囲の両端を示す短い直交バー)
  const vertical = Math.abs(dir.y) > len * 0.7;
  const tickDir = vertical ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
  [a, b].forEach((p) => {
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.24, 6), dimMat);
    t.position.copy(p);
    t.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tickDir);
    g.add(t);
  });
  return g;
}
function updateDimObjects() {
  if (dimGroup) { scene.remove(dimGroup); dimGroup = null; }
  if (!state.showDims || !currentDef) return;
  if (state.selectedDim && !currentDef.dims.some((d) => d.name === state.selectedDim)) state.selectedDim = null;
  dimGroup = new THREE.Group();
  currentDef.dims.forEach((d) => {
    if (!d.from || !d.to) return;
    const line = makeDimLine(d.from, d.to);
    line.userData.dimName = d.name;
    dimGroup.add(line);
  });
  scene.add(dimGroup);
  applyDimHighlight();
}
function applyDimHighlight() {
  if (!dimGroup) return;
  dimGroup.children.forEach((line) => {
    const on = state.selectedDim === line.userData.dimName;
    line.traverse((m) => { if (m.isMesh) m.material = on ? dimHlMat : dimMat; });
  });
}

 // {el, getPos}

function renderLabels() {
  labelsHolder.innerHTML = "";
  labelEntries = [];
  currentDef.members.forEach((m, i) => {
    const div = document.createElement("div");
    div.className = "label";
    div.innerHTML = `<div class="label-chip${m.isDamage ? " dmg" : ""}${state.selectedMember === m.key ? " active" : ""}">${m.name}</div>`;
    div.addEventListener("click", () => selectMember(m.key));
    labelsHolder.appendChild(div);
    labelEntries.push({ occluded: false, el: div, pos: new THREE.Vector3(m.pos[0], m.pos[1], m.pos[2]) });
  });
  if (state.showDims) {
    currentDef.dims.forEach((d) => {
      const div = document.createElement("div");
      div.className = "label";
      div.innerHTML = `<div class="label-chip dim${state.selectedDim === d.name ? " active" : ""}">${d.name}</div>`;
      div.addEventListener("click", () => {
        state.selectedDim = state.selectedDim === d.name ? null : d.name;
        renderLabels(); renderPanel();
      });
      labelsHolder.appendChild(div);
      const lp = (d.from && d.to)
        ? [(d.from[0] + d.to[0]) / 2, (d.from[1] + d.to[1]) / 2 + 0.16, (d.from[2] + d.to[2]) / 2]
        : d.pos;
      labelEntries.push({ occluded: false, el: div, pos: new THREE.Vector3(lp[0], lp[1], lp[2]) });
    });
  }
  updateDimObjects();
}

function occluderTargets() { return modelGroup ? [modelGroup] : []; }
/* ラベルの遮蔽判定: 壁などの陰にあるラベルは隠す(半透明の面は遮蔽物とみなさない) */
const occRay = new THREE.Raycaster();
let occTick = 0;
function updateOcclusion(force) {
  occTick++;
  if (!force && occTick % 3 !== 0) return;
  const targets = occluderTargets();
  if (!targets.length) return;
  const camPos = camera.position;
  labelEntries.forEach((e) => {
    const v = e.pos.clone().sub(camPos);
    const dist = v.length();
    if (dist < 0.6) { e.occluded = false; return; }
    occRay.set(camPos, v.normalize());
    occRay.far = dist - 0.35;
    const hits = occRay.intersectObjects(targets, true);
    e.occluded = hits.some((h) => {
      const o = h.object, mat = o.material;
      if (!o.visible || !mat) return false;
      if (mat.transparent && (mat.opacity === undefined ? 1 : mat.opacity) < 0.6) return false;
      return true;
    });
  });
}
function updateLabelPositions() {
  const w = holder.clientWidth, h = holder.clientHeight;
  updateOcclusion(false);
  const items = labelEntries.map((e) => {
    const pr = e.pos.clone().project(camera);
    return { e, x: (pr.x * 0.5 + 0.5) * w, y: (-pr.y * 0.5 + 0.5) * h, z: pr.z, behind: pr.z > 1 };
  });
  // 優先度: 選択中 > 被害 > 通常。近いものを優先
  const prio = (it) => {
    const chip = it.e.el.firstElementChild;
    let p = 0;
    if (chip && chip.classList.contains("active")) p += 100;
    if (chip && chip.classList.contains("dmg")) p += 10;
    return p;
  };
  items.sort((a, b) => (prio(b) - prio(a)) || (a.z - b.z));
  const placed = [];
  items.forEach((it) => {
    const el = it.e.el;
    if (it.behind || it.e.occluded || it.x < -60 || it.x > w + 60 || it.y < -40 || it.y > h + 40) {
      el.style.visibility = "hidden"; return;
    }
    if (!it.e.cw) { it.e.cw = el.offsetWidth || 90; it.e.ch = el.offsetHeight || 22; }
    const cw = it.e.cw, ch = it.e.ch;
    let y = it.y - 6; // 少し上げて被害・部材の視覚表現に重ねない
    let ok = false;
    for (let step = 0; step < 5; step++) {
      const rect = { l: it.x - cw / 2 - 3, r: it.x + cw / 2 + 3, t: y - ch, b: y };
      if (!placed.some((r) => r.l < rect.r && rect.l < r.r && r.t < rect.b && rect.t < r.b)) {
        ok = true; placed.push(rect); break;
      }
      y -= ch + 4; // 重なる場合は上に段積み退避
    }
    if (!ok) { el.style.visibility = "hidden"; return; }
    el.style.visibility = "visible";
    el.style.transform = `translate(-50%,-100%) translate(${it.x}px, ${y}px)`;
  });
}

/* ============================================================
   操作
============================================================ */
const dom = renderer.domElement;
dom.style.touchAction = "none";
const drag = { on: false, x: 0, y: 0 };
let lastPinch = null;

dom.addEventListener("pointerdown", (e) => { drag.on = true; drag.x = e.clientX; drag.y = e.clientY; });
window.addEventListener("pointermove", (e) => {
  if (!drag.on) return;
  orbit.theta -= (e.clientX - drag.x) * 0.006;
  orbit.phi   -= (e.clientY - drag.y) * 0.006;
  orbit.phi = Math.max(0.22, Math.min(Math.PI/2 - 0.02, orbit.phi));
  drag.x = e.clientX; drag.y = e.clientY;
});
window.addEventListener("pointerup", () => { drag.on = false; });
dom.addEventListener("wheel", (e) => {
  e.preventDefault();
  orbit.radius = Math.max(5, Math.min(48, orbit.radius + e.deltaY * 0.012));
}, { passive: false });
dom.addEventListener("touchmove", (e) => {
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (lastPinch !== null) orbit.radius = Math.max(5, Math.min(48, orbit.radius - (d - lastPinch) * 0.03));
    lastPinch = d;
    drag.on = false;
  }
}, { passive: true });
dom.addEventListener("touchend", () => { lastPinch = null; });

dom.addEventListener("click", (e) => {
  const rect = dom.getBoundingClientRect();
  const mouse = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(markerMeshes);
  if (hits.length > 0) {
    const hk = hits[0].object.userData.key;
    selectMember(hk);
  }
});

// ウィンドウだけでなくヘッダーの折り返しやパネル幅の変化にも追従する
function fitRenderer() {
  const w = holder.clientWidth, h = holder.clientHeight;
  if (w === 0 || h === 0) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
new ResizeObserver(fitRenderer).observe(holder);
window.addEventListener("resize", fitRenderer);
document.getElementById("reset-view").addEventListener("click", () => {
  orbit.theta = Math.PI/4; orbit.phi = Math.PI/3;
  orbit.radius = currentDef.camR;
  orbit.target.set(0, currentDef.targetY, 0);
});

/* ============================================================
   パネル
============================================================ */
const panel = document.getElementById("panel");

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

/* サイドバーの部品(3つのビューアで共通の見た目)。renderPanel の中で毎回作る */
function panelKit(onSelect) {
  const section = (title, meta) => el("div", "section", `<h2>${title}${meta ? `<span class="meta">${meta}</span>` : ""}</h2>`);
  // 択一のセグメント。items: [[値, ラベル, 補足?]]
  const seg = (items, cur, onPick, cols) => {
    const box = el("div", "seg");
    box.style.setProperty("--cols", cols || items.length);
    items.forEach(([v, lb, sub]) => {
      const b = el("button", cur === v ? "active" : "", lb + (sub ? `<small>${sub}</small>` : ""));
      b.setAttribute("aria-pressed", cur === v ? "true" : "false");
      b.addEventListener("click", () => onPick(v));
      box.appendChild(b);
    });
    return box;
  };
  // オン/オフのスイッチ
  const toggle = (label, on, onChange) => {
    const b = el("button", "tgl", `<span>${label}</span><span class="sw"></span>`);
    b.setAttribute("role", "switch");
    b.setAttribute("aria-checked", on ? "true" : "false");
    b.addEventListener("click", () => onChange(!on));
    return b;
  };
  const toggles = (...list) => { const d = el("div", ""); d.style.marginTop = "6px"; list.forEach((t) => t && d.appendChild(t)); return d; };
  const help = (html, label) => el("details", "help", `<summary>${label || "説明"}</summary><div>${html}</div>`);
  const cap = (html) => el("div", "legend-cap", html);
  const button = (label, onClick) => { const b = el("button", "btn", label); b.addEventListener("click", onClick); return b; };
  const item = (m, extraCls) => {
    const b = el("button", "item" + (extraCls ? " " + extraCls : "") + (state.selectedMember === m.key ? " active" : ""), m.name);
    b.addEventListener("click", () => onSelect(m.key));
    return b;
  };
  const noteCard = (m, cls) => {
    const c = el("div", "card" + (cls ? " " + cls : ""), `<button class="close" aria-label="選択を解除">解除</button><span class="title">${m.name}</span>${m.note}`);
    c.querySelector(".close").addEventListener("click", () => onSelect(m.key));
    return c;
  };
  const empty = (html) => el("div", "empty", html);
  // 部位の一覧(まとめて/部材ごと)。detailed のときは区分(part)ごとに見出しを付ける
  const memberList = (members, detailed, extraCls) => {
    const list = el("div", "list");
    if (detailed) {
      const groups = new Map();
      members.forEach((m) => { const g = m.part || "その他"; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(m); });
      groups.forEach((arr, g) => { list.appendChild(el("div", "group-h", g)); arr.forEach((m) => list.appendChild(item(m, extraCls))); });
    } else {
      members.forEach((m) => list.appendChild(item(m, extraCls)));
    }
    return list;
  };
  const legend = (rows) => {
    const lg = el("div", "legend");
    rows.forEach(([color, name, ct]) => lg.appendChild(el("div", "legend-item", `<span class="sw" style="background:${color}"></span>${name}${ct != null ? `<span class="ct">×${ct}</span>` : ""}`)));
    return lg;
  };
  // 上部(対象の選択+タブ)
  const head = ({ eyebrow, pick, summary, extra, tabs, cur, onTab }) => {   // extra: 対象の下に常に出す操作(農機具の装置の状態など)
    const h = el("div", "p-head");
    h.appendChild(el("div", "eyebrow", eyebrow));
    h.appendChild(pick);
    if (summary) h.appendChild(el("p", "model-sum", summary));
    if (extra) h.appendChild(extra);
    const row = el("div", "tabs");
    row.setAttribute("role", "tablist");
    tabs.forEach(([k, lb, badge], i) => {
      const t = el("button", "tab" + (cur === k ? " active" : ""), `<span class="no">0${i + 1}</span>${lb}${badge ? `<span class="badge">${badge}</span>` : ""}`);
      t.setAttribute("role", "tab");
      t.setAttribute("aria-selected", cur === k ? "true" : "false");
      t.addEventListener("click", () => onTab(k));
      row.appendChild(t);
    });
    h.appendChild(row);
    return h;
  };
  // 下部(この教材について)
  const foot = (html, label) => {
    const f = el("div", "p-foot");
    f.appendChild(help(html, label || "この教材について(免責)"));
    f.querySelector("details > div").classList.add("about");
    return f;
  };
  return { section, seg, toggle, toggles, help, cap, button, item, noteCard, empty, memberList, legend, head, foot };
}

/* ============================================================
   右サイドバー
   上から「型式」→「タブ(部位 / 損害評価 / 表示 / 仕様)」→「タブの中身」の順(建物ビューアと同じ構成)
============================================================ */
const TYPE_SHORT = { pipe: ["Ⅱ類", "パイプ"], steel: ["Ⅳ類", "鉄骨"], glass: ["ガラス室", "Ⅱ類"], amayoke: ["Ⅵ類", "雨よけ"], net: ["Ⅶ類", "ネット"] };

/* 部材・被害を選ぶ(もう一度選ぶと解除)。モデル上のラベル・点から選んだときも、該当するタブを開く */
function selectMember(key) {
  state.selectedMember = state.selectedMember === key ? null : key;
  const m = state.selectedMember && currentDef.members.find((x) => x.key === key);
  if (m) state.tab = m.isDamage ? "damage" : "parts";
  renderLabels(); renderPanel(); applyMode();
}

function renderPanel() {
  const scrollY = panel.scrollTop, prevTab = panel.dataset.tab;
  panel.innerHTML = "";
  const K = panelKit(selectMember);
  const t = TYPES[state.typeKey];
  const dmgs = currentDef.members.filter((m) => m.isDamage);

  panel.appendChild(K.head({
    eyebrow: "Facility type · 型式(区分)",
    pick: K.seg(Object.keys(TYPES).map((k) => [k, TYPE_SHORT[k][0], TYPE_SHORT[k][1]]), state.typeKey, (key) => {
      if (state.typeKey === key) return;
      state.typeKey = key;
      state.coverKey = TYPES[key].defaultCover;
      state.cropKey = TYPES[key].defaultCrop;
      state.selectedMember = null;
      rebuild(true);
    }, 3),
    summary: `${t.label} — ${t.sub}`,
    tabs: [["parts", "部位"], ["damage", "損害評価", dmgs.length || ""], ["view", "表示"], ["spec", "仕様"]],
    cur: state.tab, onTab: (k) => { state.tab = k; renderPanel(); },
  }));
  const body = el("div", "p-body");
  panel.appendChild(body);

  /* ---- 01 部位 ---- */
  if (state.tab === "parts") {
    const plain = currentDef.members.filter((m) => !m.isDamage);
    const sec = K.section("部材と評価の着眼点", `${plain.length}件`);
    const active = plain.find((m) => m.key === state.selectedMember);
    sec.appendChild(active ? K.noteCard(active) : K.empty("部材を選ぶと、評価の着眼点がここに表示されます。モデル上の橙色の点・ラベルからも選べます。"));
    sec.appendChild(K.seg([[false, "まとめて"], [true, "部材ごと"]], state.detailParts, (v) => { state.detailParts = v; state.selectedMember = null; rebuild(false); }, 2));
    const list = K.memberList(plain, state.detailParts);
    list.style.marginTop = "10px";
    sec.appendChild(list);
    sec.appendChild(K.toggles(K.toggle("選んだ部材以外を薄く表示", state.focusDim, (v) => { state.focusDim = v; applyMode(); renderPanel(); })));
    sec.appendChild(K.help("選んだ部材はモデル上で橙色に点滅します。「部材ごと」にすると、アーチ・母屋・胴ぶち・筋かいなどを1つずつ選べ、区分ごとの使用数も表示されます。"));
    body.appendChild(sec);
  }

  /* ---- 02 損害評価 ---- */
  if (state.tab === "damage") {
    const sec = K.section("被害シミュレーション", state.dmgScenario !== "none" ? `${dmgs.length}か所` : "");
    sec.appendChild(K.seg([["none", "なし"], ["typhoon", "台風", "風害"], ["snow", "大雪", "雪害"]], state.dmgScenario,
      (k) => { state.dmgScenario = k; state.selectedMember = null; rebuild(false); }, 3));
    if (state.dmgScenario === "none") {
      sec.appendChild(K.cap("災害を選ぶと、モデル上に被害が発生します。被害箇所を1つずつ確認し、評価の着眼点を読んで練習します。"));
    } else {
      const activeD = dmgs.find((m) => m.key === state.selectedMember);
      const wrap = el("div", "");
      wrap.style.marginTop = "12px";
      wrap.appendChild(activeD ? K.noteCard(activeD, "dmg") : K.empty("被害箇所を選ぶと、評価の着眼点がここに表示されます。モデル上の赤い点からも選べます。"));
      wrap.appendChild(K.memberList(dmgs, false, "dmg"));
      sec.appendChild(wrap);
      sec.appendChild(K.button("別の被害パターンを生成", () => { state.dmgSeed++; state.selectedMember = null; rebuild(false); }));
      sec.appendChild(K.help("被害は研修用に自動で作った架空のもので、実際の被害の分布や損害割合を示すものではありません。"));
    }
    body.appendChild(sec);

    const secB = K.section("損害評価の基本", "第4");
    secB.appendChild(K.cap("被害態様は5種類、損傷程度は甚・中・軽の3区分です。"));
    secB.appendChild(K.help("部材の被害態様は ①ちぎれ・のび・亀裂 ②腰折れ ③まがり・ねじれ ④回転・移動 ⑤引抜け・はく落 の5種類。損傷程度は甚・中・軽の3区分で、甚=取替、中=取替又は補修、軽=補修として評価します。補修割合の係数は0.7(ガラスのみ0.5)です。", "詳しく見る"));
    body.appendChild(secB);
  }

  /* ---- 03 表示 ---- */
  if (state.tab === "view") {
    const secM = K.section("表示モード");
    secM.appendChild(K.seg([["normal", "標準"], ["parts", "構造部分を色分け"]], state.mode, (k) => { state.mode = k; applyMode(); renderPanel(); }, 2));
    const s2 = K.seg([["members", "部材を色分け"], ["frame", "骨組みのみ"]], state.mode, (k) => { state.mode = k; applyMode(); renderPanel(); }, 2);
    s2.style.marginTop = "4px";
    secM.appendChild(s2);
    if (state.mode === "members") {
      secM.appendChild(K.legend(memberLegendItems().map(([nm, ct]) => [memberColorHex(nm), nm, ct])));
      secM.appendChild(K.help("部材の種類ごとに色を変えています。アーチ・母屋・胴ぶち・筋かいなど、形の似た部材の違いを見分ける練習に使えます。"));
    }
    if (state.mode === "parts") {
      secM.appendChild(K.legend(currentDef.parts.map((p) => [PART_COLORS[p], p])));
      secM.appendChild(K.help(state.typeKey === "net"
        ? "Ⅶ類は周囲面・天井面・基礎の3区分で評価します(第4-1(1)ア)。"
        : "要領では妻面・側面・屋根面・基礎の4区分。各面はA面・B面に分け、棟木・中柱を含む側がA面です(第4-1(1))。Ⅱ類は側面・屋根面が一体の「側屋根面」として扱われます(別表3・4)。"));
    }
    body.appendChild(secM);

    const secD = K.section("外面・寸法の名称", "第2");
    secD.appendChild(K.toggle("寸法線と名称を表示", state.showDims, (v) => { state.showDims = v; if (!v) state.selectedDim = null; renderLabels(); renderPanel(); applyMode(); }));
    if (state.showDims) {
      const chips = el("div", "chips");
      currentDef.dims.forEach((d) => {
        const c = el("button", "chip" + (state.selectedDim === d.name ? " active" : ""), d.name);
        c.addEventListener("click", () => { state.selectedDim = state.selectedDim === d.name ? null : d.name; renderLabels(); renderPanel(); });
        chips.appendChild(c);
      });
      secD.appendChild(chips);
      secD.appendChild(K.cap("名称を押すと、その寸法線が橙色に点滅します。"));
    }
    body.appendChild(secD);
  }

  /* ---- 04 仕様: 棟数・被覆材・施設内農作物 ---- */
  if (state.tab === "spec") {
    if (t.spansSelectable) {
      const secSp = K.section("棟数", "単棟/連棟");
      secSp.appendChild(K.seg([[1, "単棟"], [2, "2連棟"], [3, "3連棟"]], state.spans, (v) => { state.spans = v; rebuild(true); }, 3));
      secSp.appendChild(K.help("要領第3-1(2)ウ: 別表1に単棟として掲げる型式を2連棟とする場合は標準価額を5%、3連棟以上は7.5%減額できます(2連棟型式を3連棟以上とする場合は2.5%)。連棟の谷樋・接続側面の部材は屋根面A面に含めます(第4-1(1)エ・オ)。"));
      body.appendChild(secSp);
    }
    const secC = K.section("被覆材", "別表2の代表例");
    const list = el("div", "list");
    t.covers.forEach((ck) => {
      const b = el("button", "item plain" + (state.coverKey === ck ? " active" : ""), COVERS[ck].label);
      b.addEventListener("click", () => { state.coverKey = ck; rebuild(false); });
      list.appendChild(b);
    });
    secC.appendChild(list);
    body.appendChild(secC);

    const secCr = K.section("施設内農作物");
    secCr.appendChild(K.toggle("施設内の作物を表示", state.showCrops, (v) => { state.showCrops = v; rebuild(false); }));
    if (state.showCrops) {
      const s = K.seg(Object.entries(CROPS).map(([k, c]) => [k, c.label.replace(/\(.*\)/, ""), (c.label.match(/\((.*)\)/) || [])[1]]), state.cropKey,
        (k) => { state.cropKey = k; rebuild(false); }, 4);
      s.style.marginTop = "6px";
      secCr.appendChild(s);
    }
    secCr.appendChild(K.help("施設内農作物は、特定園芸施設にあわせて選択して加入する共済目的です。表示すると区分「施設内農作物」として施設本体と分けて色分け・ハイライトできます。作物は型式ごとの代表例を初期表示しています。"));
    body.appendChild(secCr);

    const secI = K.section("この型式について");
    secI.appendChild(K.help(t.info, "型式の説明"));
    body.appendChild(secI);
  }

  panel.appendChild(K.foot("本モデルは園芸施設共済評価要領(30経営第367号)の名称・区分・別表を参考にした研修用の簡略化イメージです。形状・寸法・部材数は実際の標準型式と一致せず(奥行等は表示用に短縮)、実際の型式判定・引受評価・損害評価は要領本文および別表1〜7に基づいて行ってください。"));

  // 同じタブの再描画ではスクロール位置を保ち、タブを切り替えたら先頭へ
  panel.dataset.tab = state.tab;
  panel.scrollTop = prevTab === state.tab ? scrollY : 0;
}

/* ============================================================
   ループ
============================================================ */
function animate() {
  camera.position.set(
    orbit.target.x + orbit.radius * Math.sin(orbit.phi) * Math.sin(orbit.theta),
    orbit.target.y + orbit.radius * Math.cos(orbit.phi),
    orbit.target.z + orbit.radius * Math.sin(orbit.phi) * Math.cos(orbit.theta)
  );
  camera.lookAt(orbit.target);
  const pulse = 0.35 + 0.3 * Math.sin(performance.now() * 0.004);
  hlSolid.emissiveIntensity = pulse;
  hlCover.emissiveIntensity = pulse;
  dimHlMat.emissiveIntensity = pulse + 0.15;
  renderer.render(scene, camera);
  updateLabelPositions();
  requestAnimationFrame(animate);
}

rebuild(true);
animate();
</script>
